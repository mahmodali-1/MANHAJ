الكبير للطبراني برقم 8541، وإسناده صحيح<\/cite><\/div><\/details>."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>وصية أمير المؤمنين عمر بن الخطاب لأبي موسى الأشعري رضي الله عنهما:<\/b> كتب إليه: <span class=\"qt\">«أَمَّا بَعْدُ... فَإِيَّاكَ وَالتَّأْجِيلَ فِيمَا بَقِيَ عَلَيْكَ مِنْ عَمَلِ اليَوْمِ؛ فَإِنَّكَ إِذَا فَعَلْتَ ذَلِكَ اجْتَمَعَ عَلَيْكَ عَمَلُ يَوْمَيْنِ، فَلَمْ تَدْرِ أَيَّهُمَا تَأْخُذُ، فَتَضِيعُ!»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>أخرجه ابن المبارك في الزهد برقم 521، وحلية الأولياء لأبي نعيم 1/52<\/cite><\/div><\/details>."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: مصفوفة الأولويات الأربعة (Eisenhower &amp; Sharia Matrix)<\/b>"},{"t":"p","lvl":0,"h":"عاجل (Urgent)                   غير عاجل (Not Urgent)"},{"t":"p","lvl":0,"h":"+--------------------------------+--------------------------------+"},{"t":"p","lvl":0,"h":"|  المربع (1): الطوارئ والضغوط  |  المربع (2): الإنجاز والتخطيط  |"},{"t":"p","lvl":0,"h":"مهم     |  - اختبارات الغد المفاجئة.     |  - حفظ القرآن والبناء الإيماني.|"},{"t":"p","lvl":0,"h":"(Important)| - أزمة صحية أو ظرف طارئ.    |  - المذاكرة التراكمية الهادئة. |"},{"t":"p","lvl":0,"h":"|  * الإجراء: أَدِّهِ فوراً!       |  * الإجراء: خَطِّطْ له وجَدْوِلْهُ!|"},{"t":"p","lvl":0,"h":"+--------------------------------+--------------------------------+"},{"t":"p","lvl":0,"h":"غير مهم  |  المربع (3): الخداع والانخداع |  المربع (4): الضياع واللغو     |"},{"t":"p","lvl":0,"h":"(Not     |  - اتصالات وإشعارات تافهة.    |  - تصفح الشورتس والألعاب.      |"},{"t":"p","lvl":0,"h":"Important)| - مقاطعات وطلبات عارضة.      |  - مجالس اللغو الممتدة.        |"},{"t":"p","lvl":0,"h":"|  * الإجراء: فَوِّضْهُ أو رَفِّضْهُ!  |  * الإجراء: اِبْتُرْهُ وتَخَلَّصْ منه!|"},{"t":"p","lvl":0,"h":"+--------------------------------+--------------------------------+"},{"t":"p","lvl":0,"h":"<b>المحور الثاني: سر التفوق والريادة يكمن في \"المربع الثاني\"<\/b>"},{"t":"li","lvl":0,"h":"الناجحون والعلماء يستثمرون أكثر من 70% من طاقتهم في المربع الثاني (المهم غير العاجل)؛ لأن العمل فيه يمنع انفجار الأزمات في المربع الأول، ويصنع البناء المتين دون توتر."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أنا لا أحفظ ولا أستوعب إلا ليلة الامتحان تحت ضغط الخوف والوقت الضيق، فهل هذا خطأ؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هذا وهم عصبي ناتج عن إفراز الأدرينالين؛ الحفظ السريع تحت الهلع يتبخر فور الخروج من القاعة ويترك عقلك فارغاً. التعليم الحقيقي الذي يبني ذكاءك ومستقبلك هو التراكم الهادئ في المربع الثاني."}]},{"t":"qa","n":"2","q":"\"كيف أتصرف مع طلبات الأهل المفاجئة التي تقطع جدول المذاكرة؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> بر الوالدين عبادة مقدمة، ولذا نصمم جدولنا بـ <b>\"أوقات مرنة (Buffer Time)\"<\/b> تتسع للطوارئ والبر. كما أن إطلاع الأهل مسبقاً على ساعات مذاكرتك الهامة يجعلهم يعينونك ويحترمون وقتك."}]},{"t":"qa","n":"3","q":"\"هل التخطيط الأسبوعي يقتل العفوية ويجعل اليوم رتيباً ومملاً؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> العكس هو الصحيح! التخطيط المسبق هو الذي يفرغ عقلك من القلق، ويضمن لك وقتاً حقيقياً للراحة واللعب وأنت مرتاح الضمير."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>مهندس المصفوفة (الميسر الشاب):<\/b> إدارة نقاش المربعات وتوزيع الأدوار."},{"t":"li","lvl":0,"h":"<b>مسجل الأولويات (المدوّن):<\/b> رسم المصفوفة وتصنيف أنشطة الطلاب داخلها."},{"t":"li","lvl":0,"h":"<b>محامي العواجل (المعارض):<\/b> الدفاع عن فكرة الاستجابة للمستجدات الفورية دون جدول."},{"t":"li","lvl":0,"h":"<b>ضابط التوقيت (الميقاتي):<\/b> متابعة دقائق فقرات الورشة."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر مصفوفة المهام وتخطيط الأسبوع (Weekly Matrix Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة ورقية للمصفوفة + جدول الأسبوع التكتيكي + أقلام تظليل."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"يسجل كل فتى 10 أنشطة يقوم بها في أسبوعه، ثم يصنفها داخل المربعات الأربعة."},{"t":"li","lvl":1,"h":"استخراج 3 مهام أساسية للمربع الثاني (مذاكرة تراكمية 45 د، ورد قرآن، رياضة)."},{"t":"li","lvl":1,"h":"تسكين هذه المهام في جدول الأسبوع بمواعيد وأماكن محددة وقاطعة."},{"t":"li","lvl":1,"h":"تحديد مهمتين من المربعين الثالث والرابع لتقليصهما أو حذفهما نهائياً."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: فراس وأسبوع الاختبارات المفاجئة<\/span>"},{"t":"p","lvl":0,"h":"فراس (16 سنة) طالب في الأول الثانوي، يقضي أسبوعه في مسارين:"},{"t":"p","lvl":0,"h":"- لعب الهاتف ومشاهدة المقاطع لساعات (المربع الرابع)."},{"t":"p","lvl":0,"h":"- الخروج مع رفاقه كلما اتصلوا به فوراً دون تردد (المربع الثالث)."},{"t":"p","lvl":0,"h":"- إهمال المذاكرة اليومية وتجاهل الواجبات (إهمال المربع الثاني)."},{"t":"p","lvl":0,"h":"قبل الاختبارات بأيام معدودة:"},{"t":"p","lvl":0,"h":"- تراكمت عليه 4 مقررات كاملة؛ فأصيب بالذعر وسهر ليلتين على مشروبات الطاقة (المربع الأول)."},{"t":"p","lvl":0,"h":"- دخل الاختبار مجهداً مشوش الذهن، وحصل على درجات متدنية وهو يبكي!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف قاد إهمال المربع الثاني فراس إلى جحيم المربع الأول؟"},{"t":"p","lvl":0,"h":"2. أعد هندسة أسبوع فراس ليحقق التفوق بغير هلع ولا إجهاد عصبي."}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال الامتحان الصعب مقابل الاتصال الطارئ."],["05 - 15 د","الخطاف الحواري","قصة طارق وسامي وإدارة الحوار حول ثقافة الإطفائي."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","أدلة الشرح، حديث الحرص، وأثر عمر وابن مسعود في الفراغ."],["30 - 45 د","المختبر ودراسة الحالة","تمرين المصفوفة الأسبوعية وتفكيك حالة فراس."],["45 - 55 د","بنك الأسئلة الجدلية","مناقشة أوهام ضغط الامتحان، والتعامل مع طلبات البيت."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وجدول المربع الذهبي."],["65 - 70 د","الختام والتقييم","مراجعة المخرجات وإعلان ميثاق المربع الثاني."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 25-40","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«إن تقديم الأهم على المهم أصل في الشريعة... وإن العناية بالواجبات غير العاجلة قبل فوات وقتها هو معيار الفقه والنضج»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 27-35","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«كان العلماء يوزعون أوقاتهم ويرتبون ساعاتهم على وجوه البر، فلا يتركون مجالاً لعاجل تافه يقطع عليهم مهماً جليلاً»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 160-175","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«التخطيط الأسبوعي المسبق يقلل الاحتكاك الذهني للبدء في المهام الكبيرة، ويجعل الدخول في العمل المهم أمراً تلقائياً»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 78-82","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«إن المراهق تحت وطأة الضغط النفسي يميل للهروب إلى الأنشطة الترفيهية العاجلة غير المهمة؛ تعويضاً عن شعوره بالعجز»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 54-58","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«ترتيب الأولويات العلمية والعملية يحصن الشاب من الاستهلاك في الفضاء الرقمي ويوجه طاقته للبناء الحقيقي»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 410-415","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«تعويد الأبناء على تنظيم أوقاتهم وحسن التمييز بين الواجبات والمشتتات أساس متين في بناء الشخصية المسؤولة»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>العادات السبع للناس الأكثر فاعلية<\/i> — ستيفن كوفي (العادة الثالثة: ابدأ بالأهم قبل المهم ومصفوفة الأولويات، ص 165-200)."},{"t":"li","lvl":1,"h":"<i>إدارة الأولويات: الأهم أولاً<\/i> — ستيفن كوفي وأ. روجر ميريل <span class=\"pg\">ص 45-80<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تطبيقي:<\/b> \"مصفوفة أيزنهاور وكيف ترتب أولوياتك وتتخلص من التوتر؟\" — قناة دروس أونلاين على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي:<\/b> \"فقه تقديم الأهم على المهم في حياة الشاب\" — د. محمد راتب النابلسي على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"سيادة المربع الثاني وبَتْر اللغو\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. تخطيط الجمعة الاستباقي:","[ ] تخصيص 15 دقيقة مساء الجمعة لتعبئة جدول أسبوع المربع الثاني.","2. حماية المربع الذهبي:","[ ] أداء 45 دقيقة مذاكرة تراكمية يومية في موعد ثابت قبل مواعيد الامتحانات.","3. تقييد المربع الرابع:","[ ] عدم تجاوز 45 دقيقة يومياً للترفيه الرقمي، وبشرط أن تكون بعد إنجاز مهام المربع الثاني."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الوعي بالعاجل والمهم","ينقاد لكل طارئ وإشعار ويهمل واجباته ومستقبله كلياً.","يفرق نظرياً بين العاجل والمهم لكنه يقع فريسة المماطلة وتأجيل المهم.","يميز ببراعة، ويقدم المهم غير العاجل ويحمي وقته من صراخ الطوارئ."],["التخطيط والجدولة","يرفض التخطيط ويعيش يومه بردات الفعل والمفاجآت.","يضع خططاً وأهدافاً لكنه يعجز عن الالتزام بها بعد يومين.","يخطط أسبوعه بانتظام، ويضع مساحات مرنة للطوارئ دون كسر أهدافه."],["إدارة المشتتات واللغو","يستسلم لطلبات الأقران المشتتة فوراً على حساب دراسته وصلاته.","يتردد في الرفض ويتحرج من الاعتذار لزملائه أوقات الجد.","يملك الحزم واللباقة في قول &quot;لا&quot; للغو، ويحمي ساعات إنتاجيته بصلابة."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: مصفوفة الأولويات وإدارة الأسبوع","sub":"","lines":["💡 البوصلة والمفهوم:","ليس كل ما يصرخ عاجلاً يستحق وقتك! الشاب الراشد لا يعيش حياته كـ \"رجل إطفاء للحرائق\"، بل يبني مستقبله بهدوء في \"المربع الذهبي: المهم غير العاجل\". التخطيط الأسبوعي المسبق هو مفتاح السيادة والراحة النفسية.","📖 الآية المحورية:","<span class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾<\/span> <span class=\"ayref\">الشرح: 7-8<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجَزْ»<\/span> <span class=\"takh\">[صحيح مسلم]<\/span>.","📐 القواعد الذهبية لمصفوفة الأولويات:","1. المربع الأول (الطوارئ): أدِّه فوراً، لكن قلل منه بالتخطيط المبكر.","2. المربع الثاني (المهم غير العاجل): استثمر فيه 70% من وقتك؛ فهو سر العبقرية.","3. المربعان الثالث والرابع (الخداع واللغو): قل لهما \"لا\" بحزم وشجاعة.","—hr—","🎯 مهام المربع الذهبي لهذا الأسبوع (ضع زماناً ومكاناً ثابتاً لكل مهمة):","1. البناء الإيماني (ورد القرآن + قيام/وتر): ___________________________","2. المذاكرة التراكمية اليومية (45 دقيقة): ____________________________","3. بناء الجسد والمهارة (رياضة / قراءة): ______________________________","—hr—","📝 جدول تتبع إنجاز المربع الثاني الأسبوعي (ضع ✓ عند الالتزام):","[ السبت ]  [ الأحد ]  [ الاثنين ]  [ الثلاثاء ]  [ الأربعاء ]  [ الخميس ]  [ الجمعة ]","(   )      (   )      (    )       (    )       (    )       (   )      (   )","عهد الفتى المسلم: \"أنا شاب أدير وقتي بوعي، أقدم الأهم على العاجل، وأحمي عمري من الضياع\"."]}]}]},{"id":"3-3","ordinal":"الخامس عشر","title":"صناعة القرار الأخلاقي","sub":"موازنة المصالح والمفاسد","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثالثة: فقه الأولويات وإدارة الحياة"],["عنوان اللقاء","صناعة القرار الأخلاقي (موازنة المصالح والمفاسد)"],["الرمز الكودي","U3-L15-DECISION"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","مختبر اتخاذ القرار الأخلاقي وتنمية الشجاعة الأدبية أمام ضغوط الأقران"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> صناعة القرار الأخلاقي في مرحلة الفتوة لا تقتصر على التمييز السهل بين \"حق صريح وباطل ظاهر\"، بل تتجلى في <b>\"المناطق الرمادية، ومواقف الضغط الاجتماعي الشديد، وتزاحم المصالح والمفاسد\"<\/b>. الشاب الموقن لا يخضع للاندفاع العاطفي أو الخوف من استنكار الأقران، بل يزن خياراته بـ <b>\"ميزان مقاصدي وأخلاقي صلب\"<\/b> يستند إلى قواعد فقه الأولويات (كتقديم درء المفاسد على جلب المصالح، وعدم التضحية بالأمانة والصلات الإيمانية لأجل مكاسب عاجلة أو شعبية زائفة)."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفكك الفتى خوارزمية موازنة المصالح والمفاسد وقواعد الترجيح الشرعية، ويفهم آليات ضغط الأقران وسيكولوجية الانقياد الجماعي."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى عزة الثبات على الحق والاستقلال بالرأي، متحرراً من عقدة \"الخوف من العزلة أو السخرية\"."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يمارس الفتى خطوات \"الرفض الشجاع (The Courageous NO)\" داخل القاعة، ويكتب نص الموقف الأخلاقي في سيناريو شائك."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بالسؤال الاستفزازي التالي:"},{"t":"p","lvl":0,"h":"<b>\"إذا كنت واقفاً مع 10 من أقرب أصدقائك في المدرسة، وأجمعوا كلهم على رأي خاطئ أو سخروا من زميل ضعيف، ونظروا إليك منتظرين أن تشاركهم الضحك والتأييد.. بكل صدق: كم نسبة الشجاعة لديك لتقف وحدك وتقول: (هذا خطأ ولن أشارككم فيه)؟ أم أن الخوف من النبذ سيجعلك تبتسم وتسايرهم؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — معضلة يحيى وضغط مجموعة الواتساب)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">معضلة يحيى: بين تسريب الاختبار وغضب الأصدقاء<\/span>"},{"t":"p","lvl":0,"h":"يحيى (17 سنة) يجلس في غرفته ليلة الاختبار، وإذا بإشعار ينبثق على مجموعة \"واتساب\" الخاصة بأعز 4 أصدقاء له."},{"t":"p","lvl":0,"h":"المفاجأة: أحدهم حصل على أسئلة الاختبار المسربة بإجاباتها النموذجية!"},{"t":"p","lvl":0,"h":"بدأ الأصدقاء يحتفلون ويتبادلون الإجابات، ويحيى يعلم يقيناً أن هذا غش وظلم وخيانة للأمانة."},{"t":"p","lvl":0,"h":"عندما كتب يحيى ناصحاً: \"يا إخوان هذا غش محرم ولا يجوز\"، انهالوا عليه بالسخرية:"},{"t":"p","lvl":0,"h":"- \"صرت واعظاً الآن؟ مسوي فيها شريف ومثالي؟\"."},{"t":"p","lvl":0,"h":"- \"إذا لم تستخدمها وتسكت، سنطردك من المجموعة ونقاطعك تماماً ولن يعرفك أحد منا بعد اليوم!\"."},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. لو كنت مكان يحيى.. كيف ستوازن بين مصلحة \"الدرجات العالية ورضا الأصدقاء\" ومفسدة \"الغش وخيانة الأمانة وعقاب الله\"؟"},{"t":"p","lvl":0,"h":"2. لماذا يسقط كثير من الشباب في هذا الفخ ويبيعون مبادئهم طلباً للقبول الاجتماعي؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿كُتِبَ عَلَيْكُمُ الْقِتَالُ وَهُوَ كُرْهٌ لَّكُمْ ۖ وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ ۖ وَعَسَىٰ أَن تُحِبُّوا شَيْئًا وَهو شَرٌّ لَّكُمْ ۗ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ﴾<\/span> <span class=\"ayref\">البقرة: 216<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> ميزان المصالح والمفاسد الإلهي يتجاوز الرغبات العاجلة؛ فالأمر المكروه نفساً قد يحمل الخير العظيم، واللذة العارضة قد تجلب الشر والندامة."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿قُل لَّا يَسْتَوِي الْخَبِيثُ وَالطَّيِّبُ وَلَوْ أَعْجَبَكَ كَثْرَةُ الْخَبِيثِ ۚ فَاتَّقُوا اللَّهَ يَا أُولِي الْأَلْبَابِ لَعَلَّكُمْ تُفْلِحُونَ﴾<\/span> <span class=\"ayref\">المائدة: 100<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الكثرة والقبول الاجتماعي ليسا معياراً للحق والصواب؛ فالخبيث يظل خبيثاً ولو اتفق عليه الناس جميعاً."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أم المؤمنين عائشة رضي الله عنها:<\/b> أن رسول الله ﷺ قال: <span class=\"hadith\">«مَنِ التَمَسَ رِضَى اللَّهِ بِسَخَطِ النَّاسِ كَفَاهُ اللَّهُ مُؤْنَةَ النَّاسِ، وَمَنِ التَمَسَ رِضَى النَّاسِ بِسَخَطِ اللَّهِ وَكَلَهُ اللَّهُ إِلَى النَّاسِ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>جامع الترمذي: كتاب الزهد برقم 2414؛ وصحيح ابن حبان برقم 276، وصححه الألباني في السلسلة الصحيحة برقم 2311<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> استقلال القرار الأخلاقي يقوم على تقديم مرضاة الله؛ فمن طلب رضا الناس بمعصية الله انقلب حامده منهم ذامّاً ووكله الله لضعفهم."},{"t":"li","lvl":0,"h":"<b>القاعدة النبوية الكبرى:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«لاَ ضَرَرَ وَلاَ ضِرَارَ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>سنن ابن ماجه: كتاب الأحكام، برقم 2340؛ ومسند أحمد برقم 2865، وصححه الألباني والنووي<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل المقاصدي:<\/i> درء المفاسد مقدم على جلب المصالح؛ فلا يجوز ارتكاب الضرر الأخلاقي لتحصيل نفع مادي عاجل."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف عبد الله بن حذافة السهمي رضي الله عنه مع ملك الروم:<\/b> حين أسره الروم وعرض عليه ملكهم نصف ملكه وأن يزوجه ابنته بشرط أن يتنصر، فأبى بثبات أسطوري، حتى توعده بالإلقاء في الزيت المغلي ودمعت عيناه، لا خوفاً، بل قال: <span class=\"qt\">«حزنت أن ليس لي إلا نفس واحدة تقتل في سبيل الله، وكنت أود لو كان لي بعدد شعري أنفس تعذب في ذات الله»<\/span>، فانبهر ملك الروم برجولته وقبّل رأسه وأطلق جميع أسرى المسلمين كرامة له <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>أخرجه البخاري في التاريخ الكبير 5/63، والحاكم في المستدرك 3/242<\/cite><\/div><\/details>."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: خوارزمية موازنة المصالح والمفاسد<\/b>"},{"t":"li","lvl":0,"h":"<b>القواعد الثلاث الحاكمة للقرار:<\/b>"},{"t":"li","lvl":1,"h":"<i>درء المفاسد مقدم على جلب المصالح:<\/i> تجنب الإثم والضرر أولى من تحصيل المكاسب المؤقتة."},{"t":"li","lvl":1,"h":"<i>الغاية الشريفة لا تبرر الوسيلة الرخيصة:<\/i> النجاح بالغش أو النفاق نجاح ملوث ومحقوق البركة."},{"t":"li","lvl":1,"h":"<i>ميزان العواقب البعيدة:<\/i> قس القرار بأثره عليك بعد 5 سنوات ويوم تقف أمام الله، لا بلحظته العاجلة."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: هندسة الشجاعة الأدبية والرفض الذكي (The Courageous NO)<\/b>"},{"t":"li","lvl":0,"h":"الرفض الأخلاقي ليس وقاحة ولا عداءً، بل هو ثبات محترم؛ تدريب الشاب على نبرة واثقة: <i>\"أنا أعتز بصداقتكم، لكني لا أوافق على هذا السلوك ولن أشارك فيه\"<\/i>."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"إذا كان (الجميع يفعل ذلك) في المدرسة والشارع، ألا يجعلني التمسك بالمبدأ معقداً ومنبوذاً؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> التاريخ والقيم يصنعها المصلحون الذين وقفوا ضد السيل، وليس المقلدون التابعون. الإمعة هو من يقول: \"إن أحسن الناس أحسنت وإن أساؤوا أسأت\". من يساير الموجه التافهة يحتقره أصحابه في الباطن، أما صاحب المبدأ الصلب فيفرض احترامه على الجميع ولو عارضوه ظاهراً."}]},{"t":"qa","n":"2","q":"\"ألا يمكن استخدام الغش أو الكذب كحيلة مؤقتة لدرء رسوب أو مفسدة أكبر؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الشريعة أباحت الكذب في حالات الضرورة القصوى المحددة (كإنقاذ نفس من القتل أو الإصلاح بين الناس)، ولم تجعله أداة لتبرير الحرام والغش. الرسوب بشرف وبذل جهد يعقبه نجاح حقيقي، أما النجاح بالغش فيؤسس لشخصية هشة مزورة تعيش على الخداع."}]},{"t":"qa","n":"3","q":"\"كيف أتصرف إذا كان صاحب السلوك الخاطئ هو صديقي المقرب الذي لا أريد خسارته؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الصديق الذي يطلب منك معصية الله أو خيانة أمانتك لا يرعى مصلحتك الحقيقية. انصحه بينك وبينه برفق وحزم، وأوضح له أنك تخاف عليه وعلى صداقتكما من غضب الله، فإن استكبر فاختر مبدأك ورضا ربك."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>القاضي الأخلاقي (الميسر الشاب):<\/b> توجيه الحوار وضمان سلامة الترجيحات المقاصدية."},{"t":"li","lvl":0,"h":"<b>الموثق المقاصدي (المدوّن):<\/b> تدوين جدول المصالح والمفاسد على السبورة."},{"t":"li","lvl":0,"h":"<b>محامي الضغط الجماعي (المعارض):<\/b> تمثيل صوت الأقران (\"لا تكن متزمتاً\"، \"الحياة تمشي هكذا\")."},{"t":"li","lvl":0,"h":"<b>حارس الميزان (الميقاتي):<\/b> ضبط أوقات النقاش والتطبيق."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر ميزان القرار الأخلاقي الخماسي (Moral Decision Matrix)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة ورقية مقسمة وفق خوارزمية القرار الخماسية."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة (خطوات اتخاذ القرار الـ 5):<\/b>"},{"t":"li","lvl":1,"h":"<i>توصيف الموقف:<\/i> كتابة الخيار الشائك بوضوح بلا تجميل."},{"t":"li","lvl":1,"h":"<i>جرد الميزان:<\/i> تفنيد المصالح المرجوة مقابل المفاسد المتوقعة في جدول متقابل."},{"t":"li","lvl":1,"h":"<i>الفحص المعياري:<\/i> هل في الخيار شبهة محرم قطعي؟ (غش، كذب، ظلم)."},{"t":"li","lvl":1,"h":"<i>اختبار العواقب البعيدة:<\/i> هل يسعدني أن يُنشر هذا الموقف عني في الملأ وأمام الله؟"},{"t":"li","lvl":1,"h":"<i>صياغة جملة الرفض الشجاع:<\/i> كتابة نص الرفض الحاسم الموجه للأقران بنبرة هادئة وقوية."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: مازن وعرض الإعلانات السريعة<\/span>"},{"t":"p","lvl":0,"h":"مازن (17 سنة) يدير حساباً تقنياً ناجحاً على إنستغرام وتيك توك."},{"t":"p","lvl":0,"h":"عرضت عليه شركة ألعاب رقمية مشبوهة (تحتوي مراهنات مقنعة ومحتوى لا أخلاقي) أن يروج لتطبيقها مقابل 500 دولار عن كل مقطع!"},{"t":"p","lvl":0,"h":"مازن بحاجة ماسة للمال لشراء لابتوب يعينه على دراسته وتطوير مهاراته البرمجية."},{"t":"p","lvl":0,"h":"- صديقه قال له: \"أعلن يا رجل! الجميع يعلنون، ولست مسؤولاً عن تصرفات المتابعين.. خذ المال وانفع نفسك!\"."},{"t":"p","lvl":0,"h":"- أمه نصحته: \"يا بني، المال الذي يأتي من إفساد الشباب محقوق البركة\"."},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. حلل موقف مازن بميزان (درء المفاسد مقدم على جلب المصالح)."},{"t":"p","lvl":0,"h":"2. كيف يصمد مازن أمام إغراء المال السهل وبريق الحاجة؟"},{"t":"p","lvl":0,"h":"3. اكتب الرد الحاسم الذي يجب أن يرسله مازن لشركة الإعلانات ليثبت رجولته الأخلاقية."}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال الموقف الصادم أمام الـ 10 أصدقاء."],["05 - 15 د","الخطاف الحواري","معضلة يحيى ومجموعة تسريب الاختبار وتفكيك الضغط."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","أدلة البقرة، حديث رضا الله وسخط الناس، وقصة السهمي."],["30 - 45 د","المختبر ودراسة الحالة","تمرين خوارزمية القرار وتفكيك حالة مازن في المجموعات."],["45 - 55 د","بنك الأسئلة الجدلية","تدريب محاكاة على مهارة الرفض الشجاع دون عدائية."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وتوقيع ميثاق الشجاعة الأدبية."],["65 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع الأدوار للقاء القادم."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 85-105","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«الموازنة بين المصالح والمفاسد هي عقل الفقه وروح التشريع... والقاعدة الذهبية: درء المفاسد مقدم على جلب المصالح»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 55-70","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الأمانة والصدق والشجاعة الأدبية حزم أخلاقي لا يتجزأ؛ وصاحب المبدأ لا يشتري رضا الناس بسخط ضميره وخالقه»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 35-42","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«الحصانة الأخلاقية والمفهوم المقاصدي هما الدرع الذي يحمي الشاب من ضغوط الأقران والانسياق خلف الموجات السائدة»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 88-95","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«الاندفاع العاطفي لدى المراهق يجعله فريسة سهلة لقرارات جماعة الرفاق؛ لذا فإن تدريبه على مهارة التفكير في العواقب ضرورة قصوى»<\/span>."},{"t":"src","cite":"سابغات - أحمد السيد - ص 45-50","short":"سابغات — أحمد السيد","q":"<span class=\"qt\">«التفكير النقدي والميزان المعياري المستند للوحي هو الذي ينخل الخيارات ويعصم العقل من الانخداع بالكثرة»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 380-395","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«التربية الأخلاقية وتنمية الشجاعة الأدبية تصنع فتياناً يملكون جرأة الحق والقدرة على رفض المنكر دون وجل»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>قواعد الأحكام في مصالح الأنام<\/i> — العز بن عبد السلام (فصل: موازنة المصالح والمفاسد وقواعد الترجيح، ص 30-65)."},{"t":"li","lvl":1,"h":"<i>الشجاعة الأدبية وبناء الموقف<\/i> — د. محمد موسى الشريف <span class=\"pg\">ص 40-75<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تقول (لا) وتثبت على مبدئك أمام ضغوط الأصدقاء؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"سيكولوجية الانقياد الجماعي وكيف تحمي استقلالك الأخلاقي؟\" — قناة علي وكتاب على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"الموقف الأخلاقي الشجاع (Saying NO)\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. ممارسة الرفض الشجاع:","[ ] اتخاذ موقف أخلاقي حاسم وقول \"لا\" لسلوك خاطئ يُعرض عليك (غش، غيبة، تسريب، محتوى رديء) دون خجل.","2. تطبيق خوارزمية القرار:","[ ] تطبيق مصفوفة القرار الخماسية على أي معضلة أو خيار رمادي يواجهك هذا الأسبوع.","3. صيانة الأمانة الرقمية:","[ ] الامتناع التام عن إعادة نشر أو تصديق أي محتوى كاذب أو شائعة أو ترويج مشبوه."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الاستقلال عن ضغط الأقران","يساير الأصدقاء في الخطأ خجلاً وخوفاً من النبذ والسخرية.","يرفض المنكر داخلياً وينسحب في صمت دون أن يملك شجاعة الإفصاح.","يصدع برأيه الأخلاقي بأدب وحزم، ويقود الموقف بثقة واستقلالية."],["موازنة المصالح والمفاسد","يقدم المنفعة المادية العاجلة والدرجات السهلة على الحلال والحرام.","يتردد عند تزاحم المنفعة مع المفسدة ويحتاج إلى توجيه خارجي دائم.","يطبق قاعدة &quot;درء المفاسد مقدم على جلب المصالح&quot; تلقائياً وبثبات."],["الشجاعة الأدبية","ينهار أمام الإغراءات المادية السريعة ويبرر الوسيلة بالغاية.","يظهر شجاعة في المواقف البسيطة ويتردد أمام الإغراءات الكبيرة.","يملك شجاعة استثنائية في قول الحق وحماية أمانته مهما كان الثمن."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: صناعة القرار الأخلاقي","sub":"","lines":["💡 البوصلة والمفهوم:","الرجولة مواقف! ليست العبرة بالكثرة: <span class=\"ayah\">﴿وَلَوْ أَعْجَبَكَ كَثْرَةُ الْخَبِيثِ﴾<\/span>. الشاب الحر لا يكون إمعة يساير موجات الأقران التافهة، بل يملك ميزاناً مقاصدياً يقدم فيه مرضاة ربه على تصفيق الخلق، ويعلم أن ما عند الله لا يُنال بالحرام.","📖 الآية المحورية:","<span class=\"ayah\">﴿قُل لَّا يَسْتَوِي الْخَبِيثُ وَالطَّيِّبُ وَلَوْ أَعْجَبَكَ كَثْرَةُ الْخَبِيثِ﴾<\/span> <span class=\"ayref\">المائدة: 100<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«مَنِ التَمَسَ رِضَى اللَّهِ بِسَخَطِ النَّاسِ كَفَاهُ اللَّهُ مُؤْنَةَ النَّاسِ»<\/span> <span class=\"takh\">[صحيح ابن حبان والترمذي]<\/span>.","📐 قواعد القرار الأخلاقي الحاسم:","1. درء المفاسد مقدم على جلب المصالح: المنفعة العاجلة بالحرام حسرة مؤبدة.","2. الغاية الشريفة لا تبرر الوسيلة الخبيثة: لا نجاح بالغش والخداع.","3. الشجاعة الأدبية: قل \"لا\" للباطل بثقة وأدب، فرضا الناس غاية لا تلزمك.","—hr—","🎯 خوارزمية الرفض الشجاع أمام الأصدقاء (احفظها وطبقها):","\"أنا أحترمكم وأعتز بصداقتكم، لكني لا أفعل هذا السلوك؛ لأنه يخالف ديني ومبادئي، ولن أغير رأيي\".","—hr—","📝 سجل الثبات على المبدأ هذا الأسبوع:","- الموقف الذي ثبتُّ فيه وقلتُ \"لا\": ___________________________________","- شعوري الداخلي بعد حماية ضميري وأمانتي: ____________________________","عهد الفتى المسلم: \"أنا شاب حر، ديني بوصلتي، ومرضاة ربي فوق رضا الناس جميعاً\"."]}]}]},{"id":"3-4","ordinal":"السادس عشر","title":"الموازنة الحياتية","sub":"الدراسة، العبادة، الأهل، والترويح","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثالثة: فقه الأولويات وإدارة الحياة"],["عنوان اللقاء","الموازنة الحياتية (الدراسة، العبادة، الأهل، والترويح)"],["الرمز الكودي","U3-L16-BALANCE"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل حوارية وتصميمية حول التوازن الحياتي وهندسة الاستقرار النفسي"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> التوازن الحياتي في الإسلام ليس قسمة حسابية متساوية لساعات اليوم، بل هو <b>\"إعطاء كل ذي حق حقه بميزان القسط\"<\/b>؛ استجابةً للتشريع النبوي: <span class=\"qt\">«إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا، وَلَنَفْسِكَ عَلَيْكَ حَقًّا، وَلأَهْلِكَ عَلَيْكَ حَقًّا، فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ»<\/span>. إن الاستغراق الأحادي الجائر في جانب واحد (كالمذاكرة الجافة مع قسوة على الأهل وترك العبادة، أو الاندفاع التام نحو اللعب والشاشات وإهمال التعليم) يورث الاحتراق النفسي (Burnout) والانهيار. الشاب المتزن يمارس <b>التناغم بين أركان الحياة الأربعة: العبادة، الدراسة والمهارة، بر الأهل، والترويح النظيف المجدد للهمة<\/b>."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفهم الفتى المفهوم الشمولي للعبادة وفقه التوازن النبوي، ويستوعب أسباب الاحتراق النفسي الناتجة عن الإفراط الأحادي."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى الراحة والبركة بالبر والترويح المباح، متخلصاً من عقدة الذنب الزائف أو الهروب الترفيهي المفرط."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يرسم الفتى \"عجلة الحياة المتزنة\" الخاصة به، ويعالج الخلل في القطاع المهمل، ويوقع ميثاق توازن أسبوعي ملزم."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بالسؤال المقارن التالي:"},{"t":"p","lvl":0,"h":"<b>\"لو رأيت شاباً يذاكر 10 ساعات يومياً ويحصد الدرجة النهائية، لكنه لا يبتسم في وجه أمه، ويصرخ في وجه أبيه إذا طلب منه خدمة، ولا يصلي إلا بنقر كالديك.. هل هذا الشاب في نظركم نموذج للنجاح والرجولة؟ أم أنه نموذج مشوه سينهار عند أول صدمة حقيقية في الحياة؟ ولماذا؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو السيارة ذات العجلة المعوجة)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة سيف وعامر: السيارة ذات العجلة المعوجة<\/span>"},{"t":"p","lvl":0,"h":"تخيل سيارة تسير على 4 عجلات:"},{"t":"p","lvl":0,"h":"(عجلة 1: العبادة والروح، عجلة 2: الدراسة والمهارات، عجلة 3: الأهل والبر، عجلة 4: الصحة والترويح)."},{"t":"p","lvl":0,"h":"- سيف (17 سنة): نفخ العجلة الدراسية بنسبة 100%، لكن عجلة الأهل مفرغة تماماً، وعجلة الترويح والراحة مكسورة! عندما انطلقت السيارة على الطريق السريع بدأت ترتج بعنف، وقبل الاختبارات بأسبوع اصطدمت بالحائط؛ أصيب سيف باحتراق نفسي وانهيار عصبي ولم يستطع دخول الامتحان!"},{"t":"p","lvl":0,"h":"- عامر (17 سنة): نفخ عجلة الترويح والألعاب بنسبة 100%، بينما العجلات الثلاث الأخرى مفرغة كلياً! فانقلبت سيارته وتدحرجت في قاع الفشل والرسوب!"},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. هل تستطيع سيارة أن تكمل رحلة طويلة إذا كانت إحدى عجلاتها مكسورة أو مفرغة؟"},{"t":"p","lvl":0,"h":"2. لماذا نتخيل أننا سنصل لقمة النجاح ونحن نكسر عجلة الأهل أو عجلة العبادة من أجل الدراسة أو الشاشات؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ ۖ وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا ۖ وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ﴾<\/span> <span class=\"ayref\">القصص: 77<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> رسم المنهج القرآني للتوازن الشامل؛ جعل الغاية الكبرى للآخرة، مع رعاية نصيب النفس والبدن والدنيا بغير إفراط ولا تفريط."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾<\/span> <span class=\"ayref\">الإسراء: 23<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> اقتران حق الله بحق الوالدين دلالة قاطعة على أن التوازن يقتضي ألا تطغى دراسة ولا عمل على رعاية البيت وبر الأسرة."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث سلمان الفارسي وأبي الدرداء رضي الله عنهما:<\/b> عندما رأى سلمان انقطاع أبي الدرداء للعبادة وإهماله حق زوجه وبدنه، فقال له: <span class=\"qt\">«إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا، وَلَنَفْسِكَ عَلَيْكَ حَقًّا، وَلأَهْلِكَ عَلَيْكَ حَقًّا، فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ»<\/span>، فذكرا ذلك للنبي ﷺ فقال: <span class=\"hadith\">«صَدَقَ سَلْمَانُ»<\/span> <span class=\"takh\">[صحيح البخاري: كتاب الصوم برقم 1968]<\/span>."},{"t":"li","lvl":1,"h":"<i>التأصيل الفقهي والتربوي:<\/i> إقرار نبوي صريح بأن التوازن بين الحقوق فريضة شرعية، وأن طغيان جانب على آخر -حتى في نوافل التعبد- خلل يرفضه الدين."},{"t":"li","lvl":0,"h":"<b>حديث حنظلة الأسيدي رضي الله عنه:<\/b> حين خاف من النفاق لتقلب حاله بين مجالس النبي ﷺ ورعاية أهله، فقال له النبي ﷺ: <span class=\"hadith\">«وَالَّذِي نَفْسِي بِيَدِهِ إِنْ لَوْ تَدُومُونَ عَلَى مَا تَكُونُونَ عِنْدِي وَفِي الذِّكْرِ لَصَافَحَتْكُمُ المَلاَئِكَةُ عَلَى فُرُشِكُمْ وَفِي طُرُقِكُمْ، وَلَكِنْ يَا حَنْظَلَةُ سَاعَةً وَسَاعَةً»<\/span> (كررها ثلاثاً) <span class=\"takh\">[صحيح مسلم: كتاب التوبة برقم 2750]<\/span>."},{"t":"li","lvl":0,"h":"<b>حديث إباحة الترويح الفطري النظيف:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«لِتَعْلَمَ يَهُودُ أَنَّ فِي دِينِنَا فُسْحَةً، إِنِّي أُرْسِلْتُ بِحَنِيفِيَّةٍ سَمْحَةٍ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>مسند أحمد برقم 24855، وصحيح ابن حبان برقم 5571، وصححه الألباني في السلسلة الصحيحة برقم 1829<\/cite><\/div><\/details>."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>هدي النبي ﷺ في بيته ومع صحابته:<\/b> كان ﷺ يمازح أصحابه ولا يقول إلا حقاً، وسابق أم المؤمنين عائشة رضي الله عنها في السفر، وكان في مهنة أهله يخدمهم ويؤانسهم؛ مجسداً التوازن الكامل بين قيادة الأمة وعبادة ربه ورعاية أهله والترويح عن نفسه."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: عجلة الحياة المتزنة (The Balanced Life Wheel)<\/b>"},{"t":"p","lvl":0,"h":"العبادة والروح (Worship)"},{"t":"p","lvl":0,"h":"|"},{"t":"p","lvl":0,"h":"|"},{"t":"p","lvl":0,"h":"الأهل والعلاقات --------+-------- الدراسة والمهارات"},{"t":"p","lvl":0,"h":"(Family &amp; Social)       |        (Study &amp; Skills)"},{"t":"p","lvl":0,"h":"|"},{"t":"p","lvl":0,"h":"الترويح والصحة (Leisure &amp; Health)"},{"t":"li","lvl":0,"h":"التوازن ليس قسماً حسابياً بالساعات (6 ساعات لكل قطاع)، بل هو إعطاء كل قطاع حقه من التركيز والجودة بحسب الحاجة الشرعية والفطرية."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: الترويح النظيف vs الاستنزاف الرقمي<\/b>"},{"t":"li","lvl":0,"h":"الفارق الجوهري: الترويح النظيف (الرياضة، لقاء الأصدقاء الصالحين، النزهة المباحة) يعيد شحن الطاقة وينعش الذهن. أما الترويح الرقمي المفرط (السهر على الشاشات) فهو استنزاف للدوبامين يورث الخمول والكسل والصداع."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أمي تطلب مني طلبات أثناء وقت مذاكرتي، وإذا رفضت تغضب، وإذا وافقت يتعطل ترتيبي، فكيف أتصرف؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> بر الوالدة هو مفتاح بركة الوقت والتوفيق في الامتحان. تصرف بذكاء ولباقة: ابتسم وقبّل رأسها وقل: <i>\"سأنفذ ما تريدين فوراً يا أمي، وبإذن الله سيعوضني ربي خيراً في مذاكرتي\"<\/i>. واحرص على جدولة وقتك بحيث تقضي طلبات البيت قبل بدء ساعات دراستك المركزة."}]},{"t":"qa","n":"2","q":"\"أشعر بعقدة ذنب إذا أخذت استراحة ولعبت مع أصدقائي وأنا ورائي مواد متراكمة، فهل الترويح هنا حرام؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الترويح ليس حراماً، ولكن المشكلة في <b>\"غياب الترتيب\"<\/b>. إذا خصصت ساعتين لمذاكرة مركزة بالمربع الثاني، فإن ساعة الترويح بعدها ستكون مأجورة ومريحة لضميرك تماماً. الخلل يأتي حين تروّح عن نفسك للهروب من المذاكرة!"}]},{"t":"qa","n":"3","q":"\"كيف أحمي نفسي من الاحتراق النفسي (Burnout) قبل الامتحانات النهائية؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> عبر المحافظة الصارمة على أركان التوازن: (نوم كافٍ 7 ساعات، ركعات الفجر والوتر، 20 دقيقة مشي أو رياضة، والجلوس مع الأسرة). إهمال هذه الأركان هو السبب المباشر لاحتراق الدماغ وعجزه عن الاستيعاب."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>حارس الميزان (الميسر الشاب):<\/b> إدارة نقاش الأركان الأربعة وضمان توازن المشاركات."},{"t":"li","lvl":0,"h":"<b>مهندس العجلة (المدوّن):<\/b> رسم عجلة الحياة وتفريغ تقييمات الفتيان على السبورة."},{"t":"li","lvl":0,"h":"<b>محامي الإفراط الأحادي (المعارض):<\/b> الدفاع عن فكرة الانقطاع للمذاكرة فقط وإلغاء الحياة الاجتماعية."},{"t":"li","lvl":0,"h":"<b>حارس الوقت (الميقاتي):<\/b> ضبط دقائق فقرات اللقاء."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر رسم وتقييم عجلة الحياة المتزنة (Balanced Wheel Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> نموذج ورقي لدائرة مقسمة لـ 4 قطاعات (A4) + مسطرة وأقلام ملونة."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"يقيم الفتى واقعه الحالي من (1 إلى 10) على أشعة القطاعات الأربعة:"},{"t":"li","lvl":2,"h":"<i>قطاع العبادة:<\/i> (الفرائض، الورد القرآني، الأذكار)."},{"t":"li","lvl":2,"h":"<i>قطاع الدراسة:<\/i> (المذاكرة التراكمية، المهارات، القراءة)."},{"t":"li","lvl":2,"h":"<i>قطاع الأهل:<\/i> (البر، المؤانسة، قضاء الحوائج)."},{"t":"li","lvl":2,"h":"<i>قطاع الصحة والترويح:<\/i> (الرياضة، النوم الكافي، الهوايات المباحة)."},{"t":"li","lvl":1,"h":"التوصيل بين النقاط لرؤية شكل الإطار (هل تسير به السيارة بسلاسة أم يتعثر؟)."},{"t":"li","lvl":1,"h":"كتابة قرارين تصحيحيين فوريين لرفع مستوى القطاع الأكثر إهمالاً."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: باسم وعقدة الانغلاق والاحتراق النفسي<\/span>"},{"t":"p","lvl":0,"h":"باسم (17 سنة) طالب نابغ في الثانوية، وضع لنفسه جدولاً حديدياً:"},{"t":"p","lvl":0,"h":"- يذاكر 9 ساعات متواصلة يومياً، ويقفل باب غرفته بالمفتاح."},{"t":"p","lvl":0,"h":"- حين تطلب منه أمه الجلوس مع الأسرة 10 دقائق يصرخ: \"أنا أذاكر، أنتم تدمرون مستقبلي!\"."},{"t":"p","lvl":0,"h":"- امتنع عن أي نشاط رياضي أو نزهة ترويحية، وقلص نومه لـ 4 ساعات."},{"t":"p","lvl":0,"h":"النتيجة قبل الامتحانات بأسبوعين:"},{"t":"p","lvl":0,"h":"أصيب باسم بنوبات ذعر حادة، وصداع نصفي مزمن، وعجز تام عن قراءة صفحة واحدة، وصار يبكي بحرقة في غرفته ورفض دخول الامتحانات!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. ما الخلل الفكري والمنهجي الذي أدى لانهيار باسم؟"},{"t":"p","lvl":0,"h":"2. كيف لو طبق باسم وصية سلمان النبوي: <span class=\"qt\">«إن لربك عليك حقاً ولنفسك عليك حقاً ولأهلك عليك حقاً»<\/span> حمى نفسه من هذا الانهيار؟"},{"t":"p","lvl":0,"h":"3. أعد تصميم جدول متزن لباسم يجمع التفوق مع راحة البال وبر الوالدين."}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال الشاب المتفوق دراسياً والعاق لوالديه."],["05 - 15 د","الخطاف الحواري","قصة سيف وعامر والسيارة ذات العجلة المعوجة."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","أدلة القصص، حديث سلمان النبوي، وحديث ساعة وساعة."],["30 - 45 د","المختبر ودراسة الحالة","تمرين رسم عجلة الحياة وتفكيك أزمة باسم في المجموعات."],["45 - 55 د","بنك الأسئلة الجدلية","نقاش طلبات الأهل، الترويح المأجور، والوقاية من الاحتراق."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وتوقيع ميثاق التوازن."],["65 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع الأدوار للقاء القادم."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 60-75","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«التوازن بين الحقوق والواجبات أصل كبير في الإسلام؛ فلا يجوز أن يطغى حق على حق، ولا واجب على واجب، والغلو في جانب يفضي إلى خراب الجوانب الأخرى»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 100-112","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الاعتدال في العبادة والحياة صمام أمان النفس؛ والترويح المباح المجدد للنشاط جزء أصيل من الفطرة السوية»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 65-72","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«الصراع بين متطلبات الدراسة وتطلعات الترويح وبر الأسرة يولد ضغطاً هائلاً على المراهق؛ وعلاجه يكمن في تنظيم الأدوار المتكاملة»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 310-325","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«التربية الإسلامية تربية شاملة تعتني بالجسد والروح والعقل والروابط الاجتماعية؛ ولا تقبل أن تصنع شخصية مشوهة أحادية البعد»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 25-30","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«التكامل البنائي الشامل في شخصية الشاب المسلم يحميه من الانتكاس؛ فالشاب يحتاج لتوازن متين بين العلم الشرعي والدراسة والبر والترويح الهادف»<\/span>."},{"t":"src","cite":"منهج التربية الإسلامية - محمد قطب - ص 40-52","short":"منهج التربية الإسلامية — محمد قطب","q":"<span class=\"qt\">«الشمول والتوازن في الفطرة الإنسانية هما جوهر التربية في الإسلام؛ حيث تلتقي مطالب الروح والجسد في تناغم فريد دون تصادم»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>عجلة الحياة وبناء الشخصية المتوازنة<\/i> — بول ج. ماير <span class=\"pg\">ص 25-60<\/span>."},{"t":"li","lvl":1,"h":"<i>الراحة النفسية وفقه الاستجمام في الإسلام<\/i> — د. عبد اللطيف عاشور <span class=\"pg\">ص 45-80<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي:<\/b> \"التوازن الحياتي بين الدراسة والعبادة وبر الوالدين\" — د. أحمد عبد المنعم على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"كيف تتجنب الاحتراق النفسي (Burnout) في مراحل الدراسة الصعبة؟\" — قناة علي وكتاب على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"الميثاق الأسبوعي للتوازن الحياتي\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. قطاع الأهل والبر:","[ ] تخصيص 30 دقيقة يومياً للجلوس مع الوالدين بغير هاتف والحديث معهما ومساعدتهما.","2. قطاع الصحة والترويح النظيف:","[ ] ممارسة 30 دقيقة من النشاط البدني أو المشي يومياً، مع نوم مبكر لا يقل عن 7 ساعات.","3. قطاع الدراسة والعبادة المتزنة:","[ ] الحفاظ على ساعتين مذاكرة تراكمية يومياً مع المحافظة التامة على صلاة الفجر والوتر."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["تحقيق التوازن بين الجوانب","يعيش بقطاع واحد فقط (إما استغراق في اللعب أو انغلاق دراسي جاف).","يمارس بعض التوازن لكنه يتخلى عن بر أهله ورياضته عند أدنى ضغط امتحانات.","يتقن التناغم الشامل، ويؤدي حق ربه ونفسه ودراسته وأهله باتزان تام."],["التعامل مع الأهل أوقات الجد","يعامل والديه بعصبية وجفاء مبرراً ذلك بضغط الامتحانات والمذاكرة.","يستجيب لطلبات والديه بتثاقل وتردد مع تذمر خفي.","يجعل بر الوالدين مصدراً للراحة والبركة، ويخدمهما بحب وبشاشة وجه."],["جودة الترويح والصحة","يقضي راحته في التحديق المجهد في الشاشات والسهر المؤذي.","يمارس ترويحاً متقطعاً لكنه يشعر بعقدة ذنب تشوش راحته.","يمارس ترويحاً نظيفاً (رياضة/أصدقاء أخيار) يجدد طاقته للجد والإنجاز."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: هندسة التوازن الحياتي","sub":"","lines":["💡 البوصلة والمفهوم:","الإسلام لا يريدك آلة صماء تدرس وتأكل فقط! التوازن شريعة وفطرة: <span class=\"qt\">«فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ»<\/span>. نجاحك الدراسي لا يسوغ لك الجفاف العاطفي وقسوة اللسان مع والديك، والترويح النظيف ليس تضييعاً للوقت بل وقودٌ يجدد همتك لمواصلة المسير.","📖 الآية المحورية:","<span class=\"ayah\">﴿وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ ۖ وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا﴾<\/span> <span class=\"ayref\">القصص: 77<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ مقرّاً سلمان رضي الله عنه: <span class=\"hadith\">«إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا، وَلَنَفْسِكَ عَلَيْكَ حَقًّا، وَلأَهْلِكَ عَلَيْكَ حَقًّا، فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ»<\/span> <span class=\"takh\">[صحيح البخاري]<\/span>.","📐 أركان عجلة الحياة الأربعة (احفظ توازنها تسلم سيارتك):","1. حق الله (العبادة): الفجر، الورد القرآني، وصلاة الوتر.","2. حق النفس (الصحة والترويح): نوم كافٍ، رياضة، واستجمام مباح يروح عن الفؤاد.","3. حق الأهل (البر): ابتسامة، جلسة مؤانسة يومية، وقضاء حوائج البيت.","4. حق المستقبل (الدراسة والمهارة): مذاكرة تراكمية هادئة بغير تسويف.","—hr—","🎯 إجراءات ضبط التوازن لهذا الأسبوع:","- عادتي مع أهلي (30 دقيقة مؤانسة): ________________________________","- عادتي البدنية والترويحية (رياضة/نزهة): _____________________________","—hr—","📝 جدول تتبع التوازن الأسبوعي (ضع ✓ عند الوفاء بالحقوق الأربعة):","[ السبت ]  [ الأحد ]  [ الاثنين ]  [ الثلاثاء ]  [ الأربعاء ]  [ الخميس ]  [ الجمعة ]","(   )      (   )      (    )       (    )       (    )       (   )      (   )","عهد الفتى المسلم: \"أنا شاب مسلم متزن، أعطي كل ذي حق حقه، بركة حياتي في بر أهلي وعبادة ربي\"."]}]}]},{"id":"3-5","ordinal":"السابع عشر","title":"الوعي المالي المبكر","sub":"ترشيد الاستهلاك وضبط الرغبات","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثالثة: فقه الأولويات وإدارة الحياة"],["عنوان اللقاء","الوعي المالي المبكر (ترشيد الاستهلاك وضبط الرغبات)"],["الرمز الكودي","U3-L17-MONEY"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل حوارية ومختبر هندسة المصروف الشخصي ومقاومة الثقافة الاستهلاكية"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> الوعي المالي المبكر ليس مجرد تدبير لمصروف الجيب، بل هو <b>\"تأسيس لعقيدة المال والحرية والاستقلال الأخلاقي\"<\/b>؛ فالمال نعمة وأمانة يُسأل عنها الشاب بين يدي الله (من أين اكتسبه وفيما أنفقه). في عصر الاستهلاك القهري وضغوط الإعلانات الموجهة، يُستدرج الفتى للخلط بين <b>\"الاحتياج الحقيقي (Needs)\"<\/b> و\"الرغبة الهوائية الاستعراضية (Wants)\"<b>. إن امتلاك مهارة ضبط الرغبات، وتطبيق \"قاعدة الادخار الذري (20%)\"، و<\/b>\"قانون الـ 30 يوماً\" يحمي الشاب من الاستدانة والتبعية المادية، ويبني فيه عقلية الرجل المسؤول."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفكك الفتى هرم مراتب الإنفاق (ضروريات، حاجيات، وتحسينيات)، ويدرك الحيل النفسية لخوارزميات الإعلانات الاستهلاكية."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى عزة القناعة والاستغناء عن الشكليات، متحرراً من وهم استمداد القيمة من الماركات والمظاهر."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يصمم الفتى \"ميزانية المصروف الشخصي 50/30/20\"، ويحدد رغبة استهلاكية اندفاعية ويؤجل شراءها 30 يوماً."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بطرح هذا التساؤل المباشر:"},{"t":"p","lvl":0,"h":"<b>\"لو دخلت متجراً وأعجبك قميص أو حذاء يحمل علامة تجارية شهيرة بسعر يعادل مصروفك لشهر كامل، وعندك في البيت 3 أحذية ممتازة تؤدي نفس الغرض تماماً.. ما الذي يجعلك تصر على شرائه؟ هل اشتريت (الحذاء لترتديه)؟ أم اشتريت (نظرة الإعجاب وتصفيق زملائك في المدرسة)؟ ومن الرابح الحقيقي في هذه الصفقة: أنت أم الشركة التي تلاعبت بعقلك؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو الحذاء الفاخر والمصيدة المادية)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة ماجد ورامي: مصيدة الحذاء الرياضي والجيوب الفارغة<\/span>"},{"t":"p","lvl":0,"h":"- ماجد (17 سنة): استلم مصروفه الشهري (50 دولاراً). شاهد في اليوم الأول إعلاناً براقاً لحذاء يرتديه لاعب مشهور بقيمة 45 دولاراً! رغم امتلاكه لحذاء ممتاز، اشترى الحذاء فوراً ليتباهى به بين زملائه."},{"t":"p","lvl":0,"h":"النتيجة: عاش بقية الـ 29 يوماً بجيوب خاوية، عجز عن شراء كتاب يلزمه، واضطر للاستدانة وخفض رأسه للآخرين!"},{"t":"p","lvl":0,"h":"- رامي (17 سنة): استلم نفس المصروف (50 دولاراً). طبق قاعدة الادخار الذري (50/30/20):"},{"t":"p","lvl":0,"h":"(10 دولارات وُضعت في صندوق الادخار والصدقة، 25 دولاراً للضروريات، 15 دولاراً للترويح المنضبط)."},{"t":"p","lvl":0,"h":"النتيجة: عاش رامي كريم النفس، واشترى حاسوباً ودورة تقنية في نهاية العام من ادخاره الشخصي!"},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. هل اشترى ماجد الحذاء لحاجته إليه؟ أم اشترى وهماً صنعته إعلانات الشركات؟"},{"t":"p","lvl":0,"h":"2. كيف يتحول الشاب الذي لا يملك وعياً مالياً إلى عبدٍ للماركات وأسيرٍ للاستدانة؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَالَّذِينَ إِذَا أَنفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا﴾<\/span> <span class=\"ayref\">الفرقان: 67<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الضابط القرآني الرصين للمال؛ الوسطية والقوامة بين جحيم التبذير الاستهلاكي وشح الإقتار المذموم."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُومًا مَّحْسُورًا﴾<\/span> <span class=\"ayref\">الإسراء: 29<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> التحذير من الاندفاع العاطفي في الإنفاق؛ فعاقبته الحسرة والانكسار المالي والندم (\"محسوراً\")."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث عبد الله بن مسعود رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«لاَ تَزُولُ قَدَمَا عَبْدٍ يَوْمَ القِيَامَةِ حَتَّى يُسْأَلَ عَنْ عُمُرِهِ فِيمَا أَفْنَاهُ، وَعَنْ عِلْمِهِ فِيمَ فَعَلَ، وَعَنْ مَالِهِ مِنْ أَيْنَ اكْتَسَبَهُ وَفِيمَ أَنْفَقَهُ، وَعَنْ جِسْمِهِ فِيمَ أَبْلاَهُ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>جامع الترمذي: كتاب صفة القيامة برقم 2417، وقال: حديث حسن صحيح<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الفقهي والتربوي:<\/i> المساءلة عن المال سؤال ثنائي دقيق (عن المدخل والمخرج)؛ فالمال ليس ملكاً مطلقاً للتصرف العبثي، بل هو أمانة مستخلفة."},{"t":"li","lvl":0,"h":"<b>حديث عمرو بن العاص رضي الله عنه:<\/b> أن رسول الله ﷺ قال له: <span class=\"hadith\">«يَا عَمْرُو، نِعْمَ المَالُ الصَّالِحُ لِلْمَرْءِ الصَّالِحِ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>مسند أحمد برقم 17763، والأدب المفرد للبخاري برقم 299، وصحيح ابن حبان برقم 3210، وصححه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل المفاهيمي:<\/i> إقرار نبوي بأن المال الصالح قوة وعزة وسلاح بيد الشاب الصالح لتمكين نفسه وأمته ونفع الناس."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف أمير المؤمنين عمر بن الخطاب مع جابر بن عبد الله رضي الله عنهما:<\/b> رأى عمر في يد جابر لحماً، فقال: <span class=\"qt\">«مَا هَذَا يَا جَابِرُ؟»<\/span> قَالَ: <span class=\"qt\">«اشْتَهَيْتُ لَحْمًا فَاشْتَرَيْتُهُ!»<\/span>، فَقَالَ عُمَرُ كلمته الخالدة التي تقتلع جذور الاستهلاك القهري: <span class=\"qt\">«أَوَكُلَّمَا اشْتَهَيْتَ اشْتَرَيْتَ؟! أَمَا تَخَافُ أَنْ تَكُونَ مِنْ أَهْلِ هَذِهِ الآيَةِ: <span class=\"ayah\">﴿أَذْهَبْتُمْ طَيِّبَاتِكُمْ فِي حَيَاتِكُمُ الدُّنْيَا وَاسْتَمْتَعْتُمْ بِهَا﴾<\/span>؟!»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>أخرجه ابن أبي شيبة في المصنف برقم 25400، وأحمد في الزهد ص 125، والبيهقي في شعب الإيمان برقم 5321، وإسناده صحيح<\/cite><\/div><\/details>."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: هرم مراتب الإنفاق والاحتياجات<\/b>"},{"t":"p","lvl":0,"h":"التحسينيات والكماليات (Luxury / Wants)"},{"t":"p","lvl":0,"h":"- الماركات الفاخرة، الألعاب الرقمية، المظاهر."},{"t":"p","lvl":0,"h":"* الإجراء: قيّدها وحاصرها بقانون الـ 30 يوماً!"},{"t":"p","lvl":0,"h":"------------------------------------------------"},{"t":"p","lvl":0,"h":"الحاجيات (Comforts &amp; Secondary Needs)"},{"t":"p","lvl":0,"h":"- دورات تدريبية، ملابس مناسبة، خروج متزن."},{"t":"p","lvl":0,"h":"* الإجراء: خطط لها وأنفق فيها باعتدال!"},{"t":"p","lvl":0,"h":"------------------------------------------------"},{"t":"p","lvl":0,"h":"الضروريات الأساسية (Core Needs)"},{"t":"p","lvl":0,"h":"- الكتب الدراسية، الطعام والشراب الأساسي، العلاج."},{"t":"p","lvl":0,"h":"* الإجراء: حافظ عليها وقدمها أولاً!"},{"t":"p","lvl":0,"h":"<b>المحور الثاني: قاعدة التوزيع المالي الذري (50 / 30 / 20)<\/b>"},{"t":"li","lvl":0,"h":"<b>50% للضروريات والحاجيات الأساسية:<\/b> مواصلات، قرطاسية، ومستلزمات دراسية."},{"t":"li","lvl":0,"h":"<b>30% للرغبات والترويح المنضبط:<\/b> هدايا، خروج مع الأصدقاء، وهوايات مباحة."},{"t":"li","lvl":0,"h":"<b>20% للادخار والتنمية والصدقة:<\/b> توضع فور استلام المصروف في صندوق مغلق لا يُلمس."},{"t":"p","lvl":0,"h":"<b>المحور الثالث: قانون الـ 30 يوماً لكسر الشراء الاندفاعي (De-Influencing)<\/b>"},{"t":"li","lvl":0,"h":"إذا اشتهيت شيئاً كمالياً (حذاء جديد، لعبة، سماعة فاخرة)، ألزِم نفسك بتأجيل الشراء 30 يوماً كاملاً. إذا بقيت الرغبة ملحة بعد الشهر وكانت ميزانيتك تسمح فكر بشرائه، وغالباً ستكتشف بعد أسبوعين أن الرغبة تلاشت وأن الأمر كان فورة عاطفية مؤقتة!"}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أليس الادخار نوعاً من البخل والفقر النفسي؟ ونحن شباب نريد الاستمتاع بيومنا (YOLO)!\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> البخل هو حرمان النفس من الواجب، أو الشح في حقوق الله والأهل والصدقة. أما الادخار فهو <b>\"الحرية المالية وبناء القوة\"<\/b>؛ الشاب المقتصد المدخر هو الذي يملك قراره ويستطيع إطلاق مشاريعه الخاصة دون أن يمد يده لأحد وقت الأزمات."}]},{"t":"qa","n":"2","q":"\"أصدقائي يرتدون ماركات غالية ويسخرون من الملابس العادية، فكيف أواجه ذلك؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الماركات صُممت لتبيع للمفلسين شعوراً زائفاً بالثراء! قيمتك الحقيقية في عقلك، وأخلاقك، وإنجازك، ورجولتك، وليست في قطعة قماش رخيصة الصنع وُضع عليها شعار بمئات الدولارات. صاحب الشخصية القوية هو من يزين ثيابه، لا من تزيّنه ثيابه."}]},{"t":"qa","n":"3","q":"\"كيف أستثمر مصروفي الصغير وأنا طالب لا أملك مبالغ ضخمة؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> أعظم استثمار للشاب في عمرك هو <b>\"الاستثمار في مهاراتك وعقلك\"<\/b>؛ ادخار مبالغ يسيرة لشراء كتب تأسيسية، أو الاشتراك في منصات تعليم لغات وبرمجة يعود عليك بأضعاف مضاعفة ويفتح لك أبواب الكسب الحلال المبكر."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>المستشار المالي (الميسر الشاب):<\/b> إدارة نقاش الميزانية وتفكيك سحر الإعلانات."},{"t":"li","lvl":0,"h":"<b>مدوّن الميزانية (المدوّن):<\/b> رسم هرم الإنفاق وقاعدة (50/30/20) على السبورة."},{"t":"li","lvl":0,"h":"<b>محامي الماركات (المعارض):<\/b> الدفاع عن فكرة شراء الماركات لنيل الاحترام المجتمعي."},{"t":"li","lvl":0,"h":"<b>ضابط الصندوق (الميقاتي):<\/b> الالتزام بتوقيت فقرات الورشة."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر ميزانية المصروف وقانون الـ 30 يوماً (Youth Financial Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة تصميم الميزانية الشخصية + حاسبة إلكترونية."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<i>جرد الأسبوع الماضي:<\/i> تسجيل نفقات الأسبوع الماضي وتصنيفها (ضروريات، حاجيات، رغبات كمالية)."},{"t":"li","lvl":1,"h":"<i>إعادة الهيكلة بمخطط (50/30/20):<\/i> تقسيم المصروف الأسبوعي أو الشهري على البنود الثلاثة بدقة."},{"t":"li","lvl":1,"h":"<i>استمارة قانون الـ 30 يوماً:<\/i> كتابة اسم شيء كمالي يشتهي الفتى شراءه الآن، وتدوين تاريخ اليوم، والتعهد الخطي بتأجيل شرائه لمدة 30 يوماً كاملاً."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: أمجد وفخ الهاتف الجديد بالتقسيط<\/span>"},{"t":"p","lvl":0,"h":"أمجد (17 سنة) يملك هاتفاً ممتازاً يعمل بكفاءة ويلبي كافة متطلبات الدراسة والتواصل."},{"t":"p","lvl":0,"h":"عندما أعلنت إحدى الشركات عن هاتف جديد بتعديلات بسيطة في الكاميرا، استبد به الهوس!"},{"t":"p","lvl":0,"h":"بما أن أمجد لا يملك ثمنه (800 دولار)، ضغط على والده بشدة وأقنعه ببيع هاتفه بسعر بخس، واقتراض بقية المبلغ بالتقسيط من أحد الأقارب!"},{"t":"p","lvl":0,"h":"الآن: والد أمجد مثقل بأقساط شهرية، وأمجد يعيش في رعب دائم من خدش الهاتف أو سرقته، ولم يضف الهاتف الجديد حرفاً واحداً لذكائه أو دراسته!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. حلل تصرف أمجد استناداً لمبدأ عمر رضي الله عنه: <span class=\"qt\">«أَوَكُلَّمَا اشْتَهَيْتَ اشْتَرَيْتَ؟»<\/span>."},{"t":"p","lvl":0,"h":"2. ما الآثار النفسية والمالية التي تسبب بها أمجد لأسرته بسبب النهم الاستهلاكي؟"},{"t":"p","lvl":0,"h":"3. كيف كان سينقذ أمجد نفسه لو طبق \"قانون الـ 30 يوماً وقاعدة الادخار الذري\"؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال شراء القميص الفاخر وتفكيك شراء التفاخر."],["05 - 15 د","الخطاف الحواري","قصة ماجد ورامي ومصيدة الحذاء الرياضي."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","أدلة الفرقان، حديث المساءلة المالية، وأثر عمر مع جابر."],["30 - 45 د","المختبر ودراسة الحالة","تمرين الميزانية الذرية 50/30/20 وتفكيك حالة أمجد."],["45 - 55 د","بنك الأسئلة الجدلية","تفكيك وهم الماركات، الفرق بين البخل والادخار، والاستثمار."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وتفعيل اقتطاع الادخار والصدقة."],["65 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع الأدوار للقاء التتويجي القادم."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 30-45","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«ترتيب مراتب الوجود والإنفاق أصل مقاصدي: الضروريات أولاً، تليها الحاجيات، ثم التحسينيات؛ وأخطر الفساد أن تُقدم التحسينيات على حساب الضروريات»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 82-86","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«نزعة التفاخر بالماركات لدى المراهق ما هي إلا محاولة للتعويض النفسي عن الشعور بنقص التقدير؛ وعلاجه يكون ببناء الاستقلال الذاتي والقناعة»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 115-128","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«القناعة والاعتدال هما سياج عزة المسلم؛ والإسلام يذم الشره الاستهلاكي الذي يجعل الإنسان أسيراً لشهواته وعبداً لمطالب بطنه ومظهره»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 390-405","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«التربية الاقتصادية للفتى تبدأ بتعويده على كسب اليد، وحسن التدبير لمصروفه، وتجنيبه مهاوي السرف والتبذير»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 45-50","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«الحصانة الفكرية تقتضي التحرر من عبودية الثقافة الاستهلاكية التي تبثها الشركات؛ فالشاب الرسالي يملك عقلاً ناقداً يميز بين حاجته الحقيقية وزيف الإعلانات»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 180-192","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«الادخار الذري التراكمي يبدأ بالاقتطاع التلقائي الفوري لمبالغ صغيرة؛ فالانضباط المالي هو عادة تتشكل بالتكرار لا بحجم الدخل»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>سيكولوجية المال (Psychology of Money)<\/i> — مورغان هاوسل (فصل: الحرية والقناعة وضبط الرغبات الاستهلاكية، ص 40-75)."},{"t":"li","lvl":1,"h":"<i>الأب الغني والأب الفقير للشباب<\/i> — روبرت كيوساكي <span class=\"pg\">ص 30-65<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"كيف تخدعنا إعلانات الماركات ونتخلص من فخ الاستهلاك السريع؟\" — قناة علي وكتاب على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"فقه المال والاستغناء وعقيدة الشاب المسلم\" — الشيخ أحمد السيد على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"الادخار الذري وتأجيل الرغبة الاستهلاكية\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. تطبيق اقتطاع الـ 20% (The 20% Rule):","[ ] اقتطاع 20% فوراً من أي مصروف أو مبلغ يصل ليدك هذا الأسبوع ووضعه في صندوق الادخار والصدقة.","2. تفعيل قانون الـ 30 يوماً:","[ ] امتناع تام عن شراء أي رغبة استهلاكية كمالية طوال الأسبوع وتأجيلها خطياً لمدة شهر.","3. الصدقة الذرية اليومية:","[ ] التصدق بمبلغ يسير بنية البركة وتطهير النفس وتزكيتها."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الوعي بضبط الرغبات","يشتري كل ما يشتهيه باندفاع ويرهق والديه بطلبات كمالية.","يدرك أهمية الترشيد لكنه يضعف أمام إغراءات الماركات وتخفيضات الإعلانات.","يطبق قانون الـ 30 يوماً بصرامة، ويفرق بحزم بين الاحتياج والرغبة."],["تطبيق ميزانية المصروف","ينفق مصروفه في الأيام الأولى ويبقى طوال الشهر مفلساً ومستديناً.","يوزع مصروفه بشكل تقريبي مع صعوبة في المحافظة على نسبة الادخار.","يلتزم بقاعدة (50/30/20) باقتدار، ويقتطع حصة الادخار والصدقة أولاً."],["الاستغناء والقناعة","يستمد قيمته وثقته من ماركة حذائه وهاتفه والمظاهر الاستعراضية.","يشعر بالحرج أحياناً من عدم مجاراة رفاقه في الشكليات الثمينة.","يملك عزة نفس صلبة، ويعلم أن قيمته في خُلقه وإيمانه وعقله لا في مظهره."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: الوعي والرشد المالي المبكر","sub":"","lines":["💡 البوصلة والمفهوم:","المال خادمٌ مطيع لكنه سيدٌ قبيح! الشاب الراشد لا تستعبده إعلانات الماركات، ولا يشتري ما لا يحتاج ليبهج من لا يهتم به. قيمتك في عقلك ودينك ورجولتك وليست في ملصق تجاري. الاستغناء والادخار المبكر هما طريقك للحرية والكرامة.","📖 الآية المحورية:","<span class=\"ayah\">﴿وَالَّذِينَ إِذَا أَنفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا﴾<\/span> <span class=\"ayref\">الفرقان: 67<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«لاَ تَزُولُ قَدَمَا عَبْدٍ يَوْمَ القِيَامَةِ حَتَّى يُسْأَلَ... وَعَنْ مَالِهِ مِنْ أَيْنَ اكْتَسَبَهُ وَفِيمَ أَنْفَقَهُ»<\/span> <span class=\"takh\">[جامع الترمذي]<\/span>.","📐 قواعد الرشد المالي الثلاث:","1. قاعدة عمر رضي الله عنه: <span class=\"qt\">«أَوَكُلَّمَا اشْتَهَيْتَ اشْتَرَيْتَ؟!»<\/span> (حاصر الشراء الاندفاعي).","2. قانون الـ 30 يوماً: أجّل شراء أي كماليات شهراً كاملاً لتتأكد من زوال فورة الرغبة.","3. ميزانية (50/30/20): 50% للأساسيات، 30% للترويح المنضبط، و20% ادخاراً وصدقة.","—hr—","🎯 رغبتي المؤجلة بقانون الـ 30 يوماً:","- السلعة التي أشتهيها الآن: _________________________________________","- تاريخ اليوم: ___ / ___ / 2026م  ⬅️  تاريخ اتخاذ القرار: ___ / ___ / 2026م.","—hr—","📝 سجل تتبع تحدي الادخار الأسبوعي (ضع ✓ عند الاقتطاع):","[ اقتطاع 20% للادخار ]  [ الصدقة الذرية الأسبوعية ]  [ مقاومة شراء اندفاعي ]","(   )                       (   )                       (   )","عهد الفتى المسلم: \"أنا شاب رشيد، مالي أمانة مستخلفة، قناعتي عزي، ولن أكون أسيراً للنزوات الاستهلاكية\"."]}]}]},{"id":"3-6","ordinal":"الثامن عشر","title":"مشروع تطبيقي — تصميم ميثاق زمني شخصي لإدارة الحياة","sub":"تتويج مخرجات الوحدة الثالثة","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثالثة: فقه الأولويات وإدارة الحياة"],["عنوان اللقاء","مشروع تطبيقي — تصميم ميثاق زمني شخصي لإدارة الحياة (تتويج مخرجات الوحدة الثالثة)"],["الرمز الكودي","U3-L18-PROJECT"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","مختبر تتويجي لصياغة المواثيق، توقيع العهود، ومعرض المشروعات الحياتية"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> تتويج المكاسب التربوية والتأصيلية الخمسة السابقة للوحدة الثالثة (تحديد بوصلة الأهداف، الجدولة بمصفوفة المهام، صناعة القرار الأخلاقي، التوازن الحياتي، والوعي المالي) لا يكتمل بالمعرفة النظرية وحدها، بل بـ <b>\"دمجها وتكثيفها في وثيقة تنفيذية حاسمة: الميثاق الزمني الشخصي لإدارة الحياة (Personal Life Charter)\"<\/b>. هذا الميثاق المكتوب والمشهَد هو الدستور التشغيلي الذي ينقل الفتى من فوضى العيش والشتات إلى حوكمة الذات، والالتزام المسؤول بعهده مع الله ونفسه وأمته، استجابةً للأمر الإلهي: <span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾<\/span>."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يدرك الفتى قوة \"العقود السلوكية المكتوبة والمشهدة\" في تثبيت الهوية، ودور الدستور الشخصي في حماية المسار عند الفتور وضغط الأقران."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى هيبة ومسؤولية الرجولة والصدق في العهد مع الله: <span class=\"ayah\">﴿رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ﴾<\/span>."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يصوغ الفتى بيده \"وثيقة الميثاق الزمني الشخصي\" متضمنة خلاصة أدوات الوحدة، ويوقعها رسمياً أمام المربي وشريك المساءلة (الرفيق المحاسب)."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بالسؤال المفاجئ التالي:"},{"t":"p","lvl":0,"h":"<b>\"لماذا تصر كبرى الشركات والدول والمؤسسات الناجحة على توقيع عقود ومواثيق دستورية مكتوبة ومختومة، وترفض تماماً الاعتماد على (الكلام الشفهي والنوايا الطيبة)؟ هل تعتقد أن حياتك وعمرك وأهدافك أقل شأناً من شركة تجارية؟ ولماذا نعيش سنواتنا بنوايا شفهية تتبخر عند أول هبة هواء أو فتور؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو المدير التنفيذي بلا عقد)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة الشركة العالمية والمدير بلا عقد ولا ميثاق<\/span>"},{"t":"p","lvl":0,"h":"تخيل شركة استثمارية كبرى برأسمال مليار دولار، وظفت مديراً تنفيذياً شاباً وذكياً جداً."},{"t":"p","lvl":0,"h":"في اليوم الأول، سأل المدير رئيس مجلس الإدارة:"},{"t":"p","lvl":0,"h":"- \"أين عقد العمل؟ أين الأهداف المكتوبة، والدستور الذي يحكم مسؤولياتي ومواعيد إنجازاتي؟\"."},{"t":"p","lvl":0,"h":"ابتسم الرئيس وقال له:"},{"t":"p","lvl":0,"h":"- \"لا حاجة للأوراق والمواثيق! نحن نثق بنواياك الطيبة وكلامك الرائع.. اعمل متى شئت، وبالمعدل الذي يروق لك وبلا أرقام ولا دفاتر!\"."},{"t":"p","lvl":0,"h":"بعد 4 أشهر: ضاعت الميزانيات، تعطلت المشاريع، استقال الكفاءات، وأعلنت الشركة إفلاسها التام!"},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. من المتسبب في انهيار الشركة: هل هو نقص كفاءة المدير؟ أم غياب العقد والميثاق الملزم والمكتوب؟"},{"t":"p","lvl":0,"h":"2. أليست حياتك هي هذه المؤسسة تماماً؟ وماذا تتوقع لحياتك إذا استمرت بلا ميثاق مكتوب يحاسبك عليه شريك صادق؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾<\/span> <span class=\"ayref\">المائدة: 1<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الأمر الإلهي الجازم بالوفاء بالعقود والشروط؛ وأعظم العقود هو العقد الإيماني والشخصي على استقامة الحياة وإدارتها بما يرضي الله."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾<\/span> <span class=\"ayref\">الأحزاب: 23<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> اقتران وصف \"الرجولة الحقيقية\" بالصدق في العهد والميثاق والثبات عليه دون تبديل أو نكوص."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَأَوْفُوا بِالْعَهْدِ ۖ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا﴾<\/span> <span class=\"ayref\">الإسراء: 34<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث جابر بن عبد الله وعمرو بن عوف رضي الله عنهما:<\/b> أن رسول الله ﷺ قال: <span class=\"hadith\">«المُسْلِمُونَ عِنْدَ شُرُوطِهِمْ، مَا وَافَقَ الحَقَّ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>سنن أبي داود: كتاب الأقضية برقم 3594؛ وجامع الترمذي برقم 1352، وصححه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> الالتزام بالعهود والشروط الذاتية والأخلاقية أصل في بناء الشخصية المسلمة المنضبطة."},{"t":"li","lvl":0,"h":"<b>حديث عبد الله بن عمرو رضي الله عنهما:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«أَرْبَعٌ مَنْ كُنَّ فِيهِ كَانَ مُنَافِقًا خَالِصًا، وَمَنْ كَانَتْ فِيهِ خَصْلَةٌ مِنْهُنَّ كَانَتْ فِيهِ خَصْلَةٌ مِنْ النِّفَاقِ حَتَّى يَدَعَهَا: إِذَا اؤْتُمِنَ خَانَ، وَإِذَا حَدَّثَ كَذَبَ، وَإِذَا عَاهَدَ غَدَرَ، وَإِذَا خَاصَمَ فَجَرَ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الإيمان برقم 34؛ وصحيح مسلم برقم 58<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل المفاهيمي:<\/i> الغدر ونقض العهود الشخصية والتراجع عنها علامة من علامات النفاق؛ فالرجل الصادق هو من يفي بما عاهد عليه نفسه وربه."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>مواثيق النبي ﷺ المكتوبة (صحيفة المدينة وبيعة الرضوان):<\/b> لم يترك النبي ﷺ بناء المجتمع للأمنيات، بل كتب \"صحيفة المدينة\" كدستور مكتوب يحدد التزامات الجميع، وأخذ بيعة الرضوان تحت الشجرة عهداً وميثاقاً حازماً مكتوباً في القلوب على الثبات والبذل <span class=\"takh\">[صحيح البخاري ومسلم]<\/span>."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: هيكل وثيقة الميثاق الزمني الشخصي (Life Charter Blueprint)<\/b>"},{"t":"li","lvl":0,"h":"<b>الأركان الخمسة للميثاق:<\/b>"},{"t":"li","lvl":1,"h":"<i>قسم العهد والغاية الوجودية:<\/i> (بيان العبودية والرسالة)."},{"t":"li","lvl":1,"h":"<i>بوصلة الأهداف والمربع الثاني:<\/i> (الأهداف الاستراتيجية الـ 3 وساعات العمل المركز)."},{"t":"li","lvl":1,"h":"<i>ميزان القرار الأخلاقي:<\/i> (صيغة الرفض الشجاع لحماية المبادئ)."},{"t":"li","lvl":1,"h":"<i>عجلة التوازن الحياتي:<\/i> (تحديد أوقات الأهل، العبادة، والترويح النظيف)."},{"t":"li","lvl":1,"h":"<i>الميزانية والرشد المالي:<\/i> (اقتطاع 20% ادخاراً وقانون الـ 30 يوماً)."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: سحر \"الشريك المحاسب (Accountability Partner)\"<\/b>"},{"t":"li","lvl":0,"h":"الدراسات السلوكية تثبت أن الالتزام الشفهي لا تتعدى نسبة نجاحه 10%، بينما ترتفع نسبة النجاح إلى <b>أكثر من 85%<\/b> عندما يُكتب الميثاق ويوقع ويُشهد عليه شريك محاسب يتابعك أسبوعياً."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"إذا تعثرت يوماً أو أسبوعاً ولم ألتزم بالميثاق بنسبة 100%، فهل يعني هذا فشلي وتمزيق الميثاق؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الميثاق بوصلة مرشدة وليس حبل مشنقة! التزامك بنسبة 70% إلى 80% مع التدارك الأسبوعي والمحاسبة الذاتية يضعك في مصاف المتميزين والناجحين. التعثر وارد، والمهم هو سرعة النهوض والتدارك."}]},{"t":"qa","n":"2","q":"\"ألا تقيد هذه الوثيقة حريتي وتجعل حياتي معقدة مثل الموظفين؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الميثاق هو الذي يمنحك <b>\"الحرية الحقيقية\"<\/b>؛ يحررك من عبودية خوارزميات الشاشات، ومن ضغوط الأقران التافهة، ومن قلق التراكم والتسويف. الحرية الحقيقية هي قدرتك على توجيه حياتك بيدك، وليست العيش كقطعة خشب تتقاذفها الأمواج."}]},{"t":"qa","n":"3","q":"\"كيف أختار شريكي المحاسب؟ وماذا لو تساهل معي؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> اختر شريكاً صادقاً (أخاً، صديقاً متميزاً في المجلس، أو والدتك) ممن يحبونك بصدق ولديهم الجرأة لمساءلتك بمحبة وحزم دون مجاملة تضيع الأهداف."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>أمين المواثيق (الميسر الشاب):<\/b> إدارة منصة توقيع المواثيق وعرض المشروعات."},{"t":"li","lvl":0,"h":"<b>كاتب العهود (المدوّن):<\/b> تدوين البنود النموذجية للميثاق الموحد على السبورة."},{"t":"li","lvl":0,"h":"<b>محامي التردد (المعارض):<\/b> إثارة التحديات الواقعية حول استدامة الالتزام بالميثاق."},{"t":"li","lvl":0,"h":"<b>حارس الدستور (الميقاتي):<\/b> ضبط دقائق ورشة الكتابة ومراسم التوقيع."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر صياغة وتوقيع وثيقة الميثاق الزمني الشخصي (Life Charter Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> أوراق مقواة فاخرة بتصميم وثيقة رسمية (A3 أو A4 فاخر) + أقلام حبر مميزة + أختام رمزية للمجلس."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"صياغة قسم الميثاق والغاية الكبرى بخط يد الفتى."},{"t":"li","lvl":1,"h":"تفريغ مخرجات الدروس الخمسة (الأهداف، المربع الثاني، ميزان القرار، عجلة التوازن، ميزانية 50/30/20)."},{"t":"li","lvl":1,"h":"توقيع الفتى بصفته (صاحب الميثاق)."},{"t":"li","lvl":1,"h":"اعتماد وتوقيع المربي بصفته (المشرف والميسر)."},{"t":"li","lvl":1,"h":"إشراك الرفيق والتوقيع بصفته (الشريك المحاسب)."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: سلمان والعزيمة الشفهية المتبخرة<\/span>"},{"t":"p","lvl":0,"h":"سلمان (17 سنة) شاب يملك قلباً حياً ونية طيبة للتغيير. طوال العام الدراسي:"},{"t":"p","lvl":0,"h":"- في كل بداية أسبوع يقسم أمام نفسه أنه سيذاكر بجدية، ويصلي الفجر، ويترك الألعاب."},{"t":"p","lvl":0,"h":"- لكن بما أنه لم يكتب التزاماته قط في وثيقة مرئية، كان ينسى عهده في اليوم التالي فور وصول أول إشعار أو رسالة لعب من زملائه!"},{"t":"p","lvl":0,"h":"عندما شارك سلمان في تصميم \"الميثاق الزمني الشخصي\":"},{"t":"p","lvl":0,"h":"- كتب ميثاقه بيده، ووقعه مع والدته وزميله المقرب، وعلقه فوق مكتبه وشاشته."},{"t":"p","lvl":0,"h":"- في كل مرة كان يهم بالهروب للألعاب، تقع عيناه على توقيعه وقسمه المكتوب، فيشعر بمسؤولية الرجولة، ويستحي من نقض عهده، فيعود لمذاكرته بصلابة!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف حوّل الميثاق المكتوب والمرئي عزيمة سلمان من أمنية هشة إلى قوة صامدة؟"},{"t":"p","lvl":0,"h":"2. ما أثر وجود \"الشريك المحاسب (الأم والرفيق)\" في مساعدة الشاب على الثبات؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال عقود الشركات الكبرى مقابل فوضى النوايا الشفهية."],["05 - 15 د","الخطاف الحواري","قصة المدير التنفيذي بلا عقد وربطها بإدارة العمر."],["15 - 25 د","التأصيل الشرعي والمفاهيمي","آيات العقود والعهود، حديث المسلمون عند شروطهم، وصحيفة المدينة."],["25 - 50 د","المختبر التطبيقي","ورشة كتابة وتصميم وثيقة الميثاق الزمني وتوقيعها."],["50 - 60 د","معرض المواثيق والشريك","إشهار كل شاب لميثاقه أمام مجلس الفتيان واعتماد الشريك المحاسب."],["60 - 65 د","دراسة حالة واقعية","مناقشة حالة سلمان والعزيمة الشفهية المتبخرة."],["65 - 70 د","مراسم التتويج والختام","إعلان القسم الجماعي وتتويج إتمام الوحدة الثالثة بالكامل."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 140-155","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«الانتقال من التنظير إلى التطبيق هو المحك الحقيقي لفقه الأولويات؛ ولا بقاء لفكر لا يتحول إلى خطط والتزامات ومواثيق عمل في واقع الأمة والشباب»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 40-55","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«كان العلماء يكتبون على أنفسهم العهود والمواثيق في حفظ الأوقات ومحاسبة النفس، فكانت وثائقهم حصناً منيعاً ضد الفتور والانقطاع»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 31-38","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">
