«الاستقامة العملية تتطلب ترجمة المبادئ الإيمانية إلى وثائق وبرامج التزام شخصية تحمي الشاب في أزمنة الفتن والسيولة»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 45-58","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الوفاء بالعهد والالتزام بالمسؤولية خلق إسلامي رفيع؛ والصدق مع النفس ومع الله في تعاهد العمل أساس الرجولة والكرامة»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 410-425","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«تربية الفتى على التعهد والمسؤولية الذاتية والمحاسبة المنتظمة تغرس فيه الاستقلال والشجاعة، وتهيئه ليكون رجل أمة»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 210-225","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«عقد العادة (Habit Contract): الالتزام المكتوب والمشهد أمام شريك محاسب يفرض تكلفة اجتماعية على الإخلال، ويرفع نسبة الاستمرارية لأعلى المستويات»<\/span>."},{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«الرجولة القرآنية عهد وميثاق وثبات: رجال صدقوا ما عاهدوا الله عليه وما بدلوا تبديلاً»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 105-110","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«مساعدة المراهق على صياغة خياراته في وثيقة واضحة تحميه من التردد، وتمنحه الثقة في قدرته على حوكمة حياته»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>فن إدارة الذات وصياغة الأهداف<\/i> — د. طارق السويدان (فصل: المواثيق الشخصية وخطط العمل، ص 80-115)."},{"t":"li","lvl":1,"h":"<i>المحاسبة والمراقبة الذاتية<\/i> — ابن أبي الدنيا <span class=\"pg\">ص 25-50<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تصنع ميثاقك الشخصي وتثبت على عهدك مع الله؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"قوة العقد المكتوب والشريك المحاسب في بناء العادات الصعبة\" — قناة علي وكتاب على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع التتويجي: \"تثبيت الميثاق والالتزام الأسبوعي الأول\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. تثبيت الدستور الشخصي:","[ ] تعليق وثيقة \"الميثاق الزمني الشخصي\" في مكان بارز ومرئي فوق مكتب المذاكرة في البيت.","2. التواصل اليومي مع الشريك المحاسب:","[ ] إرسال رسالة نصية يومية لرفيقك المحاسب بـ (نسبة إنجاز مهام الميثاق اليوم: ...%) قبل النوم.","3. جلسة المراجعة الأسبوعية:","[ ] عقد جلسة تقييم ومساءلة أخوية مدتها 10 دقائق مساء الجمعة لمراجعة بنود الميثاق الخمسة وتدارك التقصير."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الالتزام بالوثيقة والدستور","يترك الميثاق في الدرج ويعود للنوايا الشفهية والفوضى العشوائية.","يعلق الميثاق ويلتزم به في البداية ثم يتراجع ما لم يُتابع خارجياً.","يجعل الميثاق دستوره اليومي الحي، ويحاسب نفسه عليه بصرامة واعتزاز."],["المساءلة مع الشريك المحاسب","يتجاهل التواصل مع رفيقه ويتهرب من جلسات المراجعة الأسبوعية.","يتواصل مع رفيقه بشكل متقطع ويجامل في تقييم نسب الإنجاز.","يلتزم بالتواصل اليومي الصادق، ويتقبل نقد وتوجيه رفيقه بروح المسؤولية."],["الدمج التكاملي لأدوات الوحدة","يفصل بين الأدوات ويطبق أداة واحدة ويهمل البقية كلياً.","يطبق المصفوفة والميزانية بشكل جيد ويعاني في التوازن الحياتي.","يدمج أدوات الوحدة الخمس ببراعة، فيعيش متزناً، هادفاً، ورشيداً مالياً."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: وثيقة الميثاق الزمني الشخصي","sub":"","lines":["💡 البوصلة والمفهوم:","النوايا الشفهية تتبخر، والمواثيق المكتوبة تصنع الرجال! لست كائناً عشوائياً تتقاذفه أمواج الشاشات ورغبات الأقران، بل أنت رجل مسلم يحمل دستوراً شخصياً ينظم غايته، ويحمي وقته، ويزن قراراته، ويحفظ أمانته حتى يلقى ربه: <span class=\"ayah\">﴿أَوْفُوا بِالْعُقُودِ﴾<\/span>.","📖 الآية المحورية:","<span class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾<\/span> <span class=\"ayref\">الأحزاب: 23<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«المُسْلِمُونَ عِنْدَ شُرُوطِهِمْ، مَا وَافَقَ الحَقَّ»<\/span> <span class=\"takh\">[سنن أبي داود]<\/span>.","📐 أركان دستوري الشخصي الخمسة:","1. بوصلتي: أنا عبد مصلح ومستخلف، أهدافي خادمة لغايتي الكبرى.","2. مصفوفتي: المربع الثاني (المهم غير العاجل) هو سيد أوقاتي ويومي.","3. قراري: درء المفاسد مقدم على جلب المصالح، والشجاعة في قول \"لا\" للباطل.","4. توازني: إعطاء كل ذي حق حقه (ربي، نفسي، أهلي، ودراستي).","5. رشدي المالي: 50% للأساسيات، 30% للترويح، 20% ادخاراً وصدقة، وقانون الـ 30 يوماً.","—hr—","🤝 ميثاق العهد والشراكة:","- أعاهد الله تعالى ثم نفسي على الوفاء ببنود دستوري الشخصي بثبات ورجولة.","توقيع صاحب الميثاق (الطالب): _____________________","توقيع المشرف التربوي (المربي): ____________________","توقيع الشريك المحاسب (الرفيق): ___________________","—hr—","📝 سجل المساءلة اليومية مع الرفيق المحاسب (تم إرسال نسبة الإنجاز):","[ السبت ]  [ الأحد ]  [ الاثنين ]  [ الثلاثاء ]  [ الأربعاء ]  [ الخميس ]  [ الجمعة ]","(   )      (   )      (    )       (    )       (    )       (   )      (   )","عهد الفتى المسلم: \"أنا رجلٌ صدق ما عاهد الله عليه، دستوري مكتوب، ووقتي محفوظ، وما بدلتُ تبديلاً\"."]}]}]}]},{"n":4,"title":"معاني الرجولة والهوية","c":"rose","lessons":[{"id":"4-1","ordinal":"التاسع عشر","title":"معيار الرجولة الحق","sub":"تفكيك المفاهيم المشوهة وترسيخ قيم المروءة والشهامة","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الرابعة: معاني الرجولة والهوية"],["عنوان اللقاء","معيار الرجولة الحق (تفكيك المفاهيم المشوهة وترسيخ قيم المروءة والشهامة)"],["الرمز الكودي","U4-L19-MANHOOD"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل حوارية تفاعلية ومختبر تفكيك القوالب المشوهة وبناء معيار المروءة"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> الرجولة في الميزان القرآني والتربوي الأصيل ليست مجرد صفة بيولوجية ذكورية يولد بها كل ذكر، ولا تقاس بضخامة العضلات، أو الاستعراض المادي، أو ممارسات التعدي والجلافة وقهر الضعفاء. الرجولة <b>رتبة إيمانية وأخلاقية رفيعة تُنال كسباً وسلوكاً<\/b> بالثبات على المبدأ، والمروءة، والشهامة، والرحمة بالمستضعف، وحفظ العورات؛ فـ \"كل رجل ذكر، وليس كل ذكر رجلاً\"."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يُميّز الفتى بدقة بين \"الذكورة البيولوجية التكليفية\" و\"الرجولة الإيمانية الكسبية\"، ويفكك النماذج المشوهة التي تبثها المنصات الرقمية (كـ Alpha Male الزائف)."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى هيبة الرجولة المستمدة من الحلم والمروءة والشهامة، متخلصاً من وهم ربط الرجولة بالقسوة والجفاء والاستعراض."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يصمم الفتى \"ميثاق المروءة الشخصي\"، ويتعهد بتنفيذ 3 أفعال ميدانية في الشهامة الصامتة (خدمة الأهل، نصرة ضعيف، وضبط الغضب)."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي اللقاء بطرح هذا السؤال الاستكشافي المباشر:"},{"t":"p","lvl":0,"h":"<b>\"لو سار شابان في مكان عام: الأول يرفع صوته بالمسبات، ويقود سيارته بتهور، ويتطاول على عامل نظافة ليُظهر سطوته.. والثاني يمشي بوقار، فإذا رأى مسناً تعثر ساعده بهدوء دون أن يلتفت إليه أحد، وإذا استفزه سفيه أعرض عنه بحلم.. أيهما في مقياس الشارع يُنظر إليه بصفته (رجلاً خشناً)؟ وأيهما يملك الرجولة الحقيقية؟ ولماذا صرنا نصف الوقاحة بالرجولة، ونصف الحلم بالضعف؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو نديم وركان)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة نديم وركان: الاستعراض الصاخب vs الشهامة الصامتة<\/span>"},{"t":"p","lvl":0,"h":"- نديم (17 سنة): شاب يستعرض بعضلاته وبصوته المرتفع في الشارع، يسير بلغة جافة ويتطاول على العمال والسائقين، ويرى أن \"الرجولة أن يخافك الناس!\". وفي البيت يصرخ في وجه أخته الصغيرة ويرفض مساعدة والده قائلاً: \"أنا لست خادماً لأحد!\"."},{"t":"p","lvl":0,"h":"- ركان (17 سنة): شاب هادئ السمت، قوي البنية. أثناء عودته تحت المطر، رأى رجلاً مسناً يحمل أكياساً ثقيلة وقد زلت قدمه؛ فأسرع ركان وحمل الأكياس وأوصله لباب بيته مبتسماً دون أن يصور بهاتفه لنشر المشهد! وعندما عاد للبيت، بادر بتنظيف المجلس وخدمة أسرته برحابة صدر."},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. أيهما يحمل معايير الرجولة الحقيقية؟"},{"t":"p","lvl":0,"h":"2. من الذي روّج بين الشباب أن \"قهر الضعيف والجلافة مع الأهل\" علامة رجولة وقوة شخصية؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿رِجَالٌ لَّا تُلْهِيهِمْ تِجَارَةٌ وَلَا بَيْعٌ عَن ذِكْرِ اللَّهِ وَإِقَامِ الصَّلَاةِ وَإِيتَاءِ الزَّكَاةِ ۙ يَخَافُونَ يَوْمًا تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالْأَبْصَارُ﴾<\/span> <span class=\"ayref\">النور: 37<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الرجولة في القرآن صفة مدح قائمة على الثبات أمام فتن المادة والشهوة؛ فالرجل الحقيقي هو من يقود دنياه ويخضعها لطاعة ربه، لا من تقوده شهواته وتلهيه تجارته."},{"t":"li","lvl":0,"h":"<b>قوله تعالى في قصة موسى عليه السلام:<\/b> <span class=\"ayah\">﴿وَلَمَّا وَرَدَ مَاءَ مَدْيَنَ وَجَدَ عَلَيْهِ أُمَّةً مِّنَ النَّاسِ يَسْقُونَ وَوَجَدَ مِن دُونِهِمُ امْرَأَتَيْنِ تَذُودَانِ ۖ قَالَ مَا خَطْبُكُمَا ۖ قَالَتَا لَا نَسْقِي حَتَّىٰ يُصْدِرَ الرِّعَاءُ ۖ وَأَبُونَا شَيْخٌ كَبِيرٌ * فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰ إِلَى الظِّلِّ﴾<\/span> <span class=\"ayref\">القصص: 23-24<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> نموذج المروءة والشهامة القرآنية؛ نجدة المستضعف دون مساومة أو استعراض، ثم العفة التامة والتولي إلى الظل طلباً للأجر من الله وحده."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أبي هريرة رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«لَيْسَ الشَّدِيدُ بِالصُُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الغَضَبِ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الأدب، باب الحذر من الغضب، برقم 6114؛ وصحيح مسلم برقم 2609<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> القوة الحقيقية هي التحكم في الإرادة وكبح جماح النفس عن العدوان، وليست بالبطش الجسدي وإطلاق العنان للغضب."},{"t":"li","lvl":0,"h":"<b>حديث أبي هريرة رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«خِيَارُكُمْ فِي الجَاهِلِيَّةِ خِيَارُكُمْ فِي الإِسْلاَمِ إِذَا فَقُهُوا»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب أحاديث الأنبياء برقم 3374<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل المفاهيمي:<\/i> خصال المروءة والشهامة والنجدة معايير فطرية أصيلة تتأكد وتتزكى بنور الوحي والفقه في دين الله."},{"t":"li","lvl":0,"h":"<b>حديث الأسود بن يزيد:<\/b> سألتُ عائشة رضي الله عنها: ما كان النبي ﷺ يصنع في بيته؟ قالت: <span class=\"hadith\">«كَانَ يَكُونُ فِي مِهْنَةِ أَهْلِهِ -تَعْنِي خِدْمَةَ أَهْلِهِ- فَإِذَا حَضَرَتِ الصَّلاَةُ خَرَجَ إِلَى الصَّلاَةِ»<\/span> <span class=\"takh\">[صحيح البخاري: كتاب الأذان برقم 676]<\/span>."},{"t":"li","lvl":1,"h":"<i>التأصيل العملي:<\/i> خدمة الأهل والرفق بهم من صميم خلق سيد الرجال ﷺ، ولا تنتقص من هيبة الشاب إلا في عقل ضعيف المروءة."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>أمنية أمير المؤمنين عمر بن الخطاب رضي الله عنه:<\/b> جلس عمر في رهط من أصحابه فقال: <span class=\"qt\">«تَمَنَّوْا»<\/span>، فتمنى بعضهم ملء البيت ذهباً أو لؤلؤاً ينفقونه في سبيل الله، فقال عمر: <span class=\"qt\">«لَكِنِّي أَتَمَنَّى رِجَالاً مِثْلَ أَبِي عُبَيْدَةَ بْنِ الجَرَّاحِ، وَمُعَاذِ بْنِ جَبَلٍ، وَحُذَيْفَةَ بْنِ اليَمَانِ، فَأَسْتَعْمِلَهُمْ فِي طَاعَةِ اللَّهِ!»<\/span> [المستدرك على الصحيحين للحاكم برقم 5005 وصححه ووافقه الذهبي]. الرجولة الحقة هي رأس المال الأغلى لبناء الأمم ونهضتها."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: مصفوفة الرجولة المزيفة مقابل الرجولة القرآنية<\/b>"},{"t":"p","lvl":0,"h":"مظاهر الرجولة المشوهة (الذكورة مجردة)        معايير الرجولة القرآنية الحقة (الكسبية)"},{"t":"p","lvl":0,"h":"+----------------------------------------+----------------------------------------+"},{"t":"p","lvl":0,"h":"| - الصوت العالي والجلافة مع الأهل.       | - الهيبة والوقار والرحمة بالمستضعفين.   |"},{"t":"p","lvl":0,"h":"| - استعراض العضلات والبطش بالضعفاء.     | - نجدة المظلوم وحماية الضعيف بشهامة.   |"},{"t":"p","lvl":0,"h":"| - التدخين والمخالفة كطقس لإثبات الذات. | - ضبط النفس عند الغضب وكف الأذى.      |"},{"t":"p","lvl":0,"h":"| - التفاخر الرقمي والمباهاة المادية.     | - المروءة الصامتة والعفة وستر العورات. |"},{"t":"p","lvl":0,"h":"+----------------------------------------+----------------------------------------+"},{"t":"p","lvl":0,"h":"<b>المحور الثاني: الدافع النفسي للرجولة الاستعراضية<\/b>"},{"t":"li","lvl":0,"h":"تبيين أن المراهق يلجأ للجلافة والخشونة المصطنعة للتعويض عن شعور داخلي بنقص الثقة أو ضعف التقدير الذاتي؛ فيتوهم أن إخافة الآخرين تصنع له هيبة، بينما الهيبة الحقيقية تنبع من النضج، والتحكم في النفس، وتقديم العون للناس."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"ألا يجعل الحلم والسكوت عن الإهانة الشاب موضع استضعاف وسخرية بين أقرانه؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هناك فارق جوهري بين <b>\"العجز والذل\"<\/b> وبين <b>\"الحلم والترفع\"<\/b>؛ الحلم هو أن تكون قادراً على البطش ثم تمسك نفسك تكرماً وابتغاءً لمرضاة الله. الشاب الذي لا يستفزه صراخ السفهاء يفرض احترامه وهيبته على الجميع، بينما سريع الغضب يسهل التلاعب به واستدراجه."}]},{"t":"qa","n":"2","q":"\"ألا يقلل تنظيف الغرفة أو مساعدة الوالدة في المطبخ من مقام الرجل؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هذا من رواسب الجاهلية؛ خير البرية محمد ﷺ كان يخصف نعله ويرقع ثوبه ويكون في مهنة أهله. مساعدة الأهل بر ومروءة تدل على نبل النفس وكرم الأصل."}]},{"t":"qa","n":"3","q":"\"ما العيب في تصوير أعمال الخير والشهامة لنشر الإيجابية بين المتابعين؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> نجدة المحتاج تقتضي حفظ كرامته ومشاعره؛ فالمتاجرة بضعف الفقير لتحصيل المشاهدات تنقض الشهامة وتخدش الإخلاص. الشهامة الصامتة التي تبتغي وجه الله أعظم أجراً وأصدق مروءة."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>حارس المروءة (الميسر الشاب):<\/b> إدارة المداخلات وضبط مسار النقاش نحو المعايير القرآنية."},{"t":"li","lvl":0,"h":"<b>مهندس المعايير (المدوّن):<\/b> رسم جدول المقارنة بين الرجولة المزيفة والحقة على السبورة."},{"t":"li","lvl":0,"h":"<b>محامي القوة الزائفة (المعارض):<\/b> تمثيل صوت الأقران المدافعين عن الفتوة الخشنة والاستعراض."},{"t":"li","lvl":0,"h":"<b>حارس الوقت (الميقاتي):<\/b> ضبط توقيت الفقرات."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر مصفوفة تفكيك الرجولة الحقة وميثاق المروءة (True Manhood Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة ورقية مقسمة إلى مسارين (تخلية وتحلية) + أقلام ملونة."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<i>التخلية:<\/i> تدوين سلوكين اعتاد بعض الفتيان اعتبارهما رجولة وهما من الجلافة أو الخفة (رفع الصوت على الأهل، السخرية من العمال)."},{"t":"li","lvl":1,"h":"<i>التحلية:<\/i> تدوين سلوكين عمليين للشهامة يلتزم بهما الشاب هذا الأسبوع (المبادرة بحمل المشتريات عن الوالدين، كظم الغيظ عند الخلاف)."},{"t":"li","lvl":1,"h":"<i>شعار المروءة:<\/i> صياغة عهد شخصي: <i>\"أنا رجل بمروءتي وخدمتي لأهلي وديني، لا بصوتي ولا باستعراضي\"<\/i>."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: قصي بين نجدة الجار وصعود الشاشات<\/span>"},{"t":"p","lvl":0,"h":"قصي (16 سنة) متابع شغوف بتحديات المقاطع المصورة على المنصات الرقمية."},{"t":"p","lvl":0,"h":"وقع حادث تصادم خفيف أمام منزله، واصطدمت سيارة مسن برصيف الطريق."},{"t":"p","lvl":0,"h":"- قال صديقه: \"افتح بثاً مباشراً فوراً وسجل المشهد؛ ستحصد آلاف المشاهدات والمتابعات!\"."},{"t":"p","lvl":0,"h":"- تردد قصي.. ثم ترك الهاتف في جيبه، وأسرع لفتح الباب، واطمأن على سلامة السائق، وأحضر له الماء، وظل يهدئ روعه حتى حضرت الإسعاف، رافضاً تصوير الرجل أو إحراجه."},{"t":"p","lvl":0,"h":"عندما علم زملاؤه لاموه قائلين: \"ضيعت على نفسك فرصة المشاهدات والتفاعل السريع!\"."},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف جسد موقف قصي الشهامة القرآنية في مقابل الاستعراض الرقمي؟"},{"t":"p","lvl":0,"h":"2. ما أثر تصوير المستضعفين على مروءة الشاب وكرامة المحتاج؟"},{"t":"p","lvl":0,"h":"3. كيف تحاور من يعتبر المتاجرة بالمواقف دهاءً وشهرة؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","طرح سؤال مقارنة الشاب الصاخب بالشاب الحليم."],["05 - 15 د","الخطاف الحواري","عرض قصة نديم وركان وإدارة النقاش."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","آيات النور، شهامة موسى في مدين، وأحاديث الشديد والمهنة."],["30 - 45 د","المختبر ودراسة الحالة","تمرين مصفوفة المروءة وتفكيك حالة قصي في المجموعات."],["45 - 55 د","بنك الأسئلة الجدلية","نقاش إشكالات الحلم وضعف الهيبة، وخدمة الأهل، والتوثيق الرقمي."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وتحديد أفعال الشهامة الصامتة."],["65 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع الأدوار للقاء القادم."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«الرجولة في القرآن رتبة إيمانية كسبية، وليست مجرد ذكورة بيولوجية؛ فكل رجل ذكر، وليس كل ذكر رجلاً»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 33-40","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«تفكيك النماذج الجاهلية المشوهة للرجولة يبدأ ببيان أن الشجاعة الحقيقية هي شجاعة ضبط النفس والمروءة، وليست في الاستعراض والعدوان»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 360-380","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«التربية على المروءة والشهامة والنجدة وحماية الذمار تغرس في الفتى كرم النفس ورعاية الضعفاء وحفظ العورات»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 145-155","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«المروءة والشهامة سياج الإيمان؛ والفتوة الإسلامية نجدة وعفة، وليست تجبراً أو استعراضاً فارغاً»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 90-98","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«ميل المراهق للمباهاة والاستعراض ينبع من رغبته في تأكيد الذات؛ والواجب توجيه هذه الطاقة نحو معالي الأمور والمسؤولية»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>المروءة وخوارمها<\/i> — د. محمد بن إبراهيم الحمد <span class=\"pg\">ص 25-60<\/span>."},{"t":"li","lvl":1,"h":"<i>صفات الرجل المسلم<\/i> — د. عبد الحميد البلالي <span class=\"pg\">ص 40-75<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"سلسلة معاني الرجولة في القرآن\" — د. أحمد عبد المنعم على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"الفرق بين الرجولة الحقيقية والذكورة الاستعراضية\" — الشيخ أحمد السيد على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"مواقف الشهامة والمروءة الصامتة\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. الخدمة المنزلية الصامتة:","[ ] المبادرة بقضاء حاجات البيت وحمل الأثقال وترتيب المجلس دون طلب ودون تذمر.","2. النجدة والمروءة الميدانية:","[ ] مساعدة محتاج أو مسن أو عامل وإعانته دون استخدام الهاتف للتصوير نهائياً.","3. كظم الغيظ عند الغضب:","[ ] الإمساك التام عن رد الإهانة أو الصراخ عند حدوث خلاف، والترفع بحلم ووقار."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["فهم حقيقة الرجولة","يربط الرجولة بالجلافة، والصوت العالي، واستعراض القوة.","يدرك المعنى الشرعي نظرياً لكنه ينساق للمباهاة أمام أقرانه.","يتبنى معيار الرجولة القرآني، ويستمد عزته من المروءة والشهامة."],["التعامل مع أهل البيت","يتذمر من خدمة الأسرة ويرى مساعدة والديه انتقاصاً من هيبته.","يخدم أهل بيته ببطء أو استثقال مع حاجته للتوجيه المستمر.","يبادر بخدمة أهله اقتداءً بالنبي ﷺ، ويتعامل برفق وبر عظيم."],["ضبط النفس والحلم","يستجيب للاستفزاز سريعاً ويعتدي بالصراخ أو اليد لإثبات قوته.","يمسك نفسه بصعوبة، وقد يصدر منه تطاول لفظي عند الغضب.","يملك نفسه عند الغضب باقتدار، ويترفع عن السفاهة بعزة ووقار."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: معيار الرجولة الحق والمروءة","sub":"","lines":["💡 البوصلة والمفهوم:","ليست الرجولة في استعراض العضلات ولا الصوت العالي! الرجولة رتبةٌ إيمانية تُنال بالمروءة، والشهامة، وحماية الضعيف، وحفظ العورات. \"كل رجل ذكر، وليس كل ذكر رجلاً\".","📖 الآية المحورية:","<span class=\"ayah\">﴿رِجَالٌ لَّا تُلْهِيهِمْ تِجَارَةٌ وَلَا بَيْعٌ عَن ذِكْرِ اللَّهِ وَإِقَامِ الصَّلَاةِ وَإِيتَاءِ الزَّكَاةِ﴾<\/span> <span class=\"ayref\">النور: 37<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«لَيْسَ الشَّدِيدُ بِالصُُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الغَضَبِ»<\/span> <span class=\"takh\">[صحيح البخاري ومسلم]<\/span>.","📐 قواعد المروءة والشهامة الثلاث:","1. القوة في الحلم وضبط النفس: الغضب طيش الصغار، والتحكم شيمة الكبار.","2. خدمة الأهل شرف: كان النبي ﷺ في مهنة أهله وخيركم خيركم لأهله.","3. الشهامة الصامتة: انجد الملهوف واحفظ كرامته ولا تتاجر بضعفه في الشاشات.","—hr—","🎯 ميثاق مروءتي الشخصي (فعل رجولة ألتزم به هذا الأسبوع):","- في بيتي: _______________________________________________________","- في الشارع والمدرسة: ___________________________________________","—hr—","📝 سجل الشهامة الأسبوعي (ضع ✓ عند الإنجاز):","[ خدمة الأهل برحابة ]  [ نجدة ضعيف بغير تصوير ]  [ كظم الغيظ عند المشادة ]","(   )                      (   )                      (   )","عهد الفتى المسلم: \"أنا رجل بمروءتي، عفتي درعي، وخدمتي لأمتي وأهلي شرفي\"."]}]}]},{"id":"4-2","ordinal":"العشرون","title":"ثبات المبدأ","sub":"الشجاعة الأدبية، نصرة الحق، وقول الصدق في المواقف الحرجة","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الرابعة: معاني الرجولة والهوية"],["عنوان اللقاء","ثبات المبدأ (الشجاعة الأدبية، نصرة الحق، وقول الصدق في المواقف الحرجة)"],["الرمز الكودي","U4-L20-STEADFAST"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل حوارية وتطبيقية حول بناء الشجاعة الأدبية ومواجهة الضغوط المجتمعية"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> ثبات المبدأ ليس مجرد شعار يُردد في أوقات السعة، بل هو <b>المحك الحاسم لنضج الرجولة والصدق في الإيمان<\/b>؛ إذ تتجلى صلابة الشاب عند اشتداد ضغوط الأقران، والخوف من التهميش، أو حين يتعارض قول الصدق ونصرة المظلوم مع القبول الاجتماعي المؤقت. الشجاعة الأدبية (Moral Courage) هي القوة التي تمكن الفتى من الجهر بالحق، ورفض الباطل، ونصرة الضعيف دون أن تحنيه هيبة الناس أو مخافة اللوم."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يدرك الفتى حقيقة الشجاعة الأدبية وتفوقها على الشجاعة البدنية المجردة، ويفهم ميكانيزمات الجبن الاجتماعي وضغط المجموع."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى هيبة الحق في قلبه، وتجريد الخشية لله وحده، متحرراً من الخوف من السخرية أو التهميش الرقمي والميداني."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يمارس الفتى خطوات \"سُلّم الشجاعة الأدبية\"، ويجهر بشهادة حق أو ينصر زميلاً مظلوماً يتعرض للغيبة أو التنمر طوال الأسبوع."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بالسؤال التشخيصي التالي:"},{"t":"p","lvl":0,"h":"<b>\"إذا كنت جالساً مع مجموعة من أصدقائك المقربين، وبدأوا في نشر شائعة أو السخرية من زميل غائب ضعيف، ونظروا إليك لتشاركهم الضحك.. بصدق وصراحة: ما الذي يمنعك في تلك اللحظة من أن تقول بحزم: (توقفوا، هذا ظلم وغيبة ولا أرضى به)؟ هل هو حب المزاح؟ أم الخوف من أن ينقلبوا عليك ويسخروا منك؟ ومتى أصبحت مجاملة الباطل تسمى دبلوماسية؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — معضلة عُديّ وشجاعة الشهادة)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">معضلة عُديّ: بين حماية الصديق ونصرة المظلوم<\/span>"},{"t":"p","lvl":0,"h":"في معمل المدرسة، كسر \"باسل\" (الفتى الأكثر نفوذاً وشعبية بين الطلاب) جهاز حاسوب عمداً، ثم اتهم الفتى الهادئ \"عمر\" (وهو طالب يتيم ضعيف الحال)!"},{"t":"p","lvl":0,"h":"عُديّ (17 سنة) كان الشاهد الوحيد الذي رأى الحادثة وتأكد من براءة عمر."},{"t":"p","lvl":0,"h":"عندما أوشكت إدارة المدرسة على معاقبة عمر وفصله، اقترب باسل ورفاقه من عُديّ بلهجة تهديد مبطنة:"},{"t":"p","lvl":0,"h":"- \"عُديّ.. أنت زميلنا، إياك أن تشهد ضد باسل.. وإلا جعلنا حياتك جحيماً وقاطعناك وطردناك من كل مجموعاتنا!\"."},{"t":"p","lvl":0,"h":"وقف عُديّ بين عمر المظلوم الذي يبكي قهراً، وبين أصدقائه الأقوياء الذين يهددونه بالعزلة والنبذ!"},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. لو كنت مكان عُديّ، هل تملك الشجاعة لتقف وتشهد بالحق حتى لو خسرت رفقة الأقوياء؟"},{"t":"p","lvl":0,"h":"2. لماذا يختار البعض الصمت ويبررونه بـ \"أنا لا شأن لي\"؟ وكيف يجعلنا السكوت شركاء في الظلم؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿الَّذِينَ يُبَلِّغُونَ رِسَالَاتِ اللَّهِ وَيَخْشَوْنَهُ وَلَا يَخْشَوْنَ أَحَدًا إِلَّا اللَّهَ ۗ وَكَفَىٰ بِاللَّهِ حَسِيبًا﴾<\/span> <span class=\"ayref\">الأحزاب: 39<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> جوهر ثبات المبدأ يكمن في تجريد الخشية لله؛ فمتى استقرت هيبة الله في قلب الشاب، سقطت أمامها هيبة الخلق ومخاوف التهميش."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَجَاءَ مِنْ أَقْصَى الْمَدِينَةِ رَجُلٌ يَسْعَىٰ قَالَ يَا قَوْمِ اتَّبِعُوا الْمُرْسَلِينَ﴾<\/span> <span class=\"ayref\">يس: 20<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> نموذج الرجل الشجاع الذي كسر حاجز السلبية، وسعى من بعيد ليصدع بالحق أمام قومه بثبات ورجولة دفاعاً عن دعوة الرسل."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أبي سعيد الخدري رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«أَلاَ لاَ يَمْنَعَنَّ رَجُلاً هَيْبَةُ النَّاسِ أَنْ يَقُولَ بِحَقٍّ إِذَا عَلِمَهُ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>جامع الترمذي: كتاب الفتن برقم 2191؛ ومسند أحمد برقم 11481، وصححه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> نهي نبوي قاطع عن الجبن الاجتماعي؛ فلا يجوز للخوف من الناس أو خشية ملامتهم أن تقعد الشاب عن الصدع بالحق وإحقاق العدل."},{"t":"li","lvl":0,"h":"<b>حديث أبي سعيد الخدري رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«أَفْضَلُ الجِهَادِ كَلِمَةُ عَدْلٍ عِنْدَ سُلْطَانٍ جَائِرٍ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>سنن أبي داود: كتاب الملاحم برقم 4344؛ وجامع الترمذي برقم 2174، وصححه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل المفاهيمي:<\/i> الجهر بالعدل في المواقف الحرجة ذروة الشجاعة الأخلاقية والإيمانية."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف عبد الله بن مسعود رضي الله عنه في الجهر بالقرآن:<\/b> لما أجمع الصحابة بمكة أن قريشاً لم تسمع القرآن يجهر به، تطوع ابن مسعود قائلاً: <i>\"أنا أسمعهموه\"<\/i>. فلما أتى المقام وقت الضحى قرأ سورة الرحمن بصوت جهوري، فقاموا يضربونه في وجهه حتى أدموه وهو يواصل القراءة برأس مرفوع وثبات عظيم؛ فكان أول من جهر بالقرآن في مكة بعد رسول الله ﷺ [السيرة النبوية لابن هشام 1/314]."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: الشجاعة البدنية مقابل الشجاعة الأدبية<\/b>"},{"t":"li","lvl":0,"h":"الشجاعة البدنية يشارك فيها كثير من الناس، أما الشجاعة الأدبية (قول الحق، رفض الباطل، وتحمل تكلفة الصدق) فهي خصلة لا يقوى عليها إلا الرجال الصادقون."},{"t":"p","lvl":0,"h":"<span class=\"lbl\">مقارنة الموقف الأخلاقي<\/span>"},{"t":"p","lvl":0,"h":"الجبن والحياد السلبي              =====&gt; الصمت عن الحق طلباً لرضا الأقران والفرار من المشاكل."},{"t":"p","lvl":0,"h":"الشجاعة الأدبية وثبات المبدأ       =====&gt; الجهر بالصدق ونصرة المظلوم وإسقاط هيبة الخلق أمام هيبة الحق."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: وهم الكثرة وضغط \"الجميع يفعل ذلك\"<\/b>"},{"t":"li","lvl":0,"h":"الحق لا يُوزن بالأعداد؛ فرجل واحد ثابت على المبدأ أمة كاملة: <span class=\"ayah\">﴿إِنَّ إِبْرَاهِيمَ كَانَ أُمَّةً﴾<\/span>. الأرزاق والآجال بيد الله وحده، وقول الحق لا يقطع رزقاً ولا يقرب أجلاً."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أليس من الحكمة والسياسة أحياناً السكوت عن الباطل لتجنب الصدام؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هناك بون شاسع بين <b>\"الحكمة في أسلوب بيان الحق\"<\/b> وبين <b>\"المداهنة والسكوت عن الظلم\"<\/b>. الحكمة تعني اختيار الوقت المناسب والكلمة البصيرة، لا أن تسكت وتترك المظلوم يُسحق تحت سمعك وبصرك."}]},{"t":"qa","n":"2","q":"\"إذا شهدت بالحق وخسرت أصدقائي في المدرسة، فكيف أعيش في عزلة؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الصداقة التي تطلب منك خيانة ضميرك صداقة مسمومة. من أرضى الله بسخط الناس كفاه الله مؤنة الناس؛ وموقفك الشجاع سيجعل الأصدقاء أنفسهم يهابونك ويحترمون صدقك باطناً، وسيرزقك الله رفقة صالحة تشبهك."}]},{"t":"qa","n":"3","q":"\"هل تشمل الشجاعة الأدبية مناصحة المعلم أو الوالد إذا أخطأ؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> نعم، ولكن <b>بأعلى درجات التوقير والأدب<\/b>؛ فالشجاعة ليست وقاحة. مناصحة الوالد أو المعلم تكون سراً وبلطف وبر، وبصيغة استفسار رفيق، لا بالتطاول والتشهير."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>صوت الحق (الميسر الشاب):<\/b> إدارة نوبات الحوار وتفكيك مخاوف التهميش."},{"t":"li","lvl":0,"h":"<b>مدوّن السُلّم (المدوّن):<\/b> رسم سُلّم الشجاعة وتدوين خطوات المواجهة على السبورة."},{"t":"li","lvl":0,"h":"<b>محامي الهيبة والانسحاب (المعارض):<\/b> تمثيل صوت المبررين للسكوت السلبي."},{"t":"li","lvl":0,"h":"<b>حارس الثبات (الميقاتي):<\/b> متابعة دقائق فقرات الورشة."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر سُلّم الشجاعة الأدبية (Moral Courage Ladder)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة سُلّم الشجاعة الأدبية المكون من 4 درجات."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<i>الدرجة 1 (الاعتراف والتشخيص):<\/i> كتابة موقف سابق تردد فيه الشاب وسكت عن قول الحق، وتحديد العائق النفسي (خجل، خوف، رغبة في القبول)."},{"t":"li","lvl":1,"h":"<i>الدرجة 2 (تفكيك المخاوف):<\/i> كتابة أسوأ ما كان سيحدث، وتبيين أن المخاوف كانت أوهاماً نفسية."},{"t":"li","lvl":1,"h":"<i>الدرجة 3 (صياغة العبارة الحازمة):<\/i> صياغة جملة صلبة ومؤدبة لقولها في المواقف المشابهة (مثال: <i>\"هذا ظلم ولا أقبل به\"<\/i> أو <i>\"هذا الكلام غيبة ولن أشارك فيه\"<\/i>)."},{"t":"li","lvl":1,"h":"<i>الدرجة 4 (العهد):<\/i> توقيع تعهد بالصدع بالحق هذا الأسبوع."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: طارق في مجلس التنمر والغيبة الرقمية<\/span>"},{"t":"p","lvl":0,"h":"طارق (16 سنة) في مجموعة دردشة تضم 15 طالباً من صفه."},{"t":"p","lvl":0,"h":"نشر أحد المتنفذين صورة لزميلهم الهادئ \"ياسين\" وسخروا من ملابسه وطريقته بعبارات مؤذية."},{"t":"p","lvl":0,"h":"- شعر طارق بظلم شديد وضيق في صدره؛ لأن ياسين مظلوم ومحترم."},{"t":"p","lvl":0,"h":"- لكنه خاف إن كتب معترضاً أن تنقلب المجموعة ضده، ويسخروا منه، أو يطردوه!"},{"t":"p","lvl":0,"h":"النتيجة: سكت طارق ووضع رمز \"ضحك\" مجاملة لهم ليحمي نفسه! فعاد لبيته يشعر بضيق الضمير والندم!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف أسقط الخوف من التهميش الشجاعة الأدبية لدى طارق؟"},{"t":"p","lvl":0,"h":"2. كيف كان ينبغي لطارق أن يتصرف لنصرة ياسين بشجاعة وأدب؟"},{"t":"p","lvl":0,"h":"3. ما العبارة التي تجعل الشاب يوقف التنمر في المجموعات بثقة وقوة؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال السكوت عن الغيبة أمام الأصدقاء."],["05 - 15 د","الخطاف الحواري","معضلة عُديّ وشهادة الحق وإدارة الحوار."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","أدلة الأحزاب، أحاديث هيبة الناس، وموقف ابن مسعود في الحرم."],["30 - 45 د","المختبر ودراسة الحالة","تمرين سُلّم الشجاعة وتفكيك حالة طارق في المجموعات."],["45 - 55 د","بنك الأسئلة الجدلية","نقاش الفرق بين الشجاعة والوقاحة، والتعامل مع ضغط الرفاق."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وتحديد موقف الثبات الميداني."],["65 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع الأدوار للقاء القادم."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 55-72","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الصدق والشجاعة الأدبية توأمان؛ ولا خير في شجاعة تلوذ بالصمت حين يُنتهك الحق أو يُظلم البريء خضوعاً لهيبة الناس»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 31-42","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«الثبات على الحق ومقاومة الضغوط الاجتماعية يستلزمان حصانة فكرية ويقيناً يعلو به الشاب فوق رغبات الجماهير»<\/span>."},{"t":"src","cite":"سابغات - أحمد السيد - ص 40-52","short":"سابغات — أحمد السيد","q":"<span class=\"qt\">«اليقين الثابت يورث شجاعة أدبية صلبة لا تتزعزع أمام سيل الشبهات ولا أمام إجماع الأقران على الخطأ»<\/span>."},{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«الرجولة القرآنية وقفة واستعلاء بالحق: <span class=\"ayah\">﴿وَجَاءَ مِنْ أَقْصَى الْمَدِينَةِ رَجُلٌ يَسْعَىٰ﴾<\/span> جاء وحيداً ليصدع بما يؤمن به»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 85-94","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«الخوف من التهميش هو القيد الأكبر للمراهق؛ وتدريبه على الشجاعة الأخلاقية هو ما ينقله لمرحلة الرجولة الحقة»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>الشجاعة الأدبية في الميدان المدرسي<\/i> — د. خليل الزيود <span class=\"pg\">ص 30-65<\/span>."},{"t":"li","lvl":1,"h":"<i>ثبات الصحابة وأثر اليقين في المواقف الحرجة<\/i> — د. محمد بن صامل السلمي <span class=\"pg\">ص 45-80<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تتغلب على الجبن الاجتماعي وتصدع بالحق؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"سيكولوجية الامتثال الجماعي وتجربة آش (Asch Conformity)\" — قناة علي وكتاب على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"الشهادة بالحق والإنكار الشجاع\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. نصرة المظلوم الميدانية:","[ ] إيقاف موقف تنمر أو غيبة يُمارس على زميل بالصف أو المجموعات بصوت هادئ وحازم.","2. الصدق التام في المحك الصعب:","[ ] التزام الصدق المطلق في موقف حرج دون مراوغة أو اعتذارات كاذبة.","3. بَتْر المجاملة على حساب الدين والمبادئ:","[ ] الامتناع التام عن التفاعل أو مجاملة أي محتوى ساخر أو منكر في فضاء التواصل."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الصدع بالحق","يجامل الأقران على حساب الحق ويخشى إظهار رأيه ومبدئه.","يرفض المنكر داخلياً وينسحب صامتاً دون أن يملك جرأة الإفصاح.","يجهر بالحق وينصر المظلوم بأسلوب واثق ومؤدب دون تردد."],["مقاومة هيبة الناس","ينقاد لموجة المجموعة خجلاً وخوفاً من السخرية والتهميش.","يقاوم الضغط في الأمور الصغيرة ويضعف أمام التهديد الجاد بالعزلة.","يُسقط هيبة المخلوق أمام أمر الخالق، ولا يبالي بسخرية المبطلين."],["الصدق في المواقف الحرجة","يلجأ للحيل والأكاذيب للتخلص من المآزق أو التماس الأعذار.","يتحرى الصدق مع نوع من المواربة عند اشتداد العتب.","يلتزم بالصدق الصريح مهما كانت العواقب الدنيوية إيماناً بالبركة."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: ثبات المبدأ والشجاعة الأدبية","sub":"","lines":["💡 البوصلة والمفهوم:","الشجاعة ليست في خوض الشجار، بل في \"قول الحق حين يصمت الجميع\"! الشاب المسلم لا يكون إمعة يساير موجات الأقران الجائرة. هيبة الناس لا تسوغ السكوت عن الظلم، والصدق في المحك الحرج شيمة الرجال.","📖 الآية المحورية:","<span class=\"ayah\">﴿الَّذِينَ يُبَلِّغُونَ رِسَالَاتِ اللَّهِ وَيَخْشَوْنَهُ وَلَا يَخْشَوْنَ أَحَدًا إِلَّا اللَّهَ﴾<\/span> <span class=\"ayref\">الأحزاب: 39<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«أَلاَ لاَ يَمْنَعَنَّ رَجُلاً هَيْبَةُ النَّاسِ أَنْ يَقُولَ بِحَقٍّ إِذَا عَلِمَهُ»<\/span> <span class=\"takh\">[جامع الترمذي]<\/span>.","📐 قواعد الشجاعة الأدبية الثلاث:","1. تجريد الخشية لله: من خاف الله هابه كل شيء، ومن خاف الناس تخطفته الأوهام.","2. الكثرة ليست ميزاناً للحق: رجل واحد على الحق يزن أمة من المقلدين.","3. الشجاعة وقار وأدب: اجهر بالحق بغير وقاحة، وانصر المظلوم بعزة وهدوء.","—hr—","🎯 صياغة عبارة الشجاعة (موقفي الواثق عند المنكر):","\"أنا أحترم الجميع، لكن هذا القول/الفعل خطأ ولا أرضى به، ولن أشارك فيه\".","—hr—","📝 سجل الثبات الأسبوعي (ضع ✓ عند الصدع بالحق):","[ إنكار غيبة أو تنمر ]  [ الصدق في موقف حرج ]  [ الامتناع عن مجاملة باطل ]","(   )                     (   )                     (   )","عهد الفتى المسلم: \"أنا صاحب مبدأ لا يلين، خشيتي لربي وحده، وسأبقى صوتاً للحق ما حييت\"."]}]}]},{"id":"4-3","ordinal":"الحادي والعشرون","title":"الاعتزاز بالهوية","sub":"الانتماء الحضاري للأمة ومقاومة الذوبان والتبعية","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الرابعة: معاني الرجولة والهوية"],["عنوان اللقاء","الاعتزاز بالهوية (الانتماء الحضاري للأمة ومقاومة الذوبان والتبعية)"],["الرمز الكودي","U4-L21-IDENTITY"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل حوارية وتطبيقية حول تفكيك عقدة النقص الحضارية وبناء الاستعلاء الإيماني"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> أخطر التحديات التي تواجه الشاب في الفضاء الرقمي هي <b>\"عقدة الهزيمة النفسية والانسحاق الحضاري أمام النموذج الغربي\"<\/b>؛ حيث يُستدرج الفتى للشعور بالخجل من لغته وتاريخه ورموزه الإسلامية، فيسعى لتقليد الغالب تقليداً أعمى في المظهر واللسان والسلوكيات المشوهة. الاعتزاز بالهوية الإسلامية هو <b>\"الاستعلاء الإيماني الواعي\"<\/b> القائم على الشعور بالشرف بالانتساب لخير أمة أخرجت للناس، مع امتلاك عقلية نقدية تفيد من العلوم والتقنيات المادية النافعة دون تفريط في الأخلاق والمبادئ."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفكك الفتى مغالطة الربط بين التقدم التقني والانحلال الأخلاقي، ويدرك أبعاد الهزيمة النفسية ومصيدة التقليد الأعمى."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى عزة الانتماء لأمة الإسلام، متخلصاً من عقدة النقص والدونية تجاه الثقافات الوافدة."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يصمم الفتى \"درع حماية الهوية\"، ويلتزم بممارسات عملية تعزز انتماءه (فصاحة اللسان العربي، نصرة قضايا الأمة، وإبراز السمت المستقل)."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بالسؤال الاستفزازي الهادئ التالي:"},{"t":"p","lvl":0,"h":"<b>\"لماذا يشعر بعض الشباب بالفخر إذا ارتدى قميصاً عليه علم دولة غربية أو اسم مغنٍ أجنبي، بينما يشعر بالحرج إذا تحدث باللغة العربية الفصحى أو أظهر اعتزازه برمز إسلامي؟ هل التقدم في صناعة الطائرات والشرائح الإلكترونية يعني بالضرورة أن تكون أفكارهم وأخلاقهم هي الأرقى؟ ومتى أصبح جلد الذات واحتقار أمتنا علامة على الثقافة؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو زياد والمسخ الحضاري)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة زياد وراكان: مسخ اللغة والمظهر vs العزة الحضارية<\/span>"},{"t":"p","lvl":0,"h":"- زياد (17 سنة): يشعر بالحرج إذا تحدث بالعربية أو استشهد بآية؛ يدس مصطلحات أجنبية مكسرة في كل جملة، ويقلد قصات شعر وسلوكيات مشاهير الغرب بحذافيرها! وإذا ذُكر تاريخ المسلمين ابتسم بسخرية قائلاً: \"نحن أمة متخلفة لا نملك إلا الماضي، والغرب هو القمة في كل شيء!\"."},{"t":"p","lvl":0,"h":"- راكان (17 سنة): يتحدث العربية بفصاحة واعتزاز، متفوق في البرمجة والفيزياء. عندما يتحدث عن الحضارات يقول بتوازن: \"نستفيد من علومهم وصناعاتهم النافعة، لكننا نترفع عن انحلالهم وإلحادهم؛ فنحن أصحاب الرسالة الخاتمة وهداية البشرية\"."},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. أيهما الشاب الحر صاحب الهوية المستقلة؟ وأيهما الشاب الذي استُلب عقله وصار مجرد صدى وتابع أعمى؟"},{"t":"p","lvl":0,"h":"2. كيف نستفيد من علوم العالم دون أن نذوب في مستنقع انحرافاتهم؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ وَلَٰكِنَّ الْمُنَافِقِينَ لَا يَعْلَمُونَ﴾<\/span> <span class=\"ayref\">المنافقون: 8<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> العزة أصل ملازم للمؤمن مستمد من عزة الله ورسوله؛ فلا يسوغ لفتى مسلم أن يستشعر الدونية أو الانكسار أمام أية حضارة مادية أرضية."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ﴾<\/span> <span class=\"ayref\">آل عمران: 139<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> نهي قرآني عن الوهن والانسحاق النفسي؛ فالاستعلاء بالإيمان وقيمه هو الحصن الذي يحفظ الهوية من الذوبان."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنكَرِ وَتُؤْمِنُونَ بِاللَّهِ﴾<\/span> <span class=\"ayref\">آل عمران: 110<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث عبد الله بن عمر رضي الله عنهما:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«مَنْ تَشَبَّهَ بِقَوْمٍ فَهُوَ مِنْهُمْ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>سنن أبي داود: كتاب اللباس، باب في لبس الشهرة، برقم 4031، وصححه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> تحذير نبوي من التشبه والذوبان الأعمى في الخصائص العقدية والأخلاقية المميزة لغير المسلمين؛ فحماية الاستقلالية واجبة."},{"t":"li","lvl":0,"h":"<b>حديث حذيفة بن اليمان رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«لاَ تَكُونُوا إِمَّعَةً، تَقُولُونَ: إِنْ أَحْسَنَ النَّاسُ أَحْسَنَّا، وَإِنْ ظَلَمُوا ظَلَمْنَا، وَلَكِنْ وَطِّنُوا أَنْفُسَكُمْ، إِنْ أَحْسَنَ النَّاسُ أَنْ تُحْسِنُوا، وَإِنْ أَسَاءُوا فَلاَ تَظْلِمُوا»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>جامع الترمذي: كتاب البر والصلة برقم 2007، وقال: حسن غريب<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الفكري:<\/i> النهي عن التبعية الهوجاء؛ فشخصية الشاب المسلم شخصية رائدة ومستقلة تؤثر في واقعها ولا تذوب فيه."},{"t":"li","lvl":0,"h":"<b>حديث النعمان بن بشير رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ وَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: برقم 6011؛ وصحيح مسلم: برقم 2586<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الوجداني:<\/i> الانتماء للأمة انتماء عقدي جامع يسمو فوق الحدود، يجعل الشاب حياً يتفاعل مع آلام إخوانه في كل مكان."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف ربعي بن عامر رضي الله عنه أمام رستم قائد الفرس:<\/b> دخل بثيابه البسيطة وفرسه القصيرة على مجلس رستم المليء بالحرير والذهب، فلما سأله رستم: ما جاء بكم؟ قال بثقة الاستعلاء الإيماني: <span class=\"qt\">«اللَّهُ ابْتَعَثَنَا لِنُخْرِجَ مَنْ شَاءَ مِنْ عِبَادَةِ الْعِبَادِ إِلَى عِبَادَةِ رَبِّ الْعِبَادِ، وَمِنْ ضِيقِ الدُّنْيَا إِلَى سَعَتِهَا، وَمِنْ جَوْرِ الأَدْيَانِ إِلَى عَدْلِ الإِسْلاَمِ»<\/span> [تاريخ الطبري 3/520، والبداية والنهاية لابن كثير 7/46]. نموذج باذخ للشاب الذي لا يبهره البريق المادي الزائف."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: نقد عقدة النقص والتفوق الغربي المادي<\/b>"},{"t":"li","lvl":0,"h":"التمييز بين:"},{"t":"li","lvl":1,"h":"<b>العلوم الكونية والتجريبية:<\/b> حكمة إنسانية مشتركة، يأخذ منها المسلم ويطورها بنية نفع الأمة."},{"t":"li","lvl":1,"h":"<b>المنظومة الأخلاقية والاجتماعية:<\/b> مبادئ الوحي هي المعيار، والغرب يعاني من سيولة أسرية وإلحاد وانتحار وتفكك قيمي."},{"t":"p","lvl":0,"h":"<span class=\"lbl\">خريطة التعامل مع الثقافات الأخرى<\/span>"},{"t":"p","lvl":0,"h":"العلوم التقنية والصناعات النافعة   =====&gt; نقتبسها، ونتفوق فيها، ونبني بها أمتنا."},{"t":"p","lvl":0,"h":"الانحرافات الأخلاقية والإلحادية     =====&gt; نرفضها، ونستعلي بإيماننا وقيمنا عنها."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: اللسان العربي ووعاء الهوية<\/b>"},{"t":"li","lvl":0,"h":"التحدث بالعربية الفصيحة شرف وعبادة ورباط بالقرآن؛ الرطانة المبتذلة واستبدال الكلمات العربية بغيرها دون حاجة علمية دليل على ضعف الثقة بالذات."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أليس الغربيون أفضل منا سلوكاً ونظاماً في شوارعهم ومؤسساتهم؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> النظام والصدق قيم إسلامية أصيلة دعا إليها ديننا قبل أن يطبقوها؛ فإذا أحسنوا في تطبيق قيمة فهذا يحسب للقيمة ذاتها، لكن تفوقهم الإداري لا يسوغ قبول شذوذهم الأخلاقي وإلحادهم."}]},{"t":"qa","n":"2","q":"\"ألا يتطلب تعلم الإنجليزية والبرمجة أن نندمج في ثقافتهم وطرائقهم؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هناك فرق بين <b>\"إتقان اللغة كأداة علم وتواصل\"<\/b> وبين <b>\"تبني الثقافة والذوبان فيها\"<\/b>. علماء اليابان والصين يقودون العالم في التكنولوجيا وهم أشد الناس اعتزازاً بلغاتهم وثقافاتهم وهوياتهم!"}]},{"t":"qa","n":"3","q":"\"ماذا أستطيع أن أقدم لأمتي وأنا شاب لا أملك سلطة ولا مالاً؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> تبدأ نصرة الأمة من نفسك: تفوقك الدراسي، صيانة لسانك، حفظ صلاتك، الدعاء للمستضعفين، والتخطيط لتكون رقماً صعباً في تخصصك لترفع راية أمتك."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>حارس الهوية (الميسر الشاب):<\/b> إدارة الحوار حول مظاهر التبعية وتفكيك عقدة النقص."},{"t":"li","lvl":0,"h":"<b>مدوّن الدرع (المدوّن):<\/b> رسم درع الهوية وتدوين أركان العزة الإيمانية على السبورة."},{"t":"li","lvl":0,"h":"<b>محامي الانبهار (المعارض):<\/b> تمثيل صوت المنبهرين بالمظاهر الغربية."},{"t":"li","lvl":0,"h":"<b>حارس الثغور (الميقاتي):<\/b> الالتزام بتوقيتات الورشة."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر درع الهوية ومقاومة الذوبان (Identity Shield Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة مرسومة على شكل درع واقٍ مقسم إلى 4 قطاعات."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<i>قطاع اللسان واللغة:<\/i> التعهد بتنقية الكلام من الرطانة والاعتزاز بالعربية."},{"t":"li","lvl":1,"h":"<i>قطاع المظهر المستقل:<\/i> استبعاد أية قصات أو ملابس تروج لرموز انحلالية أو إلحادية."},{"t":"li","lvl":1,"h":"<i>قطاع العقل الناقد:<\/i> صياغة عبارة تفكك بريق الحضارة المادية الزائفة."},{"t":"li","lvl":1,"h":"<i>قطاع نصرة الأمة:<\/i> تحديد خطوة عملية لنصرة قضايا المسلمين ودعم قضاياهم."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: سامر وعقدة لعبة الشركة المسيئة<\/span>"},{"t":"p","lvl":0,"h":"سامر (17 سنة) شاب شغوف بالألعاب الإلكترونية."},{"t":"p","lvl":0,"h":"أطلقت شركة أجنبية لعبة مبهرة تقنياً، لكنها دسّت في مراحلها رموزاً وإهانات للمقدسات الإسلامية والقرآن."},{"t":"p","lvl":0,"h":"- شعر سامر بامتعاض أولي، لكن صديقه قال له: \"يا رجل هذه مجرد لعبة للتسلية! لا تكن معقداً وتخلط الدين بالترفيه.. العب واستمتع!\"."},{"t":"p","lvl":0,"h":"- اقتنع سامر واشترى اللعبة وصار يدعو زملاءه إليها بحماس!"},{"t":"p","lvl":0,"h":"عندما سأله أخوه: \"كيف تدفع مالك للعبة تسيء لدينك؟\"، رد سامر: \"نحن مستهلكون، وهم الأقوى والأذكى في العالم!\"."},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف جسد رد سامر الهزيمة النفسية وعقدة النقص؟"},{"t":"p","lvl":0,"h":"2. كيف يتصرف الشاب المعتز بهويته ورجولته في مثل هذا الموقف؟"},{"t":"p","lvl":0,"h":"3. ما البدائل التقنية المحترمة التي تحمي كرامة الفتى ودينه؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال الاعتزاز بالعلم الأجنبي مقابل الخجل من العربية."],["05 - 15 د","الخطاف الحواري","قصة زياد وراكان وإدارة نقاش التبعية والحرية."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","أدلة العزة، حديث من تشبه والإمعة، وموقف ربعي بن عامر."],["30 - 45 د","المختبر ودراسة الحالة","تمرين درع الهوية وتفكيك حالة سامر في المجموعات."],["45 - 55 د","بنك الأسئلة الجدلية","نقاش تفوق الغرب الإداري، واللغات الأجنبية، ونصرة الأمة."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وتحديد ممارسات الهوية العملية."],["65 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع الأدوار للدروس المتبقية."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 28-36","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«الانتماء الحضاري للأمة يبدأ بتجاوز عقدة النقص أمام التفوق المادي للغرب، وإدراك أن فضل أمتنا هو بما تحمله من هداية الوحي للعالمين»<\/span>."},{"t":"src","cite":"منهج التربية الإسلامية - محمد قطب - ص 65-80","short":"منهج التربية الإسلامية — محمد قطب","q":"<span class=\"qt\">«التصور الإسلامي للهوية يربط المسلم بأمته العقائدية الشاملة؛ فيستعلي بإيمانه على كل تبعية، ويأبى أن يكون ذيلاً لثقافة أخرى»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 85-98","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«العزة في الإسلام ترفع هامة المسلم عن الدنية؛ فالمسلم شخصية متبوعة تصنع المجد، وليست تابعة تنسحق أمام الغالب»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 92-102","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«أزمة الهوية لدى الشاب تدفعه للتقليد الأعمى للمشاهير طلباً للانتماء؛ وعلاجه بغرس الاعتزاز بأمجاده الحقيقية»<\/span>."},{"t":"src","cite":"سابغات - أحمد السيد - ص 42-55","short":"سابغات — أحمد السيد","q":"<span class=\"qt\">«الحصانة الفكرية تمنح الشاب عيناً ناقدة تميز بين الاستفادة العلمية المشروعة وبين الانبهار المذموم الذي يطمس الهوية»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>المسلمون والحضارة الغربية<\/i> — الشيخ سفر الحوالي (فصل: تفكيك عقدة التفوق الغربي، ص 50-95)."},{"t":"li","lvl":1,"h":"<i>الهوية الإسلامية في زمن العولمة<\/i> — د. محمد عمارة <span class=\"pg\">ص 30-70<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تتخلص من الهزيمة النفسية وعقدة التفوق الغربي؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"فخاخ التغريب ومسخ الهوية في الفضاء الرقمي\" — قناة شؤون إسلامية على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"الاعتزاز بالهوية ونصرة الأمة\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. فصاحة اللسان واعتزاز اللغة:","[ ] التحدث والكتابة باللغة العربية الفصيحة، وتنقية منشوراتك من الرطانة المبتذلة.","2. استقلال السمت والمظهر:","[ ] التخلي عن أية ملابس أو قصات أو رموز تدعم أفكاراً منحرفة أو مشاهير شاذين.","3. التفاعل مع قضايا الأمة:","[ ] تخصيص دعاء يومي لإخوانك المستضعفين، والتوعية بقضاياهم بالكلمة الطيبة."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الاعتزاز بالهوية","يشعر بالدونية ويخجل من لغته ودينه وينبهر بكل ما هو غربي.","يعتز بدينه عاطفياً لكنه ينساق للتقليد الشكلي للمشاهير الأجانب.","يستعلي بإيمانه، ويعتز بلسانه وتاريخه وسمته المستقل باقتدار."],["العقلية النقدية للحضارة","يرى الغرب قدوة مطلقة في التقنية والأخلاق والسلوك.","يدرك أخطاء الغرب نظرياً ويصعب عليه نقد منتجاتهم وألعابهم.","يفرز بين العلم النافع فيأخذه، وبين الانحلال الأخلاقي فيرفضه."],["الانتماء لأمة الإسلام","يعيش باهتمامات شخصية ضيقة ولا يبالي بقضايا المسلمين.","يتأثر بمشاهد آلام المسلمين مؤقتاً وسرعان ما ينساها.","يستشعر أنه جزء من جسد الأمة، وينصر قضاياها بالدعاء والعمل الجاد."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: الاعتزاز بالهوية والاستعلاء الإيماني","sub":"","lines":["💡 البوصلة والمفهوم:","أنت حفيد أمة قادت العالم بالعدل والرحمة! التقدم في الصناعة لا يعطي أحداً حق فرض انحلاله الأخلاقي علينا. المسلم يستفيد من علوم البشرية النافعة، لكنه يستعلي بإيمانه وقيمه: <span class=\"ayah\">﴿وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ﴾<\/span>.","📖 الآية المحورية:","<span class=\"ayah\">﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ﴾<\/span> <span class=\"ayref\">آل عمران: 139<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«لاَ تَكُونُوا إِمَّعَةً... وَلَكِنْ وَطِّنُوا أَنْفُسَكُمْ»<\/span> <span class=\"takh\">[جامع الترمذي]<\/span>.","📐 ركائز درع الهوية الثلاث:","1. عزة اللسان: لغتي العربية وعاء ديني وفكري، ورطانتها بغير حاجة هزيمة نفسية.","2. استقلال السمت: لا أرتدي ما يروج لباطل، ولست لوحة إعلانات لأحد.","3. التمييز الواعي: نأخذ العلم والصناعة، ونلقي الإلحاد والانحلال.","—hr—","🎯 مقولتي المستقلة أمام الحضارات (شعار ربعي بن عامر):","\"الله ابتعثنا لنخرج العباد من عبادة العباد إلى عبادة رب العباد\".","—hr—","📝 سجل الاعتزاز الأسبوعي (ضع ✓ عند التطبيق):","[ صيانة اللسان بالعربية ]  [ مقاطعة منتج أو رمز مسيء ]  [ نصرة قضية لأمتي بالدعاء ]","(   )                       (   )                       (   )","عهد الفتى المسلم: \"أنا ابن خير أمة أخرجت للناس، رأسي مرفوع بإسلامي، ولن أكون ظلاً لأحد\"."]}]}]}]},{"n":5,"title":"المهارات المستقبلية والجاهزية العملية","c":"lavender","lessons":[{"id":"5-1","ordinal":"الخامس والعشرون","title":"فن الإلقاء والتأثير","sub":"التعبير عن الأفكار بقوة وثقة أمام الجمهور وإتقان لغة الجسد","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الخامسة: المهارات المستقبلية والجاهزية العملية"],["عنوان اللقاء","فن الإلقاء والتأثير (التعبير عن الأفكار بقوة وثقة أمام الجمهور وإتقان لغة الجسد)"],["الرمز الكودي","U5-L25-PUBLIC_SPEAKING"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل تفاعلية حية، مسرح محاكاة الخطابة، ومختبر لغة الجسد ونبرات الصوت"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> قدرة الشاب على التعبير عن أفكاره وقيمه بلغة فصيحة، ونبرة واثقة، ولغة جسد متزنة ليست مجرد \"موهبة كمالية\"، بل هي <b>سلاح التمكين ووسيلة البلاغ والتأثير القيادي في العصر الحديث<\/b>؛ فكم من صاحب حق عجز عن نصرة قضيته لرهبة المنصة وانحباس لسانه! فن الإلقاء والتأثير هو <b>إدارة رهبة الجمهور، وتوظيف الجسد والصوت لنقل المعاني الصادقة بوقار وهيبة<\/b> اقتداءً بالأنبياء الذين أوتوا فصل الخطاب."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفكك الفتى عناصر الرسالة المؤثرة (الكلمات، نبرات الصوت، ولغة الجسد)، ويدرك أن الإلقاء مهارة كسبية تتطور بالمران."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى شرف منّة البيان وعزة البلاغ، متغلباً على الخجل الاجتماعي ورهبة مواجهة الناس."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يقدم الفتى عرضاً إلقائياً حياً مدته 90 ثانية (Elevator Pitch) متقناً فيه: وقفة الثبات، التنوع الصوتي، والتواصل البصري المباشر."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي اللقاء بطرح هذا السؤال الاستكشافي:"},{"t":"p","lvl":0,"h":"<b>\"لو طلب منك الآن فجأة أن تصعد على هذه المنصة لتقنع 100 شخص بفكرة تؤمن بها بشدة لمدة دقيقتين فقط.. ما أول شعور يداهم جسدك؟ تسارع النبض؟ جفاف الحلق؟ الرغبة في الاختفاء؟ ولماذا تضعف ألسنتنا ونرتجف أمام أعين الناس ونحن نحمل أعظم المبادئ؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو الفكرة المقتولة والعرض الملهم)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة زياد وحسام: الفكرة العبقرية المقتولة vs العرض الملهم<\/span>"},{"t":"p","lvl":0,"h":"في مسابقة المبادرات الشبابية، تقدم طالبتان بمشروعين:"},{"t":"p","lvl":0,"h":"- زياد (17 سنة): يملك فكرة تقنية مبتكرة لحل أزمة تسرب المياه في المدن! صعد للمنصة:"},{"t":"p","lvl":0,"h":"* ارتبك، نظر إلى السقف والأرض، ويداه ترتجفان داخل جيبه!"},{"t":"p","lvl":0,"h":"* تحدث برتم واحد منخفض ومتلعثم، وقرأ الشرائح حرفياً دون أن ينظر في أعين الحكام!"},{"t":"p","lvl":0,"h":"* النتيجة: شعر الجمهور بالملل، ولم يفهم الحكام فكرته، ورُفض مشروعه وقيل عنه \"صاحب فكرة عبقرية قتلها الإلقاء الرديء!\"."},{"t":"p","lvl":0,"h":"- حسام (17 سنة): يملك فكرة متواضعة لجمع الكتب القديمة، لكنه صعد للمنصة بثبات:"},{"t":"p","lvl":0,"h":"* ظهر مستقيم، ابتسامة واثقة، وتواصل بصري شمل كل الحضور!"},{"t":"p","lvl":0,"h":"* صوته تموج بين الهدوء والحماس، ويداه ترسمان المعاني بوقار في الهواء."},{"t":"p","lvl":0,"h":"* النتيجة: فاز بالمركز الأول ونال دعماً كاملاً لمشروعه بفضل قوة بيانه وتأثيره!"},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. لماذا تقتل \"رهبة المنصة وسوء التعبير\" أنبل الأفكار والمشاريع في زماننا؟"},{"t":"p","lvl":0,"h":"2. كيف نحول أصواتنا ووقفتنا إلى أداة تخدم قيمنا ونصرة ديننا؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿الرَّحْمَٰنُ * عَلَّمَ الْقُرْآنَ * خَلَقَ الْإِنسَانَ * عَلَّمَهُ الْبَيَانَ﴾<\/span> <span class=\"ayref\">الرحمن: 1-4<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الامتنان الإلهي بمنّة \"البيان\" والإعراب عما في الضمير؛ فالفصاحة والتعبير من أخص خصائص التكريم الإنساني."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿قَالَ رَبِّ اشْرَحْ لِي صَدْرِي * وَيَسِّرْ لِي أَمْرِي * وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي * يَفْقَهُوا قَوْلِي﴾<\/span> <span class=\"ayref\">طه: 25-28<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> فزع موسى عليه السلام إلى الدعاء بانطلاق اللسان وجودة البيان عند التكليف بالرسالة؛ ليكون القول مفهوماً مؤثراً."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَقُل لَّهُمْ فِي أَنفُسِهِمْ قَوْلًا بَلِيغًا﴾<\/span> <span class=\"ayref\">النساء: 63<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث عمار بن ياسر رضي الله عنهما:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«إِنَّ طُولَ صَلاَةِ الرَّجُلِ، وَقِصَرَ خُطْبَتِهِ، مَئِنَّةٌ مِنْ فِقْهِهِ... وَإِنَّ مِنَ البَيَانِ لَسِحْرًا»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح مسلم: كتاب الجمعة، باب تخفيف الصلاة والخطبة، برقم 869<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> إقرار نبوي لقوة التأثير البياني (\"إن من البيان لسحراً\")؛ فالبلاغة والإيجاز دليل على عمق الفقه والتمكن."},{"t":"li","lvl":0,"h":"<b>حديث أم المؤمنين عائشة رضي الله عنها:<\/b> قالت: <span class=\"qt\">«كَانَ كَلاَمُ رَسُولِ اللَّهِ ﷺ كَلاَمًا فَصْلاً يَفْهَمُهُ كُلُّ مَنْ سَمِعَهُ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>سنن أبي داود: كتاب الأدب، باب في التؤدة في الكلام، برقم 4839، وحسنه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الإجرائي:<\/i> الهدي النبوي في الإلقاء؛ التأني، والوضوح، والقطع بين الجمل لتحقيق الفهم التام."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>خطبة النبي ﷺ على الصفا في ابتداء الجهر بالدعوة:<\/b> صعد الصفا ونادى بطون قريش، ثم وظف شاهداً عقلياً وبصرياً حاسماً: <span class=\"qt\">«أَرَأَيْتَكُمْ لَوْ أَخْبَرْتُكُمْ أَنَّ خَيْلًا بِالوَادِي تُرِيدُ أَنْ تُغِيرَ عَلَيْكُمْ، أَكُنْتُمْ مُصَدِّقِيَّ؟»<\/span> قَالُوا: نَعَمْ، مَا جَرَّبْنَا عَلَيْكَ إِلَّا صِدْقًا! قَالَ: <span class=\"qt\">«فَإِنِّي نَذِيرٌ لَكُمْ بَيْنَ يَدَيْ عَذَابٍ شَدِيدٍ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب التفسير برقم 4770؛ وصحيح مسلم برقم 208<\/cite><\/div><\/details>. استخدام المقدمة المنطقية الآسرة في قيادة الجمهور وتمرير الرسالة."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: تشريح الرسالة الإلقائية (مخطط لغة الجسد والصوت)<\/b>"},{"t":"li","lvl":0,"h":"<b>لغة الجسد (55%):<\/b> الثبات الحركي (وقفة الشجرة)، استقامة الظهر، الأيدي المفتوحة (Open Gestures)، والتواصل البصري الشامل بنمط (حرف Z)."},{"t":"li","lvl":0,"h":"<b>نبرات الصوت (38%):<\/b> التنوع بين الحماس والهدوء، رفع النبرة عند المعاني المهمة، واستخدام الوقفات الذكية (Pauses) لترسيخ الفكرة."},{"t":"li","lvl":0,"h":"<b>الكلمات والصياغة (7%):<\/b> فصاحة اللفظ، البعد عن التقعر أو الابتذال، والتركيز على فكرة مركزية واحدة."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: سيكولوجية التعامل مع التوتر والخوف<\/b>"},{"t":"li","lvl":0,"h":"التوتر ليس دليلاً على الفشل، بل طاقة طبيعية يفرزها الجسم للتحفز؛ والحل في <b>التنفس العميق البطني<\/b>، والتحضير الممتاز، والتركيز على \"خدمة الجمهور ونقل الفائدة\" بدلاً من التفكير في \"كيف ينظر الناس إليّ\"."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"هل الخطابة موهبة فطرية يولد بها الإنسان، ولا يمكن للشخص الخجول تعلمها؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الإلقاء مهارة مكتسبة بنسبة 100% تتطور بالتدريب والتكرار؛ أعظم خطباء التاريخ عانوا في بداياتهم من اللعثمة والرهبة. بالممارسة المستمرة تتحول الرهبة إلى قوة حضور."}]},{"t":"qa","n":"2","q":"\"ألا يُعد تجميل الصوت والاعتناء بلغة الجسد نوعاً من الرياء والتصنع؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الشريعة دعت للبلاغة: <span class=\"ayah\">﴿وَقُل لَّهُمْ فِي أَنفُسِهِمْ قَوْلًا بَلِيغًا﴾<\/span>. العناية بأسلوب الإلقاء هي إكرام للحق وإعانة للسامع على الفهم، والنية الصادقة هي التي تفصل بين التبليغ المأجور واستعراض النرجسية."}]},{"t":"qa","n":"3","q":"\"كيف أتصرف إذا نسيت الفكرة أثناء الوقوف على المنصة وتملكني الصمت؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> لا ترتبك ولا تعتذر؛ خذ نفساً عميقاً، واصمت لمدة 3 ثوانٍ (سيعتبرها الجمهور وقفة تأملية مقصودة!)، ثم أعد صياغة آخر فكرة قلتها بهدوء، أو انتقل مباشرة للنقطة التالية."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>رئيس منصة الخطابة (الميسر الشاب):<\/b> إدارة منصة التحدث وتقديم زملائه."},{"t":"li","lvl":0,"h":"<b>مدوّن الملاحظات البيانية (المدوّن):<\/b> تدوين نقاط القوة ومساحات التحسين لكل ملقٍ."},{"t":"li","lvl":0,"h":"<b>مدرب لغة الجسد (المعارض/المقيم):<\/b> رصد حركة الأيدي، الثبات، والتواصل البصري."},{"t":"li","lvl":0,"h":"<b>حارس الدقيقة والنصف (الميقاتي):<\/b> ضبط وقت العروض (90 ثانية لكل طالب) بجرس هادئ."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مسرح المحاكاة — تحدي الـ 90 ثانية للإلقاء القيادي (Elevator Pitch Arena)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> ميكروفون، ساعة إيقاف، ومنصة مخصصة بالقاعة."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<i>التحضير السريع (3 دقائق):<\/i> يختار الفتى فكرة قيمية محددة (أهمية صلاة الفجر، خطر المخدرات الرقمية، بر الوالدين، أو شغف البرمجة)."},{"t":"li","lvl":1,"h":"<i>الصعود والتنفيذ (90 ثانية):<\/i>"},{"t":"li","lvl":2,"h":"(00-15 ث): مقدمة آسرة (سؤال صادم أو رقم إحصائي)."},{"t":"li","lvl":2,"h":"(15-65 ث): صلب الفكرة مع استشهاد قرآني أو واقعي."},{"t":"li","lvl":2,"h":"(65-90 ث): خاتمة ودعوة قاطعة للعمل (Call to Action)."},{"t":"li","lvl":1,"h":"<i>الاشتراطات الحركية:<\/i> ثبات القدمين، التواصل البصري الشامل، وحركات أيدٍ مفتوحة ومتزنة."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: منذر وتلعثم الإذاعة المدرسية<\/span>"},{"t":"p","lvl":0,"h":"منذر (16 سنة) طالب متفوق حافظ لكتاب الله. اختاره المعلم لإلقاء كلمة الصباح بالإذاعة أمام 500 طالب ومعلم:"},{"t":"p","lvl":0,"h":"- عندما وقف أمام اللاقط ورأى حشود الطلاب، داهمه الذعر!"},{"t":"p","lvl":0,"h":"- تسارعت دقات قلبه، جف حلقه، ووضع يديه في جيبه متجمداً، وبدأ يقرأ بسرعة خاطفة وصوت خافت متلعثم!"},{"t":"p","lvl":0,"h":"- عندما همس بعض الطلاب في الخلف ضاحكين، قطع الكلمة ونزل ركضاً من المنصة، وأقسم ألا يواجه الناس ثانية!"},{"t":"p","lvl":0,"h":"بعد أسبوع: عُرضت عليه المشاركة في مسابقة الإلقاء فرفض بحسم قائلاً: \"أنا إنسان خجول بطبعي، والمنصات ليست لي!\"."},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف تحول التعثر الأول إلى عقدة نفسية سلبت منذر شجاعته؟"},{"t":"p","lvl":0,"h":"2. ما الخطوات الثلاث التي تعيد بناء ثقة منذر وتجهزه للمنصة من جديد؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال الارتباك ومواجهة الجمهور."],["05 - 15 د","الخطاف الحواري","قصة زياد وحسام وتفكيك الفكرة المقتولة."],["15 - 25 د","التأصيل الشرعي والمفاهيمي","أدلة البيان، حديث سحر البيان، وخطبة الصفا النبوية."],["25 - 55 د","المختبر التطبيقي","مسرح المحاكاة: تحدي الـ 90 ثانية لجميع الفتيان."],["55 - 63 د","دراسة حالة واقعية","تفكيك أزمة منذر وتجاوز صدمة المنصة."],["63 - 68 د","بنك الأسئلة الجدلية","أسرار الوقوف الثابت والتعامل مع النسيان المفاجئ."],["68 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع بطاقة الطالب."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«الرجولة القرآنية لسان صدق وبيان: <span class=\"ayah\">﴿وَأَخِي هَارُونُ هُوَ أَفْصَحُ مِنِّي لِسَانًا فَأَرْسِلْهُ مَعِيَ رِدْءًا يُصَدِّقُنِي﴾<\/span>؛ فالبيان وسيلة تمكين الحق»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 45-55","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«بناء مهارات التواصل والتأثير والتعبير عن الحق بشجاعة أدبية واجب الجيل الصاعد لمواجهة طوفان الباطل المزخرف»<\/span>."},{"t":"src","cite":"النبأ العظيم - محمد عبد الله دراز - ص 60-75","short":"النبأ العظيم — محمد عبد الله دراز","q":"<span class=\"qt\">«سحر البيان يكمن في صدق الشعور وتطابق القول مع هيئة الناطق؛ فالكلمة الصادقة تنفذ للبصائر قبل الأسماع»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 160-172","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«البيان في الإسلام وسيلة لهداية الخلق، وليس بوقاً للمباهاة الفارغة؛ وقيمة الحديث في ثمرته وطهارة مقصده»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 405-420","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«تدريب الفتى على الخطابة ومواجهة الجمهور يغرس فيه عزة النفس ويكسر حاجز الوجل والخجل الاجتماعي»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 75-88","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«الخوف من الجمهور ظاهرة طبيعية لدى المراهق؛ وعلاجها يكمن في التدريب المتدرج داخل بيئات آمنة لا تسخر من تعثره»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>التحدث بثقة وأثر أمام الجمهور<\/i> — د. طارق السويدان <span class=\"pg\">ص 30-75<\/span>."},{"t":"li","lvl":1,"h":"<i>فن الخطابة وإعداد المتحدث<\/i> — ديل كارنيجي <span class=\"pg\">ص 45-90<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تتحدث بثقة وتتخلص من رهبة المنصة؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع تدريبي:<\/b> \"أسرار لغة الجسد ونبرات الصوت للمتحدث المؤثر\" — قناة دروس أونلاين على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"صوت الحق والإلقاء الميداني\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. الإلقاء الميداني الحقيقي:","[ ] إلقاء كلمة نافعة أو قراءة حديث مع شرحه (2-3 دقائق) أمام جمهور حقيقي (مصلى المدرسة، كلمة في المنزل، أو بين الزملاء).","2. استقامة السمت والتواصل البصري:","[ ] التحدث بظهر مستقيم ونظر مباشر في الأعين أثناء حواراتك مع المعلمين والوالدين.","3. التوثيق والتطوير الذاتي:","[ ] تسجيل مقطع فيديو لنفسك مدته دقيقتان ومراجعته لفحص نبرة صوتك وحركة يديك."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["إدارة رهبة المنصة","يرفض الصعود تماماً، أو يتجمد وينقطع صوته من الذعر.","يصعد بارتباك ملحوظ، ويتحدث بسرعة للتخلص من الموقف.","يقف بثبات ووقار، ويوظف طاقة التوتر في الحماس والشغف."],["لغة الجسد والتواصل","يضع يديه في جيبه ويتجنب النظر إلى الجمهور كلياً.","يوزع بصره جزئياً مع جمود نسبي في حركة اليدين.","يطبق وقفة الشجرة بثقة، ويوزع بصره بنمط Z، ويستخدم إيماءات مفتوحة."],["التنوع الصوتي والبيان","يتحدث برتم رتيب ساكن (Monotone) أو يقرأ حرفياً من ورقة.","يغير نبرته ببطء مع وجود بعض اللعثمة والتردد.","يمتلك صوتاً فصيحاً متموجاً، ويستخدم الوقفات الذكية ببراعة واقتدار."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: فن الإلقاء والتأثير البياني","sub":"","lines":["💡 البوصلة والمفهوم:","البيان شرف وسلاح تمكين! ما فائدة العلم والحق إن عجزت عن التعبير عنه بنبرة واثقة ولغة صادقة؟ لست متحدثاً للاستعراض، بل أنت لسان صدق يبلغ رسالات ربه بوقار وهيبة ووضوح.","📖 الآية المحورية:","<span class=\"ayah\">﴿الرَّحْمَٰنُ * عَلَّمَ الْقُرْآنَ * خَلَقَ الْإِنسَانَ * عَلَّمَهُ الْبَيَانَ﴾<\/span> <span class=\"ayref\">الرحمن: 1-4<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«وَإِنَّ مِنَ البَيَانِ لَسِحْرًا»<\/span> <span class=\"takh\">[صحيح مسلم]<\/span>.","📐 أركان الوقوف القيادي المؤثر الثلاثة:","1. الجسد (55%): وقفة ثابتة بظهر مستقيم، يد مفتوحة، وتواصل بصري شامل.","2. الصوت (38%): تلوين النبرات بين الهدوء والحماس، وتوظيف الوقفات الذكية.","3. الكلمات (7%): وضوح الفكرة، البعد عن التقعر، وخاتمة تحث على الفعل.","—hr—","🎯 هيكل عرض الـ 90 ثانية (احفظه وطبقه):","- (15 ث): خطاف حواري أو سؤال صادم.","- (50 ث): فكرة جوهرية واحدة مدعومة بدليل.","- (25 ث): دعوة صريحة ومباشرة للعمل والتطبيق.","—hr—","📝 سجل الإلقاء والتأثير الأسبوعي (ضع ✓ عند الإنجاز):","[ إلقاء كلمة أمام جمهور ]  [ تواصل بصري مستقيم مع المعلم/الوالد ]  [ مراجعة فيديو شخصي ]","(   )                             (   )                            (   )","عهد الفتى المسلم: \"أنا لسان صدق ينطق بالحق، أصعد بثبات، وأبث الخير ببيان آسر\"."]}]}]},{"id":"5-2","ordinal":"السادس والعشرون","title":"العمل الجماعي","sub":"القيادة التشاركية، إدارة الخلافات، وتوزيع الأدوار داخل الفريق","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الخامسة: المهارات المستقبلية والجاهزية العملية"],["عنوان اللقاء","العمل الجماعي (القيادة التشاركية، إدارة الخلافات، وتوزيع الأدوار داخل الفريق)"],["الرمز الكودي","U5-L26-TEAMWORK"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل محاكاة حية، تطبيق القيادة التشاركية، ومختبر إدارة الصراعات داخل الفرق"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> العمل الجماعي والتكامل ليس مجرد مهارة إدارية ناعمة (Soft Skill)، بل هو <b>أصل شرعي وإيماني وركيزة لبناء الأمة وإنجاز المشاريع الكبرى<\/b>؛ فالمرء ضعيف بمفرده، قوي بإخوانه، والعمل الفردي الأناني يعجز عن الصمود أمام تحديات الواقع. العمل الجماعي الراشد يتطلب <b>تفكيك نرجسية الأنا، وحسن إدارة الخلاف بروح الشورى، وتوزيع الأدوار وفق القدرات، ونكران الذات لصالح الهدف الأسمى<\/b>."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفهم الفتى ديناميكية الفرق وأنماط الأعضاء (المفكر، المنفذ، المنسق، والمحلل)، ويستوعب بروتوكول إدارة الخلاف الموضوعي."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى بركة معية الله مع الجماعة، متخلصاً من نزعة الاستبداد بالرأي أو حسد الرفاق."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يشارك الفتى في محاكاة \"تحدي أزمة الفريق\"، ويلتزم بتطبيق الشورى، وينجز مهمة ميدانية مشتركة مع أقرانه."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بالسؤال المفاجئ التالي:"},{"t":"p","lvl":0,"h":"<b>\"إذا طُلب منك إنجاز مشروع مدرسي كبير وكان لك الخيار: أن تعمله وحدك وتسهر الليالي لكنك تضمن السيطرة الكاملة.. أو تعمله مع 4 من زملائك وتتحمل نقاشاتهم وخلافاتهم.. أيهما تختار بصراحة؟ ولماذا نشعر دائماً بأن العمل مع الآخرين (وجع رأس)؟ هل العيب في فكرة الفريق، أم في غياب أخلاقيات العمل الجماعي لدينا؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو العباقرة الأربعة والروبوت المنهار)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة العباقرة الأربعة والمشروع المنهار<\/span>"},{"t":"p","lvl":0,"h":"في مسابقة الروبوتات والذكاء الاصطناعي، تشكل فريق من 4 طلاب هم الأذكى في المدرسة:"},{"t":"p","lvl":0,"h":"(مبرمج محترف، مهندس ميكانيكا، مصمم بارع، ومتحدث فصيح)[span_87](start_span)[span_87](end_span)."},{"t":"p","lvl":0,"h":"- عندما بدأ العمل: أصر المبرمج على أن يقود هو وحده ويتحكم في كل صغيرة وكبيرة[span_88](start_span)[span_88](end_span)!"},{"t":"p","lvl":0,"h":"- سخر المهندس من طريقة المصمم، ورفض المصمم ملاحظات المتحدث، وتحول النقاش إلى صراخ وتراشق شخصي[span_89](start_span)[span_89](end_span)!"},{"t":"p","lvl":0,"h":"- يوم التحكيم: انسحب اثنان، ولم يكتمل الروبوت، وقدموا أسوأ مشروع وخرجوا بفضيحة[span_90](start_span)[span_90](end_span)!"},{"t":"p","lvl":0,"h":"في المقابل: فريق آخر من 4 طلاب عاديي الذكاء، لكنهم وزعوا المهام بالشورى، وضعوا آلية لحل أي خلاف باحترام، وتعاونوا بتواضع.. فصنعوا روبوتاً متقناً وفازوا بالمركز الأول[span_91](start_span)[span_91](end_span)!"},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. لماذا يفشل الأذكياء والموهوبون حين تتحكم \"الأنا والنرجسية\" في الفريق؟"},{"t":"p","lvl":0,"h":"2. كيف تتحول مهارة \"إدارة الخلاف وتوزيع الأدوار\" إلى سر النجاح الأكبر في الحياة والعمل؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَالْمُؤْمِنُونَ وَالْمُؤْمِنَاتُ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ ۚ يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنكَرِ﴾<\/span> <span class=\"ayref\">التوبة: 71<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> تقرير مبدأ الولاية والتناصر؛ فالمؤمنون شبكة متماسكة يسند بعضهم بعضاً في ميادين البناء والإصلاح."},{"t":"li","lvl":0,"h":"<b>قوله تعا
