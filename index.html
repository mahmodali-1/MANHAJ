النزيه مصلح، والطبيب الرحيم مصلح، والابن البار مصلح."}]},{"t":"qa","n":"3","q":"\"كيف نحافظ على هذه الأخوة التي نشأت في هذا المنهج طوال السنوات القادمة؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> عبر <b>اللقاءات الشهرية الدورية<\/b>، ومشاريع العمل المشترك، والتواصي المستمر بالحق والصبر في مجموعات التواصل، فالمرء قليل بنفسه كثير بإخوانه."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>رئيس المؤتمر ومقدم الحفل (أحد الفتيان):<\/b> إدارة منصة التتويج وتقديم الفقرات."},{"t":"li","lvl":0,"h":"<b>عريف العروض الميدانية (مقرر من الفتيان):<\/b> تنظيم استعراض المشاريع ومتابعة لوحة الأرقام."},{"t":"li","lvl":0,"h":"<b>لجنة التكريم والشهادات (المربي وممثل الآباء):<\/b> تقليد الأوسمة وتوقيع العهود."},{"t":"li","lvl":0,"h":"<b>منظم البروتوكول والوقت (الميقاتي):<\/b> ضبط أوقات عروض المشاريع (3 دقائق لكل فريق)."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مراسم توقيع ميثاق الاستمرارية والعهد الرسالي (The Lifelong Covenant)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> وثائق الميثاق الرسالي الفاخرة المذهبة، أقلام التوقيع، ودروع التتويج."},{"t":"li","lvl":0,"h":"<b>إجراء المراسم:<\/b>"},{"t":"li","lvl":1,"h":"<i>استعراض مشاريع الأثر (30 دقيقة):<\/i> يقدم كل فريق مشروعه الميداني مستعرضاً الصور والبيانات والنتائج أمام الآباء."},{"t":"li","lvl":1,"h":"<i>قسم الميثاق الجماعي:<\/i> يقف الفتيان ويلقون قسم الميثاق بصوت موحد يهز القاعة:"},{"t":"li","lvl":2,"h":"<i>عهد العبودية:<\/i> الثبات على الصلاة وعفة الخلوات والاستعلاء بالإيمان."},{"t":"li","lvl":2,"h":"<i>عهد البر:<\/i> الوفاء للأهل والخدمة التامة دون تذمر."},{"t":"li","lvl":2,"h":"<i>عهد الأثر:<\/i> تسخير المهارات والتخصصات لنصرة أمة الإسلام وعمارة الأرض."},{"t":"li","lvl":1,"h":"<i>التوقيع والاعتماد:<\/i> يوقع الفتى، ويعتمد والده توقيعه، ويشهد المربي عليه."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: معاذ وخوف الانتكاس بعد الختام<\/span>"},{"t":"p","lvl":0,"h":"معاذ (17 سنة) تغيرت حياته جذرياً خلال الـ 30 لقاءً:"},{"t":"p","lvl":0,"h":"(أصلح صلته بوالديه، ترك مقاطع اللهو والسهر، أتقن مهارة الإلقاء، وقاد مبادرة تنظيف مسجد الحي بنجاح)[span_386](start_span)[span_386](end_span)."},{"t":"p","lvl":0,"h":"- ليلة المؤتمر: أسرّ للمربي بخوفه قائلاً: \"أنا سعيد بما أنجزت، لكنني مرعوب من أن ينتهي البرنامج، فأعود تدريجياً لسلبيتي القديمة وأخسر كل ما بنيته[span_387](start_span)!\"[span_387](end_span)."},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف يعكس خوف معاذ صدقه وحرصه على الاستقامة؟"},{"t":"p","lvl":0,"h":"2. ما \"أنظمة الأمان السلوكية\" التي تحمي معاذ من التراجع والانتكاس في حياته القادمة[span_388](start_span)[span_388](end_span)؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 10 د","افتتاحية المؤتمر والخطاف","كلمة تقديمية وعرض قصة شهادة الحائط وميثاق الأثر."],["10 - 20 د","التأصيل الشرعي الختامي","أدلة صدقوا ما عاهدوا الله عليه، حديث الاستقامة، وخطبة عرفات."],["20 - 50 د","منصة استعراض المشاريع","عروض الفرق لمشاريع الأثر الميداني (3 دقائق لكل فريق)."],["50 - 60 د","مراسم التوقيع والتتويج","توقيع ميثاق الاستمرارية أمام الآباء وتسليم شهادات الجاهزية."],["60 - 68 د","كلمات الآباء والمربين","شهادات أولياء الأمور حول التغيير الملموس في أبنائهم."],["68 - 70 د","الدعاء والصورة التذكارية","دعاء الختام والتقاط الصورة الجماعية التتويجية."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 65-80","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«الثبات والاستمرارية بعد مواسم البناء هما المحك؛ وشرف الانتساب للجيل الصاعد يفرض على الشاب أن يحمل همّ رسالته ولا يعود للوراء أبداً»<\/span>."},{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«الرجولة القرآنية عهد وثبات ممتد حتى الموت: <span class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾<\/span>»<\/span>."},{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 150-165","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«أولوية الأثر الممتد والدائم على العمل المنقطع هي غاية الفقه؛ والبرامج التربوية إنما تقاس بثمارها العملية في حياة الفرد والمجتمع»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 180-192","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الوفاء بالعهود وصدق الاستقامة بعد التزكية هما تاج الأخلاق الإيمانية؛ والرجولة أن تصدق فيما عاهدت الله عليه»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 440-455","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«الاحتفاء بإنجازات الفتيان أمام أهلهم ومجتمعهم يرسخ هويتهم القيادية وينقلهم لمرحلة تحمل المسؤولية الاجتماعية الكاملة»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 230-245","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«ترسيخ الهوية الجديدة يستلزم المحافظة على الأنظمة التراكمية اليومية؛ فأنت لا ترتقي لمستوى أهدافك، بل تنزل لمستوى أنظمتك وعاداتك المستمرة»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>الاستقامة وأثرها في حياة الفرد والمجتمع<\/i> — الشيخ عبد الرزاق البدر <span class=\"pg\">ص 25-60<\/span>."},{"t":"li","lvl":1,"h":"<i>صناعة الأثر وبناء المشاريع المجتمعية<\/i> — د. علي الحمادي <span class=\"pg\">ص 40-85<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تثبت على الحق بعد انتهاء البرامج التربوية؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"فلسفة صناعة الأثر الممتد والجيل الصاعد\" — قناة البناء المنهجي على يوتيوب."}]},{"num":14,"title":"التحدي المستمر الممتد (تحدي العمر)","short":"التحدي المستمر الممتد","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي العمر المستمر: \"ميثاق الجيل الصاعد والرسالة الممتدة\"","sub":"","lines":["المهمة الميدانية المستمرة في مسيرة الحياة:","1. صيانة الحد الأدنى الإيماني (Daily Habits):","[ ] المحافظة الحازمة على الصلوات في وقتها، ورد القرآن، وعفة الخلوات الرقمية دون انقطاع.","2. المبادرة المجتمعية الشهرية:","[ ] إطلاق أو المشاركة في مشروع نفعي يخدم الأهل، المسجد، أو المجتمع مرة كل شهر على الأقل.","3. التواصي وتجديد العهد:","[ ] اللقاء الدوري الشهري مع رفقاء المنهج لمراجعة الأداء وتجديد العهد على الثبات والأثر."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["التحول نحو الاستمرارية","يعود للفتور والعادات القديمة فور انتهاء اللقاءات كأن لم يدرس شيئاً.","يستمر في بعض العادات وينقطع عن أخرى، ويحتاج لدفع وتذكير خارجي.","يثبت على عاداته الإيمانية والمهارية بذاتية وانضباط، وينتقل لدور المصلح."],["المبادرة والأثر الميداني","يعيش سلبياً منكفئاً على ذاته ولا يقدم أي مبادرة لمجتمعه.","يشارك في المبادرات إذا دُعي إليها فقط دون توليد للأفكار.","يقود المبادرات، ويوظف مهاراته لخدمة دينه وأسرته، ويترك أثراً مباركاً."],["الصدق في العهد والهوية","تهتز هويته أمام أول شبهة أو ضغط مجتمعي جديد.","يتذبذب في مواقفه، ويحمل همّ الثبات بمشاعر قلقة غير مستقرة.","رجل راسخ الهوية: <span class=\"ayah\">﴿صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ وَمَا بَدَّلُوا تَبْدِيلًا﴾<\/span>."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: ميثاق الاستمرارية والعهد الرسالي","sub":"","lines":["💡 البوصلة والمفهوم:","اليوم انتهى التدريب وبدأ التكليف الحقيقي! الرحلة لم تكن مجرد دروس تُنسى، بل إعادة صياغة لشخصيتك كرجل مصلح يحمل نور دينه، ويبر أهله، ويتقن مهاراته، ويعمر أرضه. عاهد الله واثبت؛ فالأمة تنتظر عطاءك.","📖 الآية المحورية:","<span class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾<\/span> <span class=\"ayref\">الأحزاب: 23<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«قُلْ: آمَنْتُ بِاللَّهِ، ثُمَّ اسْتَقِمْ!»<\/span> <span class=\"takh\">[صحيح مسلم]<\/span>.","📐 أركان ميثاق الجيل الصاعد الأربعة:","1. عهد العبودية: صلاتي، وردي القرآني، وعفتي الرقمية خط أحمر لا يسقط أبداً.","2. عهد البر والشهامة: أهلي أولى الناس بإحساني ومروءتي ورعايتي وخدمتي.","3. عهد الثغر والمهارة: التفوق في تخصصي وميداني لنصرة أمتي ورفعة رايتها.","4. عهد الأثر: لن أكون متفرجاً؛ بل سأكون فاعلاً مصلحاً مباركاً أينما حللت.","—hr—","🤝 ميثاق التتويج والتخرج:","\"أعاهد الله تعالى على الاستقامة، والثبات على ما تعلمت، وأن أبقى خادماً لديني وأمتي\".","- توقيع الطالب (صاحب العهد): _______________________________________","- توقيع ولي الأمر (الشاهد الأول): ____________________________________","- توقيع المربي المشرف (الشاهد الثاني): ________________________________","—hr—","📝 سجل الاستقامة والمسيرة الممتدة:","[ المحافظة على الفجر والورد ]  [ مبادرة شهرية نافعة ]  [ التواصل مع الرفقة الصالحة ]","(   )                     (   )                      (   )","عهد الفتى المسلم: \"أنا رجلٌ صدق ما عاهد الله عليه، استقامتي ديمة، وأثري ممتد حتى ألقى ربي\"."]}]}]}]}]</script>
<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const UO=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة'];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ico=(n,c='i')=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('mrb:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mrb:'+k,JSON.stringify(v))}catch(e){}}};

// flat lessons
const FLAT=[];D.forEach(u=>u.lessons.forEach((l,i)=>{l.u=u;l.idx=i+1;FLAT.push(l)}));
const byId=id=>FLAT.find(l=>l.id===id);
let done=store.get('done',{});

// ------------ settings -------------
function applyTheme(){const t=store.get('theme','auto');if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  const dark=t==='dark'||(t==='auto'&&!matchMedia('(prefers-color-scheme: light)').matches);$('meta[name=theme-color]').content=dark?'#0D1F22':'#EAF0EE'}
function applyFs(){document.documentElement.style.setProperty('--fs',store.get('fs',17)+'px')}
applyTheme();applyFs();

// ------------ block renderer -------------
function isGroup(h){const t=h.trim();return /^<b>[^]*<\/b>:?$/.test(t)&&!t.slice(3,-4).includes('<b>')&&t.replace(/<[^>]+>/g,'').length<90}
function lines(ls){
  let o='';
  for(let raw of ls){
    if(raw==='—hr—'){o+='<hr>';continue}
    const plain=raw.replace(/<[^>]+>/g,'').trim();
    if(!plain)continue;
    if(/^[\(\)\s]+$/.test(plain))continue;
    const days=plain.match(/\[\s*([^\[\]]{2,12}?)\s*\]/g);
    if(days&&days.length>=5&&plain.replace(/\[[^\]]*\]/g,'').trim()===''){
      o+='<div class="days">'+days.map(d=>`<button type="button"><i></i>${esc(d.replace(/[\[\]]/g,'').trim())}</button>`).join('')+'</div>';continue}
    if(/^-?\s*[.…]{8,}$/.test(plain)){o+='<div class="wl"></div>';continue}
    raw=raw.replace(/[_ـ]{5,}|\.{6,}|…{3,}/g,'<span class="fill"></span>');
    const m=raw.match(/^\s*\[\s?\]\s*(.*)$/);
    if(m){o+=`<div class="ln cb"><span class="box"></span><div>${m[1]}</div></div>`;continue}
    if(/^[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/u.test(plain)||/:$/.test(plain)&&plain.length<60){o+=`<div class="ln k">${raw}</div>`;continue}
    o+=`<div class="ln">${raw.replace(/^-\s+/,'• ')}</div>`;
  }
  return o;
}
function block(b){
  switch(b.t){
    case 'p':{if(isGroup(b.h))return `<h4 class="sub4">${b.h.replace(/<\/?b>/g,'').replace(/:$/,'')}</h4>`;return `<p class="p">${b.h}</p>`}
    case 'li':{const g=isGroup(b.h)&&b.lvl===0;return `<div class="li l${Math.min(b.lvl,3)}${g?' grp':''}"><span class="bul"></span><div>${b.h}</div></div>`}
    case 'kvs':return '<div class="kv">'+b.items.map(([k,v])=>`<div class="${v.length>26?'w':''}"><small>${esc(k)}</small><span>${v}</span></div>`).join('')+'</div>';
    case 'qa':return `<div class="qa"><div class="qq"><span class="qn">${b.n||'؟'}</span><div class="qt2">${b.q}</div></div><div class="ans"><div><div class="pad">${b.a.map(a=>`<div class="li l${Math.min(a.lvl,3)}"><span class="bul"></span><div>${a.h}</div></div>`).join('')}</div></div></div><button class="rev" type="button">${ico('q')}<span>اعرض التفكيك</span></button></div>`;
    case 'timeline':return '<div class="tl">'+b.rows.map(r=>`<div class="st" data-t="${esc(r[0].replace(/<[^>]+>/g,''))}"><div class="tm">${r[0].replace(/<\/?b>/g,'')}</div><div>${r[1]?`<div class="ph">${r[1].replace(/<\/?b>/g,'')}</div>`:''}<div class="ds">${r[2]||''}</div></div></div>`).join('')+'</div>';
    case 'matrix':{const hd=b.head.map(h=>h.replace(/<[^>]+>/g,'').replace(/مستوى|\(|\)/g,'').trim());return '<div class="mx">'+b.rows.map(r=>`<div class="cr"><h5>${r[0].replace(/<\/?b>/g,'')}</h5>${r.slice(1).map((c,i)=>`<div class="lv"><span class="tg">${esc(hd[i+1]||'')}</span><div>${c}</div></div>`).join('')}</div>`).join('')+'</div>'}
    case 'srcs':return '<div class="srcl">'+b.items.map(s=>`<div class="srcitem"><details><summary><span class="bk">${esc(s.short)}<small>${esc(s.cite)}</small></span><span class="chev"></span></summary><div class="q">${s.q}</div></details></div>`).join('')+'</div>';
    case 'card':return `<div class="sheet"><button class="pbtn" type="button" aria-label="طباعة البطاقة">${ico('print')}</button>${b.title?`<div class="sh"><b>${b.title}</b>${b.sub?`<small>${b.sub}</small>`:''}</div>`:''}${lines(b.lines)}</div>`;
    case 'table':return '<div class="tbw"><table class="tb">'+b.rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</table></div>';
  }
  return '';
}
function badge(n,cls=''){return `<span class="sbadge ${cls}"><svg><use href="#star8"/></svg><span>${n}</span></span>`}
function splitTitle(t){const m=t.match(/^(.*?)\s*\((.*)\)\s*(.*)$/);if(m&&m[1].length>3)return [m[1].replace(/—.*$/,'').trim(),m[2]+(m[3]?' '+m[3]:'')];const d=t.split(/\s—\s/);return [d[0],d.slice(1).join(' — ')]}
function secBody(s){
  const inner=s.blocks.map(block).join('');
  if(s.kind==='sources'){
    const n=s.blocks.reduce((a,b)=>a+(b.t==='srcs'?b.items.length:(b.t==='li'&&!isGroup(b.h)?1:0)),0);
    return `<details class="srcsec"><summary>${ico('book','i ic')}<span class="t"><b>اضغط لعرض المصادر</b><small>${n} مرجعاً ووسيطاً؛ مخفية لتبقى الشاشة نظيفة أثناء الشرح</small></span><span class="chev"></span></summary><div class="in">${inner}</div></details>`}
  if(s.kind==='handout'||(s.blocks.length===1&&s.blocks[0].t==='card'))return inner;
  return `<div class="body">${inner}</div>`;
}
function enhance(root){
  $$('.ayah,.hadith',root).forEach(e=>{if(e.textContent.length>44&&!e.closest('details.src.inl blockquote')){e.classList.add('blk');let n=e.nextSibling;while(n&&n.nodeType===3&&!n.textContent.trim())n=n.nextSibling;if(n&&n.nodeType===1&&n.classList.contains('ayref'))n=n.nextSibling;if(n&&n.nodeType===3&&/^\s*\.\s*$/.test(n.textContent))n.textContent=''}});
}

// ------------ top bar -------------
function top(html){$('#topRow').innerHTML=html}
function setTab(t){$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t))}

// ------------ views -------------
const app=$('#app');
function render(html){app.innerHTML=`<div class="view">${html}</div>`;enhance(app);window.scrollTo(0,0)}

function viewHome(){
  document.body.className='';
  top(`<div class="brand"><svg class="star"><use href="#khatam"/></svg>دليل المربي</div><div style="flex:1"></div><button class="ibtn" data-act="theme" aria-label="تبديل المظهر">${ico('sun')}</button>`);
  setTab('home');$('#progBar').style.width='0';
  const last=byId(store.get('last',''));
  const total=FLAT.length, dn=FLAT.filter(l=>done[l.id]).length;
  let h=`<div class="wrap"><section class="hero"><svg class="khatam"><use href="#khatam"/></svg><svg class="khatam2"><use href="#khatam"/></svg>
  <h1><span>الدليل التشغيلي والتأصيلي</span>منهج بناء الفتى المسلم</h1>
  <p>مرجعك أثناء التحضير وفي القاعة: كل لقاء بخطواته، ونصوصه، وأنشطته، ومصادره في مكان واحد.</p>
  <div class="facts"><div class="fact"><b>${D.length}</b>وحدات</div><div class="fact"><b>${total}</b>لقاءً</div><div class="fact"><b>70</b>دقيقة لكل لقاء</div></div></section>`;
  if(last)h+=`<a class="resume u-${last.u.c}" href="#/l/${last.id}"><div class="t"><small>تابع من حيث توقفت</small><b>${esc(last.title)}</b><small>الوحدة ${UO[last.u.n-1]}، اللقاء ${last.ordinal}</small></div><span class="go">${ico('prev')}</span></a>`;
  h+=`<div class="h2">الوحدات</div><div class="units">`;

// ------------ timer -------------
const T={on:false,run:false,acc:0,st:0,lesson:null};
function phases(l){const tl=l.sections.flatMap(s=>s.blocks.filter(b=>b.t==='timeline'))[0];if(!tl)return[];return tl.rows.map(r=>{const m=r[0].replace(/<[^>]+>/g,'').match(/(\d+)\s*-\s*(\d+)/);const name=(r[1]||r[2]).replace(/<[^>]+>/g,'');return m?{a:+m[1],b:+m[2],name:name.split(/[.؛،]/)[0],key:r[0].replace(/<[^>]+>/g,'')}:null}).filter(Boolean)}
function elapsed(){return T.acc+(T.run?Date.now()-T.st:0)}
function startTimer(){if(!curLesson)return;if(!T.on||T.lesson!==curLesson.id){T.on=true;T.acc=0;T.lesson=curLesson.id}T.run=true;T.st=Date.now();$('#timer').classList.add('on');tick()}
function tick(){if(!T.on)return;const ms=elapsed(),m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;const l=byId(T.lesson);const ph=phases(l).find(p=>m>=p.a&&m<p.b);
  $('#tv').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('#tp').textContent=ph?ph.name:(m>=70?'انتهى زمن اللقاء':'');
  $('#tPlay').innerHTML=ico(T.run?'pause':'play');markTimeline(ph);$('#pT')&&presTitle();}
function markTimeline(ph){if(!T.on||!curLesson||T.lesson!==curLesson.id){$$('.tl .st.now').forEach(x=>x.classList.remove('now'));return}
  if(ph===undefined){const m=Math.floor(elapsed()/60000);ph=phases(curLesson).find(p=>m>=p.a&&m<p.b)}
  $$('.tl .st').forEach(x=>x.classList.toggle('now',!!ph&&x.dataset.t===ph.key))}
setInterval(()=>{if(T.on&&T.run)tick()},1000);
$('#tPlay').onclick=()=>{if(T.run){T.acc=elapsed();T.run=false}else{T.run=true;T.st=Date.now()}tick()};
$('#tStop').innerHTML=ico('stop');$('#tStop').onclick=()=>{T.on=false;T.run=false;$('#timer').classList.remove('on');markTimeline()};

const PX={bg:'0D1F22',sf:'14302F',sf2:'1A3A3A',gold:'D8B46A',gold2:'F0D49A',text:'EDE6D6',text2:'C9C3B4',muted:'8FA6A1',mint:'74D2B4',line:'2A4644'};

const clean=s=>s.replace(/\s+/g,' ').replace(/\s+([،؛.:!؟])/g,'$1').trim();
// html -> runs; source dropdowns go to notes
function runsOf(html,notes){
  const d=document.createElement('div');d.innerHTML=html;
  d.querySelectorAll('details.src').forEach(x=>{const sum=clean(x.querySelector('summary').textContent.replace('❖',''));const q=x.querySelector('blockquote'),c=x.querySelector('cite');notes.push(sum+(q?'\n«'+clean(q.textContent)+'»':'')+(c&&q?'\n('+clean(c.textContent)+')':(c?' '+clean(c.textContent):'')));x.remove()});
  const runs=[];
  (function walk(n,st){n.childNodes.forEach(c=>{if(c.nodeType===3){if(c.textContent)runs.push({t:c.textContent,...st})}else if(c.nodeType===1){const s={...st};const cl=c.classList;
    if(c.tagName==='B'||c.tagName==='STRONG')s.b=true;if(c.tagName==='I')s.color=PX.gold2;
    if(cl.contains('ayah')){s.color=PX.gold;s.b=false}if(cl.contains('hadith'))s.color=PX.mint;if(cl.contains('ayref')||cl.contains('takh')||cl.contains('pg')){s.color=PX.muted;s.sz=0.8}
    if(cl.contains('ayref')){runs.push({t:' [',...s});walk(c,s);runs.push({t:']',...s});return}
    if(cl.contains('fill')){runs.push({t:' ..............................',...s});return}
    walk(c,s)}})})(d,{});
  // merge + normalize whitespace
  const out=[];runs.forEach(r=>{r.t=r.t.replace(/\s+/g,' ');const p=out[out.length-1];if(p&&p.b===r.b&&p.color===r.color&&p.sz===r.sz)p.t+=r.t;else out.push(r)});
  if(out.length){out[0].t=out[0].t.replace(/^\s+/,'');out[out.length-1].t=out[out.length-1].t.replace(/\s+$/,'')}
  return out.filter(r=>r.t);
}
function parasOf(sec,notes){
  const P=[];
  const add=(html,o={})=>{const r=runsOf(html,notes);if(r.length)P.push({runs:r,...o})};
  sec.blocks.forEach(b=>{
    if(b.t==='p')add(b.h,{head:isGroup(b.h)});
    else if(b.t==='li')add(b.h,{lvl:b.lvl,bullet:!(isGroup(b.h)&&b.lvl===0),head:isGroup(b.h)&&b.lvl===0});
    else if(b.t==='card'){if(b.title)P.push({runs:[{t:clean(b.title.replace(/<[^>]+>/g,'')),b:true,color:PX.gold}],center:true});
      b.lines.forEach(l=>{if(l==='—hr—')return;const pl=l.replace(/<[^>]+>/g,'').trim();if(!pl||/^[\(\)\s]+$/.test(pl))return;
        const days=pl.match(/\[\s*([^\[\]]{2,12}?)\s*\]/g);if(days&&days.length>=5&&pl.replace(/\[[^\]]*\]/g,'').trim()===''){P.push({runs:[{t:days.map(x=>'☐ '+x.replace(/[\[\]]/g,'').trim()).join('    '),color:PX.text2}]});return}
        let h=l.replace(/[_ـ]{5,}|\.{6,}|…{3,}/g,'<span class="fill"></span>').replace(/^\s*\[\s?\]\s*/,'☐ ');
        const k=/^[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/u.test(pl)||(/:$/.test(pl)&&pl.length<60);
        const r=runsOf(h,notes);if(k)r.forEach(x=>{x.b=true;x.color=x.color||PX.gold});if(r.length)P.push({runs:r})})}
    else if(b.t==='kvs')b.items.forEach(([k,v])=>P.push({runs:[{t:k+': ',b:true,color:PX.gold},{t:clean(v.replace(/<[^>]+>/g,''))}],bullet:true}));
  });
  return P;
}
function paraLen(p){return p.runs.reduce((a,r)=>a+r.t.length,0)+40}
function chunk(P,budget){const out=[];let cur=[],n=0;P.forEach(p=>{const L=paraLen(p);if(cur.length&&n+L>budget&&!(cur.length===1&&cur[0].head)){let carry=[];while(cur.length>1&&cur[cur.length-1].head)carry.unshift(cur.pop());out.push(cur);cur=carry;n=carry.reduce((a,x)=>a+paraLen(x),0)}if(cur.length&&cur[cur.length-1].head&&n+L>budget*1.25){/* keep head with next */}cur.push(p);n+=L});if(cur.length)out.push(cur);return out}
function textObjs(P,fs){const T=[];P.forEach((p,pi)=>{p.runs.forEach((r,ri)=>{const o={fontFace:'Tajawal',fontSize:Math.round(fs*(r.sz||1)),color:r.color||PX.text,bold:!!r.b||!!p.head,rtlMode:true,lang:'ar-SA',align:p.center?'center':'right',paraSpaceAfter:p.head?4:8,lineSpacingMultiple:1.2};
  if(p.head&&!r.color)o.color=PX.acc;
  if(p.bullet){o.bullet={indent:14};o.indentLevel=Math.min(p.lvl||0,3)}
  if(ri===p.runs.length-1&&pi<P.length-1)o.breakLine=true;T.push({text:r.t,options:o})})});return T}
async function exportLesson(l){
  if(DL===null){toast('التصدير غير متاح في هذا العرض');return}
  toast('جارٍ تجهيز السلايدات…',0);
  try{await loadPptx()}catch(e){toast('تعذّر تحميل أداة التصدير. تحقق من الاتصال وحاول مجدداً.');return}
  const acc=UACC[l.u.c]||PX.gold;PX.acc=acc;
  const pptx=new PptxGenJS();pptx.layout='LAYOUT_WIDE';pptx.rtlMode=true;pptx.title=l.title;pptx.author='دليل المربي';
  const W=13.333,H=7.5;
  const tb=(s,text,o)=>s.addText(text,{isTextBox:true,fontFace:'Tajawal',rtlMode:true,lang:'ar-SA',align:'right',valign:'top',margin:0,...o});

    {text:{text:l.title+'  |  الوحدة '+UO[l.u.n-1]+'، اللقاء '+l.ordinal,options:{isTextBox:true,x:0.6,y:H-0.5,w:9.5,h:0.3,fontFace:'Tajawal',fontSize:10,color:PX.muted,align:'right',rtlMode:true,margin:0}}}],
    slideNumber:{x:0.5,y:H-0.52,w:0.6,h:0.3,fontFace:'Tajawal',fontSize:10,color:PX.muted}});
  // cover
  let s=pptx.addSlide();s.background={color:PX.bg};
  s.addShape(pptx.ShapeType.star8,{x:-2.4,y:-1.2,w:7.4,h:7.4,fill:{color:PX.bg},line:{color:PX.gold,width:1.2,transparency:55}});
  s.addShape(pptx.ShapeType.star8,{x:-1.2,y:0,w:5,h:5,fill:{color:PX.bg},line:{color:acc,width:1,transparency:60}});
  s.addShape(pptx.ShapeType.rect,{x:W-0.12,y:0,w:0.12,h:H,fill:{color:acc}});
  tb(s,'الوحدة '+UO[l.u.n-1]+': '+l.u.title,{x:4.8,y:1.5,w:7.9,h:0.5,fontSize:16,color:acc,bold:true});
  tb(s,'اللقاء '+l.ordinal,{x:4.8,y:2.05,w:7.9,h:0.5,fontSize:18,color:PX.gold});
  tb(s,l.title,{x:4.8,y:2.65,w:7.9,h:1.6,fontSize:40,bold:true,color:PX.text,valign:'middle',fit:'shrink'});
  if(l.sub)tb(s,l.sub,{x:4.8,y:4.35,w:7.9,h:1.1,fontSize:18,color:PX.text2});
  tb(s,'الفئة المستهدفة: الفتيان 15–18 سنة     المدة: 70 دقيقة',{x:4.8,y:6.3,w:7.9,h:0.4,fontSize:13,color:PX.muted});
  const secs=l.sections.filter(x=>!x.hide);
  // agenda
  const tl=secs.flatMap(x=>x.blocks.filter(b=>b.t==='timeline'))[0];
  const head=(sl,num,title,cont)=>{sl.addShape(pptx.ShapeType.star8,{x:W-1.35,y:0.42,w:0.78,h:0.78,fill:{color:PX.sf},line:{color:acc,width:1.5}});
    tb(sl,String(num),{x:W-1.35,y:0.42,w:0.78,h:0.78,align:'center',valign:'middle',fontSize:18,bold:true,color:acc});
    tb(sl,title+(cont?'  (تابع)':''),{x:0.6,y:0.45,w:W-2.2,h:0.75,fontSize:26,bold:true,color:PX.text,valign:'middle',fit:'shrink'});
    sl.addShape(pptx.ShapeType.line,{x:W-4.6,y:1.32,w:3.25,h:0,line:{color:acc,width:2}})};
  const strip=h=>clean(String(h).replace(/<[^>]+>/g,' '));
  const tcell=(t,o={})=>({text:t,options:{fontFace:'Tajawal',fontSize:13,color:PX.text,align:'right',rtlMode:true,valign:'middle',...o}});
  const allNotes=[];
  secs.forEach(sec=>{
    const [ta]=splitTitle(sec.title);
    if(sec.kind==='sources'){sec.blocks.forEach(b=>{if(b.t==='srcs')b.items.forEach(x=>allNotes.push({short:x.short,full:x.cite+'\n«'+clean(x.q.replace(/<[^>]+>/g,''))+'»'}));else if(b.t==='li'&&!isGroup(b.h))allNotes.push({short:strip(b.h),full:''})});return}
    const tbl=sec.blocks.find(b=>b.t==='timeline'||b.t==='matrix');
    if(tbl&&tbl.t==='timeline'){const sl=pptx.addSlide({masterName:'M'});head(sl,sec.num,ta);
      const rows=[[tcell('الإجراء',{bold:true,color:acc}),tcell('الفقرة',{bold:true,color:acc}),tcell('الزمن',{bold:true,color:acc,align:'center'})]].concat(tbl.rows.map(r=>[tcell(strip(r[2])),tcell(strip(r[1]),{bold:true}),tcell(strip(r[0]),{align:'center',bold:true,color:PX.gold})]));
      sl.addTable(rows,{x:0.6,y:1.6,w:W-1.4,colW:[7.4,2.6,1.93],border:{type:'solid',pt:0.75,color:PX.line},fill:{color:PX.sf},rowH:0.55,autoPage:false});return}
    if(tbl&&tbl.t==='matrix'){const sl=pptx.addSlide({masterName:'M'});head(sl,sec.num,ta);
      const hd=tbl.head.map(strip);const lvC=['F08C7C',PX.gold,PX.mint];
      const rows=[[3,2,1].map(i=>tcell(hd[i]||'',{bold:true,color:lvC[i-1],fontSize:12})).concat([tcell(hd[0],{bold:true,color:acc,fontSize:12})])].concat(tbl.rows.map(r=>[tcell(strip(r[3]),{fontSize:11}),tcell(strip(r[2]),{fontSize:11}),tcell(strip(r[1]),{fontSize:11}),tcell(strip(r[0]),{bold:true,fontSize:12})]));
      sl.addTable(rows,{x:0.6,y:1.6,w:W-1.4,colW:[3.3,3.3,3.3,2.03],border:{type:'solid',pt:0.75,color:PX.line},fill:{color:PX.sf},valign:'top',autoPage:false});return}
    const qas=sec.blocks.filter(b=>b.t==='qa');
    if(qas.length){qas.forEach((q,qi)=>{const notes=[];const sl=pptx.addSlide({masterName:'M'});head(sl,sec.num,ta+' — السؤال '+(q.n||qi+1));

      const ap=q.a.map(a=>({runs:runsOf(a.h,notes),lvl:a.lvl,bullet:false}));
      sl.addText(textObjs(ap,16),{isTextBox:true,x:0.6,y:3.1,w:W-1.4,h:3.8,valign:'top',margin:0,fit:'shrink'});
      if(notes.length)sl.addNotes('المصادر:\n'+notes.join('\n\n'))});return}
    const notes=[];const P=parasOf(sec,notes);if(!P.length)return;
    const isCard=sec.blocks.some(b=>b.t==='card');const fs=isCard?17:20;
    const parts=chunk(P,isCard?1150:1000);
    parts.forEach((part,pi)=>{const sl=pptx.addSlide({masterName:'M'});head(sl,sec.num,ta,pi>0);
      if(isCard)sl.addShape(pptx.ShapeType.roundRect,{x:0.5,y:1.5,w:W-1.2,h:5.35,fill:{color:PX.sf},line:{color:PX.gold,width:1,transparency:40},rectRadius:0.15});
      sl.addText(textObjs(part,fs),{isTextBox:true,x:isCard?0.8:0.6,y:isCard?1.7:1.6,w:W-(isCard?1.8:1.4),h:isCard?5:5.2,valign:'top',margin:0,fit:'shrink'});
      if(pi===parts.length-1&&notes.length)sl.addNotes('المصادر والاقتباسات (للمعلم):\n\n'+notes.join('\n\n'))});
  });
  if(allNotes.length){const per=11;for(let i=0;i<allNotes.length;i+=per){const sl=pptx.addSlide({masterName:'M'});const g=allNotes.slice(i,i+per);
    head(sl,'✦','المراجع والمصادر',i>0);
    sl.addText(textObjs(g.map(x=>({runs:[{t:x.short,color:PX.text2}],bullet:true})),14),{isTextBox:true,x:0.6,y:1.6,w:W-1.4,h:5.2,valign:'top',margin:0});
    sl.addNotes(g.map(x=>x.short+(x.full?'\n'+x.full:'')).join('\n\n'))}}
  // closing
  s=pptx.addSlide();s.background={color:PX.bg};s.addShape(pptx.ShapeType.star8,{x:W/2-1.6,y:1.2,w:3.2,h:3.2,fill:{color:PX.bg},line:{color:PX.gold,width:1.2}});
  tb(s,'عهد الفتى المسلم',{x:1,y:4.7,w:W-2,h:0.6,align:'center',fontSize:26,bold:true,color:PX.gold});
  tb(s,'«أنا شاب مسلم ابن أمة رسالية، أبني نفسي لبنةً لبنةً بثبات ويقين»',{x:1,y:5.35,w:W-2,h:0.8,align:'center',fontSize:18,color:PX.text2});
  const name=('اللقاء '+l.ordinal+' - '+l.title).replace(/[\\/:*?"<>|]/g,'').slice(0,90)+'.pptx';
  let blob;try{const raw=await pptx.write({outputType:'blob'});blob=new Blob([raw],{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'})}catch(e){toast('تعذّر إنشاء الملف.');return}
  if(DL===undefined&&window.claude){try{DL=await window.claude.use('downloads')}catch(e){DL=null}}
  if(DL&&DL!=='native'){toast('اختر «حفظ» لتنزيل الملف',3000);try{await DL.save({filename:name,data:blob});toast('تم حفظ السلايدات')}catch(e){const c=e&&e.code;toast(c==='declined'?'أُلغي الحفظ':c==='rate_limited'?'هناك نافذة حفظ مفتوحة بالفعل':'تعذّر حفظ الملف في هذا العرض')}}
  else if(DL==='native'){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل السلايدات')}
  else toast('التصدير غير متاح في هذا العرض');
}
