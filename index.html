دِينِ خَلِيلِهِ، فَلْيَنْظُرْ أَحَدُكُمْ مَنْ يُخَالِلُ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>سنن أبي داود: كتاب الأدب، باب من يؤمر أن يجالس، برقم 4833؛ وجامع الترمذي: كتاب الزهد، برقم 2378 وقال: حسن غريب؛ ومسند أحمد برقم 8417، وحسنه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":0,"h":"<b>حديث التوبة (قاتل المائة نفس):<\/b> ووصية العالم له: <span class=\"qt\">«انْطَلِقْ إِلَى أَرْضِ كَذَا وَكَذَا، فَإِنَّ بِهَا أُنَاسًا يَعْبُدُونَ اللهَ فَاعْبُدِ اللهَ مَعَهُمْ، وَلاَ تَرْجِعْ إِلَى أَرْضِكَ فَإِنَّهَا أَرْضُ سَوْءٍ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح مسلم: كتاب التوبة، باب قبول توبة القاتل، برقم 2766<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الهندسي:<\/i> لم يفصل العالم التائب عن بيئته القديمة ببرنامج وعظي شفهي، بل اشترط <b>تغيير الجغرافيا والمحيط<\/b>؛ لأن البيئة القديمة تعيد إحياء العادات السلبية."},{"t":"li","lvl":0,"h":"<b>حديث الاستعاذة من الفتن:<\/b> قال النبي ﷺ: <span class=\"hadith\">«مَنْ سَمِعَ بِالدَّجَّالِ فَلْيَنْأَ عَنْهُ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>سنن أبي داود: كتاب الملاحم، باب خروج الدجال، برقم 4319، وصححه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الوقائي:<\/i> الفرار من الفتنة وتطهير البيئة هو الأصل، وليس تعريض النفس للاختبار استعلاءً بالقوة الموهومة."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف مصعب بن عمير رضي الله عنه:<\/b> هجرته من بيئة الترف والجاهلية في مكة إلى بيئة الأنصار في المدينة لبناء واقع إيماني جديد."},{"t":"li","lvl":0,"h":"<b>تأسيس النبي ﷺ للمسجد والسوق بالمدينة:<\/b> إدراك نبوي لأهمية هندسة المكان والمحيط؛ فالمسجد بيئة للعبادة والأخوة، وسوق المسلمين بيئة للاستقلال الاقتصادي والانفكاك عن بيئة الربا والاحتكار."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: خديعة قوة الإرادة وقوانين هندسة المحفزات<\/b>"},{"t":"li","lvl":0,"h":"ذوو \"الانضباط العالي\" ليسوا خارقين يصارعون المغريات طوال يومهم، بل هم <b>مهندسون أذكياء لبيئاتهم<\/b> يتواجدون أقل بكثير في مواطن الإغراء."},{"t":"li","lvl":0,"h":"<b>قواعد تصميم الإشارات:<\/b>"},{"t":"li","lvl":1,"h":"<i>لبناء عادة حسنة:<\/i> اجعل الإشارة مرئية ومباشرة (المصحف مفتوحاً على المكتب، الحذاء الرياضي أمام الباب)."},{"t":"li","lvl":1,"h":"<i>لقطع عادة سيئة:<\/i> اجعل الإشارة خفية وبعيدة المنال (الهاتف في غرفة أخرى، إيقاف الإشعارات)."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: الجليس الرقمي والعدوى السلوكية الخفية<\/b>"},{"t":"li","lvl":0,"h":"الشاب اليوم ليس نتاج رفاق المدرسة فقط، بل هو <b>نتاج الحسابات الخمسة الأكثر متابعة في هاتفه!<\/b> المدخلات الرقمية تعيد برمجة مستويات الدوبامين، وتصنع المعايير الذهنية لما هو طبيعي أو منكر دون وعي مباشر."},{"t":"p","lvl":0,"h":"<b>المحور الثالث: هندسة الحيز المكاني المصغر (Micro-Environment Design)<\/b>"},{"t":"li","lvl":0,"h":"قاعدة: <b>\"مكان واحد لسياق واحد\"<\/b>."},{"t":"li","lvl":0,"h":"لا تمزج بيئة الراحة ببيئة الجد؛ فالسرير للنوم حصراً، والمكتب للتعلم والمطالعة فقط، ليربط الدماغ تلقائياً بين الدخول في الحيز والبدء في السلوك المطلوب."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"هل تعني هندسة البيئة اعتزال زملاء المدرسة وقطع العلاقات معهم إن قصروا في الصلاة؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هناك فارق جوهري بين <b>\"صديق الملازمة والتأثير\"<\/b> وبين <b>\"زميل البر والمعاملة والدعوة\"<\/b>. لا تعادهم أو تستعلِ عليهم، لكن انقلهم من دائرة الخلطة اليومية المقربة التي تصوغ أفكارك، إلى دائرة الزمالة الطيبة والدعوة بالتي هي أحسن."}]},{"t":"qa","n":"2","q":"\"أعيش في مساحة منزلية ضيقة ومزدحمة، فكيف أهندس بيئتي؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هندسة البيئة تبدأ من الحيز الصغير الخاص بك (Micro-Space): زاوية محددة ترتبها، طاولة في مكتبة عامة أو زاوية هادئة في المسجد، واستخدام سماعة لحجب الضوضاء. الأهم من ذلك: بيئتك الرقمية في هاتفك تحت سيطرتك التامة 100%."}]},{"t":"qa","n":"3","q":"\"أليس إخفاء التطبيقات أو الألعاب نوعاً من الضعف؟ ألا ينبغي للشاب أن يدرب نفسه على المقاومة المباشرة؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هذا فخ الكبر النفسي؛ الشريعة الإسلامية قامت على أصل <b>\"سد الذرائع والفرار من مواطن الفتنة\"<\/b>. استنزاف طاقتك العقلية في مقاومة إغراء متواصل يجعلك منهكاً وعاجزاً عن الإنجاز. إبعاد المشتت ذكاء ورجولة وحماية لمستقبلك."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>الميسر الشاب:<\/b> قيادة النقاش حول معضلة أمين."},{"t":"li","lvl":0,"h":"<b>المدوّن:<\/b> كتابة قواعد \"جعل الإشارة مرئية / خفية\" على السبورة."},{"t":"li","lvl":0,"h":"<b>المعارض (محامي الشيطان):<\/b> إثارة حجة \"أنا أملك إرادة حديدية ولا تؤثر بي البيئة\"."},{"t":"li","lvl":0,"h":"<b>ضابط الوقت (الميقاتي):<\/b> متابعة دقائق الجلسة."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر إعادة تصميم البيئة والهاتف (Before &amp; After)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة تصميم البيئة الرقمية والمكانية."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b> توزيع نموذج ورقي لـ \"شاشة هاتف مفخخة بالمشتتات\" و\"مكتب فوضوي\"، ويطلب من الفتيان تصميمهما بالنمط الجديد:"},{"t":"li","lvl":1,"h":"إبعاد تطبيقات الترفيه وإخفاؤها في المجلد الأخير."},{"t":"li","lvl":1,"h":"قصر الشاشة الأولى على: القرآن، الملاحظات، والمنبه التعليمي."},{"t":"li","lvl":1,"h":"تحديد مكان شحن الهاتف خارج غرفة النوم طوال الليل."},{"t":"li","lvl":1,"h":"تجهيز كتب الدرس والمصحف على المكتب قبيل النوم."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: عمار وشاشة التيك توك<\/span>"},{"t":"p","lvl":0,"h":"عمار (17 سنة) شاب متفوق، يعاني أنه كلما جلس للمذاكرة، يجد نفسه بعد دقائق يفتح تطبيق مقاطع الفيديو القصيرة وينتقل بينها لساعتين متواصلتين دون وعي!"},{"t":"p","lvl":0,"h":"حاول تثبيت تطبيق لقفل الشاشة لكنه يمسحه فور شعوره بالملل. عند فحص بيئته الرقمية تبيّن:"},{"t":"p","lvl":0,"h":"- التطبيق موجود في الصفحة الرئيسية الأولى لهاتفه."},{"t":"p","lvl":0,"h":"- إشعارات المقترحات تنبثق باستمرار."},{"t":"p","lvl":0,"h":"- حسابه يتابِع قنوات تعرض محتوى سريعاً ومحفزاً للدوبامين."},{"t":"p","lvl":0,"h":"الأسئلة للنقاش:"},{"t":"p","lvl":0,"h":"1. كيف سلب التصميم الرقمي إرادة عمار؟"},{"t":"p","lvl":0,"h":"2. ضع خطة بيئية من 3 إجراءات تجعل عادة التصفح لدى عمار \"خفية وصعبة الوصول للغاية\"."}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","مقارنة الشاب (أ) والشاب (ب) في ضبط الحيز الشخصي."],["05 - 15 د","الخطاف الحواري","نقاش معضلة أمين والغرفة المفخخة."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","أدلة الصحبة، الجليس الصالح، وقاتل المائة، وقوانين السلوك."],["30 - 45 د","المختبر ودراسة الحالة","تمرين تصميم الشاشة والمكتب ودراسة حالة عمار."],["45 - 55 د","بنك الأسئلة الجدلية","معالجة شبهات المقاومة الذاتية وضيق المكان والاعتزال."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة التطهير البيئي الشخصية."],["65 - 70 د","الختام والتقييم","مراجعة النقاط الختامية وتوزيع الأدوار للقاء المقبل."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 86","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«اجعل الإشارات الخاصة بالعادات الحسنة واضحة ومرئية... إن تحسين البيئة يجعلك سيد بيئتك ومشكّلاً لحياتك»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 96","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«الأشخاص الذين يتمتعون بضبط نفس عالٍ يقضون وقتاً أقل في البيئات المغرية، وتجنب الفتنة أسهل بكثير من مقاومتها»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 97","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«اجعل الإشارة خفية... إن القضاء على العادة السيئة يتطلب تقليل التعرض للإشارة التي تتسبب فيها»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 92","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«يؤثر الرفاق السيئون في إدراك المراهق للأشياء، وهذا التأثير يكون متدرجاً ومتعاضداً... وتتسع الفجوة بينه وبين محيطه»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 78-79","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«الفراغ وسوء تنظيم البيئة والوقت هما المشرط الذي يبتر قدرات المراهق ويجعله عرضة للضياع»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 54","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«من أكبر عوائق الجيل الصاعد عن تحقيق التميز والبناء الفكري السليم: حالة الشتات المعرفي والسيولة الرقمية»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 37","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«فكم من متحمس في نقاش أصحاب الشبهات ومخالطة بيئاتهم وهو غير مبني بناء صحيحاً كانت عاقبته خسارة وضياعاً»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 168","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«إن اختيار الخليل والصاحب الصالح هو أس المراهقة الرشيدة، وإن التهاون في بيئة الأقران يهدد البناء التربوي»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 112","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الجليس الصالح يبني فيك الإيمان والأخلاق دون أن تدري، والجليس السوء يهدمك دون أن تشعر»<\/span>."},{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 142","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«إن تقديم الواجبات وحماية الأولويات تتطلب حماية البيئة المعنوية والمكانية من المشتتات واللغو»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 62","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«كان العلماء أشد شيء حرصاً على بيئاتهم وأوقاتهم، فيفرون من المشتتات وفضول المخالطة فرارهم من الأسد»<\/span>."},{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«رجال القرآن هم الذين يتسامون عن المحيط المادي الضيق، ولا تلهيهم المشتتات عن قيادة أنفسهم وأمتهم»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>العمل العميق (Deep Work)<\/i> — كال نيوبورت (فصل: قواعد التخلص من شبكات التواصل الاجتماعي وتصميم البيئة الخالية من التشتت، ص 155-180)."},{"t":"li","lvl":1,"h":"<i>العادات السبع للفتيان الأكثر فعالية<\/i> — شون كوفي (العادة الأولى: كن مبادراً وسيداً لبيئتك ومحيطك، ص 45-62)."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع توعوي تفاعلي:<\/b> \"كيف تهندس بيئتك الرقمية وتتخلص من إدمان الشاشات؟\" — قناة <i>دروس أونلاين<\/i> على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي:<\/b> \"خطورة القرناء وأثر البيئة في تشكيل شخصية الشاب\" — د. عثمان الخميس على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني (تطهير البيئة الرقمية والمكانية)","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"عملية التطهير البيئي الثلاثية\"","sub":"","lines":["المهمة الميدانية المطلوبة:","1. تطهير البيئة الرقمية:","[ ] إلغاء متابعة 5 حسابات تافهة أو ملوثة للفكر والوقت.","[ ] إغلاق الإشعارات تماماً لجميع تطبيقات الألعاب والتواصل.","[ ] نقل تطبيقات الترفيه إلى المجلد الأخير وإخفاء إشاراتها.","2. تطهير البيئة المكانية:","[ ] شحن الهاتف خارج غرفة النوم طوال أيام الأسبوع دون استثناء.","[ ] ترك المصحف وكتاب المذاكرة مفتوحين على المكتب قبل النوم.","3. تطهير البيئة الاجتماعية:","[ ] اختيار \"صديق مبادرة\" واحد للمتابعة والتواصي بالحق أسبوعياً."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الوعي بضبط البيئة","يعتمد كلياً على الإرادة ويحتفظ بالمشتتات في متناول يده.","يدرك أثر البيئة نظرياً ويتردد في إبعاد الهاتف أو حجب المشتتات.","يمارس &quot;الهندسة الوقائية&quot; بصرامة؛ جاعلاً المشتت خفياً وشاقاً."],["إدارة المساحة الرقمية","يستجيب للإشعارات فوراً وينساق خلف المقاطع السريعة.","يغلق بعض الإشعارات أوقات المذاكرة ثم يعيد فتحها.","يلغي إشعارات التطبيقات نهائياً، ويصمم شاشة هاتفه وفق أولوياته."],["انتقاء الرفقة والمحيط","ينساق خلف أقران الغفلة على حساب أولوياته وصلاته.","يتجنب مجالس السوء المباشرة لكنه يسايرهم في الفضاء الرقمي.","ينتقي صحبته بعناية، ويرتبط بـ &quot;رفيق مبادرة&quot; يعينه على الطاعة والجد."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: هندسة البيئة والمحيط","sub":"","lines":["💡 البوصلة والمفهوم:","إرادتك طاقة محدودة تستهلكها المغريات! الشاب الحكيم لا يقف في مهب الفتن بصدرٍ مكشوف بدعوى الصمود، بل \"يهندس محيطه\". اجعل طريق الخير مرئياً وسهلاً أمام ناظريك، واجعل طريق الغفلة خفياً وشاقاً بعيداً عن يدك.","📖 الآية المحورية:","<span class=\"ayah\">﴿وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ﴾<\/span> <span class=\"ayref\">الكهف: 28<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«انْطَلِقْ إِلَى أَرْضِ كَذَا وَكَذَا، فَإِنَّ بِهَا أُنَاسًا يَعْبُدُونَ اللهَ فَاعْبُدِ اللهَ مَعَهُمْ، وَلاَ تَرْجِعْ إِلَى أَرْضِكَ فَإِنَّهَا أَرْضُ سَوْءٍ»<\/span> <span class=\"takh\">[صحيح مسلم]<\/span>.","📐 القواعد الهندسية لتصميم السلوك:","1. لبناء عادة حسنة: اجعل الإشارة مرئية والوصول إليها سهلاً (الكتب والمصحف أمام العين).","2. لكسر عادة سيئة: اجعل الإشارة خفية والوصول إليها شاقاً (الهاتف خارج غرفة النوم).","—hr—","🎯 قواعد حماية حيزك الشخصي:","1. أنت لست رهن ما تختاره بإرادتك فقط، بل صورة للمدخلات التي تسمح لها بالدخول لهاتفك وغرفتك.","2. تجنب الفتنة والفرار منها من كمال الحكمة والقوة وليس من الضعف.","3. مكان واحد لوظيفة واحدة: السرير للنوم، والمكتب للعمل.","—hr—","📝 قائمة فحص التحدي البيئي (ضع ✓ عند الإنجاز):","[ ] شحن الهاتف خارج غرفة النوم طوال الأسبوع.","[ ] إغلاق إشعارات تطبيقات التواصل والألعاب نهائياً.","[ ] ترك المصحف والكتب جاهزة على المكتب قبيل النوم.","[ ] الاتفاق مع \"رفيق مبادرة\" للمتابعة الأسبوعية.","عهد الفتى المسلم: \"أنا شاب مسلم سيدٌ لبيئتي وهاتفي، ولا أسمح للمشتتات أن تصنع هويتي\"."]}]}]},{"id":"2-3","ordinal":"الثالث","title":"فك قيود التسويف ولصوص الوقت","sub":"الانتقال من المماطلة إلى الإنجاز الفوري","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثانية: صناعة الذات وهندسة العادات"],["عنوان اللقاء","فك قيود التسويف ولصوص الوقت (الانتقال من المماطلة إلى الإنجاز الفوري)"],["الرمز الكودي","U2-L3-PROC"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل تطبيقية ومختبر لتفكيك المماطلة وإدارة المهام"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> التسويف ليس عجزاً في الذكاء ولا كسلاً جينياً، بل هو <b>\"اضطراب في إدارة المشاعر السلبية تجاه المهمة\"<\/b> (كالخوف من الفشل، رهبة الغموض، أو وهم طلب الكمال). التغلب على المماطلة لا يعتمد على انتظار \"المزاج المناسب والشغف\"، بل يتطلب <b>تفكيك المهمة الكبيرة إلى أفعال ذرية لا تقاوم<\/b>، واستعمال قواعد البدء الفوري لكسر مقاومة الدماغ الأولى."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفكك الفتى الصراع العصبي بين (القشرة الجبهية) و(اللوزة الدماغية)، ويتعرف على أدوات كسر التسويف (قاعدة الدقيقتين، تقنية البومودورو، وقاعدة الـ 5 ثوانٍ)."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى قدسية الوقت كرأس مال غير قابل للاسترداد، ويتخلص من مشاعر جلد الذات الناتجة عن التراكم."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يمارس الفتى أسلوب تفكيك مهمة مؤجلة وتطبيق تقنية 25 دقيقة تركيز (بومودورو) دون مقاطعة طوال الأسبوع."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي الجلسة بطرح هذا التساؤل المباشر:"},{"t":"p","lvl":0,"h":"<b>\"لماذا نؤجل دائماً مادة دراسية صعبة أو واجباً ثقيلاً حتى الساعات الأخيرة قبل الموعد، بينما لا نحتاج لأي تفكير أو تأجيل لفتح لعبة أو مقطع ترفيهي؟ هل عقولنا تكره النجاح؟ أم أن الدماغ يفر من (الألم النفسي والغموض) إلى الدوبامين السريع؟ وكيف نقود عقولنا للبدء الفوري دون تسويف؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — معضلة حمزة وتأجيل مشروع البحث)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">معضلة حمزة: خدعة المزاج المناسب والفرار إلى الترتيب الفجائي<\/span>"},{"t":"p","lvl":0,"h":"حمزة (17 سنة) يؤرقه منذ 3 أسابيع إنجاز بحث دراسي ومراجعة مادة الرياضيات المتراكمة."},{"t":"p","lvl":0,"h":"كل يوم بعد العودة للمنزل يقول: \"سأبدأ عند تمام السادسة مساءً حين أكون في مزاج رائق وطاقة كاملة!\"."},{"t":"p","lvl":0,"h":"عندما تدق الساعة 6:00، يشعر بثقل وانقباض، فيقول: \"سأرتب المكتب أولاً وأعد كوباً من الشاي لأتهيأ جلياً!\"."},{"t":"p","lvl":0,"h":"يمضي الوقت بين الترتيب وتفقد الهاتف حتى التاسعة، فيقول: \"مضى اليوم وتعبت، سأستيقظ غداً في الفجر وأبدأ من جديد!\"."},{"t":"p","lvl":0,"h":"تكرر ذلك 20 يوماً.. وفي الليلة الأخيرة قبل التسليم، أصابه الذعر والهلع، فسهر الليل كله ينسخ النصوص بضغط عصبي هائل، وقدم عملاً مهلهلاً وهو يشعر بالخجل والإنهاك!"},{"t":"p","lvl":0,"h":"محاور النقاش:"},{"t":"p","lvl":0,"h":"1. لماذا هرب عقل حمزة إلى (ترتيب المكتب وتصفح الهاتف) فور اقتراب موعد المهمة الجادة؟"},{"t":"p","lvl":0,"h":"2. ما الخدعة النفسية الكامنة في انتظار \"المزاج والشغف\" قبل البدء في الواجبات؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ﴾<\/span> <span class=\"ayref\">آل عمران: 133<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الأمر بالمسارعة والمبادرة دون تسويف؛ لأن التأجيل يورث الفوات والندم."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿حَتَّىٰ إِذَا جَاءَ أَحَدَهُمُ الْمَوْتُ قَالَ رَبِّ ارْجِعُونِ * لَعَلِّي أَعْمَلُ صَالِحًا فِيمَا تَرَكْتُ ۚ كَلَّا﴾<\/span> <span class=\"ayref\">المؤمنون: 99-100<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> بيان قرآني لخطورة التسويف وكلمة \"سوف\" و\"لعل\"؛ فهي بذور الحسرة الكبرى عند انقضاء الأجل وفوات الفرص."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾<\/span> <span class=\"ayref\">الشرح: 7-8<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> لا يعرف المنهج الإسلامي الفراغ السلبي المهدور، بل هو انتقال متجدد من عمل إلى عمل ومن عبادة إلى بناء."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث ابن عباس رضي الله عنهما:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالفَرَاغُ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الرقاق، باب ما جاء في الرقاق، برقم 6412<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الفقهي والسلوكي:<\/i> سمى النبي ﷺ تضييع الفراغ \"غبناً\"؛ وهو أفحش درجات الخسارة في البيع؛ لأن رأس مال الإنسان هو زمانه المحدود."},{"t":"li","lvl":0,"h":"<b>دعاء النبي ﷺ المستمر:<\/b> <span class=\"hadith\">«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ العَجْزِ وَالكَسَلِ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الدعوات، باب التعوذ من العجز والكسل، برقم 6363؛ وصحيح مسلم برقم 2706<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل المفاهيمي:<\/i> الكسل هو التسويف والمماطلة مع سلامة الجسد والقدرة، وهو آفة تسلب مروءة الشاب وقوته."},{"t":"li","lvl":0,"h":"<b>وصية ابن عمر رضي الله عنهما:<\/b> <span class=\"qt\">«إِذَا أَمْسَيْتَ فَلاَ تَنْتَظِرِ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلاَ تَنْتَظِرِ المَسَاءَ، وَخُذْ مِنْ صِحَّتِكَ لِمَرَضِكَ، وَمِنْ حَيَاتِكَ لِمَوْتِكَ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الرقاق، باب قول النبي ﷺ كن في الدنيا كأنك غريب، برقم 6416<\/cite><\/div><\/details>."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف كعب بن مالك رضي الله عنه في غزوة تبوك:<\/b> كان يخرج ليتجهز مع الجيش، فيرجع ولم يقضِ شيئاً قائلاً في نفسه: \"أنا قادر على اللحاق بهم متى شئت\"، حتى مضى الجيش وفات الأمر، وسجل كلمته الخالدة بياناً لعاقبة التسويف: <i>\"فلم يزل ذلك يتمادى بي حتى أسرعوا وتفارَط الغزو، وفات الأمر\"<\/i> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب المغازي برقم 4418؛ وصحيح مسلم برقم 2769<\/cite><\/div><\/details>."},{"t":"li","lvl":0,"h":"<b>أثر عمر بن الخطاب رضي الله عنه:<\/b> حين أتاه رجل ليلاً في حاجة فقال له الرجل: أعدك غداً، فقال له عمر معاتباً: <i>\"أتضمن لي أن أعيش إلى الغد؟ تأخير عمل اليوم إلى الغد يورث العجز والندامة\"<\/i> [مصنف ابن أبي شيبة برقم 35687، وحلية الأولياء 1/52]."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: الميكانيزم العصبي للصراع الداخلي (Prefrontal Cortex vs Amygdala)<\/b>"},{"t":"li","lvl":0,"h":"بيان الصراع في دماغ الشاب:"},{"t":"li","lvl":1,"h":"<b>القشرة الجبهية (Prefrontal Cortex):<\/b> مسؤولة عن التخطيط، والمنطق، والأهداف العالية والمستقبل."},{"t":"li","lvl":1,"h":"<b>اللوزة الدماغية (Amygdala):<\/b> مسؤولة عن الانفعال البدائي والبحث عن المتعة السريعة والهروب من أي ألم."},{"t":"li","lvl":0,"h":"عندما تكون المهمة ضخمة أو غامضة، ترسل اللوزة إشارات ألم وضغط، فيفر الشاب فوراً للهاتف طلباً لمتعة سهلة بلا ألم!"},{"t":"p","lvl":0,"h":"<b>المحور الثاني: وهم \"انتظار الشغف والمزاج\"<\/b>"},{"t":"li","lvl":0,"h":"القاعدة السلوكية الحاسمة: <b>\"العمل هو الذي يولد المزاج والشغف، وليس المزاج هو الذي يولد العمل!\"<\/b>."},{"t":"li","lvl":0,"h":"بمجرد أن تبدأ العمل لمدة <b>120 ثانية فقط<\/b>، تتراجع إشارات الألم، ويدخل الدماغ في حالة الاندماج الإنجازي عبر ما يسمى نفسياً بـ <i>(تأثير زيجارنيك - Zeigarnik Effect)<\/i>؛ حيث يميل الدماغ تلقائياً لإتمام المهمة التي بدأها بالفعل."},{"t":"p","lvl":0,"h":"<b>المحور الثالث: أدوات كسر المماطلة ولصوص الوقت<\/b>"},{"t":"li","lvl":0,"h":"<b>أدوات الحسم السلوكي:<\/b>"},{"t":"li","lvl":1,"h":"<b>قاعدة الدقيقتين:<\/b> اختصر بداية المهمة إلى 120 ثانية فقط لتجاوز عتبة المقاومة."},{"t":"li","lvl":1,"h":"<b>تقنية البومودورو (Pomodoro):<\/b> 25 دقيقة تركيز خالص بغير مشتتات + 5 دقائق راحة."},{"t":"li","lvl":1,"h":"<b>قاعدة العد التنازلي (5 - 4 - 3 - 2 - 1 - انطلق!):<\/b> قطع حبال التردد عبر الحركة الجسدية المباشرة."},{"t":"li","lvl":0,"h":"<b>لصوص الوقت الأربعة:<\/b> (التصفح الرقمي التائه، العجز عن قول \"لا\" للغو، فوضى المكان، وأوهام المثالية الصارمة)."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أنا لا أبدع إلا تحت ضغط اللحظات الأخيرة والمواعيد النهائية (Deadlines)، فهل التسويف ميزة لي؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الإنجاز تحت ضغط الذعر يفرز هرمونات الإجهاد (الكورتيزول والأدرينالين) فيعطي نشوة مؤقتة، لكنه يقدم نتائج سطحية مليئة بالأخطاء ويهلك الصحة النفسية. الإتقان الرصين والعمق يحتاجان لصفاء وتركيز متدرج."}]},{"t":"qa","n":"2","q":"\"كيف أتخلص من جلد الذات بعد أن تراكمت عليّ مواد ومهام لأسابيع؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> <b>\"جلد الذات هو الوقود الأول للاستمرار في التسويف!\"<\/b>؛ لأن الدماغ يهرب من تأنيب الضمير باللجوء إلى الشاشات. اقطع التفكير في الماضي، وسامح نفسك عن التقصير، وركز على \"مهمة الساعة الحالية\" فقط؛ فالجبال لا تُنقل إلا حجراً حجراً."}]},{"t":"qa","n":"3","q":"\"هل اعتذاري للزملاء عن الخروج أوقات الجد والعمل يعتبر خذلاناً ونقصاً في المروءة؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> قولك \"لا\" للغو والشتات هو في حقيقته قولك \"نعم\" لكرامتك ورسالتك ونجاحك. الصاحب النبيل يقدر أوقاتك ويشجعك على التميز، أما من يحزن لانضباطك فهو يسعى لجرك إلى مربع الفراغ ليؤنس بك تقصيره!"}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>الميسر الشاب:<\/b> إدارة نوبات المداخلات حول معضلة حمزة وتلخيص الأفكار."},{"t":"li","lvl":0,"h":"<b>المدوّن:<\/b> تسجيل أدوات كسر المماطلة ولصوص الوقت على السبورة."},{"t":"li","lvl":0,"h":"<b>المعارض (محامي الشيطان):<\/b> الدفاع عن فكرة الإنجاز تحت الضغط الأخير."},{"t":"li","lvl":0,"h":"<b>ضابط الوقت (الميقاتي):<\/b> ضبط الوقت بالدقيقة."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر تفكيك جبل التسويف (Task Deconstruction)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة تفكيك المهام + مؤقت إلكتروني."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b> يحدد كل فتى أضخم مهمة يؤجلها منذ أيام، ويطبق خوارزمية التفكيك الخماسية:"},{"t":"li","lvl":1,"h":"تسمية المهمة بدقة."},{"t":"li","lvl":1,"h":"تحويلها إلى أول حركة جسدية مدتها 120 ثانية (فتح الدفتر وقراءة أول فقرة)."},{"t":"li","lvl":1,"h":"تحديد الموعد والمكان فور العودة للبيت."},{"t":"li","lvl":1,"h":"نفي المشتت الرئيسي (إخراج الهاتف)."},{"t":"li","lvl":1,"h":"تفعيل مؤقت القاعة وتطبيق أول دقيقتين فعلياً في المهمة كنموذج عملي."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: يوسف وعقدة الظروف المثالية<\/span>"},{"t":"p","lvl":0,"h":"يوسف (16 سنة) فتى متوقد الذكاء، يواجه مشكلة في حفظ القرآن ومذاكرة المواد العلمية بسبب وقوعه في فخ \"المثالية الصارمة\"؛ فهو يشترط للبدء:"},{"t":"p","lvl":0,"h":"1. توفر 3 ساعات متصلة خالية تماماً من المقاطعة."},{"t":"p","lvl":0,"h":"2. هدوء الغرفة التام وضبط إضاءة ومشروب معين."},{"t":"p","lvl":0,"h":"وحيث إن هذه البيئة الخيالية لا تتهيأ له وسط مسؤوليات أسرته والمدرسة، يؤجل الحفظ والدراسة أسبوعاً إثر أسبوع حتى تراكمت عليه مقررات كاملة، فأصابه اليأس وقرر الانسحاب من حلقة التحفيظ!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف عطل وهم \"الظروف الكاملة\" حياة يوسف؟"},{"t":"p","lvl":0,"h":"2. كيف نعيد توجيه يوسف لاستغلال \"الفراغات البينية (10 دقائق بعد الصلاة / بين الحصص)\" دون انتظار المستحيل؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال الفرار إلى الدوبامين السريع وتفكيك الهروب النفسي."],["05 - 15 د","الخطاف الحواري","عرض معضلة حمزة والمزاج المزعوم وإدارة الحوار."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","آيات المسارعة، أحاديث الكسل والغبن، وقصة كعب بن مالك."],["30 - 45 د","المختبر ودراسة الحالة","تمرين تفكيك جبل التسويف وتفكيك حالة يوسف."],["45 - 55 د","بنك الأسئلة الجدلية","نقاش أوهام الضغط الأخير، وجلد الذات، ومهارة قول &quot;لا&quot;."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وتحديد مهمة البومودورو."],["65 - 70 د","الختام والتقييم","تلخيص المخرجات والتكليف بالأدوار للقاء القادم."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 162-165","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«قاعدة الدقيقتين: عندما تبدأ عادة جديدة، ينبغي ألا تستغرق أكثر من دقيقتين... اختصر العادة لتثبت شارة الحضور وتتخطى حاجز البدء»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 168","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«اجعل السلوك سهلاً: قلل الاحتكاك المرتبط بالعادات الحسنة؛ فعندما يقل الاحتكاك يسهل على الدماغ التنفيذ وتتلاشى المماطلة»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 78-79","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«إن الفراغ وسوء تنظيم الوقت هما المشرط الذي يبتر قدرات المراهق ويجعله عرضة للتسويف؛ فالمرء حين لا يجد ما يشغل به نفسه بالحق شغلته بالباطل»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 106","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«يحتاج المراهق إلى مساعدة مستمرة في تنظيم حياته وحسم خياراته؛ لضعف خبرته وتصارع رغباته في داخله»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 54","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«من أكبر عوائق الجيل الصاعد: حالة الشتات المعرفي واستسهال التأجيل والتسويف الناجم عن استهلاك السيولة الرقمية»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 27-28","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«إن الوقت هو الحياة... وقد كان العلماء أشد شيء حرصاً على أوقاتهم، فيبادرون اللحظات ولا يتركون للتسويف مسلكاً إلى قلوبهم»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 45","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«ينبغي للإنسان أن يعرف شرف زمانه وقدر وقته، فلا يذهب منه لحظة في غير قربة، ويقدم الأفضل فالأفضل دون تأخير»<\/span>."},{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 150","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«إن تقديم الأهم على المهم والمبادرة بإنجاز الواجبات قبل فوات وقتها هو جوهر فقه الأولويات، والتسويف يخل بهذا الميزان»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 85-86","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الصبر في الإسلام قوة إرادة تكبح جماح الهوى وتدفع إلى الإنجاز والمبادرة وقطع التسويف»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 412","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«تعويد الشباب على تحمل المسؤولية والمبادرة بالعمل يقطع دابر الكسل والتسويف، ويغرس فيهم روح الرجولة»<\/span>."},{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«رجال القرآن هم المبادرون الذين يتسامون عن التسويف، ويعلمون أن بناء الذات يتطلب عزمة صادقة لا تحتمل التأجيل»<\/span>."},{"t":"src","cite":"النبأ العظيم - محمد عبد الله دراز - ص د","short":"النبأ العظيم — محمد عبد الله دراز","q":"<span class=\"qt\">«الأمة التي تربت على منهج القرآن هي أمة العمل والمبادرة والبرهان، لا أمة الأماني والتسويف»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>التغلب على التسويف (Overcoming Procrastination)<\/i> — د. تيموثي بيتشيل (فصل: تنظيم العواطف وقاعدة البدء المباشر دون انتظار الشغف، ص 30-55)."},{"t":"li","lvl":1,"h":"<i>إنجاز الأمور (Getting Things Done)<\/i> — ديفيد ألين (فصل: قاعدة الدقيقتين وتفريغ الذهن من القلق، ص 110-135)."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع توعوي تفاعلي:<\/b> \"تخلص من التسويف والمماطلة نهائياً بقاعدة الدقيقتين\" — قناة <i>علي وكتاب<\/i> على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تدير وقتك وتتخلص من التسويف والكسل؟\" — الشيخ د. عمر عبد الكافي على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني (تحدي كسر جبل التسويف)","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"كسر الجبل وقاعدة الـ 120 ثانية\"","sub":"","lines":["المهمة الميدانية المطلوبة:","1. تحديد جبل التسويف:","- تحديد أثقل مهمة كنت تؤجلها منذ فترة (مذاكرة وحدة صعبة، كتابة تقرير، أو ورد قرآني).","2. كسر التردد بقاعدة العد العكسي:","- عد تنازلياً (5 - 4 - 3 - 2 - 1 - انطلق!)، وابدأ أول 120 ثانية فوراً دون تأجيل.","3. تطبيق تقنية البومودورو (Pomodoro):","- إتمام جلسة تركيز يومية واحدة (25 دقيقة عمل مركز بغير هاتف + 5 دقائق راحة).","4. التدوين: توثيق إنجاز الـ 25 دقيقة يومياً في جدول البطاقة."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الوعي ببدء المهمة","يرهن عمله بانتظار المزاج والشغف والظروف المثالية.","يدرك أهمية البدء لكنه يحتاج لدفع ومتابعة خارجية مستمرة.","يطبق &quot;قاعدة الدقيقتين والـ 5 ثوانٍ&quot; ويباشر مهامه دون تسويف."],["إدارة لصوص الوقت","يستسلم للمشتتات ويعجز عن رفض طلبات الخروج واللغو.","يغلق بعض التنبيهات لكنه يتردد في حسم وقته أمام الأقران.","يحمي ساعاته بصلابة راقية، ويتقن استخدام جلسات البومودورو."],["التعامل مع التراكم","يصاب بالهلع وجلد الذات ويهرب للتسلية عند ثقل المهام.","يسعى للعمل تحت الضغط النفسي الشديد في اللحظات الأخيرة.","يفكك الجبل المتراكم إلى خطوات صغيرة، ويسير بإنجاز هادئ ومتزن."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: فك قيود التسويف والمماطلة","sub":"","lines":["💡 البوصلة والمفهوم:","التسويف ليس كسلاً مجرداً، بل هو فرار من \"الألم النفسي والغموض\"! لا تعلق إنجازك بانتظار الشغف؛ فالعمل الحقيقي هو ما يجلب الشغف. ابدأ لمدة 120 ثانية فقط، وسيتكفل عقلك بإكمال البناء.","📖 الآية المحورية:","<span class=\"ayah\">﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ﴾<\/span> <span class=\"ayref\">آل عمران: 133<\/span>.","مِشكاة النبوة:","كان رسول الله ﷺ يكثر أن يتعوذ فيقول: <span class=\"hadith\">«اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ العَجْزِ وَالكَسَلِ»<\/span> <span class=\"takh\">[صحيح البخاري ومسلم]<\/span>.","📐 قواعد الحسم الثلاث لكسر التسويف:","1. قاعدة الـ 5 ثوانٍ: إذا ترددت، عُد تنازلياً (5 - 4 - 3 - 2 - 1) وانطلق جسدياً للعمل!","2. قاعدة الدقيقتين: ابدأ بـ 120 ثانية فقط لتجاوز جدار المقاومة النفسية الأولى.","3. تقنية البومودورو: 25 دقيقة تركيز خالص بغير هاتف = نتاج يفوق 4 ساعات من المذاكرة المشوشة.","—hr—","🎯 لصوص الوقت الأربعة (احذرهم!):","1. التصفح الرقمي التائه.       2. أوهام المثالية والظروف الكاملة.","3. العجز عن قول \"لا\" للشتات.     4. فوضى الحيز المكاني وغياب التفكيك.","—hr—","📝 جدول تتبع جلسات البومودورو الأسبوعية (ضع ✓ عند إتمام 25 دقيقة):","[ السبت ]  [ الأحد ]  [ الاثنين ]  [ الثلاثاء ]  [ الأربعاء ]  [ الخميس ]  [ الجمعة ]","(   )      (   )      (    )       (    )       (    )       (   )      (   )","عهد الفتى المسلم: \"أنا شاب مسلم مبادر، أقطع دابر التسويف، ووقتي هو عمري الذي لا يُعوَّض\"."]}]}]},{"id":"2-4","ordinal":"الرابع","title":"العادات الإيمانية المستدامة","sub":"فقه «أحب العمل إلى الله أدومه وإن قل»","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثانية: صناعة الذات وهندسة العادات"],["عنوان اللقاء","العادات الإيمانية المستدامة (فقه «أحب العمل إلى الله أدومه وإن قل»)"],["الرمز الكودي","U2-L4-FAITH"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل حوارية وتأصيلية في هندسة الاستدامة التعبدية"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> الإيمان ليس شحنة وجدانية موسمية تتأجج ثم تخبو، بل هو <b>\"منظومة حياة وسلوك يومي حي\"<\/b> يترجم إلى عادات إيمانية ذرية راسخة تثبت في أوقات الإقبال والفتور. الاستقامة لا تقاس بالطفرات المنقطعة، بل بفقه <b><span class=\"qt\">«أحب العمل إلى الله أدومه وإن قل»<\/span><\/b>؛ وهو المنهج الذي يحمي الشاب من الانبتات والانتكاس، ويبني في داخله رجولة إيمانية صلبة."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يدرك الفتى طبيعة النفس البشرية في الإقبال والفتور (فقه الفتور وقانون لكل شرة فترة)، ويتعلم هندسة \"الحد الأدنى الإيماني (MVF)\" الذي لا ينكسر."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى سكينة القرب الدائم من الله، متحرراً من جلد الذات واليأس عند تراجع فورة المشاعر الإيمانية."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يصمم الفتى \"المثلث الإيماني الذري\" (الفجر في وقته، ورد صفحتين من القرآن، وركعة الوتر مع أذكار النوم) ويربطه بروتينه القائم عبر تقنية (تجميع العادات)."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي الجلسة بطرح هذا التساؤل التشخيصي:"},{"t":"p","lvl":0,"h":"<b>\"لماذا يشتعل حماسنا الإيماني في رمضان كالبحر الهادر، فنبكي في التراويح ونختم القرآن، وبمجرد انقضاء الشهر نرجع لنقطة الصفر ونتثاقل حتى عن صلاة الفريضة؟ هل ركائز الإيمان مخصصة لمواسم معدودة؟ أم أن خللنا يكمن في ربط العبادة بالفوران العاطفي المؤقت بدلاً من تأسيسها كعادة ذرية مستدامة؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — معضلة اندفاعة طارق وثبات زياد)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">معضلة طارق وزياد: طفرة الإيمانيات vs ديمة العبادة<\/span>"},{"t":"p","lvl":0,"h":"- طارق (17 سنة): قرر في أول ليلة من رجب أن يغير حياته الإيمانية جذرياً؛ فقام الليل بسورة البقرة، وتعهد بقراءة جزأين يومياً وصيام الإثنين والخميس. استمر طارق 10 أيام في نشوة عارمة، وفي اليوم الحادي عشر أصابه إرهاق شديد، فترك القيام، ثم هجر الورد، ثم بدأ يفرط في صلاة الفجر لأشهر متواصلة!"},{"t":"p","lvl":0,"h":"- زياد (17 سنة): ألزم نفسه فقط بـ \"المثلث الذري\": (صلاة الفجر حاضراً، صفحتان من المصحف بعد الصلاة، وركعة الوتر مع أذكار النوم)، معاهداً ربه ألا يترك هذا الحد الأدنى مهما اشتدت عليه الظروف."},{"t":"p","lvl":0,"h":"سؤال النقاش:"},{"t":"p","lvl":0,"h":"أيهما أعظم توفيقاً وأحب إلى الله تعالى ورسوله ﷺ؟"},{"t":"p","lvl":0,"h":"ولماذا نميل جميعاً إلى مسلك طارق، ثم نشتكي من الانتكاسة وظلمة القلب؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ﴾<\/span> <span class=\"ayref\">الحجر: 99<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الأمر الإلهي للرسول ﷺ باستدامة التعبد حتى الموت (\"اليقين\")؛ فالعبودية صبغة حياة لا تنتهي بانقضاء موسم أو مرحلة عمرية."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿الَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ دَائِمُونَ﴾<\/span> <span class=\"ayref\">المعارج: 23<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> امتدح الله أهل الفلاح بصفة <b>الدوام والمواظبة<\/b>؛ فالقيمة العليا في الميزان الإلهي هي الاستمرارية والثبات."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ﴾<\/span> <span class=\"ayref\">آل عمران: 200<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> المرابطة الإيمانية تتطلب الصبر على الطاعة وحماية الثغور والفرائض قبل الاستكثار من النوافل."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أم المؤمنين عائشة رضي الله عنها:<\/b> أن رسول الله ﷺ سُئِلَ: أَيُّ الأَعْمَالِ أَحَبُّ إِلَى اللهِ؟ قَالَ: <span class=\"hadith\">«أَدْوَمُهَا وَإِنْ قَلَّ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: برقم 6465؛ وصحيح مسلم: برقم 783<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الفقهي والسلوكي:<\/i> القليل الدائم يتقدم عند الله على الكثير المنقطع؛ لأنه يعكس خضوعاً دائماً وارتباطاً مستمراً بالخالق."},{"t":"li","lvl":0,"h":"<b>حديث أم المؤمنين عائشة رضي الله عنها في وصف هدي النبي ﷺ:<\/b> <span class=\"hadith\">«وَكَانَ عَمَلُهُ دِيمَةً»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الصوم برقم 1987؛ وصحيح مسلم برقم 782<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل المفاهيمي:<\/i> \"الديمة\" هي المطر الدائم الساكن الذي يروي الأرض فيثمر زرعها، وهكذا كانت حياة النبي ﷺ التعبدية."},{"t":"li","lvl":0,"h":"<b>حديث عبد الله بن عمرو بن العاص رضي الله عنهما:<\/b> قال لي رسول الله ﷺ: <span class=\"hadith\">«يَا عَبْدَ اللهِ، لاَ تَكُنْ مِثْلَ فُلاَنٍ كَانَ يَقُومُ اللَّيْلَ فَتَرَكَ قِيَامَ اللَّيْلِ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب التهجد برقم 1152<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل التربوي:<\/i> تحذير نبوي من الانقطاع بعد الإقبال؛ لأن التراجع يورث الجفاء وقسوة القلب."},{"t":"li","lvl":0,"h":"<b>حديث عبد الله بن مسعود رضي الله عنه في فقه الفتور:<\/b> أن النبي ﷺ قال: <span class=\"hadith\">«إِنَّ لِكُلِّ عَمَلٍ شِرَّةً (أي: حماساً وإقبالاً)، وَلِكُلِّ شِرَّةٍ فَتْرَةً (أي: فتوراً وسكوناً)، فَمَنْ كَانَتْ فَتْرَتُهُ إِلَى سُنَّتِي فَقَدِ اهْتَدَى، وَمَنْ كَانَتْ إِلَى غَيْرِ ذَلِكَ فَقَدْ هَلَكَ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>مسند أحمد برقم 6764، وصحيح ابن حبان برقم 360، وصححه الألباني في صحيح الترغيب برقم 55<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> تقرير نبوي بأن الفتور عارض بشري طبيعي؛ والمهم ألا يتجاوز الفتور دائرة النوافل فيهدم الفرائض والمحرمات."},{"t":"li","lvl":0,"h":"<b>حديث أبي ذر ومعاذ بن جبل رضي الله عنهما:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«اتَّقِ اللهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>جامع الترمذي: كتاب البر والصلة، برقم 1987 وقال: حسن صحيح، وحسنه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل العلاجي:<\/i> الحسنات الماحية هي العلاج الفوري للذنب، والذنب لا يبرر هجران الطاعة."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف حنظلة الأسيدي رضي الله عنه:<\/b> حين أتى يبكي ويقول: <i>\"نَافَقَ حَنْظَلَةُ!\"<\/i> لكونهم عند النبي ﷺ ترق قلوبهم، فإذا رجعوا إلى أهلهم عافسوا الدنيا ونسوا، فقال له النبي ﷺ مؤصلاً واقعية النفس: <span class=\"hadith\">«وَالَّذِي نَفْسِي بِيَدِهِ إِنْ لَوْ تَدُومُونَ عَلَى مَا تَكُونُونَ عِنْدِي وَفِي الذِّكْرِ لَصَافَحَتْكُمُ المَلاَئِكَةُ عَلَى فُرُشِكُمْ وَفِي طُرُقِكُمْ، وَلَكِنْ يَا حَنْظَلَةُ سَاعَةً وَسَاعَةً»<\/span> <span class=\"takh\">[صحيح مسلم: كتاب التوبة برقم 2750]<\/span>."},{"t":"li","lvl":0,"h":"<b>أثر الإمام الفضيل بن عياض رحمه الله في الإخلاص والاستقامة:<\/b> <span class=\"qt\">«ترك العمل من أجل الناس رياء، والعمل من أجل الناس شرك، والإخلاص أن يعافيك الله منهما»<\/span> [حلية الأولياء لأبي نعيم 8/95، وشعب الإيمان للبيهقي برقم 6831]."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: فقه الفتور وطبيعة النفس البشرية (قانون الشِّرة والفَتْرة)<\/b>"},{"t":"li","lvl":0,"h":"توضيح أن تقلب المشاعر الإيمانية أمر فطري أقرته السنة النبوية؛ فالحكيم هو من يجعل أوقات الفتور والكسل محصورة في التمسك الصارم بـ \"الفرائض والواجبات\"، محذراً من أن تتعدى الفترة إلى المحرمات أو تضييع الصلوات."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: تجذير العبادة بـ (تجميع العادات - Habit Stacking)<\/b>"},{"t":"li","lvl":0,"h":"ربط السلوك التعبدي الجديد بروتين يومي قائم وثابت:"},{"t":"li","lvl":1,"h":"<i>معادلة الربط:<\/i> [بعد / قبل عادة يومية ثابتة] + [سأؤدي العبادة الذرية]."},{"t":"li","lvl":1,"h":"<i>أمثلة تطبيقية:<\/i> \"فور التسليم من صلاة الفجر، سأقرأ صفحتين من المصحف قبل مغادرة السجادة\"، \"قبل وضع الهاتف على الشاحن للنوم، سأصلي ركعة الوتر\"."},{"t":"p","lvl":0,"h":"<b>المحور الثالث: تأسيس \"الحد الأدنى الإيماني (Minimum Viable Faith - MVF)\"<\/b>"},{"t":"li","lvl":0,"h":"بناء جدار فولاذي لحماية الهوية لا يُسمح بانهياره تحت أي ظرف (امتحانات، سفر، مرض، أو فتور نفسي):"},{"t":"li","lvl":1,"h":"الصلوات الخمس في أوقاتها المحددة (والحرص على الفجر)."},{"t":"li","lvl":1,"h":"ورد قرآني ثابت (صفحتان = 4 دقائق)."},{"t":"li","lvl":1,"h":"ركعة الوتر مع أذكار الصباح والمساء."},{"t":"li","lvl":1,"h":"اجتناب الكبائر والمحرمات الظاهرة."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أليس أداء العبادة القليلة (كركعة واحدة أو صفحتين) عملاً آلياً بارداً يفتقر للخشوع والبكاء؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الخشوع واللذة ثمرة المداومة والانضباط، وليسا شرطاً لبدء العبادة! انتظار المشاعر الدافئة دائماً حيلة شيطانية لدفعك للترك؛ فالصلاة في أوقات الجفاف العاطفي تعبير عن صدق الامتثال والعبودية المحضة لله."}]},{"t":"qa","n":"2","q":"\"أخشى الوقوع في النفاق أو الرياء حين أحافظ على عباداتي أمام زملائي في المدرسة، فهل أتركها؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> قاعدة الفضيل بن عياض واضحة: <i>\"ترك العمل من أجل الناس رياء\"<\/i>. لا تتراجع عن إظهار شعائر دينك خجلاً، واحمِ إخلاصك بأن تجعل لنفسك \"خبيئة صالحة\" في بيتك وغرفتك لا يطلع عليها إلا الله."}]},{"t":"qa","n":"3","q":"\"إذا زلت قدمي في معصية، أشعر بالخزي وأرى أنه لا معنى لصلاتي وقراءتي للقرآن بعدها، فكيف أتصرف؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هذه أخبث مكائد إبليس؛ حيث يستغل الذنب لقطعك عن الله كلياً. العلاج النبوي حاسم: <span class=\"qt\">«وَأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُهَا»<\/span>. توضأ فوراً وصلِّ ركعتين وتصدق؛ فالطاعات كفارات والفرار يكون إلى الله لا منه."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>الميسر الشاب:<\/b> إدارة نوبات الحوار حول معضلة طارق وزياد."},{"t":"li","lvl":0,"h":"<b>المدوّن:<\/b> كتابة معادلة تجميع العادات وأركان الحد الأدنى الإيماني على السبورة."},{"t":"li","lvl":0,"h":"<b>المعارض (محامي الشيطان):<\/b> إثارة حجة \"العبادة القليلة لا خشوع فيها والطفرات أفضل\"."},{"t":"li","lvl":0,"h":"<b>ضابط الوقت (الميقاتي):<\/b> الالتزام بتوزيع الدقائق."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر هندسة المثلث الإيماني (Habit Stacking Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة تصميم المثلث الإيماني وروتين اليوم."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b> يصمم كل فتى معادلات الربط الذاتي:"},{"t":"li","lvl":1,"h":"<i>الورد القرآني:<\/i> ربطه بالانتهاء من صلاة الفجر مباشرة."},{"t":"li","lvl":1,"h":"<i>أذكار اليوم:<\/i> ربطها بركوب السيارة أو الحافلة صباحاً."},{"t":"li","lvl":1,"h":"<i>الوتر وأذكار النوم:<\/i> ربطها بوضع الهاتف على الشاحن ليلاً."},{"t":"li","lvl":1,"h":"مراجعة المعادلات ثنائياً بين الطلاب لضمان خلوها من الغموض وسهولة تنفيذها بنسبة 100%."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: سلمان وعقدة الانتكاسة بعد المواسم<\/span>"},{"t":"p","lvl":0,"h":"سلمان (16 سنة) فتى صادق القلب، يتأثر بشدة بالمواعظ، وفي رمضان يلتزم ببرنامج عبادي شاق: (قيام ساعة يومياً، جزآن من القرآن، وصيام تطوع)."},{"t":"p","lvl":0,"h":"بمجرد انقضاء رمضان وبدء الدراسة، يداهمه الفتور فيثقل عليه القيام، وبدلاً من تقليص العبادة للحد الأدنى، يخاطب نفسه باحتقار: \"أنا منافق كاذب!\"، فيترك قيام الليل، ثم يهجر القرآن، وتتراجع صلاته حتى يضيع الفجر عن وقته لأسابيع!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف تحول غياب \"فقه الفتور\" لدى سلمان إلى فخ قاده للانتكاسة الكلية؟"},{"t":"p","lvl":0,"h":"2. كيف نعيد ضبط حياة سلمان الإيمانية وفق مفهوم \"الحد الأدنى الإيماني (MVF)\"؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال انقطاع العبادة بعد رمضان واستثارة التفكير."],["05 - 15 د","الخطاف الحواري","عرض قصة طارق وزياد وتفكيك أوهام الاندفاع الموسمي."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","أدلة الدوام، حديث الديمة، قصة حنظلة، وفقه الفتور."],["30 - 45 د","المختبر ودراسة الحالة","تمرين تجميع العادات وتفكيك حالة سلمان في المجموعات."],["45 - 55 د","بنك الأسئلة الجدلية","تفكيك إشكالات غياب الخشوع، خوف الرياء، ومدافعة الذنب."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وتثبيت المثلث الإيماني."],["65 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع الأدوار للوحدة القادمة."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 77-79","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«تجميع العادات: اربط عادتك الجديدة بعادة قائمة بالفعل... المعادلة: بعد [العادة الحالية]، سأقوم بـ [العادة الجديدة]»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 37-38","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«إن المداومة على العمل الصالح -وإن قل- يربي في النفس العبودية الراسخة، ويحمي الشخصية من التذبذب بين الإقبال والانكسار»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 31","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«الاستقامة العملية والثبات على الحق وتثبيت الأقدام على الصراط المستقيم هي الغاية الكبرى من التعلم والبناء التربوي»<\/span>."},{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 101","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«أن يكون العمل أدوم: ومعنى الأدم أن يداوم عليه فاعله ويواظب عليه، بخلاف العمل الذي يقع منه بعض المرات»<\/span>."},{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 66","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«الفهم الدقيق لفقه الأولويات يقتضي تقديم الفرائض والمحكمات والمداومة عليها قبل الاستغراق في النوافل التي قد تعقبها الانتكاسة»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 24-26","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«القرآن والعبادات لم تنزل لتكون مجرد شحنات عاطفية عابرة في المناسبات، بل لتكون منهج حياة يترجم الإيمان إلى خلق دائم وعمل مستمر»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 85-86","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الصبر في الإسلام هو الصبر على الطاعة والصبر عن المعصية، والاستمرار في رعاية النبتة الإيمانية دون ملل أو نكوص»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 168","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«إن تعويد الفتى على العبادات الذرية اليومية والمواظبة عليها يغرس فيه روح الانضباط والمسؤولية الإيمانية»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 106","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«يحتاج المراهق إلى مساعدة في تنظيم حياته وإيمانياته وحسم خياراته؛ لأن تصارع رغباته يجعله يتأرجح بين الطفرة العاطفية والكسل»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 45","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«كان العلماء يجعلون لأورادهم التعبدية والعلمية حداً أدنى لا ينقصون عنه في سفر ولا حضر ولا مرض حماية لقلوبهم»<\/span>."},{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«رجال القرآن هم أهل الدوام والثبات: رجال لا تلهيهم تجارة ولا بيع عن ذكر الله وإقام الصلاة»<\/span>."},{"t":"src","cite":"منهج التربية الإسلامية - محمد قطب - ص 42","short":"منهج التربية الإسلامية — محمد قطب","q":"<span class=\"qt\">«التربية الإسلامية الشاملة تبني الإنسان كلاً متكاملاً؛ فلا تغرق في العاطفة المجردة، بل تربطه برباط التعبد المستمر والعمل الصالح المتدرج»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>علو الهمة<\/i> — محمد أحمد إسماعيل المقدم (فصل: فقه المداومة، وآفات المظاهر الموسمية وتأصيل الثبات، ص 180-210)."},{"t":"li","lvl":1,"h":"<i>جلاء الأفهام في فضل الصلاة والسلام على خير الأنام<\/i> — ابن قيم الجوزية (فصل: ثمار المداومة على أذكار اليوم والليلة، ص 90-115)."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي:<\/b> \"كيف تثبت على الطاعة بعد رمضان وتتغلب على الفتور؟\" — الشيخ د. عمر عبد الكافي على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع تربوي:<\/b> \"فقه أحب الأعمال إلى الله أدومها وإن قل\" — الشيخ أحمد السيد (برنامج <i>البناء المنهجي<\/i> على يوتيوب)."}]},{"num":14,"title":"التحدي الأسبوعي الميداني (تحدي المثلث الإيماني الذري)","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"المثلث الإيماني الذري (MVF)\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. تثبيت ركائز المثلث الإيماني الذري دون انقطاع:","[ ] صلاة الفجر في وقتها (حاضراً في المسجد).","[ ] ورد القرآن الذري (صفحتان فور الانتهاء من الفجر).","[ ] ركعة الوتر + أذكار النوم (قبل إغلاق الهاتف للنوم).","2. تطبيق قانون تجميع العادات (Habit Stacking):","- ربط كل عبادة بسلوك يومي حتمي قائم.","3. التوثيق:","- وضع علامة (✓) في جدول بطاقة الطالب اليومية فور الإنجاز."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الوعي بالاستدامة الإيمانية","يعتمد على فورة العاطفة في المواسم وينقطع كلياً بانقضائها.","يدرك فضل المداومة ويصعب عليه المحافظة على الحد الأدنى عند الفتور.","يتبنى فقه &quot;أدومه وإن قل&quot;، ويثبت على حده الأدنى الإيماني بصلابة."],["التعامل مع الفتور والذنب","يصاب بالإحباط والجلد الذاتي ويهجر الصلاة والعبادة إثر المعصية.","يثقل عليه الرجوع ويظل أسيراً لمشاعر الذنب المشوشة.","يستوعب طبيعة النفس، ويفزع للتوبة والحسنات الماحية فور كبوته."],["تطبيق تجميع العادات","يؤجل العبادات لأوقات فراغ خيالية لا تتحقق.","يربط بعض عباداته بالوقت المجرد ويتأثر بتغير الظروف.","يربط عباداته الذرية بسياقات وروتين يومه الثابت باقتدار."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: العادات الإيمانية المستدامة","sub":"","lines":["💡 البوصلة والمفهوم:","الإيمان ليس موجة حماس عابرة تثور ثم تنطفئ! أحب الأعمال إلى الله ما دام واستمر وإن قل حجمه. قطرات الماء المتتابعة برفق تفلق أصلب الصخور، بينما السيل الجارف يمر سريعاً ويترك الجفاف.","📖 الآية المحورية:","<span class=\"ayah\">﴿الَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ دَائِمُونَ﴾<\/span> <span class=\"ayref\">المعارج: 23<\/span>.","مِشكاة النبوة:","سُئِلَ رسول الله ﷺ: أَيُّ الأَعْمَالِ أَحَبُّ إِلَى اللهِ؟ قَالَ: <span class=\"hadith\">«أَدْوَمُهَا وَإِنْ قَلَّ»<\/span> <span class=\"takh\">[صحيح البخاري ومسلم]<\/span>.","📐 قواعد هندسة الاستدامة الإيمانية الثلاث:","1. قاعدة تجميع العادات: [بعد/قبل عادة يومية حتمية] + [سأؤدي العبادة الذرية].","2. فقه الفتور: إذا تراجعت طاقتك، احمِ فرائضك وحدك الأدنى ولا تتراجع عنه أبداً.","3. التدارك المباشر: الذنب لا يسوغ هجر الطاعة! <span class=\"qt\">«وَأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُهَا»<\/span>.","—hr—","🎯 المثلث الإيماني الذري (حدك الأدنى الذي لا يسقط أبداً):","1. صلاة الفجر في وقتها.","2. ورد القرآن الذري (صفحتان بعد صلاة الفجر مباشرة).","3. ركعة الوتر + أذكار النوم.","—hr—","📝 جدول تتبع تحدي المثلث الإيماني (ضع ✓ عند إتمام العادات الثلاث):","[ السبت ]  [ الأحد ]  [ الاثنين ]  [ الثلاثاء ]  [ الأربعاء ]  [ الخميس ]  [ الجمعة ]","(   )      (   )      (    )       (    )       (    )       (   )      (   )","عهد الفتى المسلم: \"أنا عبدٌ دائم العبودية لربي، صلاتي ووردي ديمةٌ ثابتة حتى ألقى الله\"."]}]}]}]},{"n":3,"title":"فقه الأولويات وإدارة الحياة","c":"azure","lessons":[{"id":"3-1","ordinal":"الثالث عشر","title":"بوصلة الأهداف","sub":"تحديد الغايات الكبرى وتجاوز التشتت","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثالثة: فقه الأولويات وإدارة الحياة"],["عنوان اللقاء","بوصلة الأهداف (تحديد الغايات الكبرى وتجاوز التشتت)"],["الرمز الكودي","U3-L13-GOAL"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل حوارية ومختبر هندسة الغايات وتصميم البوصلة الشخصية"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> الضياع والتشتت الحاد في العصر الرقمي ليس ناتجاً عن قلة الفرص، بل عن <b>\"غياب البوصلة والغايات الكبرى\"<\/b>. الشاب الذي لا يملك غاية وجودية صلبة تُصاغ اهتماماته بخوارزميات الشاشات ورغبات الأقران. إن ربط الأهداف المرحلية (الدراسة، المهارات، واللياقة) بـ <b>\"الغاية الوجودية العظمى (العبودية لله، الاستخلاف، وعمارة الأرض)\"<\/b> يمنح السعي معناه الحقيقي، ويمنح الشاب قوة حاسمة لبَتْر المشتتات واللغو."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفكك الفتى الفارق المفاهيمي بين \"الغاية الوجودية الكبرى\" و\"الهدف المرحلي الوسائلي\"، ويدرك مخاطر السيولة المعرفية والتشتت الرقمي."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى عزة الانتماء لمرضاة الله، متحرراً من القلق والخواء الوجودي واللهاث خلف الشهرة الزائفة."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يصمم الفتى وثيقة \"شجرة بوصلة الأهداف الشخصية\" تتضمن: غاية كبرى، و3 أهداف استراتيجية للعام الحالي، مع بتر 3 مشتتات رئيسية."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي اللقاء بطرح السؤال الصادم التالي دون تمهيد:"},{"t":"p","lvl":0,"h":"<b>\"لو دخلت سباقاً للجري وبذلت فيه أقصى طاقتك العضلية حتى تصبب عرقك وتقطعت أنفاسك وكنت أول الواصلين، ثم اكتشفت عند خط النهاية أنك ركضت في المضمار الخطأ كلياً وأن الجائزة في الاتجاه المعاكس.. ما شعورك؟ أليس هذا هو بالضبط حال من يركض طوال شبانه في تحصيل المتابعين، أو جمع المال، أو الألعاب، دون أن يسأل نفسه: إلى أين سينتهي بي هذا الطريق عند الموت؟\"<\/b>"},{"t":"li","lvl":0,"h":"<b>تشخيص المربي:<\/b> سيعبر الطلاب عن مشاعر الصدمة والخيبة والعبثية."},{"t":"li","lvl":0,"h":"<b>الترشيد الميسر:<\/b> السرعة لا تعني شيئاً إذا كان الاتجاه خاطئاً! البوصلة تسبق الساعة، والغاية تسبق الحركة."}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو الربان وبوصلة المجهول)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">سيناريو السفينة الفاخرة والمجهول<\/span>"},{"t":"p","lvl":0,"h":"تخيل سفينة محيطية عملاقة تُقدر بمليارات الدولارات، مزودة بأحدث محركات الملاحة والأنظمة الترفيهية ومحملة بآلاف الأطنان من الوقود والطعام."},{"t":"p","lvl":0,"h":"أبحر الربان بها في عرض المحيط، وبعد 3 أيام صعد أحد المسافرين وسأله:"},{"t":"p","lvl":0,"h":"- \"يا كابتن، السرعة مذهلة والمحركات جبارة.. لكن إلى أي ميناء نتجه؟\"."},{"t":"p","lvl":0,"h":"ابتسم الربان بكل برود وقال:"},{"t":"p","lvl":0,"h":"- \"في الحقيقة لا أدري! ليس لدينا خريطة ولا ميناء نرسو فيه.. المهم أننا نتحرك بسرعة ونستمتع بالموسيقى!\"."},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. ما هو المصير الحتمي لهذه السفينة بعد أسبوع حين ينفد الوقود وتواجه العواصف؟"},{"t":"p","lvl":0,"h":"2. أليست هذه السفينة صورة طبق الأصل لشاب يملك صحة وقدرات وهاتفاً متطوراً، لكنه يركض في الحياة بلا هدف مكتوب ولا غاية واضحة؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾<\/span> <span class=\"ayref\">الذاريات: 56<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> حسم وتحديد الغاية الكبرى للوجود البشري؛ فجميع الأهداف الدنيوية الفرعية يجب أن تدور في فلك العبودية ولا تعارضها."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَلَا تَكُونُوا كَالَّذِينَ نَسُوا اللَّهَ فَأَنسَاهُمْ أَنفُسَهُمْ ۚ أُولَٰئِكَ هُمُ الْفَاسِقُونَ﴾<\/span> <span class=\"ayref\">الحشر: 19<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> نسيان الغاية الشرعية يقود حتماً إلى تيه الهوية، والشتات النفسي، وفقدان الذات."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث عبد الله بن عمر رضي الله عنهما:<\/b> قال: أَخَذَ رَسُولُ اللَّهِ ﷺ بِمَنْكِبِي فَقَالَ: <span class=\"hadith\">«كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الرقاق، باب قول النبي ﷺ كن في الدنيا كأنك غريب، برقم 6416<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> عابر السبيل يركز على وجهته ومقصده النهائي، ولا تستهلكه الملهيات أو تفاصيل المحطات على جنبات الطريق."},{"t":"li","lvl":0,"h":"<b>حديث أنس بن مالك رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«مَنْ كَانَتِ الآخِرَةُ هَمَّهُ جَعَلَ اللَّهُ غِنَاهُ فِي قَلْبِهِ وَجَمَعَ لَهُ شَمْلَهُ، وَأَتَتْهُ الدُّنْيَا وَهِيَ رَاغِمَةٌ، وَمَنْ كَانَتِ الدُّنْيَا هَمَّهُ جَعَلَ اللَّهُ فَقْرَهُ بَيْنَ عَيْنَيْهِ، وَفَرَّقَ عَلَيْهِ شَمْلَهُ، وَلَمْ يَأْتِهِ مِنَ الدُّنْيَا إِلَّا مَا قُدِّرَ لَهُ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>جامع الترمذي: كتاب صفة القيامة والرقائق، برقم 2465، وصححه الألباني في صحيح الترغيب برقم 3169<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الفقهي والنفسي:<\/i> وحدة الغاية توحد شتات العقل وتمنح الغنى والسكينة، بينما تفرّق الغايات يشتت الطاقات ويورث القلق الدائم."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف النبي ﷺ عند مساومة قريش:<\/b> عندما عرضت عليه قريش عبر عمه أبي طالب المال والملك والشرف ليترك دعوته، تجلت وحدة الغاية ووضوح البوصلة في رده الحازم: <span class=\"qt\">«يَا عَمِّ، وَاللَّهِ لَوْ وَضَعُوا الشَّمْسَ فِي يَمِينِي، وَالْقَمَرَ فِي يَسَارِي عَلَى أَنْ أَتْرُكَ هَذَا الأَمْرَ حَتَّى يُظْهِرَهُ اللَّهُ أَوْ أَهْلِكَ فِيهِ مَا تَرَكْتُهُ»<\/span> [السيرة النبوية لابن هشام 1/266]."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: هرم الغايات (الغاية العظمى vs الأهداف المرحلية)<\/b>"},{"t":"li","lvl":0,"h":"توضيح الهيكلية:"},{"t":"li","lvl":1,"h":"<b>قمة الهرم (الغاية الكبرى):<\/b> رضا الله والجنة والعبودية وعمارة الأرض بالخير."},{"t":"li","lvl":1,"h":"<b>قاعدة الهرم (الأهداف الوسائلية):<\/b> التفوق الدراسي، اللياقة البدنية، إتقان البرمجة، والنجاح المهني."},{"t":"li","lvl":0,"h":"تحويل الأهداف الدنيوية إلى عبادات: النية الصالحة تجعل المذاكرة وتطوير الجسد والمهارة أدوات لنصرة الدين والأمة ونيل الأجر."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: فخ التشتت الرقمي وتغير الاهتمامات السريع<\/b>"},{"t":"li","lvl":0,"h":"تحليل ظاهرة \"التقلب الأسبوعي\": ملاحقة كل صيحة وتريند يجعل الشاب مجرد مستهلك سطحي؛ فالتركيز وبتر الخيارات الفائضة هو الشرط الحاسم للتميز والعمق."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"هل يتعارض تحديد الغاية بالآخرة والعبودية مع الطموح للثراء وبناء المشاريع والشهرة العالمية؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> إطلاقاً! كان عثمان بن عفان وعبد الرحمن بن عوف من كبار الأثرياء وسخرا مالهما للتمكين والصدقة. الإسلام لا يحرم النجاح الدنيوي، بل يرفض أن تكون الدنيا هي \"الغاية النهائية والمستقر\"، ويطلب أن تكون خادمة للرسالة."}]},{"t":"qa","n":"2","q":"\"أشعر أن اهتماماتي كثيرة وأريد أن أكون مبرمجاً، ورياضياً، ومحامياً، وطبيباً في آن واحد.. فكيف أحسم؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هذا يسمى \"تشتت البدايات\". الاستكشاف مطلوب لفترة وجيزة، لكن التميز الحقيقي يفرض <b>\"التركيز وبتر التفرعات\"<\/b>. اختر مجالاً أساسياً وركز عليه جهودك لمدة عام كامل لتبني فيه عضلات الإتقان."}]},{"t":"qa","n":"3","q":"\"كيف أتصرف إذا شعرت بالملل والفتور بعد أسابيع من كتابة أهدافي؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الحماس الأولي يزول دائماً؛ لذلك لا نعتمد على الحماس، بل نعتمد على \"نظام الانضباط اليومي والارتباط بالغاية الكبرى\". ذكر نفسك يومياً بالهدف، وجدد العهد مع الله أسبوعياً."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>ربّان البوصلة (الميسر الشاب):<\/b> إدارة مداخلات الحوار وضبط النقاش حول السفينة."},{"t":"li","lvl":0,"h":"<b>مهندس الخريطة (المدوّن):<\/b> رسم \"هرم الغايات والأهداف\" على السبورة وتدوين المشاركات."},{"t":"li","lvl":0,"h":"<b>محامي التشتت (المعارض):<\/b> إثارة حجة \"الحياة تجارب ويجب تجربة كل شيء بلا قيود\"."},{"t":"li","lvl":0,"h":"<b>حارس الزمن (الميقاتي):<\/b> الالتزام الدقيق بجدول الدقائق."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر ورشة شجرة البوصلة الشخصية (Personal Compass Tree)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> ورقة عمل مصممة (A4) تحتوي مجسم الشجرة ثلاثي الأبعاد + أقلام ملونة."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<b>الجذور (الغاية الوجودية):<\/b> كتابة بيان الهوية: <i>\"أنا عبد مصلح ومستخلف، غايتي مرضاة الله ونفع الأمة\"<\/i>."},{"t":"li","lvl":1,"h":"<b>الأغصان (3 أهداف استراتيجية للعام):<\/b>"},{"t":"li","lvl":2,"h":"<i>هدف إيماني/خلقي:<\/i> (حفظ جزءين من القرآن والمحافظة على الفجر)."},{"t":"li","lvl":2,"h":"<i>هدف عقلي/دراسي:<\/i> (معدل 95% وقراءة 6 كتب تأسيسية)."},{"t":"li","lvl":2,"h":"<i>هدف مهاري/بدني:<\/i> (إتقان مهارة تقنية وبرنامج رياضي محدد)."},{"t":"li","lvl":1,"h":"<b>المقص وبَتْر المشتتات:<\/b> كتابة 3 لصوص وقت يلتزم الشاب بقصهم واستئصالهم هذا الأسبوع."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: سهيل ودوامة الطموحات المتغيرة<\/span>"},{"t":"p","lvl":0,"h":"سهيل (17 سنة) شاب متوقد الذكاء، لكنه يقع في فخ التشتت السريع:"},{"t":"p","lvl":0,"h":"- الأسبوع 1: شاهد مقطعاً عن الذكاء الاصطناعي، فاشترى دورة وأعلن أنه سيصبح خبيراً تقنياً!"},{"t":"p","lvl":0,"h":"- الأسبوع 2: شاهد مقطعاً لبطل رياضي، فترك الدورة واشترك في نادٍ وقال: \"مستقبلي في الألعاب القتالية!\"."},{"t":"p","lvl":0,"h":"- الأسبوع 3: شاهد رائد أعمال يتحدث عن التجارة الرقمية، فترك الرياضة وبدأ يبحث عن منتجات للبيع!"},{"t":"p","lvl":0,"h":"بعد 6 أشهر: لم يتعلم برمجة، ولم يبنِ لياقة، ولم يربح شيئاً، وتراجع مستواه المدرسي بشكل حاد وأصيب بالإحباط!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. ما الجذر الفكري والنفسي لأزمة سهيل؟"},{"t":"p","lvl":0,"h":"2. كيف تسلب منصات التواصل بوصلة الشاب إذا لم تكن له غاية صلبة؟"},{"t":"p","lvl":0,"h":"3. صمم خطة علاجية لسهيل ترتكز على \"قانون التركيز وبتر الشتات\"."}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال سباق الجري في المضمار الخاطئ."],["05 - 15 د","الخطاف الحواري","عرض سيناريو السفينة التائهة وإدارة النقاش."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","آيات العبودية، حديث الغريب والهمة، وموقف النبي ﷺ."],["30 - 45 د","المختبر ودراسة الحالة","تمرين شجرة البوصلة وتفكيك حالة سهيل في المجموعات."],["45 - 55 د","بنك الأسئلة الجدلية","تفكيك التعارض بين الطموح الدنيوي والآخرة، وحسم التشتت."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة استمارة التحدي وبتر المشتت الأكبر."],["65 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع الأدوار للقاء القادم."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 14-24","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«إن اختلال ميزان الأولويات هو الداء العضال... وأول الأولويات هو ضبط الغايات وتقديم الأصول الكلية على الفروع الجزئية»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 29-34","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«سؤال الهوية هو المبتدأ؛ فلا هوية لمسلم قبل فهم مبدأ العبودية واستيعاب الغاية التي خلق من أجلها»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 71-73","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«الفوضى المعرفية المعاصرة تفرض على الشاب أن يمتلك بوصلة ترشيد، حتى لا تبتلعه موجات الشتات الرقمي»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 31-33","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«الصراع في داخل المراهق يشتد بين تعدد رغباته وضعف خبرته؛ ولذا فإن أهم ما يحتاجه هو المساعدة على حسم خياراته وتحديد أهدافه»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 56-57","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«ضياع الهدف لدى الفتى هو الذي يولد الفراغ ويقوده للانسياق خلف الأقران أو العوالم الافتراضية»<\/span>."},{"t":"src","cite":"النبأ العظيم - محمد عبد الله دراز - ص د","short":"النبأ العظيم — محمد عبد الله دراز","q":"<span class=\"qt\">«الغاية السامية في منهج القرآن هي العبودية الخالصة لله واستخلافه في الأرض، التي تنتظم سائر شؤون الحياة»<\/span>."},{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«الرجولة في القرآن رؤية واضحة وثبات على الغاية الكبرى: رجال لا تلهيهم تجارة ولا بيع عن ذكر الله»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 27-28","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«الوقت هو وعاء العمل وميدان السباق، ومن ضيع بوصلة غايته صار وقته نهباً للمشتتات والبطالين»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>سلطة الثقافة الغالبة<\/i> — الشيخ إبراهيم السكران (فصل: مركزية الآخرة والتحرر من ضغط النماذج الاستهلاكية، ص 45-75)."},{"t":"li","lvl":1,"h":"<i>بناء الأهداف والمسارات للشباب<\/i> — د. محمد بن عبد الله الدويش <span class=\"pg\">ص 25-50<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي:<\/b> \"كيف تحدد بوصلتك وتنجو من التشتت في العصر الرقمي؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"فخ الأهداف السطحية وكيف تجد غايتك الكبرى؟\" — قناة دوباميكافين على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"تثبيت البوصلة وبَتْر المشتت الأكبر\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. تثبيت وثيقة البوصلة:","[ ] تعليق \"شجرة بوصلة الأهداف\" في مكان بارز فوق مكتب المذاكرة في المنزل.","2. بَتْر المشتت الأكبر (Digital Isolation):","[ ] تحديد أكبر تطبيق أو لعبة تستهلك وقتك ووضع قفل عليها أو حذفها لمدة 7 أيام.","3. تركيز الـ 45 دقيقة اليومية:","[ ] إنجاز 45 دقيقة يومياً دون مقاطعة للعمل على هدفك الاستراتيجي الأول."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["وضوح الغاية والبوصلة","يعيش بعشوائية ويلهث خلف التريندات والأهداف المادية المؤقتة.","يحدد أهدافاً دنيوية جيدة لكنه يفصلها عن الغاية الإيمانية الكبرى.","يربط دراسته ومهاراته بغاية العبودية ونفع الأمة برؤية متماسكة."],["مقاومة التشتت الرقمي","يبدل اهتماماته أسبوعياً وينقاد لكل مؤثر جديد يراه في الشاشات.","يدرك تشتته ويحاول التركيز لكنه يستسلم للمقاطعات بعد أيام.","يبتر المشتتات بحزم، ويركز على مسار محدد لمدة طويلة حتى يتقنه."],["الالتزام بالهدف المرحلي","يكتفي بالأمنيات الشفهية دون أي تقدم عملي على الأرض.","يتقدم في أهدافه على فترات متقطعة بحسب المزاج والنشاط.","يخصص وقتاً يومياً ثابتاً للعمل على أهدافه الاستراتيجية بانضباط تام."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: بوصلة الأهداف وحسم الشتات","sub":"","lines":["💡 البوصلة والمفهوم:","السرعة بلا اتجاه دمارٌ مؤكد! قيمتك ليست في كثرة حركتك، بل في \"ثبات بوصلتك\". الشاب المسلم لا تصنعه خوارزميات الشاشات، بل يقود سفينة حياته بغاية وجودية صلبة: العبودية لله، وعمارة الأرض، والريادة في ميدانه.","📖 الآية المحورية:","<span class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾<\/span> <span class=\"ayref\">الذاريات: 56<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«مَنْ كَانَتِ الآخِرَةُ هَمَّهُ جَعَلَ اللَّهُ غِنَاهُ فِي قَلْبِهِ وَجَمَعَ لَهُ شَمْلَهُ»<\/span> <span class=\"takh\">[سنن الترمذي]<\/span>.","📐 قواعد تثبيت البوصلة الثلاث:","1. الغاية تسبق الحركة: حدد الميناء قبل أن تشعل المحركات.","2. التميز في البتر: ترك المشتتات والخيارات الفائضة هو ثمن التميز الحقيقي.","3. وحدة الهم: من جعل الهموم هماً واحداً كفاه الله شتات أمره.","—hr—","🎯 أهدافي الاستراتيجية الثلاثة لهذا العام:","1. الهدف الإيماني: _________________________________________________","2. الهدف الدراسي: _________________________________________________","3. الهدف المهاري/البدني: ____________________________________________","—hr—","📝 جدول تتبع تحدي التركيز اليومي (45 دقيقة عمل مركز بغير هاتف):","[ السبت ]  [ الأحد ]  [ الاثنين ]  [ الثلاثاء ]  [ الأربعاء ]  [ الخميس ]  [ الجمعة ]","(   )      (   )      (    )       (    )       (    )       (   )      (   )","عهد الفتى المسلم: \"أنا شاب صاحب غاية ورسالة، بوصلتي مرضاة ربي، ولن أكون نهباً للمشتتات\"."]}]}]},{"id":"3-2","ordinal":"الرابع عشر","title":"مصفوفة المهام","sub":"التمييز بين العاجل والمهم وتخطيط الأسبوع","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثالثة: فقه الأولويات وإدارة الحياة"],["عنوان اللقاء","مصفوفة المهام (التمييز بين العاجل والمهم وتخطيط الأسبوع)"],["الرمز الكودي","U3-L14-MATRIX"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل حوارية وتطبيقية حول إدارة الأولويات وتخطيط الأسبوع"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> يعيش غالب الشباب في استنزاف نفسي دائم نتيجة \"إطفاء الحرائق واللهاث خلف العاجل\" كالاختبارات المفاجئة والطلبات الطارئة، بينما يُهمل <b>\"المهم غير العاجل\" (المربع الذهبي)<\/b> كالبناء الإيماني، والمذاكرة التراكمية، وبناء المهارات، مع أنه الجوهر الذي يصنع المستقبل المتين. إن الانتقال من عقلية الطوارئ إلى <b>\"عقلية الاستباق والجدولة الأسبوعية\"<\/b> يمثل جوهر فقه الأولويات الشرعي."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يستوعب الفتى مصفوفة المربعات الأربعة (أيزنهاور وفقه الأولويات)، ويميز بدقة بين صراخ \"العاجل\" وقيمة \"المهم\"."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يتحرر الفتى من توتر اللحظات الأخيرة والهلع العصبي، ويستشعر سكينة الانضباط والتحكم في وقته."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يصمم الفتى \"جدول الأسبوع الاستباقي\" متضمناً 3 مهام ركينة في المربع الثاني، مع بتر وتفويض مهام المربعين الثالث والرابع."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بطرح هذا التساؤل المباشر:"},{"t":"p","lvl":0,"h":"<b>\"إذا كان لديك غداً امتحان مصيري في مادة صعبة لم تفتحها بعد، ورن هاتفك الآن باتصال عاجل من صديق يطلب منك النزول للعب مباراة كرة قدم فوراً وإلا خسر الفريق.. أيهما يفرض صراخه ولحاحته عليك في هذه اللحظة؟ وأيهما يبني مستقبلك حقيقة؟ ولماذا نضحي بأهم ما نملك من أجل إرضاء صراخ الشيء العاجل؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو إطفائي الحرائق ورسام اللوحة)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة طارق وسامي: رجل الإطفاء vs الرسام المخطط<\/span>"},{"t":"p","lvl":0,"h":"- طارق (17 سنة): يقضي يومه كـ \"رجل إطفاء الحرائق\"؛ يقفز مذعوراً من إشعار هاتف، إلى مذاكرة امتحان غد في اللحظة الأخيرة، إلى تلبية طلبات مفاجئة! في نهاية اليوم يخر مجهداً محبطاً؛ لم يحفظ قرآناً، ولم يقرأ كتاباً، ولم يمارس رياضة!"},{"t":"p","lvl":0,"h":"- سامي (17 سنة): يخصص مساء كل جمعة 15 دقيقة لكتابة جدول أسبوعه. يحدد أوقات المذاكرة قبل الامتحانات بأسابيع، وأوقات صلاته ورياضته. عندما تفاجئه الطلبات والمشتتات يقول بثقة وهدوء: \"آسف، هذا وقت المذاكرة/الرياضة، سأكون متاحاً لاحقاً\"."},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. لماذا يستسلم معظمنا لنمط رجل الإطفاء مثل طارق ونبتعد عن هدوء وتخطيط سامي؟"},{"t":"p","lvl":0,"h":"2. هل الشيء العاجل دائماً هو الأهم؟ أم أنه مجرد خادع يسرق أعمارنا؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾<\/span> <span class=\"ayref\">الشرح: 7-8<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> التوجيه القرآني لترتيب الأوقات والجدولة المتصلة؛ لا فراغ مهدور في حياة المسلم، بل انتقال منظم من طاعة إلى عمل ومن إنجاز إلى عبادة."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُلْهِكُمْ أَمْوَالُكُمْ وَلَا أَوْلَادُكُمْ عَن ذِكْرِ اللَّهِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ﴾<\/span> <span class=\"ayref\">المنافقون: 9<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> تحذير صريح من طغيان العواجل الدنيوية والشواغل العارضة على المهم الأكبر وهو حق الله وبناء الروح."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أبي هريرة رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجَزْ»<\/span> <span class=\"takh\">[صحيح مسلم: كتاب القدر، برقم 2664]<\/span>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> الحرص يجب أن يتوجه للمهم الذي يمتد نفعه وأثره، مع استباق العجز بتنظيم الوقت والتوكل على الله."},{"t":"li","lvl":0,"h":"<b>أثر عبد الله بن مسعود رضي الله عنه في ذم الفراغ والعشوائية:<\/b> <span class=\"qt\">«إِنِّي لَأَكْرَهُ أَنْ أَرَى الرَّجُلَ فَارِغًا سَبَهْلَلًا؛ لاَ فِي عَمَلِ دُنْيَا وَلاَ فِي عَمَلِ آخِرَةٍ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>أخرجه ابن أبي شيبة في المصنف برقم 35686، والمعجم
