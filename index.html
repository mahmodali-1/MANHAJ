<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1F22">
<title>دليل المربي | المنهج التربوي التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1F22; --bg2:#10272B; --surface:#14302F; --surface2:#1A3A3A; --line:rgba(237,230,214,.09); --line2:rgba(237,230,214,.16);
  --text:#EDE6D6; --text2:#C9C3B4; --muted:#8FA6A1; --gold:#D8B46A; --gold2:#F0D49A; --gold-t:rgba(216,180,106,.10);
  --mint:#74D2B4; --mint-t:rgba(116,210,180,.10); --danger:#F08C7C;
  --emerald:#5CCB9F; --amber:#EBAA55; --azure:#72AEF2; --rose:#E88394; --lavender:#AE98F4;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7);
  --fs:17px; --r:18px;
  --font:'Tajawal','Amiri Quran',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EAF0EE; --bg2:#E1E9E6; --surface:#FFFFFF; --surface2:#F3F6F5; --line:rgba(15,42,46,.09); --line2:rgba(15,42,46,.16);
    --text:#122B2E; --text2:#34504F; --muted:#63807B; --gold:#9A6F1E; --gold2:#7D5913; --gold-t:rgba(154,111,30,.08);
    --mint:#1E8E6E; --mint-t:rgba(30,142,110,.08); --danger:#B84A3A;
    --emerald:#1F9A6F; --amber:#B7731A; --azure:#2F6FC2; --rose:#B8465C; --lavender:#6B52C9;
    --shadow:0 18px 40px -24px rgba(15,42,46,.35); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EAF0EE; --bg2:#E1E9E6; --surface:#FFFFFF; --surface2:#F3F6F5; --line:rgba(15,42,46,.09); --line2:rgba(15,42,46,.16);
  --text:#122B2E; --text2:#34504F; --muted:#63807B; --gold:#9A6F1E; --gold2:#7D5913; --gold-t:rgba(154,111,30,.08);
  --mint:#1E8E6E; --mint-t:rgba(30,142,110,.08); --danger:#B84A3A;
  --emerald:#1F9A6F; --amber:#B7731A; --azure:#2F6FC2; --rose:#B8465C; --lavender:#6B52C9;
  --shadow:0 18px 40px -24px rgba(15,42,46,.35); color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{overflow-x:clip;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.85;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.u-emerald{--acc:var(--emerald)} .u-amber{--acc:var(--amber)} .u-azure{--acc:var(--azure)} .u-rose{--acc:var(--rose)} .u-lavender{--acc:var(--lavender)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:10px;height:58px}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);line-height:1.2}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;color:var(--text2);transition:background .2s}
.ibtn:hover,.ibtn:active{background:var(--surface2)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.brand .star{width:30px;height:30px;color:var(--gold)}
.prog{position:absolute;inset-inline:0;bottom:-1px;height:2px;background:transparent}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc,var(--gold)),var(--gold));transition:width .1s linear;margin-inline-start:0}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:64px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:500;color:var(--muted);transition:color .2s}
.nav button.on{color:var(--gold)}
.nav button.on svg{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--gold) 45%,transparent))}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));min-height:100vh}
.view{animation:vin .38s cubic-bezier(.2,.7,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;padding:34px 0 26px}
.hero .khatam{position:absolute;width:520px;height:520px;inset-inline-start:-190px;top:-170px;color:var(--gold);opacity:.13;animation:spin 140s linear infinite}
.hero .khatam2{position:absolute;width:260px;height:260px;inset-inline-end:-90px;top:120px;color:var(--mint);opacity:.08;animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{position:relative;font-size:clamp(2.1rem,9vw,3.3rem);line-height:1.15;font-weight:900;margin:14px 0 10px;letter-spacing:-.5px}
.hero h1 span{display:block;font-weight:300;font-size:.5em;color:var(--gold);letter-spacing:0;margin-bottom:6px}
.hero p{position:relative;margin:0;color:var(--text2);font-size:1rem;max-width:34ch}
.facts{position:relative;display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.fact{padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;color:var(--text2)}
.fact b{font-size:1.25rem;color:var(--text);margin-inline-end:6px;font-weight:800}
.resume{display:flex;align-items:center;gap:14px;margin:22px 0 6px;padding:16px;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));box-shadow:var(--shadow)}
.resume .t{flex:1;min-width:0}
.resume .t small{color:var(--muted);font-size:.78rem;display:block}
.resume .t b{display:block;font-size:1rem;line-height:1.5}
.resume .go{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--bg);display:grid;place-items:center;flex:none}
.h2{font-size:1.2rem;font-weight:800;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.h2::after{content:"";flex:1;height:1px;background:var(--line)}
.units{display:grid;gap:14px}
.ucard{position:relative;display:block;padding:20px 20px 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:transform .25s,border-color .25s}
.ucard:active{transform:scale(.985)}
.ucard::before{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%)}
.ucard .num{font-size:.8rem;font-weight:700;color:var(--acc);display:flex;align-items:center;gap:8px}
.ucard .num .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.ucard h3{margin:6px 0 10px;font-size:1.3rem;line-height:1.45;font-weight:800;position:relative}
.ucard .meta{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:.85rem}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.legend{margin-top:26px;padding:18px;border-radius:var(--r);border:1px dashed var(--line2);color:var(--text2);font-size:.9rem}
.legend h4{margin:0 0 10px;font-size:.95rem;color:var(--text)}
.legend .lg{display:flex;align-items:flex-start;gap:10px;margin:8px 0}
.legend .sw{flex:none;margin-top:6px;width:14px;height:14px;border-radius:4px}

/* ---------- unit page ---------- */
.uhead{padding:26px 0 18px;position:relative}
.uhead .kick{color:var(--acc);font-weight:700;font-size:.9rem}
.uhead h1{margin:6px 0 8px;font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.3;font-weight:900}
.uhead p{margin:0;color:var(--muted);font-size:.92rem}
.lessons{display:grid;gap:10px;margin-top:10px;position:relative}
.lrow{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.lrow:active{transform:scale(.99)}
.lrow .t{flex:1;min-width:0}
.lrow .t small{color:var(--acc);font-weight:700;font-size:.78rem}
.lrow .t b{display:block;font-size:1.02rem;line-height:1.5;font-weight:700}
.lrow .t span{display:block;color:var(--muted);font-size:.82rem;line-height:1.6;margin-top:2px}
.lrow .done{color:var(--mint)}
.sbadge{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center;font-weight:800;color:var(--acc)}
.sbadge svg{position:absolute;inset:0;width:100%;height:100%}
.sbadge span{position:relative;font-size:1rem}

/* ---------- lesson ---------- */
.lhero{position:relative;padding:24px 0 12px;overflow:hidden}
.lhero .band{position:absolute;inset-inline:-40px;top:-60px;height:220px;background:radial-gradient(80% 90% at 80% 0%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%);pointer-events:none}
.lhero .kick{position:relative;color:var(--acc);font-weight:700;font-size:.88rem}
.lhero h1{position:relative;margin:4px 0 6px;font-size:clamp(1.65rem,7.4vw,2.35rem);line-height:1.35;font-weight:900}
.lhero .sub{position:relative;color:var(--text2);margin:0;font-size:.98rem;line-height:1.7}
.actions{position:relative;display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);font-weight:700;font-size:.9rem;transition:background .2s}
.btn.pri{background:var(--acc);color:#0D1F22;border-color:transparent}
.btn.on{background:var(--mint-t);color:var(--mint);border-color:color-mix(in srgb,var(--mint) 40%,transparent)}
.btn svg.i{width:19px;height:19px}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:14px -18px 0}
.chips .sc{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}
.chips .sc::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:12px;font-size:.82rem;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);white-space:nowrap;transition:all .25s}
.chip em{font-style:normal;font-weight:800;font-size:.75rem;opacity:.7}
.chip.on{color:#0D1F22;background:var(--acc);border-color:transparent;font-weight:700}
.sec{padding-top:26px;scroll-margin-top:130px}
.sech{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sech .sbadge{width:42px;height:42px}
.sech h2{margin:4px 0 0;font-size:1.22rem;line-height:1.5;font-weight:800}
.sech h2 small{display:block;font-size:.78rem;color:var(--muted);font-weight:500;line-height:1.6;margin-top:2px}
.sech .ic{margin-inline-start:auto;color:var(--acc);opacity:.8;margin-top:8px}
.body{overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px}
.body>*:first-child{margin-top:0}
.p{margin:.35em 0 .6em;color:var(--text)}
.sub4{margin:1em 0 .5em;font-size:1.02rem;font-weight:800;color:var(--acc);display:flex;align-items:center;gap:8px}
.sub4::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--acc);transform:rotate(45deg)}
.li{display:flex;gap:10px;margin:.45em 0;align-items:flex-start}
.li .bul{flex:none;width:7px;height:7px;margin-top:.8em;border-radius:50%;background:var(--acc)}
.li>div{flex:1;min-width:0}
.li.l1{margin-inline-start:18px}.li.l1 .bul{background:transparent;border:1.5px solid var(--acc)}
.li.l2{margin-inline-start:36px}.li.l2 .bul{width:6px;height:2px;border-radius:2px;margin-top:.95em;background:var(--muted)}
.li.l3{margin-inline-start:52px}
.li.grp{margin-top:1em}.li.grp .bul{display:none}
.li.grp>div{font-weight:800;color:var(--text)}
b{font-weight:700;color:var(--text)}
i{font-style:normal;color:var(--gold2);font-weight:500}
.body b{color:color-mix(in srgb,var(--text) 92%,var(--acc))}

/* sacred texts */
.ayah{font-size:1.12em;font-weight:500;color:var(--gold2);line-height:2.1}
.ayah.blk{display:block;margin:.55em 0;padding:.75em 1em;border-radius:14px;background:var(--gold-t);border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);text-align:center;position:relative}
.ayref{display:inline-block;font-size:.72em;font-weight:700;color:var(--gold);padding:0 .6em;border-radius:20px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);line-height:1.8;margin:0 2px;vertical-align:middle}
.ayah.blk+.ayref{display:table;margin:-.2em auto .6em}
.hadith{color:var(--mint);font-weight:500}
.hadith.blk{display:block;margin:.55em 0;padding:.7em 1em;border-radius:14px;background:var(--mint-t);border-inline-start:3px solid var(--mint)}
.qt{color:var(--text)}
.takh{font-size:.78em;color:var(--muted)}
.pg{font-size:.75em;color:var(--muted);padding:0 .45em;border-radius:6px;background:var(--surface2);white-space:nowrap}
.lbl{display:inline-block;font-weight:800;color:var(--acc);padding:.15em .8em;border-radius:10px;background:color-mix(in srgb,var(--acc) 12%,transparent)}
sup{font-size:.7em}

/* source dropdowns */
details.src{margin:.5em 0;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);overflow:hidden}
details.src summary{list-style:none;display:flex;align-items:center;gap:8px;padding:.45em .8em;cursor:pointer;font-size:.8rem;font-weight:500;color:var(--muted);min-height:38px}
details.src summary::-webkit-details-marker{display:none}
details.src .ico{color:var(--gold);font-size:.8rem}
details.src .st{flex:1;min-width:0;line-height:1.5}
.chev{width:9px;height:9px;border-inline-start:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .25s;margin-inline-end:4px}
details[open]>summary .chev{transform:rotate(135deg)}
details.src[open]{border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
details.src[open] summary{color:var(--gold)}
details.src .sb{padding:.2em .9em .8em;font-size:.93em;animation:dd .3s ease}
@keyframes dd{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
details.src blockquote{margin:0 0 .5em;padding:.2em .8em;border-inline-start:2px solid var(--gold);color:var(--text2)}
details.src cite{display:block;font-style:normal;font-size:.8em;color:var(--muted)}
details.src.tk{display:inline-block;vertical-align:middle;margin:.2em 0}
details.src.tk summary{min-height:28px;padding:.1em .7em;font-size:.72rem}
details.src.tk[open]{display:block}
details.srcsec{border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);overflow:hidden}
details.srcsec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
details.srcsec>summary::-webkit-details-marker{display:none}
details.srcsec>summary .t{flex:1}
details.srcsec>summary .t b{display:block;font-size:.95rem}
details.srcsec>summary .t small{color:var(--muted);font-size:.78rem}
details.srcsec>summary .ic{color:var(--gold)}
details.srcsec .in{padding:0 16px 14px;border-top:1px solid var(--line)}
.srcitem{border-bottom:1px solid var(--line)}
.srcitem:last-child{border-bottom:0}
.srcitem details summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;font-weight:500;font-size:.9rem}
.srcitem details summary::-webkit-details-marker{display:none}
.srcitem details summary .bk{flex:1;line-height:1.55}
.srcitem details summary .bk small{display:block;color:var(--muted);font-size:.75rem;font-weight:400}
.srcitem .q{padding:0 0 12px;color:var(--text2);border-inline-start:2px solid var(--gold);padding-inline-start:12px;margin-bottom:12px;animation:dd .3s ease}

/* Q&A */
.qa{border-radius:16px;border:1px solid var(--line2);background:var(--bg2);margin:.7em 0;overflow:hidden}
.qa .qq{display:flex;gap:12px;padding:14px;align-items:flex-start}
.qa .qn{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.qa .qt2{flex:1;font-weight:700;line-height:1.7}
.qa .rev{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-top:1px dashed var(--line2);font-size:.85rem;font-weight:700;color:var(--acc)}
.qa .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.7,.2,1)}
.qa .ans>div{overflow:hidden}
.qa .ans .pad{padding:0 14px 14px}
.qa.open .ans{grid-template-rows:1fr}
.qa.open .rev{color:var(--muted)}

/* timeline */
.tl{position:relative;padding-inline-start:4px}
.tl .st{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0}
.tl .st::before{content:"";position:absolute;inset-inline-start:37px;top:44px;bottom:-10px;width:1.5px;background:var(--line2)}
.tl .st:last-child::before{display:none}
.tl .tm{width:76px;text-align:center;font-size:.78rem;font-weight:800;color:var(--acc);padding:6px 0;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,transparent);height:fit-content;direction:ltr}
.tl .st.now .tm{background:var(--acc);color:#0D1F22;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}
.tl .ph{font-weight:800;line-height:1.5}
.tl .ds{color:var(--text2);font-size:.92rem;line-height:1.75}

/* matrix */
.mx{display:grid;gap:12px}
.mx .cr{border-radius:16px;border:1px solid var(--line2);overflow:hidden}
.mx .cr h5{margin:0;padding:10px 14px;font-size:.95rem;background:var(--bg2)}
.mx .lv{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:.9rem;line-height:1.7}
.mx .lv .tg{font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:8px;height:fit-content;white-space:nowrap}
.mx .lv:nth-of-type(1) .tg{background:rgba(240,140,124,.14);color:var(--danger)}
.mx .lv:nth-of-type(2) .tg{background:var(--gold-t);color:var(--gold)}
.mx .lv:nth-of-type(3) .tg{background:var(--mint-t);color:var(--mint)}

/* kv */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.kv div.w{grid-column:1/-1}
.kv small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.kv span{font-weight:700;font-size:.92rem;line-height:1.6}

/* worksheet card */
.sheet{position:relative;border-radius:20px;padding:20px 18px;background:
  linear-gradient(var(--surface2),var(--surface2)) padding-box,
  linear-gradient(140deg,color-mix(in srgb,var(--acc) 70%,transparent),transparent 40%,color-mix(in srgb,var(--gold) 60%,transparent)) border-box;border:1.5px solid transparent}
.sheet .sh{text-align:center;margin-bottom:12px;padding:0 38px}
.sheet .sh b{display:block;font-size:1.12rem;font-weight:800;line-height:1.5}
.sheet .sh small{color:var(--muted);font-size:.85rem}
.sheet{overflow:hidden}
.sheet .ln{margin:.35em 0;line-height:1.85;overflow-wrap:anywhere}
.fill{display:inline-block;width:min(60%,260px);height:1.1em;border-bottom:1.5px dotted var(--muted);vertical-align:baseline;margin-inline-start:4px;opacity:.7}
.sheet .k{margin-top:1em;font-weight:800;color:var(--acc)}
.sheet hr{border:0;height:1px;background:var(--line2);margin:14px 0}
.sheet .wl{height:26px;border-bottom:1.5px dotted var(--line2);margin:0 0 6px}
.sheet .cb{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.sheet .cb .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);margin-top:.35em;display:grid;place-items:center;transition:all .2s}
.sheet .cb.on .box{background:var(--mint);border-color:var(--mint)}
.sheet .cb.on .box::after{content:"";width:9px;height:5px;border-bottom:2px solid var(--bg);border-inline-start:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:.6em 0}
.days button{padding:8px 0;border-radius:10px;border:1px solid var(--line2);font-size:.7rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.days button i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2)}
.days button.on{color:var(--mint);border-color:var(--mint)}
.days button.on i{background:var(--mint);border-color:var(--mint)}
.pbtn{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--bg2)}
.pbtn svg.i{width:18px;height:18px}
table.tb{width:100%;border-collapse:collapse;font-size:.88rem}
.tbw{overflow-x:auto}
table.tb td,table.tb th{border:1px solid var(--line2);padding:8px;vertical-align:top}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:34px 0 10px}
.pager a{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-height:84px}
.pager a small{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:.78rem}
.pager a b{display:block;font-size:.92rem;line-height:1.55;margin-top:4px}
.pager a.nx{text-align:left}
.pager a.nx small{justify-content:flex-end}
.pager .ph{visibility:hidden}

/* sheets / overlays */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,10,11,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheetp{position:fixed;inset-inline:0;bottom:0;z-index:61;max-height:86vh;display:flex;flex-direction:column;background:var(--bg2);border-radius:26px 26px 0 0;border-top:1px solid var(--line2);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:760px;margin:0 auto}
.sheetp.on{transform:none}
.sheetp .grab{width:44px;height:5px;border-radius:5px;background:var(--line2);margin:10px auto 4px}
.sheetp .hd{display:flex;align-items:center;padding:6px 18px 10px;gap:10px}
.sheetp .hd b{flex:1;font-size:1.1rem}
.sheetp .ct{overflow-y:auto;padding:0 18px 22px}
.idxu{margin:10px 0 4px;font-weight:800;color:var(--acc);font-size:.9rem;display:flex;gap:8px;align-items:center}
.idxl{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;font-size:.92rem;line-height:1.5}
.idxl:active,.idxl.cur{background:var(--surface)}
.idxl.cur{color:var(--acc);font-weight:700}
.idxl em{font-style:normal;font-size:.75rem;color:var(--muted);flex:none;width:22px;text-align:center}
.srch{display:flex;align-items:center;gap:10px;padding:0 14px;height:52px;border-radius:16px;background:var(--surface);border:1px solid var(--line2)}
.srch input{flex:1;background:none;border:0;outline:0;color:var(--text);font-family:inherit;font-size:1rem}
.res{display:block;padding:12px 4px;border-bottom:1px solid var(--line)}
.res small{color:var(--acc);font-size:.75rem;font-weight:700}
.res b{display:block;font-size:.95rem}
.res p{margin:4px 0 0;color:var(--text2);font-size:.85rem;line-height:1.7}
.res mark{background:var(--gold-t);color:var(--gold2);border-radius:4px;padding:0 2px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.92rem}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{padding:7px 12px;border-radius:9px;font-size:.85rem;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface2);color:var(--text);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}

/* timer pill */
.timer{position:fixed;z-index:35;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);display:none;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:40px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:.85rem;max-width:calc(100% - 28px)}
[dir=rtl] .timer{transform:translateX(50%)}
.timer.on{display:flex}
.timer .tv{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;color:var(--acc)}
.timer .tp{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.timer button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg2)}
.timer button svg.i{width:16px;height:16px}

/* presenter */
.pres{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pres.on{display:flex}
.pres .ph{display:flex;align-items:center;gap:8px;padding:10px 14px}
.pres .ph .tt{flex:1;min-width:0;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pres .segs{display:flex;gap:3px;padding:0 14px}
.pres .segs i{flex:1;height:3px;border-radius:3px;background:var(--line2);transition:background .3s}
.pres .segs i.on{background:var(--acc)}
.pres .stage{flex:1;overflow-y:auto;padding:18px 18px 30px;font-size:calc(var(--fs) * 1.12)}
.pres .stage .in{max-width:860px;margin:0 auto;animation:vin .35s ease}
.pres .stage h2{font-size:1.55rem;line-height:1.45;margin:6px 0 16px;font-weight:900}
.pres .stage .kick{color:var(--acc);font-weight:700;font-size:.85rem}
.pres .pf{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.pres .pf .c{flex:1;text-align:center;font-size:.85rem;color:var(--muted);font-weight:700}
.pres .pf .btn{height:48px}

.toast{position:fixed;z-index:90;left:50%;transform:translate(-50%,20px);bottom:calc(150px + env(safe-area-inset-bottom,0px));padding:12px 18px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:all .3s;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:720px){
  :root{--fs:18px}
  .units{grid-template-columns:1fr 1fr}
  .units .ucard:first-child{grid-column:1/-1}
  .body{padding:22px 24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  body.printing *{visibility:hidden}
  body.printing .print-target,body.printing .print-target *{visibility:visible}
  body.printing .print-target{position:absolute;inset:0 0 auto 0;margin:0;background:#fff!important;color:#000!important;border:1px solid #999}
  body.printing .print-target .pbtn{display:none}
  .nav,.top,.timer{display:none}
}
</style>
</head>

<script type="application/json" id="data">[{"n":1,"title":"الحصانة الفكرية واليقين","c":"emerald","lessons":[{"id":"1-1","ordinal":"الأول","title":"بوصلة الوجود","sub":"الغاية والهوية؛ من أنا؟ ولماذا أنا هنا؟","sections":[{"num":1,"title":"عنوان اللقاء","short":"عنوان اللقاء","kind":"meta","icon":"id","blocks":[{"t":"p","lvl":0,"h":"<b>بوصلة الوجود (الغاية والهوية): من أنا؟ ولماذا أنا هنا؟<\/b>"}],"hide":true},{"num":2,"title":"نبض الغرفة (تشخيص الحالة النفسية والذهنية للفتيان 15-18 سنة + بروتوكول الاحتواء النبوي)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"li","lvl":0,"h":"<b>التشخيص النفسي والذهني لفتيان مرحلة الثانوية (15-18 سنة):<\/b> يمر فتيان هذه المرحلة بتغيرات نمائية ونفسية حادة تنعكس في صورتين متناقضتين: الرغبة العارمة في الاستقلالية وتأكيد الذات، مقابل الارتباك والغموض أمام أسئلة المعنى وضغوط العصر الرقمي وأخلاقيات الترفيه. وقد شخّص هذا الارتباك د. عبد الكريم بكار بقوله: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: عبد الكريم بكار — المراهق: كيف نفهمه وكيف نوجهه؟<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>الارتباك والحيرة هما الطابع الأساسي الذي يطبع الحالة النفسية والعقلية للمراهق، فهو يجد نفسه وقد أصبح على نحو مفاجئ في عداد البالغين... وتكمن عقدة العلاقة بالمراهق أنه يتصرف أحياناً كما يتصرف الأطفال، ويريد منا أن نتعامل معه كما نتعامل مع الراشدين<\/blockquote><cite>عبد الكريم بكار - المراهق: كيف نفهمه وكيف نوجهه؟ - ص 14-16<\/cite><\/div><\/details> كما يعاني كثير منهم من السطحية المعرفية وتشتت الأهداف؛ حيث يصف الأستاذ أحمد بن يوسف السيد هذه الحالة: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: أحمد بن يوسف السيد — إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>جيل كثير منه كانت حياته واهتماماته ترفيهية تافهة -أنمي، ألعاب، أفلام، كرة... إلخ- وكان ضعيفاً دينياً... ومعرفياً جهل مركب شنيع، ولم تكن له أهداف يسعى لها، هائم في الحياة<\/blockquote><cite>أحمد بن يوسف السيد - إلى الجيل الصاعد - ص 13<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>بروتوكول الاحتواء النبوي المعتمد داخل الجلسة:<\/b>"},{"t":"li","lvl":1,"h":"<b>الاحتواء والتلطف دون استنكار:<\/b> التعامل مع تساؤلات الشاب وقلقه الوجودي بوصفه مظهراً لبداية النضج والبحث عن الحقيقة، لا انحرافاً يُعاقب عليه، اقتداءً بالرسول ﷺ حين أتاه الشاب يستأذنه في الزنا، فقربه وأدناه برفق ولم يعنفه."},{"t":"li","lvl":1,"h":"<b>الحوار البرهاني المحاكِي للعقل والفطرة:<\/b> استخدام الأسئلة التوليدية المنطقية التي تخاطب الفطرة والعقل معاً (كما قال النبي ﷺ للشاب: <span class=\"hadith\">«أتحبه لأمك؟ أتحبه لأختك؟»<\/span>)، للوصول إلى الإقناع الذاتي الهادئ."},{"t":"li","lvl":1,"h":"<b>استدعاء نموذج \"الفتوة الإسلامية\":<\/b> رفع همة الفتى وعزته بذكر أمثلة الصحابة الشباب الذين قادوا الأمة في مثل سنهم؛ كـ \"أسامة بن زيد\" في قيادة الجيش، و\"مصعب بن عمير\" في سفارة الدعوة، و\"معاذ بن جبل\" في الفقه والعلم."}]},{"num":3,"title":"خيط الربط (الوصل بأهداف الوحدة والمنهج، والتمهيد للقاء التالي)","short":"خيط الربط","kind":"std","icon":"link","blocks":[{"t":"li","lvl":0,"h":"<b>الوصل بأهداف الوحدة الأولى:<\/b> يُعدّ هذا اللقاء <b>الركيزة الكبرى والعمود الفقري<\/b> لبناء الحصانة الفكرية واليقين؛ إذ لا يمكن تفكيك الشبهات، ولا بناء التفكير الناقد، إلا إذا امتلك الشاب <b>\"بوصلة وجودية\"<\/b> تحدد غايته العظمى (العبودية لله) وهويته الصلبة (المسلم المستخلف)."},{"t":"li","lvl":0,"h":"<b>التمهيد للقاء الثاني:<\/b> ختام اللقاء بإشارة تمهيدية إلى أن امتلاك الغاية يتطلب سلامة \"العقل المميّز\" الذي يحمي هذه البوصلة من الانحراف؛ وهو ما ستتم معالجته في اللقاء القادم: <b>[أدوات التفكير الصحيح: أساسيات التفكير الناقد وكشف المغالطات المنطقية]<\/b>."}]},{"num":4,"title":"الخطاف (The Hook) — تجربة فكرية تفاعلية في أول 5 دقائق","short":"الخطاف","kind":"std","icon":"hook","blocks":[{"t":"li","lvl":0,"h":"<b>سيناريو التجربة الفكرية: \"رحلة الطائرة بلا وجهة\"<\/b>"},{"t":"li","lvl":1,"h":"<b>الإجراء الميداني:<\/b> يعرض المربي مجسماً أو صورة لطائرة نفاثة مجهزة بكل أسباب الرفاهية: شاشات، ألعاب، مقاعد فاخرة."},{"t":"li","lvl":1,"h":"<b>السيناريو:<\/b> <i>\"صعدتم إلى هذه الطائرة واستمتعتم بخدماتها، ثم سألتم الكابتن: إلى أين تأخذنا هذه الرحلة؟ فقال بهدوء: لا توجد وجهة محددة! نحن نطير فقط ونستمتع حتى ينفد الوقود ونسقط في أي مكان!\"<\/i>."},{"t":"li","lvl":1,"h":"<b>أسئلة الاستثارة التوليدية (3 دقائق):<\/b>"},{"t":"li","lvl":2,"h":"ما هو الشعور النفسي لحظة سماع جواب الكابتن؟ هل تبقي الرفاهية على قيمتها؟"},{"t":"li","lvl":2,"h":"هل يشبه هذا حال الإنسان الغارق في الاستهلاك الرقمي دون معرفة سبب وجوده ومحطته الأخيرة؟"}]},{"num":5,"title":"المهارة الناعمة المستهدفة","short":"المهارة الناعمة المستهدفة","kind":"std","icon":"spark","blocks":[{"t":"li","lvl":0,"h":"<b>التفكير الوجودي الواعي (Existential Awareness):<\/b> طرح أسئلة الغاية واستكشاف المعنى الكلي للوجود."},{"t":"li","lvl":0,"h":"<b>التحرر من التبعية العمياء (Autonomy):<\/b> الانفكاك عن ضغط الأقران والنموذج المادي العابث."},{"t":"li","lvl":0,"h":"<b>صناعة المعنى الشخصي (Meaning Making):<\/b> توجيه القرارات اليومية وفق معيار مرضاة الله تعالى."}]},{"num":6,"title":"المحتوى المعرفي والتأصيلي المدمج","short":"المحتوى المعرفي والتأصيلي المدمج","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: نصوص الوحي المؤسسة (الآيات والأحاديث):<\/b>"},{"t":"li","lvl":0,"h":"<b>القرآن الكريم:<\/b>"},{"t":"li","lvl":1,"h":"<b>آية الغاية الصريحة:<\/b> قال تعالى: <span class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾<\/span> <span class=\"ayref\">الذاريات: 56<\/span>؛ العبادة هنا تحرير للإنسان من الخضوع للمخلوقات أو الشهوات."},{"t":"li","lvl":1,"h":"<b>آية نفي العبثية:<\/b> قال تعالى: <span class=\"ayah\">﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ﴾<\/span> <span class=\"ayref\">المؤمنون: 115<\/span>؛ الكون مسيّر بحكمة وقصد، والإنسان لم يُخلق سدى."},{"t":"li","lvl":1,"h":"<b>آية التيه الوجودي:<\/b> قال تعالى: <span class=\"ayah\">﴿وَلَا تَكُونُوا كَالَّذِينَ نَسُوا اللَّهَ فَأَنسَاهُمْ أَنفُسَهُمْ ۚ أُولَٰئِكَ هُمُ الْفَاسِقُونَ﴾<\/span> <span class=\"ayref\">الحشر: 19<\/span>؛ من ينسَ ربه يفقد معرفة نفسه وبوصلة حياته."},{"t":"li","lvl":0,"h":"<b>السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":1,"h":"<b>حديث الهوية والسيادة النفسية:<\/b> عن ابن عباس رضي الله عنهما قال: كنت خلف النبي ﷺ يوماً فقال: <span class=\"hadith\">«يا غلامُ، إني أُعلِّمُك كلماتٍ: احفَظِ اللهَ يحفَظْك، احفَظِ اللهَ تَجِدْه تُجاهَك، إذا سأَلتَ فاسأَلِ اللهَ، وإذا استعَنْتَ فاستَعِنْ باللهِ...»<\/span> <span class=\"takh\">[صحيح الترمذي]<\/span>."},{"t":"li","lvl":1,"h":"<b>حديث مركزية مرحلة الشباب:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«لا تزولُ قَدَمَا عَبْدٍ يومَ القيامةِ حتى يُسألَ عن أربعٍ: عن عُمُرِهِ فيما أفناهُ، وعن شَبابِهِ فيما أبلاهُ...»<\/span> <span class=\"takh\">[رواه الترمذي وحسنه الألباني]<\/span>؛ دلالة على أن الفتوة زمن البناء والأثر."},{"t":"p","lvl":0,"h":"<b>ثانياً: مواقف من قصص الأنبياء والسيرة النبوية:<\/b>"},{"t":"li","lvl":0,"h":"<b>رحلة إبراهيم عليه السلام في البحث عن اليقين [الأنعام: 75-79]:<\/b> تأمل الكوكب والقمر والشمس، وقوله: <span class=\"ayah\">﴿لَا أُحِبُّ الْآفِلِينَ﴾<\/span>، وصولاً إلى إعلانه: <span class=\"ayah\">﴿إِنِّي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا﴾<\/span>."},{"t":"li","lvl":1,"h":"<i>التوظيف التربوي:<\/i> استخدام التفكير الفطري السليم للوصول إلى الحقيقة والانفكاك عن تقليد البيئة الفاسدة."},{"t":"li","lvl":0,"h":"<b>فتية أصحاب الكهف (نموذج الفتوة المستقلة):<\/b> <span class=\"ayah\">﴿إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى﴾<\/span> <span class=\"ayref\">الكهف: 13<\/span>؛ شباب واجهوا ضغط المجتمع الوثني بثبات على المبدأ والهوية."},{"t":"p","lvl":0,"h":"<b>ثالثاً: التأصيل المرجعي المقارن:<\/b>"},{"t":"li","lvl":0,"h":"<b>حقيقة العبودية لله وغاية الوجود:<\/b> يؤكد الأستاذ أحمد بن يوسف السيد: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>لا هوية للمسلم قبل فهم مبدأ العبودية وغاية الوجود... ولنتذكر دائماً، أن الإنسان إذا لم يعرف ربه لم يعرف نفسه، وإذا فقد ربه فسيفقد المعنى في كل شيء، وسيكون نسيانه لربه هو ذاته اليوم الذي سينسى فيه نفسه<\/blockquote><cite>إلى الجيل الصاعد - ص 30-31<\/cite><\/div><\/details> ويضيف: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن الإنسان إذا تخلى عن مقعد العبودية للواحد القهار مستبدلاً إياه بصرح فرعون الذي بناه متكبراً متنكراً جاحداً، فإنه سيغمض عليه كل شيء في الكون، ثم يغرق في يم الضعف البشري<\/blockquote><cite>إلى الجيل الصاعد - ص 31<\/cite><\/div><\/details> كما يؤصل د. عبد الكريم بكار: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: المراهق<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>كل علاقات المسلمين فرع عن علاقتهم بخالقهم... عبوديتنا سابقة على كل ما بيننا من علاقات<\/blockquote><cite>المراهق - ص 61<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>الفرق بين الهدف المرحلي والغاية الكبرى:<\/b> يقرر الأستاذ أحمد السيد: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>فنحن بحاجة إلى الانفكاك عن المفهوم المادي الضيق والمختزل للنجاح، وإعادة تعريفه ليتوافق مع التصور الإسلامي للحياة؛ فهذا يسهل الكثير من الأمور في مسيرة الإنسان ويزرع في نفسه طمأنينة يعلم من خلالها أن ليس عليه إلا سعيه<\/blockquote><cite>إلى الجيل الصاعد - ص 23<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>العبادات لبناء الأخلاق والاستخلاف:<\/b> يقرر الشيخ محمد الغزالي: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: خلق المسلم<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>والعبادات التي شرعت في الإسلام واعتبرت أركاناً في الإيمان ليست طقوساً مبهمة من النوع الذي يربط الإنسان بالغيوب المجهولة... بل هي تمارين متكررة لتعويد المرء أن يحيا بأخلاق صحيحة<\/blockquote><cite>خلق المسلم - ص 7<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>حقيقة الرجولة الإيمانية في القرآن:<\/b> يؤكد د. أحمد عبد المنعم: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: تفريغ: معاني الرجولة في القرآن<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>الذكورة في القرآن لبيان النوع والجنس، أما الرجولة فلبيان الحقيقة والمقام... والرجولة صفة إيمانية قائمة على العبادة والدعوة والثبات<\/blockquote><cite>تفريغ: معاني الرجولة في القرآن<\/cite><\/div><\/details>"}]},{"num":7,"title":"دليل ورشة التطبيق (التفاعل الميداني)","short":"دليل ورشة التطبيق","kind":"std","icon":"tools","blocks":[{"t":"li","lvl":0,"h":"<b>الزمن:<\/b> 20 دقيقة."},{"t":"li","lvl":0,"h":"<b>المجموعات:<\/b> 3 مجموعات (المستكشفون، البناة، المرابطون)."},{"t":"li","lvl":0,"h":"<b>التحدي:<\/b> ورقة دراسة حالة تقارن بين:"},{"t":"li","lvl":1,"h":"<b>سالم:<\/b> متفوق دراسياً ورقمياً، لكنه يعاني فراغاً واكتئاباً لغياب الغاية."},{"t":"li","lvl":1,"h":"<b>عمر:<\/b> مجتهد ورياضي، ويربط تفوقه بنية العبودية والاستخلاف ونفع المسلمين."},{"t":"li","lvl":0,"h":"<b>المهمة:<\/b> استخراج 4 فروق جوهرية في: <i>مرجعية الهوية، معيار النجاح، الصلابة عند الأزمات، والنظرة للمستقبل<\/i>."},{"t":"li","lvl":0,"h":"<b>المخرجات:<\/b> تقديم ممثل عن كل مجموعة خلاصة النقاش في 3 دقائق أمام القاعة."}]},{"num":8,"title":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","short":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"لماذا خلقنا الله وهو غني عن عبادتنا؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> عبادتنا لله ليست لحاجته سبحانه (فهو الغني المطلق)، بل هي <b>حاجة إنسانية وفطرية للمخلوق<\/b>. الإنسان مفطور على التعلق؛ فإن لم يعبد الله، استعبدته الشهوات أو الأقران أو الترندات، والعبادة هي التي تطعم الروح بالسكينة وتمنح الحياة اتزانها."}]},{"t":"qa","n":"2","q":"\"هل الاهتمام بالغاية الأخروية يعني إهمال النجاح الدنيوي والتطور التقني؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> إطلاقاً؛ عمارة الأرض جزء من الاستخلاف والعبادة إذا حسنت النية. يقول د. يوسف القرضاوي: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: في فقه الأولويات<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن تحصيل هذه التكنولوجيا المتقدمة والتفوق فيها... أصبح فريضة وضرورة، فريضة يوجبها الدين، وضرورة يحتتمها الواقع<\/blockquote><cite>في فقه الأولويات - ص 120<\/cite><\/div><\/details>"}]},{"t":"qa","n":"3","q":"\"أشعر بالتشتت ولا أعلم شغفي في الحياة؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> الغاية الكبرى محددة للجميع (مرضاة الله بالعبودية والإصلاح)، أما المسارات والتخصصات فتُكتشف بالتجربة والعمل والتدرج."}]}]},{"num":9,"title":"علم الإنذار المبكر (بروتوكول الحماية والتدخل الفردي)","short":"علم الإنذار المبكر","kind":"std","icon":"alert","blocks":[{"t":"li","lvl":0,"h":"<b>مؤشرات الخطر:<\/b> تردد عبارات العدمية (\"لماذا نعيش إذا كنا سنموت؟\")، السخرية من الغايات الإيمانية، والانغماس الرقمي الكامل هرباً من الواقع."},{"t":"li","lvl":0,"h":"<b>بروتوكول التدخل:<\/b>"},{"t":"li","lvl":1,"h":"تجنب الصدام أو التخوين الإيماني أمام الطلاب."},{"t":"li","lvl":1,"h":"جلسة فردية قائمة على الإنصات والرفق والاستماع التام لحيرته دون مقاطعة."},{"t":"li","lvl":1,"h":"استثارة فطرته بالأسئلة الهادئة وإعادة ربطه برفيق صالح."}]},{"num":10,"title":"الفعاليات والأنشطة المصاحبة (بطاقة عمل تفاعلية)","short":"الفعاليات والأنشطة المصاحبة","kind":"std","icon":"card","blocks":[{"t":"li","lvl":0,"h":"<b>تمرين: بطاقة \"بوصلة حياتي\" (7 دقائق خلوة فردية):<\/b>"},{"t":"card","title":"بطاقة: بوصلة حياتي","sub":"","lines":["1. هويتي الصلبة: (3 صفات أعتز بها كشاب مسلم)","- .............................................","2. غايتي العظمى: (ما هو الأثر الذي أريد لقاء الله به؟)","- .............................................","3. أهدافي الثلاثة لخدمة غايتي (إيماني - دراسي - مهاري):","- هدف 1: .......................................","- هدف 2: .......................................","- هدف 3: .......................................","4. قرار التحرر: (عادة أو رفقة سيئة سأتخلى عنها فوراً):","- ............................................."]}]},{"num":11,"title":"أدوار مجلس الفتيان (التشغيل القيادي)","short":"أدوار مجلس الفتيان","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>ميقاتي اللقاء:<\/b> ضبط زمن الفقرات والالتزام بالجدول."},{"t":"li","lvl":0,"h":"<b>مدوّن الخلاصات (المقرر):<\/b> تسجيل أهم القواعد والأفكار الناتجة عن الورشة."},{"t":"li","lvl":0,"h":"<b>مسؤول البيئة والتفاعل:<\/b> تنظيم المداخلات والأدوات."}]},{"num":12,"title":"خلفية المربي والمعينات المرئية المقترحة","short":"خلفية المربي والمعينات المرئية المقترحة","kind":"std","icon":"compass","blocks":[{"t":"li","lvl":0,"h":"<b>موجهات المربي:<\/b> عقلية الميسر لا المحاضر، الرفق النبوي، والوعي بضغوط العصر الرقمي."},{"t":"li","lvl":0,"h":"<b>المعينات المرئية الإثرائية (يوتيوب):<\/b>"},{"t":"li","lvl":1,"h":"<i>للشباب:<\/i> مقطع \"لماذا خلقنا الله؟\" - د. إياد قنيبي (سلسلة رحلة اليقين)."},{"t":"li","lvl":1,"h":"<i>للشباب والمربي:<\/i> حلقة \"معنى الحياة ولماذا نحن هنا؟\" - بودكاست وعي."},{"t":"li","lvl":1,"h":"<i>للمربي:<\/i> سلسلة \"إلى الجيل الصاعد\" (الحلقات التأسيسية للهوية) - أ. أحمد بن يوسف السيد."}]},{"num":13,"title":"الخطة الزمنية التفصيلية المجدولة (70 دقيقة)","short":"الخطة الزمنية التفصيلية المجدولة","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","","الخطاف وسيناريو الطائرة بلا وجهة."],["05 - 15 د","","نبض الغرفة وخيط الربط بالمنهج."],["15 - 35 د","","المحتوى المعرفي والتأصيلي (الوحي، السيرة، والمراجع)."],["35 - 55 د","","ورشة التطبيق وتعبئة بطاقة البوصلة."],["55 - 65 د","","تفكيك الاعتراضات والشبهات."],["65 - 70 د","","التكليف وختام اللقاء."]]}]},{"num":14,"title":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","short":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>توثيق الاقتباسات الأساسية:<\/b>"},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - دار صناعة الفكر - ص 30-31."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 31."},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>المراهق: كيف نفهمه وكيف نوجهه؟<\/i> - دار السلام - ص 14-16."},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>المراهق<\/i> - ص 61."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 23."},{"t":"li","lvl":1,"h":"محمد الغزالي - <i>خلق المسلم<\/i> - دار القلم - ص 7."},{"t":"li","lvl":1,"h":"د. يوسف القرضاوي - <i>في فقه الأولويات<\/i> - مكتبة وهبة - ص 120."},{"t":"li","lvl":1,"h":"د. أحمد عبد المنعم - <i>تفريغ: معاني الرجولة في القرآن<\/i>."},{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية المعتمدة (بالصفحات):<\/b>"},{"t":"li","lvl":1,"h":"ابن القيم - <i>الداء والدواء (الجواب الكافي)<\/i> - دار ابن حزم - (ص 85 - 105: فصول أثر نسيان الله على ضياع النفس)."},{"t":"li","lvl":1,"h":"محمد قطب - <i>الإنسان بين المادية والإسلام<\/i> - دار الشروق - (ص 15 - 45: حقيقة النفس والغاية من الحياة)."}]},{"num":15,"title":"التكليف العملي السلوكي (تطبيق واقعي طوال الأسبوع)","short":"التكليف العملي السلوكي","kind":"std","icon":"flag","blocks":[{"t":"li","lvl":0,"h":"<b>خلوة الاستقامة:<\/b> 15 دقيقة يومياً بعيداً عن الهاتف والشاشات لمراجعة الأهداف."},{"t":"li","lvl":0,"h":"<b>قرار العبودية:<\/b> التزام تغيير سلوكي واحد دائم (مثل: صلاة الفجر في وقتها، أو حذف تطبيق يستنزف الوقت بلا فائدة)."}]},{"num":16,"title":"مؤشر قياس الأثر الميداني (معايير تحقق الوعي لدى الطالب)","short":"مؤشر قياس الأثر الميداني","kind":"std","icon":"chart","blocks":[{"t":"li","lvl":0,"h":"<b>الاعتزاز بالهوية:<\/b> وضوح التمسك بالفرائض والقيم أمام الأقران دون خجل."},{"t":"li","lvl":0,"h":"<b>ترتيب الأولويات:<\/b> تقديم الواجبات الإيمانية والدراسية على الترفيه الرقمي المفرط."},{"t":"li","lvl":0,"h":"<b>المبادرة الإيجابية:<\/b> الانتقال من دور المستهلك الكسول إلى الشاب المبادر في أسرته ومحيطه."}]}]},{"id":"1-2","ordinal":"الثاني","title":"أدوات التفكير الصحيح","sub":"أساسيات التفكير الناقد وكشف المغالطات المنطقية","sections":[{"num":1,"title":"عنوان اللقاء","short":"عنوان اللقاء","kind":"meta","icon":"id","blocks":[{"t":"p","lvl":0,"h":"<b>أدوات التفكير الصحيح: أساسيات التفكير الناقد وكشف المغالطات المنطقية<\/b>"}],"hide":true},{"num":2,"title":"نبض الغرفة (تشخيص الحالة النفسية والذهنية للفتيان 15-18 سنة + بروتوكول الاحتواء النبوي)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"li","lvl":0,"h":"<b>التشخيص النفسي والذهني لفتيان مرحلة الثانوية (15-18 سنة):<\/b> يعيش فتيان هذه المرحلة في فلك طوفان رقمي وإعلامي متدفّق يعجّ بالإشاعات والمغالطات والأحكام السريعة. ويتميز تفكيرهم بالمثالية الزائدة والنقد الحاد مع نقص الخبرة في التمييز بين الحجة البرهانية والمغالطة المزخرفة. يشخّص د. عبد الكريم بكار هذه الحالة: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: المراهق<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>لا نبالغ إذا قلنا: إن جزءاً كبيراً من مشاكسات المراهقين مع أهليهم وأساتذتهم، يعود إلى ما لديهم من مثالية زائدة وفهم متخشب للأمور، هذه الوضعية تعود إلى أن المراهق لا يستطيع رؤية الفجوة التي تفصل بين النظرية والتطبيق<\/blockquote><cite>المراهق - ص 18-19<\/cite><\/div><\/details> ويوضح السبب النمائي: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: المراهق<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>يميل المراهق إلى التطرف؛ لأنه غير قادر على التبصر في عواقب الأمور... وهذا يعود إلى أن الفص الأمامي من مخه -وهو المسؤول عن المنطق وتوقع النتائج والتخطيط والتنظيم- لم يكتمل بعد<\/blockquote><cite>المراهق - ص 104-105<\/cite><\/div><\/details> ويؤكد الأستاذ أحمد بن يوسف السيد خطورة غياب العقلية الناقدة: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>كيف يمكن للمرء أن يعيش اليوم في عالم يعج بالمغالطات على كافة أصعدته... دون أن تكون لديه عقلية ناقدة يفحص بها ما يستقبل من معلومات؟! إن من يفتقد المستوى الناقدي الجيد فإنه سيتيه بين الأخبار المختلفة، والدعايات المتعارضة، والآراء المتضاربة<\/blockquote><cite>إلى الجيل الصاعد - ص 39-40<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>بروتوكول الاحتواء النبوي المعتمد داخل الجلسة:<\/b>"},{"t":"li","lvl":1,"h":"<b>الترشيد الناقد بدلاً من المصادرة:<\/b> عدم قمع نزعة النقد بل توجيهها للتمحيص الموضوعي؛ التزاماً بقاعدة د. عبد الكريم بكار: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: المراهق<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>لا تمنع المراهق من ممارسة النقد، ولكن علمه كيف ينقد بطريقة صحيحة<\/blockquote><cite>المراهق - ص 11<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<b>الرفق واستثارة البرهان:<\/b> محاورة عقولهم بالحجة دون تسفيه، والتفريق بين الحوار البرهاني والجدل العقيم."},{"t":"li","lvl":1,"h":"<b>تأسيس معيار التبين:<\/b> تدريبهم على فحص كل ما يتلقونه عبر الشاشات عملاً بالأدب القرآني."}]},{"num":3,"title":"خيط الربط (الوصل بأهداف الوحدة والمنهج، والتمهيد للقاء التالي)","short":"خيط الربط","kind":"std","icon":"link","blocks":[{"t":"li","lvl":0,"h":"<b>الوصل بأهداف الوحدة الأولى:<\/b> بعد أن حُددت الغاية والهوية في اللقاء الأول، يزود هذا اللقاء الشاب بـ <b>\"الدروع العقلية الحامية\"<\/b>؛ فالغاية تحتاج إلى تفكير ناقد يحمي القلب والعقل من التضليل والمغالطات التشكيكية."},{"t":"li","lvl":0,"h":"<b>التمهيد للقاء الثالث:<\/b> ختام اللقاء بالإشارة إلى أن أرقى نماذج التفكير والبرهان العقلي تتجلى في القرآن الكريم؛ وهو موضوع اللقاء القادم: <b>[القرآن والبرهان العقلي: كيف يبني الوحي القناعات واليقين؟]<\/b>."}]},{"num":4,"title":"الخطاف (The Hook) — تجربة فكرية تفاعلية في أول 5 دقائق","short":"الخطاف","kind":"std","icon":"hook","blocks":[{"t":"li","lvl":0,"h":"<b>سيناريو التجربة الفكرية: \"مختبر المنشور المضلل\"<\/b>"},{"t":"li","lvl":1,"h":"<b>الإجراء الميداني:<\/b> يعرض المربي منشوراً مصمماً بأسلوب احترافي يتضمن: <i>\"أكد الدكتور (X) المتخصص بالعلوم الإنسانية في جامعته المشهورة: أن تناول السكريات قبل النوم يزيد الذكاء بنسبة 80%، وأضاف: وكل من يرفض هذه الحقيقة هو شخص رجعي يحارب التطوير الذاتي!\"<\/i>."},{"t":"li","lvl":1,"h":"<b>المهمة:<\/b> من ينشر هذا المنشور فوراً؟ ومن يتوقف للتثبت ولماذا؟"},{"t":"li","lvl":1,"h":"<b>أسئلة الاستثارة التوليدية (3 دقائق):<\/b>"},{"t":"li","lvl":2,"h":"أين تكمن الحيل في هذا المنشور؟ (الاحتكام لسلطة مجهولة + إرهاب المخالف بالشخصنة والرجعية)."},{"t":"li","lvl":2,"h":"كم منشوراً وفكرة نقبلها يومياً بالطريقة نفسها دون فحص الأدلة؟"}]},{"num":5,"title":"المهارة الناعمة المستهدفة","short":"المهارة الناعمة المستهدفة","kind":"std","icon":"spark","blocks":[{"t":"li","lvl":0,"h":"<b>التفكير الناقد (Critical Thinking):<\/b> فحص الدعاوى وتقييم الأدلة قبل إصدار الأحكام."},{"t":"li","lvl":0,"h":"<b>كشف المغالطات (Fallacy Detection):<\/b> تفكيك أساليب التضليل الإعلامي والجدلي."},{"t":"li","lvl":0,"h":"<b>التثبت المعرفي (Epistemic Vigilance):<\/b> التحرر من الإشاعات والتبعية الفكرية للرأي الشائع."}]},{"num":6,"title":"المحتوى المعرفي والتأصيلي المدمج","short":"المحتوى المعرفي والتأصيلي المدمج","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: نصوص الوحي المؤسسة (الآيات والأحاديث):<\/b>"},{"t":"li","lvl":0,"h":"<b>القرآن الكريم:<\/b>"},{"t":"li","lvl":1,"h":"<b>آية التثبت من الأنباء:<\/b> قال تعالى: <span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا أَن تُصِيبُوا قَوْمًا بِجَهَالَةٍ فَتُصْبِحُوا عَلَىٰ مَا فَعَلْتُمْ نَادِمِينَ﴾<\/span> <span class=\"ayref\">الحجرات: 6<\/span>."},{"t":"li","lvl":1,"h":"<b>آية نفي التبعية والتقليد الأعمى:<\/b> قال تعالى: <span class=\"ayah\">﴿وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا أَلْفَيْنَا عَلَيْهِ آبَاءَنَا ۗ أَوَلَوْ كَانَ آبَاؤُهُمْ لَا يَعْقِلُونَ شَيْئًا وَلَا يَهْتَدُونَ﴾<\/span> <span class=\"ayref\">البقرة: 170<\/span>."},{"t":"li","lvl":1,"h":"<b>آية المسؤولية المعرفية:<\/b> قال تعالى: <span class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ۚ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾<\/span> <span class=\"ayref\">الإسراء: 36<\/span>."},{"t":"li","lvl":0,"h":"<b>السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":1,"h":"<b>حديث النهي عن التبعية العابثة:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«لا تَكونوا إمَّعَةً، تقولونَ: إن أحسَنَ النَّاسُ أحسَنَّا، وإن ظلَموا ظلَمنا، ولَكِن وَطِّنوا أنفُسَكُم، إن أحسَنَ النَّاسُ أن تُحسِنوا، وإن أساؤوا فلا تَظلِموا»<\/span> <span class=\"takh\">[رواه الترمذي وحسنه]<\/span>."},{"t":"li","lvl":1,"h":"<b>حديث التحذير من تداول الأخبار دون فحص:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«كَفَى بالمَرْءِ كَذِبًا أَنْ يُحَدِّثَ بكُلِّ ما سَمِعَ»<\/span> <span class=\"takh\">[صحيح مسلم]<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: مواقف من قصص الأنبياء والسيرة النبوية:<\/b>"},{"t":"li","lvl":0,"h":"<b>إبراهيم عليه السلام في تفكيك المغالطة المنطقية لقومه [الأنبياء: 62-67]:<\/b> عندما حطم الأصنام وقال لهم: <span class=\"ayah\">﴿بَلْ فَعَلَهُ كَبِيرُهُمْ هَٰذَا فَاسْأَلُوهُمْ إِن كَانُوا يَنطِقُونَ﴾<\/span>، وضعهم أمام تناقضهم العقلي الصريح؛ كيف يعبدون ما لا يسمع ولا ينطق ولا يدفع عن نفسه ضراً؟ فرجعوا إلى أنفسهم وقالوا: <span class=\"ayah\">﴿إِنَّكُمْ أَنتُمُ الظَّالِمُونَ﴾<\/span>."},{"t":"li","lvl":0,"h":"<b>تثبت النبي ﷺ ومنهجه في رد الشائعات:<\/b> موقفه في حادثة بني المصطلق حين أتاه الخبر بامتناعهم عن الزكاة، فتأنى وتثبت ولم يتعجل بإنفاذ الجيش حتى ظهر صدق القوم وبطلان الإشاعة."},{"t":"p","lvl":0,"h":"<b>ثالثاً: التأصيل المرجعي المقارن:<\/b>"},{"t":"li","lvl":0,"h":"<b>أصل التفكير الناقد في الإسلام:<\/b> يؤصل الأستاذ أحمد بن يوسف السيد: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن الإسلام بجانب إتيانه بالأوامر والنواهي والأخبار قد أرشد إلى الاهتمام بالتفكير والأدلة والبراهين وعدم اعتناق العقائد وتبني الأقوال لمجرد كونها منتشرة... فنحن نقرأ قول الله تعالى: <span class=\"ayah\">﴿قُلْ هَاتُوا بُرْهَانَكُمْ إِن كُنتُمْ صَادِقِينَ﴾<\/span><\/blockquote><cite>إلى الجيل الصاعد - ص 40<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>السمات الست للمفكر الناقد (أحمد بن يوسف السيد):<\/b>"},{"t":"li","lvl":1,"h":"<i>اشتراط الدليل للقبول:<\/i> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 41<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>الدعاوى لا تساوي شيئاً ما لم يقرنها أصحابها بأدلة تثبت صحتها<\/blockquote><cite>ص 41<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>اشتراط صحة الدليل:<\/i> النظر في الدليل والنتيجة وطريقة الاستدلال <span class=\"pg\">ص 41<\/span>."},{"t":"li","lvl":1,"h":"<i>اشتراط اللزوم:<\/i> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 42<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>لا بد أن يكون بين الدليل والمدلول علاقة لزوم<\/blockquote><cite>ص 42<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>عدم مناقضة القطعيات:<\/i> تقديم القطعي الثابت على الظني <span class=\"pg\">ص 42-43<\/span>."},{"t":"li","lvl":1,"h":"<i>عدم قبول التناقض:<\/i> النقيضان لا يجتمعان <span class=\"pg\">ص 43<\/span>."},{"t":"li","lvl":1,"h":"<i>التفريق بين القطعي والظني:<\/i> إعطاء كل مستوى حقه من الثبوت <span class=\"pg\">ص 43-44<\/span>."},{"t":"li","lvl":0,"h":"<b>المغالطات المنطقية الشائعة:<\/b>"},{"t":"li","lvl":1,"h":"<i>الشخصنة (Ad Hominem):<\/i> مهاجمة القائل بدلاً من الحجة."},{"t":"li","lvl":1,"h":"<i>رجل القش (Straw Man):<\/i> تشويه حجة المخالف لتسهيل ردها."},{"t":"li","lvl":1,"h":"<i>الاحتكام للسلطة (Authority):<\/i> قبول رأي المشهور في غير تخصصه."},{"t":"li","lvl":1,"h":"<i>التعميم الخاطئ (Hasty Generalization):<\/i> تعميم حالة فردية على الكل."},{"t":"li","lvl":0,"h":"<b>الناقد البناء vs الشكاك السفسطائي:<\/b> يقرر الأستاذ أحمد السيد: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 45-46<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>التفكير الناقد يسعى للوصول إلى المعرفة اليقينية الصحيحة... في حين أن التفكير الشكي هو حالة من العبثية التي لا تقود إلا إلى مزيد من التيه والتناقض<\/blockquote><cite>ص 45-46<\/cite><\/div><\/details>"}]},{"num":7,"title":"دليل ورشة التطبيق (التفاعل الميداني)","short":"دليل ورشة التطبيق","kind":"std","icon":"tools","blocks":[{"t":"li","lvl":0,"h":"<b>الزمن:<\/b> 20 دقيقة."},{"t":"li","lvl":0,"h":"<b>المجموعات:<\/b> 3 مجموعات (الباحثون، المحققون، النقاد)."},{"t":"li","lvl":0,"h":"<b>التحدي:<\/b> تفكيك 3 مقولات واقعية:"},{"t":"li","lvl":1,"h":"<i>\"كيف تأخذ نصيحة هذا المدرس وهو يقود سيارة قديمة؟\"<\/i> (مغالطة الشخصنة)."},{"t":"li","lvl":1,"h":"<i>\"المتدينون يريدون منا ترك كل التقنية والعيش في الكهوف!\"<\/i> (مغالطة رجل القش)."},{"t":"li","lvl":1,"h":"<i>\"رأيت حافظ قرآن تصرف بسوء أدب، إذاً حلقات القرآن لا تربي!\"<\/i> (مغالطة التعميم الخاطئ)."},{"t":"li","lvl":0,"h":"<b>المهمة:<\/b> تسمية المغالطة، وتصحيح العبارة وفق قواعد الاستدلال السليم."},{"t":"li","lvl":0,"h":"<b>المخرجات:<\/b> تقديم كل فريق تحليله في 3 دقائق أمام القاعة."}]},{"num":8,"title":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","short":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"هل التفكير الناقد يبيح التشكيك في المسلمات الشرعية؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> التفكير الناقد وسيلة للوصول إلى اليقين وفحص الأدلة. وقد ثبتت صحة الإسلام بالبراهين العقلية القاطعة، ومن تمام العقل التسليم بما صح عن الوحي؛ لأن العقل دل على صدق الرسول ﷺ. يقول أ. أحمد السيد: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن الدلائل التي تثبت صدق الوحي تقود للتسليم بكل ما يأتي من الوحي من أخبار<\/blockquote><cite>إلى الجيل الصاعد - ص 46<\/cite><\/div><\/details>"}]},{"t":"qa","n":"2","q":"\"كيف أميز بين الحجة العلمية والمغالطة الذكية؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> بفحص الركائز الثلاث: هل الدليل ثابت وصحيح؟ وهل النتيجة تلزم منه منطقياً؟ وهل سلم الكلام من الشخصنة والتهويل العاطفي؟"}]},{"t":"qa","n":"3","q":"\"لماذا نطالب بالدليل ومعظم الناس يكتفون بالرأي الشائع؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> لأن كثرة القائلين بالشيء لا تجعله حقاً؛ والقرآن ذم اتباع الكثرة بغير علم: <span class=\"ayah\">﴿وَإِن تُطِعْ أَكْثَرَ مَن فِي الْأَرْضِ يُضِلُّوكَ عَن سَبِيلِ اللَّهِ﴾<\/span> <span class=\"ayref\">الأنعام: 116<\/span>."}]}]},{"num":9,"title":"علم الإنذار المبكر (بروتوكول الحماية والتدخل الفردي)","short":"علم الإنذار المبكر","kind":"std","icon":"alert","blocks":[{"t":"li","lvl":0,"h":"<b>مؤشرات الخطر:<\/b> السفسطة وإنكار الحقائق البديهية، التشكيك الدائم في نيات القدوات، أو اتخاذ الشك ذريعة للتهرب من الفرائض."},{"t":"li","lvl":0,"h":"<b>بروتوكول التدخل:<\/b>"},{"t":"li","lvl":1,"h":"جلسة فردية هادئة تبدأ بالسؤال: \"هل تشك في وجودك وبديهيات عقلك؟\"."},{"t":"li","lvl":1,"h":"توضيح التناقض الذاتي للشك المطلق؛ فالشاك في كل شيء يشك في شكه!"},{"t":"li","lvl":1,"h":"التفريق بين الشك المنهجي العابر الموصل لليقين، والشك السفسطائي المرضي."}]},{"num":10,"title":"الفعاليات والأنشطة المصاحبة (بطاقة عمل تفاعلية)","short":"الفعاليات والأنشطة المصاحبة","kind":"std","icon":"card","blocks":[{"t":"li","lvl":0,"h":"<b>تمرين: بطاقة \"مختبر فحص الأفكار\" (7 دقائق فردية):<\/b>"},{"t":"card","title":"بطاقة: مختبر فحص الأفكار","sub":"","lines":["اختر فكرة أو شائعة مرت عليك هذا الأسبوع:","1. الفكرة أو الدعوى: .................................","2. الدليل المقدم لدعمها: ............................","3. فحص الدليل:","- هل الدليل ثابت وصحيح في نفسه؟ [ نعم / لا ]","- هل يلزم من الدليل صحة النتيجة حتماً؟ [ نعم / لا ]","4. كشف المغالطة: هل تضمنت (شخصنة / رجل قش / تعميم)؟","- .............................................","5. القرار المعرفي: [ أقبل الفكرة / أردها / أتوقف للتثبت ]"]}]},{"num":11,"title":"أدوار مجلس الفتيان (التشغيل القيادي)","short":"أدوار مجلس الفتيان","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>ميقاتي الجلسة:<\/b> ضبط أوقات المداخلات والورشة."},{"t":"li","lvl":0,"h":"<b>مدوّن المغالطات (المقرر):<\/b> حصر المغالطات وطرق كشفها."},{"t":"li","lvl":0,"h":"<b>ضابط الحوار:<\/b> إلزام المتحدثين بمناقشة الحجج وتجنب مقاطعة الزملاء."}]},{"num":12,"title":"خلفية المربي والمعينات المرئية المقترحة","short":"خلفية المربي والمعينات المرئية المقترحة","kind":"std","icon":"compass","blocks":[{"t":"li","lvl":0,"h":"<b>موجهات المربي:<\/b> تجنب ممارسة أي مغالطة (كالسلطة الأبوية لفرض القناعة دون دليل)، وترسيخ أن النقد يكون بأدب وعلم."},{"t":"li","lvl":0,"h":"<b>المعينات المرئية الإثرائية (يوتيوب):<\/b>"},{"t":"li","lvl":1,"h":"<i>للشباب والمربي:<\/i> سلسلة \"التفكير الناقد وقواعد الاستدلال\" - أ. أحمد السيد (قناة البناء الفكري)."},{"t":"li","lvl":1,"h":"<i>للشباب:<\/i> مقاطع تبسيط المغالطات المنطقية الشائعة (سلسلة فضاء فكر)."}]},{"num":13,"title":"الخطة الزمنية التفصيلية المجدولة (70 دقيقة)","short":"الخطة الزمنية التفصيلية المجدولة","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","","الخطاف وسيناريو المنشور المضلل."],["05 - 15 د","","نبض الغرفة وخيط الربط بالمنهج."],["15 - 35 د","","المحتوى المعرفي (سمات الناقد والمغالطات والوحي)."],["35 - 55 د","","ورشة التطبيق وتفكيك النصوص."],["55 - 65 د","","معالجة الاعتراضات وتفنيدها."],["65 - 70 د","","إعلان التكليف والختام."]]}]},{"num":14,"title":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","short":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>توثيق الاقتباسات الأساسية:<\/b>"},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>المراهق: كيف نفهمه وكيف نوجهه؟<\/i> - ص 18-19."},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>المراهق<\/i> - ص 104-105."},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>المراهق<\/i> - إضاءة ص 11."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 39-40."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 40-44."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 45-46."},{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية المعتمدة (بالصفحات):<\/b>"},{"t":"li","lvl":1,"h":"د. عادل مصطفى - <i>المغالطات المنطقية: فصول في المنطق غير الصوري<\/i> - دار رؤية - (ص 25 - 65: فصول مغالطة الشخصنة، رجل القش، والتعميم)."},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>تأسيس عقلية الطفل والمراهق<\/i> - دار السلام - (ص 55 - 80: مهارات الفحص والمحاكمة العقلية)."}]},{"num":15,"title":"التكليف العملي السلوكي (تطبيق واقعي طوال الأسبوع)","short":"التكليف العملي السلوكي","kind":"std","icon":"flag","blocks":[{"t":"li","lvl":0,"h":"<b>فلتر المنشورات:<\/b> الامتناع عن إعادة نشر أو تصديق أي خبر فكري أو اجتماعي دون التثبت من مصدره ودليله."},{"t":"li","lvl":0,"h":"<b>رصد مغالطة:<\/b> استخراج مغالطة منطقية واحدة مرت عليه في السوشيال ميديا وتدوينها لمشاركتها في مطلع اللقاء القادم."}]},{"num":16,"title":"مؤشر قياس الأثر الميداني (معايير تحقق الوعي لدى الطالب)","short":"مؤشر قياس الأثر الميداني","kind":"std","icon":"chart","blocks":[{"t":"li","lvl":0,"h":"<b>التثبت والتريث:<\/b> التوقف عن ترديد الشائعات والأحكام السريعة في حواراته."},{"t":"li","lvl":0,"h":"<b>الموضوعية:<\/b> مناقشة الفكرة بدليلها وتجنب الهجوم على الأشخاص."},{"t":"li","lvl":0,"h":"<b>الحصانة من التضليل:<\/b> سرعة اكتشاف الثغرات في الإعلانات والمحتويات الإعلامية البراقة."}]}]},{"id":"1-3","ordinal":"الثالث","title":"القرآن والبرهان العقلي","sub":"كيف يبني الوحي القناعات واليقين؟","sections":[{"num":1,"title":"عنوان اللقاء","short":"عنوان اللقاء","kind":"meta","icon":"id","blocks":[{"t":"p","lvl":0,"h":"<b>القرآن والبرهان العقلي: كيف يبني الوحي القناعات واليقين؟<\/b>"}],"hide":true},{"num":2,"title":"نبض الغرفة (تشخيص الحالة النفسية والذهنية للفتيان 15-18 سنة + بروتوكول الاحتواء النبوي)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"li","lvl":0,"h":"<b>التشخيص النفسي والذهني لفتيان مرحلة الثانوية (15-18 سنة):<\/b> يتسم تفكير فتيان هذه المرحلة بالتحول نحو الاستدلال المجرد. لكن التدفق الرقمي السريع خلق لدى بعضهم وهماً بوجود تعارض بين العقل والوحي، أو توهم أن القرآن كتاب للتبرك المجرد لا مصدر لبناء البراعة العقلية واليقين البرهاني. يشخّص د. عبد الكريم بكار ذلك: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: المراهق<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>فالمراهق إنسان عاقل ومدرك للفضائل، وفي ذهنه فصل لا بأس به بين الحق والباطل... لكن سيطرته على نفسه ونوازعه وانسجامه مع مجتمعه وإدراكه لمصالحه... كل ذلك ناقص<\/blockquote><cite>المراهق - ص 6<\/cite><\/div><\/details> ويؤصل د. يوسف القرضاوي ضرورة الفهم العميق: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: في فقه الأولويات<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>والإسلام إنما يريد منا: التفقه في الدين، لا مجرد تعلم الدين... والفقه شيء أعمق وأخص من العلم، إنه الفهم، والفهم الدقيق، ولهذا نعى الله تعالى على الكفار والمنافقين، حين وصفهم بأنهم: <span class=\"ayah\">﴿قَوْمٌ لاَّ يَفْقَهُونَ﴾<\/span><\/blockquote><cite>في فقه الأولويات - ص 66<\/cite><\/div><\/details> ويوضح الأستاذ أحمد بن يوسف السيد دور القرآن في اليقين: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن الإنسان كلما اقترب من القرآن –حفظاً وفهماً وتلاوة وتدبراً وعملاً– فإنه يزداد إيماناً، وتنفتح له أبواب الهداية والتوفيق... ومن أفضل صور العلاقة بالقرآن: تخصيص ورد للقراءة والتدبر المصحوب بالمدارسة والاستهداء<\/blockquote><cite>إلى الجيل الصاعد - ص 37-38<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>بروتوكول الاحتواء النبوي المعتمد داخل الجلسة:<\/b>"},{"t":"li","lvl":1,"h":"<b>إعادة الاعتبار للعقل عبر الوحي:<\/b> إبراز أن الوحي يوجه العقل نحو طرائق النظر المحكمة دون مصادرة لملكاته."},{"t":"li","lvl":1,"h":"<b>الرفق والاستيعاب:<\/b> عدم التأفف من أسئلتهم حول دلالات الآيات، بل استخدام منهج القرآن ذاته في البرهنة."},{"t":"li","lvl":1,"h":"<b>الانتقال من التلاوة المجردة إلى التدبر:<\/b> تحفيز الشباب على تجاوز الترديد الآلي إلى استنباط الحجج والبصائر."}]},{"num":3,"title":"خيط الربط (الوصل بأهداف الوحدة والمنهج، والتمهيد للقاء التالي)","short":"خيط الربط","kind":"std","icon":"link","blocks":[{"t":"li","lvl":0,"h":"<b>الوصل بأهداف الوحدة الأولى:<\/b> بعد وعي الغاية في اللقاء الأول، واكتساب أدوات التفكير الناقد في اللقاء الثاني، يتوج هذا اللقاء المسار بـ <b>\"المصدر الأكبر لليقين وهو القرآن الكريم\"<\/b>؛ فالقرآن هو المنظومة العقلية التي تصنع الفلتر الحصين."},{"t":"li","lvl":0,"h":"<b>التمهيد للقاء الرابع:<\/b> البرهان القرآني هو الأساس المتين لبناء فلتر الشبهات الميداني الذي ستتم معالجته في اللقاء القادم: <b>[حصون اليقين (صناعة الفلتر): المنهجية العملية للتعامل مع الشبهات وتفكيكها]<\/b>."}]},{"num":4,"title":"الخطاف (The Hook) — تجربة فكرية تفاعلية في أول 5 دقائق","short":"الخطاف","kind":"std","icon":"hook","blocks":[{"t":"li","lvl":0,"h":"<b>سيناريو التجربة الفكرية: \"شهادة الفصيح الكافر (الوليد بن المغيرة)\"<\/b>"},{"t":"li","lvl":1,"h":"<b>الإجراء الميداني:<\/b> عرض شهادة خبير البلاغة واللغة في الجاهلية (الوليد بن المغيرة) بعد سماعه آيات التنزيل: <i>\"والله لقد سمعتُ منه كلاماً ما هو من كلام الإنس ولا من كلام الجن! وإن له لحلاوة، وإن عليه لطلاوة، وإن أعلاه لمثمر، وإن أسفله لمغدق، وإنه ليعلو ولا يُعلى عليه، وإنه ليحطم ما تحته!\"<\/i> <span class=\"pg\">النبأ العظيم - ص 116<\/span>."},{"t":"li","lvl":1,"h":"<b>السيناريو:<\/b> <i>\"رجل كافر ومعادٍ للإسلام يمتلك أعلى ذائقة نقدية في قومه، لماذا انخلع قلبه وعجز عن إنكار القرآن؟\"<\/i>."},{"t":"li","lvl":1,"h":"<b>أسئلة الاستثارة التوليدية (3 دقائق):<\/b>"},{"t":"li","lvl":2,"h":"ما هي الخصائص البرهانية في القرآن التي حيرت عقول أعدائه؟"},{"t":"li","lvl":2,"h":"كيف يحول تدبر هذا الكتاب القناعات الذهنية الباردة إلى يقين نفسي لا يتزعزع؟"}]},{"num":5,"title":"المهارة الناعمة المستهدفة","short":"المهارة الناعمة المستهدفة","kind":"std","icon":"spark","blocks":[{"t":"li","lvl":0,"h":"<b>الاستدلال البرهاني (Rational Argumentation):<\/b> بناء القناعات على أسس عقلية راسخة."},{"t":"li","lvl":0,"h":"<b>التدبر والاستهداء المعرفي (Qur'anic Literacy):<\/b> التلقي الواعي للقرآن كمنهج هداية ودليل."},{"t":"li","lvl":0,"h":"<b>الانقياد للحق (Intellectual Objectivity):<\/b> الخضوع لسطوة البرهان متى ما استبان."}]},{"num":6,"title":"المحتوى المعرفي والتأصيلي المدمج","short":"المحتوى المعرفي والتأصيلي المدمج","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: نصوص الوحي المؤسسة (الآيات والأحاديث):<\/b>"},{"t":"li","lvl":0,"h":"<b>القرآن الكريم:<\/b>"},{"t":"li","lvl":1,"h":"<b>برهان الخلق العقلي:<\/b> قال تعالى: <span class=\"ayah\">﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ * أَمْ خَلَقُوا السَّمَاوَاتِ وَالْأَرْضَ ۚ بَل لَّا يُوقِنُونَ﴾<\/span> <span class=\"ayref\">الطور: 35-36<\/span>؛ قسمة عقلية ثلاثية حاصرة تبطل الصدفة وتثبت الخالق."},{"t":"li","lvl":1,"h":"<b>برهان التمانع ونظام الكون:<\/b> قال تعالى: <span class=\"ayah\">﴿لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا ۚ فَسُبْحَانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ﴾<\/span> <span class=\"ayref\">الأنبياء: 22<\/span>؛ انتظام الكون يدل على وحدة مدبره."},{"t":"li","lvl":1,"h":"<b>برهان الإعادة والنشأة الأولى:<\/b> قال تعالى: <span class=\"ayah\">﴿وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ ۖ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ * قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ﴾<\/span> <span class=\"ayref\">يس: 78-79<\/span>؛ القادر على البدء قادر على الإعادة بداهةً."},{"t":"li","lvl":0,"h":"<b>السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":1,"h":"<b>حديث المعجزة العقلية الخالدة:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«ما مِنَ الأنْبِياءِ نَبِيٌّ إلَّا أُعْطِيَ ما مِثْلُهُ آمَنَ عليه البَشَرُ، وإنَّما كانَ الذي أُوتِيتُ وَحْيًا أَوْحاهُ اللَّهُ إلَيَّ، فأرْجُو أَنْ أَكُونَ أَكْثَرَهُمْ تابِعًا يَومَ القِيامَةِ»<\/span> <span class=\"takh\">[صحيح البخاري]<\/span>."},{"t":"li","lvl":1,"h":"<b>أثر سماع القرآن في هداية العقول:<\/b> حين سمع جبير بن مطعم رضي الله عنه النبي ﷺ يقرأ سورة الطور في المغرب وبلغ قوله: <span class=\"ayah\">﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ﴾<\/span> قال: <span class=\"hadith\">«كادَ قَلْبِي أنْ يَطِيرَ، وذلِكَ أوَّلَ ما وقَرَ الإيمانُ في قَلْبِي»<\/span> <span class=\"takh\">[صحيح البخاري]<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: مواقف من قصص الأنبياء والسيرة النبوية:<\/b>"},{"t":"li","lvl":0,"h":"<b>استماع عتبة بن ربيعة للقرآن:<\/b> جاء عتبة ليفاوض النبي ﷺ عارضاً المال والملك، فأنصت له رسول الله ﷺ حتى فرغ، ثم تلا عليه أوائل سورة فصلت، فلما بلغ آية السجدة أمسك عتبة بيده على فم النبي ﷺ مناشداً إياه أن يتوقف لما استشعره من هيبة الحجة وصدق البيان، ورجع لقريش بوجه غير الذي ذهب به."},{"t":"li","lvl":0,"h":"<b>إسلام أسيد بن حضير وسعد بن معاذ عند سماع مصعب بن عمير:<\/b> جاء أسيد بحربته متوعداً مصعباً، فقال له مصعب بمنطق نبوي: \"أو تجلس فتسمع، فإن رضيت أمراً قبلته، وإن كرهته كففنا عنك ما تكره؟\" فجلس، فقرأ عليه مصعب آيات من القرآن، فما لبث أن قال: \"ما أحسن هذا الكلام وأجمله! كيف تصنعون إذا أردتم أن تدخلوا في هذا الدين؟\"."},{"t":"p","lvl":0,"h":"<b>ثالثاً: التأصيل المرجعي المقارن:<\/b>"},{"t":"li","lvl":0,"h":"<b>القرآن وصناعة العقلية العلمية:<\/b> يؤصل د. محمد عبد الله دراز: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: النبأ العظيم — مقدمة ص د<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>فالعلوم الإسلامية عندما ازدهرت في هذه الأمة الطيبة... أعدّت عقلية هذه الأمة لتكون أقوى عقلية علمية ظهرت في الأرض... عقلية منهجية مرتبة، رتّبتها آيات القرآن الكريم... تجمع بين هداية الوحي وبصيرة الدنيا<\/blockquote><cite>النبأ العظيم - مقدمة ص د<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>قوة الإعجاز التركيبي والبنائي:<\/b> يبين د. دراز: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: النبأ العظيم<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>فإن المُنصف يجد في القرآن نظماً بديعاً وتأليفاً عجيباً ينادي بأن هذا التأليف خرج عن طبيعة التأليف الإنساني... وهو تحدٍّ للقدرة البشرية جمعاء<\/blockquote><cite>النبأ العظيم - ص 187<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>الجمع بين البرهان ووضوح الفطرة:<\/b> يشرح د. دراز: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: النبأ العظيم<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>اقرأ مثلاً قوله تعالى: <span class=\"ayah\">﴿لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا﴾<\/span>... الدليل نفسه جامع بين عمق المقدمات اليقينية ووضوح المقدمات المسلمة... فهو برهاني خطابي شعري معاً<\/blockquote><cite>النبأ العظيم - ص 146<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>ترجمة اليقين إلى سلوك وخلق:<\/b> يقرر الشيخ محمد الغزالي: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: خلق المسلم<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>فالقرآن لم ينزل ليكون مجرد كتاب يُتلى بالحركات والسكنات، بل نزل ليكون منهج حياة يُترجم الإيمان إلى خُلُق، واليقين إلى عمل<\/blockquote><cite>خلق المسلم - ص 24-26<\/cite><\/div><\/details>"}]},{"num":7,"title":"دليل ورشة التطبيق (التفاعل الميداني)","short":"دليل ورشة التطبيق","kind":"std","icon":"tools","blocks":[{"t":"li","lvl":0,"h":"<b>الزمن:<\/b> 20 دقيقة."},{"t":"li","lvl":0,"h":"<b>المجموعات:<\/b> 3 مجموعات (أهل البرهان، أهل التفكر، أهل البصيرة)."},{"t":"li","lvl":0,"h":"<b>التحدي:<\/b> توزيع آيات الاستدلال العقلي على الفرق:"},{"t":"li","lvl":1,"h":"<i>الفريق 1:<\/i> <span class=\"ayah\">﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ﴾<\/span> <span class=\"ayref\">الطور: 35-36<\/span>."},{"t":"li","lvl":1,"h":"<i>الفريق 2:<\/i> <span class=\"ayah\">﴿لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا﴾<\/span> <span class=\"ayref\">الأنبياء: 22<\/span>."},{"t":"li","lvl":1,"h":"<i>الفريق 3:<\/i> <span class=\"ayah\">﴿قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ﴾<\/span> <span class=\"ayref\">يس: 78-79<\/span>."},{"t":"li","lvl":0,"h":"<b>المهمة:<\/b> تفكيك الآية وصياغة الحجة العقلية المضمرة فيها في صورة دليل منطقي حواري."},{"t":"li","lvl":0,"h":"<b>المخرجات:<\/b> تقديم كل فريق خلاصته في 3 دقائق أمام القاعة."}]},{"num":8,"title":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","short":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"هل العقل مقدم على النقل عند التعارض؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> لا تعارض بين <b>صريح العقل وصحيح النقل<\/b>. فالعقل هو الذي دلنا على صحة الوحي، فإذا ثبت الوحي صار من كمال العقل قبول أخباره الغيبية وأحكامه. التعارض يقع فقط إذا كان النص غير صحيح، أو كان \"العقل\" مجرد هوى وظنون متوهمة."}]},{"t":"qa","n":"2","q":"\"لماذا لم يأتِ القرآن بأسلوب النظريات الفلسفية المعقدة؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> لأن المصطلحات الفلسفية تتغير بتغير العصور وتخص النخب الضيقة، بينما نزل القرآن هداية عامة للبشرية، فصاغ حقائقه بأسلوب فطري عميق يفهمه الجميع."}]},{"t":"qa","n":"3","q":"\"كيف أستشعر اليقين بالقرآن وأنا لا أفهم بعض كلماته؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> بقراءة القرآن بنية الاستهداء والاستعانة بتفسير ميسر (كتفسير السعدي أو المختصر في التفسير)؛ فالفهم مفتاح الخشوع."}]}]},{"num":9,"title":"علم الإنذار المبكر (بروتوكول الحماية والتدخل الفردي)","short":"علم الإنذار المبكر","kind":"std","icon":"alert","blocks":[{"t":"li","lvl":0,"h":"<b>مؤشرات الخطر:<\/b> الجفاء الشديد تجاه القرآن (\"القرآن كتاب قديم لا يلبي واقعنا\")، التشكيك في التشريعات القطعية استناداً إلى ثقافة غربية، والانقطاع التام عن التلاوة."},{"t":"li","lvl":0,"h":"<b>بروتوكول التدخل:<\/b>"},{"t":"li","lvl":1,"h":"جلسة فردية هادئة دون تخوين."},{"t":"li","lvl":1,"h":"بيان أن الشبهة ناتجة عن تقديم العقل البشري المحدود على علم الله المطلق المحيط."},{"t":"li","lvl":1,"h":"إهداؤه كتاباً مبسطاً في عظمة القرآن (مثل <i>النبأ العظيم<\/i> أو <i>سلسلة بوصلة المصلح<\/i>) ومدارسة فصل معه."}]},{"num":10,"title":"الفعاليات والأنشطة المصاحبة (بطاقة عمل تفاعلية)","short":"الفعاليات والأنشطة المصاحبة","kind":"std","icon":"card","blocks":[{"t":"li","lvl":0,"h":"<b>تمرين: بطاقة \"شجرة البراهين القرآنية\" (7 دقائق فردية):<\/b>"},{"t":"card","title":"بطاقة: شجرة البراهين القرآنية","sub":"","lines":["اختر آية استوقفتك في جلسة اليوم:","1. نص الآية الكريمة: <span class=\"ayah\">﴿ ......................... ﴾<\/span>","2. قضية اليقين: [ وج
