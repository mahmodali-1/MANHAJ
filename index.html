لى:<\/b> <span class=\"ayah\">﴿وَأَطِيعُوا اللَّهَ وَرَسُولَهُ وَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ ۖ وَاصْبِرُوا ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾<\/span> <span class=\"ayref\">الأنفال: 46<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> تحذير قرآني جازم من التنازع الداخلي؛ فهو السبب المباشر لتبدد القوة وذهاب الهيبة والفشل الذريع."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ﴾<\/span> <span class=\"ayref\">الشورى: 38<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أبي موسى الأشعري رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«المُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا - وَشَبَّكَ بَيْنَ أَصَابِعِهِ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الصلاة، باب تشبيك الأصابع في المسجد، برقم 481؛ وصحيح مسلم برقم 2585<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> التمثيل النبوي الحسي بالتشبيك بين الأصابع لتأصيل ضرورة التكامل الوظيفي والتلاحم المتين في العمل المشترك."},{"t":"li","lvl":0,"h":"<b>حديث عبد الله بن عمر رضي الله عنهما:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«يَدُ اللَّهِ مَعَ الجَمَاعَةِ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>جامع الترمذي: كتاب الفتن برقم 2167، وصححه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الوجداني:<\/i> البركة والرعاية الإلهية تحف النفوس المؤتلفة التي تخلت عن أنانيتها لصالح المجموع."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>مشاركة النبي ﷺ الميدانية في حفر الخندق:<\/b> لما نزل النبي ﷺ مع أصحابه لحفر الخندق، قسّم المهام بدقة (كل عشرة يحفرون أربعين ذراعاً)، ولم يكتفِ بالتوجيه من خيمته، بل نزل بفأسه يكسر الصخور ويحمل التراب معهم حتى وارى التراب جلد بطنه الشريف؛ ليرسخ عملياً مبدأ \"القيادة التشاركية ونكران الذات\"."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: العمل الفردي مقابل العمل الجماعي التشاركي<\/b>"},{"t":"p","lvl":0,"h":"العمل الفردي والأنانية                     العمل الجماعي التشاركي"},{"t":"p","lvl":0,"h":"+----------------------------------------+----------------------------------------+"},{"t":"p","lvl":0,"h":"| - \"رأيي هو الأوحد وعلى الجميع التنفيذ\". | - الشورى واستثمار تنوع الكفاءات.        |"},{"t":"p","lvl":0,"h":"| - الانسحاب والتذمر عند أول خلاف وجهات. | - إدارة الخلاف بهدوء وفق بروتوكول محدد. |"},{"t":"p","lvl":0,"h":"| - حب الاستئثار بالأضواء والمديح.       | - نكران الذات ونسبة النجاح للفريق ككل.  |"},{"t":"p","lvl":0,"h":"| - التكاسل والاتكالية على جهد الآخرين.   | - القيام بالمسؤولية المسندة بدقة وأمانة.|"},{"t":"p","lvl":0,"h":"+----------------------------------------+----------------------------------------+"},{"t":"p","lvl":0,"h":"<b>المحور الثاني: بروتوكول حل الخلاف داخل الفريق (Conflict Resolution)<\/b>"},{"t":"li","lvl":0,"h":"الخلاف في الآراء طبيعي وصحي، والخلل في تحويله إلى خصومة شخصية؛ البروتوكول الخماسي: (1) الهدوء والتنفس، (2) الاستماع دون مقاطعة، (3) مناقشة الفكرة لا الشخص، (4) التصويت بالشورى، (5) الالتزام التام بقرار الأغلبية دون تذمر."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"إذا كان في الفريق عضو كسول لا يعمل، فلماذا أتحمل جهده وينال نفس تقييمي؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الحل ليس بالانسحاب أو المشاجرة، بل في <b>وضوح توزيع المهام المكتوبة<\/b> منذ اليوم الأول وتوثيقها. إذا قصر عضو، يناصحه القائد بلطف، فإن تمادى يُرفع الأمر للمشرف/المعلم ببيانات دقيقة وموضوعية دون تشهير."}]},{"t":"qa","n":"2","q":"\"هل يجب على القائد أن يكون الأكثر ذكاءً وخبرة في الفريق؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> لا يشترط؛ القائد الناجح ليس من يفعل كل شيء، بل من <b>يُحسن إدارة الطاقات وتنسيقها<\/b> ويوفر البيئة التي تجعل الأذكياء يبدعون؛ فالقيادة خدمة وتيسير وليست رتبة استعلاء."}]},{"t":"qa","n":"3","q":"\"كيف أتصرف إذا صوّت الفريق على رأي أرى أنه خاطئ؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> من كمال الرجولة والشورى أن تنزل عند رأي الأغلبية وتعمل لإنجاحه بكل طاقتك، مالم يكن معصية لله. النبي ﷺ نزل عند رأي أغلبية الشباب في الخروج لأحد بالرغم من أن رأيه كان البقاء في المدينة!"}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>قائد عمليات الفريق (الميسر الشاب):<\/b> إدارة المحاكاة وضبط جولات التحدي."},{"t":"li","lvl":0,"h":"<b>مدوّن الميثاق الجماعي (المدوّن):<\/b> تدوين بروتوكول الخلاف وتوزيع الأدوار على السبورة."},{"t":"li","lvl":0,"h":"<b>مراقب السلوك والتواصل (المقيم):<\/b> رصد أسلوب الحديث والاستماع ومنع المقاطعات."},{"t":"li","lvl":0,"h":"<b>حارس زمن المشاريع (الميقاتي):<\/b> ضبط المواعيد بدقة لتدريبهم على الالتزام."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر محاكاة أزمة الفريق (Team Crisis Challenge)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> أوراق مهام مجزأة، 20 ورقة بيضاء لكل فريق، ومظاريف أزمات طارئة."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<i>التشكيل (4 فتيان بكل فريق):<\/i> تحديد القائد، المنفذ، المنسق، والمراقب."},{"t":"li","lvl":1,"h":"<i>التحدي (10 دقائق):<\/i> بناء أعلى برج ورقي متزن دون استخدام أي مادة لاصقة!"},{"t":"li","lvl":1,"h":"<i>الأزمة الطارئة (بعد 5 دقائق):<\/i> يسلم الميسر ظرفاً طارئاً (مثال: \"توقف القائد عن الحديث ولا يحق له إلا الإشارة\"، أو \"سُحبت 5 أوراق وعليكم تعديل الخطة في 30 ثانية\")."},{"t":"li","lvl":1,"h":"<i>تطبيق بروتوكول الخلاف:<\/i> التدريب الحي على اتخاذ القرار والشورى بهدوء تحت الضغط."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: فريق \"الرواد\" والانسحاب بسبب خلاف الرأي<\/span>"},{"t":"p","lvl":0,"h":"فريق \"الرواد\" المكون من 5 طلاب اتفقوا على إعداد مجسم علمي للمنافسة المدرسية:"},{"t":"p","lvl":0,"h":"- أثناء التخطيط: اقترح \"باسل\" فكرة معقدة ومكلفة، بينما اقترح \"عمر\" فكرة ذكية وبسيطة وغير مكلفة[span_118](start_span)[span_118](end_span)."},{"t":"p","lvl":0,"h":"- بعد الشورى: صوت 4 أعضاء لصالح فكرة عمر[span_119](start_span)[span_119](end_span)!"},{"t":"p","lvl":0,"h":"- استشاط باسل غضباً وقال: \"أنتم لا تفهمون شيئاً في الإبداع! وبما أنكم رفضتم فكرتي، فأنا منسحب ولن أساعدكم بحرف!\"، وأغلق هاتفه وهاجمهم في حساباته[span_120](start_span)[span_120](end_span)!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف عكست ردة فعل باسل الأنانية والنرجسية التي تهدم العمل الجماعي؟"},{"t":"p","lvl":0,"h":"2. كيف لو كنت مكان باسل تتصرف برجولة ومرونة عند عدم اختيار فكرتك؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال العمل الفردي مقابل العمل الجماعي."],["05 - 15 د","الخطاف الحواري","قصة العباقرة الأربعة والروبوت المنهار."],["15 - 25 د","التأصيل الشرعي والمفاهيمي","أدلة البنيان المرصوص، يد الله مع الجماعة، وتجربة الخندق."],["25 - 55 د","المختبر التطبيقي","تمرين بناء البرج الورقي وإدارة الأزمة الطارئة."],["55 - 63 د","دراسة حالة واقعية","تفكيك حالة باسل والانسحاب الأناني في المجموعات."],["63 - 68 د","بنك الأسئلة الجدلية","إدارة العضو الكسول، ومفهوم القائد الخادم."],["68 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع بطاقة الطالب."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 85-100","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«أولوية العمل المؤسسي الجماعي على العمل الفردي العشوائي أصل شرعي؛ فالأمة لا تُبنى بجهود مبعثرة وإن كانت مخلصة»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 345-365","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«التربية على الشورى والتعاون ونكران الذات تصنع فتياناً يتكاملون كالبنيان المرصوص ولا تحركهم الأحقاد»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 40-50","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«البناء المشترك مع الأقران هو محك النضج؛ وتجاوز آفات الفردية وحب الاستئثار شرط أساسي لبركة العمل»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 135-150","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«سلامة الصدور وسعة الأفق في أدب الخلاف هما سياج الأخوة؛ والمؤمن يألف ويؤلف ولا خير فيمن لا يألف ولا يؤلف»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 100-115","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«صراعات النفوذ بين المراهقين تعالج بتوضيح الأدوار وتقسيم المهام بالعدل والمساءلة الموضوعية»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>ديناميكية فرق العمل وبناء الروح الجماعية<\/i> — د. روبينز <span class=\"pg\">ص 40-85<\/span>."},{"t":"li","lvl":1,"h":"<i>أدب الاختلاف في الإسلام<\/i> — د. طه جابر العلواني <span class=\"pg\">ص 25-60<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف نبني روح الفريق ونتجاوز الأنانية؟\" — د. أحمد عبد المنعم على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع تدريبي:<\/b> \"المهارات الخمس للعمل الجماعي الفعال\" — قناة علي وكتاب على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"التكامل الجماعي وبركة الشورى\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. الاندماج في مهمة جماعية حقيقية:","[ ] المشاركة الفاعلة في مشروع مدرسي أو تطوعي أو منزلي مع الالتزام التام بالدور المسند إليك.","2. ممارسة أدب الشورى:","[ ] التنازل عن رأيك الشخصي لصالح رأي الأغلبية في موقف جماعي بهدف إنجاح العمل.","3. مساندة رفيق متعثر:","[ ] تقديم دعم ومساعدة لعضو في فريقك يعاني من صعوبة إنجاز مهمته دون تذمر أو تعالٍ."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الاندماج ونكران الذات","يصر على فرض رأيه، أو ينسحب سريعاً إذا لم يختر رأيه.","يعمل مع الفريق بتردد، ويميل للانفراد بمهامه وتجنب النقاش.","يتكامل بمرونة، وينسب النجاح للفريق، ويعمل بروح نكران الذات."],["إدارة الخلاف الحواري","يقاطع الآخرين، ويرفع صوته، ويحول النقاش إلى هجوم شخصي.","يستمع بصعوبة، وقد يظهر انزعاجاً صامتاً عند معارضة فكرته.","يطبق بروتوكول حل الخلاف، ويناقش الفكرة بموضوعية وأدب."],["المسؤولية والالتزام","يتكاسل عن أداء دوره ويعتمد كلياً على جهد زملائه.","ينجز دوره بعد تذكير متكرر وبمستوى متوسط.","يؤدي مهامه المسندة بإتقان تام، ويبادر لمساندة رفاقه المتعثرين."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: العمل الجماعي والقيادة التشاركية","sub":"","lines":["💡 البوصلة والمفهوم:","المرء ضعيفٌ بمفرده، قويٌ بإخوانه! المشروعات الكبرى التي تبني الأمة لا يقودها مستبدون أنانيون، بل رجالٌ تآلفت قلوبهم على الشورى ونكران الذات. يد الله مع الجماعة، والبركة تتنزل على المتواضعين.","📖 الآية المحورية:","<span class=\"ayah\">﴿وَالْمُؤْمِنُونَ وَالْمُؤْمِنَاتُ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ﴾<\/span> <span class=\"ayref\">التوبة: 71<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«المُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا»<\/span> <span class=\"takh\">[صحيح البخاري ومسلم]<\/span>.","📐 خطوات بروتوكول الخلاف الخماسي:","1. الصمت والتنفس العميق عند احتدام النقاش.","2. الاستماع الكامل لوجهة نظر الزميل دون مقاطعة.","3. تفنيد الأفكار بموضوعية دون تجريح شخصي.","4. الاحتكام للتصويت بروح الشورى.","5. الالتزام الصادق بقرار الأغلبية لإنجاح الهدف المشترك.","—hr—","🎯 دوري القيادي في فريقي هذا الأسبوع:","- المهمة المسندة إليّ: _____________________________________________","- الزميل الذي سأسانده في مهمته: ___________________________________","—hr—","📝 سجل الالتزام الجماعي (ضع ✓ عند التطبيق):","[ إنجاز المهمة المسندة بدقة ]  [ النزول عند رأي الأغلبية ]  [ مساندة زميل متعثر ]","(   )                         (   )                       (   )","عهد الفتى المسلم: \"أنا لبنة صالحة في بنيان أمتي، قوتي في إخواني، وسلامة صدري عنوان رجولتي\"."]}]}]},{"id":"5-3","ordinal":"السابع والعشرون","title":"حل المشكلات واتخاذ القرار","sub":"التفكير الإبداعي ومهارات تفكيك الأزمات الواقعية","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الخامسة: المهارات المستقبلية والجاهزية العملية"],["عنوان اللقاء","حل المشكلات واتخاذ القرار (التفكير الإبداعي ومهارات تفكيك الأزمات الواقعية)"],["الرمز الكودي","U5-L27-PROBLEM_SOLVING"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل تفاعلية حية، عيادة تفكيك الأزمات الواقعية، ومختبر مصفوفات اتخاذ القرار"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> الحياة الواقعية والأكاديمية سلسلة متصلة من التحديات والمشكلات المعقدة التي تتطلب حكمة وثباتاً؛ والشاب الضعيف هو من يقابل الأزمات بالانفعال، أو الهروب بالشكوى والمسكنات. الشاب القيادي هو من يمتلك <b>أدوات تفكيك المشكلات إلى جذورها الأولية (Root Cause Analysis)، واستخدام التفكير الإبداعي لتوليد البدائل، والموازنة بين المصالح والمفاسد لحسم القرار دون تردد أو تسويف<\/b>."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يتقن الفتى أداة \"لماذا الخماسية (5 Whys)\" للوصول لجذر المشكلة، ويستوعب مصفوفة المفاضلة بين الخيارات."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يتخلص الفتى من \"فوبيا اتخاذ القرار\" وشلل التحليل، ويستشعر الحكمة والتوكل على الله عند نزول الأزمات."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يفكك الفتى مشكلة واقعية يعاني منها، ويولد لها 3 حلول بديلة، ويتخذ قراراً حاسماً ومكتوباً ويباشر تنفيذه."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بطرح هذا السؤال التشخيصي:"},{"t":"p","lvl":0,"h":"<b>\"إذا أحسست بألم حاد في ضرسك ليلة الامتحان، فأخذت حبة مهدئ وسكت الألم لساعات ثم عاد مضاعفاً.. هل قمت بحل المشكلة؟ أم قمت بتخدير العَرَض وتجاهلت أصل المصيبة؟ كم مشكلة في دراستك وعلاقاتك تتعامل معها بنفس طريقة (حبة المهدئ) بالهروب والتسويف حتى تنفجر بوجهك؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو المحرك المحترق والحل السطحي)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة السائق والزيت المحترق vs مهندس الأسباب الجذور<\/span>"},{"t":"p","lvl":0,"h":"- مالك (17 سنة): كان يقود سيارته، وفجأة أضاءت لمبة التحذير الحمراء في شاشة القيادة!"},{"t":"p","lvl":0,"h":"* بدلاً من التوقف والبحث عن العطل، ألصق شريطاً لاصقاً أسود فوق اللمبة كي لا يراها وواصل السير مسرعاً!"},{"t":"p","lvl":0,"h":"* بعد 10 كيلومترات: انفجر المحرك بالكامل، وخسر مئات الدولارات بسبب هروبه من جذر المشكلة!"},{"t":"p","lvl":0,"h":"- معاذ (17 سنة): تعرض لنفس الموقف؛ توقف فوراً، فتح غطاء المحرك، فحص منسوب الزيت والماء، واكتشف تسريباً طفيفاً فأصلحه في دقائق ووفر ماله ومركبته!"},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. لماذا نميل دائماً إلى \"وضع الشريط اللاصق على المشكلة\" بدلاً من تفكيك سببها الأصلي؟"},{"t":"p","lvl":0,"h":"2. كيف نحول أزماتنا الدراسية والشخصية من كوارث مرهقة إلى فرص للتعلم عبر التفكير التحليلي؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿يُؤْتِي الْحِكْمَةَ مَن يَشَاءُ ۚ وَمَن يُؤْتَ الْحِكْمَةَ فَقَدْ أُوتِيَ خَيْرًا كَثِيرًا ۗ وَمَا يَذَّكَّرُ إِلَّا أُولُو الْأَلْبَابِ﴾<\/span> <span class=\"ayref\">البقرة: 269<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الحكمة هي وضع الشيء في موضعه اللائق؛ واتخاذ القرار الرشيد المنبثق من التحليل العميق خير عطايا الله للعبد."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿فَبَشِّرْ عِبَادِ * الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ ۚ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ ۖ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ﴾<\/span> <span class=\"ayref\">الزمر: 17-18<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> منهج القرآن في المفاضلة وتوليد البدائل؛ الاستماع للخيارات المتعددة واختيار أحسنها وأكثرها مصلحة ونفعاً."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أم المؤمنين عائشة رضي الله عنها:<\/b> قالت: <span class=\"qt\">«مَا خُيِّرَ رَسُولُ اللَّهِ ﷺ بَيْنَ أَمْرَيْنِ إِلاَّ أَخَذَ أَيْسَرَهُمَا، مَا لَمْ يَكُنْ إِثْمًا»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب المناقب برقم 3560؛ وصحيح مسلم برقم 2327<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> الواقعية والمرونة النبوية في اتخاذ القرار؛ اختيار الأيسر والأنفع والمحقق للمصلحة بشرط السلامة من الحرام."},{"t":"li","lvl":0,"h":"<b>حديث علي بن أبي طالب رضي الله عنه:<\/b> لما بعثه النبي ﷺ لليمن قاضياً فقال: إني شاب لا أدري ما القضاء، فضرب بيده في صدره وقال: <span class=\"hadith\">«اللَّهُمَّ اهْدِ قَلْبَهُ، وَثَبِّتْ لِسَانَهُ! يَا عَلِيُّ، إِذَا جَلَسَ إِلَيْكَ الخَصْمَانِ فَلاَ تَقْضِ بَيْنَهُمَا حَتَّى تَسْمَعَ مِنَ الآخَرِ كَمَا سَمِعْتَ مِنَ الأَوَّلِ، فَإِنَّهُ أَحْرَى أَنْ يَتَبَيَّنَ لَكَ القَضَاءُ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>سنن أبي داود: كتاب الأقضية برقم 3582؛ وجامع الترمذي برقم 1331، وصححه الألباني<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل المنهجي:<\/i> استكمال جمع البيانات وفحص وجهات النظر قبل إصدار أي حكم أو حسم قرار."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>مشورة أم سلمة رضي الله عنها في الحديبية:<\/b> لما اشتد كرب الصحابة وحزنهم من بنود الصلح وتباطؤوا عن النحر والحلق، دخل النبي ﷺ عليها كئيباً، فأشارت عليه بحكمة بالغة: <span class=\"hadith\">«اخْرُجْ ثُمَّ لاَ تُكَلِّمْ أَحَدًا مِنْهُمْ كَلِمَةً حَتَّى تَنْحَرَ بُدْنَكَ، وَتَدْعُوَ حَالِقَكَ فَيَحْلِقَكَ!»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الشروط برقم 2731-2732<\/cite><\/div><\/details>. تفكيك أزمة نفسية كبرى عبر \"المبادرة بالفعل الإجرائي القيادي المباشر\" الذي يزيل المقاومة."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: خوارزمية السبب الجذر (تقنية 5 Whys)<\/b>"},{"t":"li","lvl":0,"h":"عدم التوقف عند السطح؛ مثال:"},{"t":"li","lvl":1,"h":"<i>المشكلة الظاهرة:<\/i> درجاتي متدنية في الرياضيات."},{"t":"li","lvl":1,"h":"<i>لماذا 1؟<\/i> لأنني لم أحل جيداً في الاختبار."},{"t":"li","lvl":1,"h":"<i>لماذا 2؟<\/i> لأنني لم أذاكر إلا ليلة الامتحان."},{"t":"li","lvl":1,"h":"<i>لماذا 3؟<\/i> لأنني أجّلت المذاكرة أسبوعين."},{"t":"li","lvl":1,"h":"<i>لماذا 4؟<\/i> لأنني أقضي 3 ساعات على التيك توك يومياً بعد عودتي."},{"t":"li","lvl":1,"h":"<i>لماذا 5 (السبب الجذر):<\/i> <b>غياب نظام حظر الهاتف وفوضى بيئة الغرفة!<\/b>"},{"t":"p","lvl":0,"h":"<span class=\"lbl\">خوارزمية الحسم والقرار<\/span>"},{"t":"p","lvl":0,"h":"تشخيص السبب الجذر (5 Whys) ⬅️ توليد 3 بدائل إبداعية ⬅️ موازنة المصالح والمفاسد ⬅️ حسم القرار والتنفيذ الفوري"},{"t":"p","lvl":0,"h":"<b>المحور الثاني: التخلص من فخ \"شلل التحليل (Analysis Paralysis)\"<\/b>"},{"t":"li","lvl":0,"h":"لا يوجد قرار كامل بنسبة 100% خالٍ من أي عيب في الدنيا؛ الشجاعة تقتضي اختيار الخيار \"الأرجح مصلحة والأقل مفسدة\"، والتوكل على الله، وترك التردد المميت."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"ماذا لو اتخذت قراراً وتبين لاحقاً أنه خاطئ وندمت؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> اتخاذ قرار مبني على الاستشارة والتحليل ثم الخطأ فيه جزء أصيل من نضج الإنسان وخبرته الحياتية. الخطأ هو مادة التعلم، والتردد والهروب المستمر أسوأ من اتخاذ قرار يحتاج لتصويب."}]},{"t":"qa","n":"2","q":"\"هل الاستخارة تغني عن التفكير التحليلي واستشارة الخبراء؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الاستخارة والشورى متلازمان؛ شرع الله لنا استشارة العقلاء ودراسة البدائل أولاً، ثم صلاة الاستخارة تفويضاً للأمر إلى الله وتوكلاً عليه، ولا تعارض بين الشرع والعقل."}]},{"t":"qa","n":"3","q":"\"كيف أتصرف إذا واجهت مشكلة أجهل تماماً كيفية حلها؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> أول قواعد الحكمة الاعتراف بالجهل وسؤال أهل الذكر والخبرة: <span class=\"ayah\">﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾<\/span>؛ والرجولة تقتضي طلب العون لا التخبط والمكابرة."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>رئيس عيادة الأزمات (الميسر الشاب):<\/b> إدارة النقاش وتوزيع المشكلات الواقعية."},{"t":"li","lvl":0,"h":"<b>مهندس الجذور (المدوّن):<\/b> تفريغ تقنية (5 Whys) ورسم شجرة القرار على السبورة."},{"t":"li","lvl":0,"h":"<b>محلل المخاطر والبدائل (المعارض/المقيم):<\/b> اختبار جدوى الحلول وموازنة السلبيات والإيجابيات."},{"t":"li","lvl":0,"h":"<b>حارس وقت القرار (الميقاتي):<\/b> ضبط أوقات التفكير والمحاكاة."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر عيادة الأزمات ومصفوفة اتخاذ القرار (Decision Matrix Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة ورقية مقسمة إلى شجرة المشكلة ومصفوفة المفاضلة."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<i>التشخيص:<\/i> كتابة أزمة شخصية حقيقية تؤرق الطالب (ضعف دراسي، تسويف، خلاف)."},{"t":"li","lvl":1,"h":"<i>حفر الجذور:<\/i> تطبيق أسئلة \"لماذا الخمس\" حتى الوصول للسبب الجوهري المولد للمشكلة."},{"t":"li","lvl":1,"h":"<i>توليد البدائل (3 حلول):<\/i> حل مألوف، حل ذكي قليل التكلفة، وحل جذري شجاع."},{"t":"li","lvl":1,"h":"<i>المفاضلة والحسم:<\/i> تقييم كل حل بدرجة من 10 (المكاسب - الأضرار) وكتابة القرار النهائي الحاسم للبدء فيه خلال 24 ساعة."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: حسام وصراع قرار التخصص الجامعي<\/span>"},{"t":"p","lvl":0,"h":"حسام (17 سنة) في الصف الأخير بالثانوية، يواجه معضلة مصيرية:"},{"t":"p","lvl":0,"h":"- والده يضغط عليه بقسوة ليدخل كلية الهندسة ليقال عنه \"والد الباشمهندس[span_183](start_span)\"[span_183](end_span)."},{"t":"p","lvl":0,"h":"- حسام يملك شغفاً ومهارة عالية في البرمجة والذكاء الاصطناعي، ويرى مستقبله فيها[span_184](start_span)[span_184](end_span)."},{"t":"p","lvl":0,"h":"- أصيب حسام بهلع وتردد؛ إن دخل الهندسة خشي الفشل، وإن دخل الحاسوب خشي غضب والده[span_185](start_span)[span_185](end_span)!"},{"t":"p","lvl":0,"h":"النتيجة: توقف حسام عن المذاكرة بالكامل وصار يقضي 8 ساعات في النوم والهروب بالشاشات[span_186](start_span)[span_186](end_span)!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف حول الهروب والتردد المشكلة إلى أزمة كادت تدمر مستقبل حسام الدراسي؟"},{"t":"p","lvl":0,"h":"2. كيف يوظف حسام مصفوفة الموازنات لإقناع والده ببر وذكاء دون صدام؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال حبة المسكن وتخدير أصل المشكلة."],["05 - 15 د","الخطاف الحواري","قصة السائق والمحرك المحترق والزيت."],["15 - 25 د","التأصيل الشرعي والمفاهيمي","آيات الحكمة، حديث الأيسر، وتوجيه علي للقضاء، ورأي أم سلمة."],["25 - 55 د","المختبر التطبيقي","عيادة الأزمات: تطبيق (5 Whys) ومصفوفة القرار."],["55 - 63 د","دراسة حالة واقعية","تفكيك حيرة حسام بين ضغط الأب وشغف التخصص."],["63 - 68 د","بنك الأسئلة الجدلية","علاج التردد، الجمع بين الاستخارة والتحليل، وطلب العون."],["68 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع بطاقة الطالب."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 40-62","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«فقه الموازنات بين المصالح والمفاسد هو جوهر العقل والتشريع؛ واتخاذ القرار الرشيد يقدم أعظم المصلحتين ويدفع أسوأ المفسدتين»<\/span>."},{"t":"src","cite":"سابغات - أحمد السيد - ص 35-48","short":"سابغات — أحمد السيد","q":"<span class=\"qt\">«التفكير النقدي والتفكيك المنطقي للإشكالات هو الدرع الذي يحمي الشاب من الارتجال والسطحية والانسياق خلف الأعراض»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 42-52","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«تطوير العقلية التحليلية وتدريب الفتى على حسم قراراته بشجاعة يخرجه من دائرة الاتكالية إلى مصاف القيادة»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 180-192","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«إذا أردت حل مشكلة مستمرة، فلا تعالج السلوك السطحي، بل غير البيئة والنظام المحرك الذي يولد المشكلة من جذورها»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 105-118","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«التردد آفة تقتل طموح المراهق؛ ومساعدته على امتلاك أدوات المفاضلة المكتوبة تمنحه الجرأة والنضج»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>التفكير الإبداعي ومهارات حل المشكلات<\/i> — د. إدوارد دي بونو <span class=\"pg\">ص 35-70<\/span>."},{"t":"li","lvl":1,"h":"<i>صناعة القرار واتخاذه في الأزمات<\/i> — د. محمد عبد الغني حسن <span class=\"pg\">ص 40-80<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تتخذ قراراتك المصيرية بحكمة وتتخلص من التردد؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع تدريبي:<\/b> \"تقنية الأسباب الخمسة (5 Whys) في حل المشكلات المعقدة\" — قناة علي وكتاب على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"تفكيك مشكلة واتخاذ قرار شجاع\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. استئصال جذر المشكلة:","[ ] تطبيق تقنية (5 Whys) على تحدٍ دراسي أو شخصي واقعي وتحديد سببه الأصلي بوضوح.","2. حسم قرار تنفيذي مؤجل:","[ ] اتخاذ قرار حاسم في مسألة كنت تسوفها وتتردد فيها، ومباشرة أول خطوة فيها اليوم.","3. الاستشارة الراشدة:","[ ] استشارة صاحب حكمة وتجربة (والدك، معلمك، أو ميسرك) وعرض بدائلك عليه بتوازن."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["تفكيك المشكلات","يكتفي بالشكوى والانفعال ويعالج الأعراض السطحية.","يستوعب أسباب المشكلة نظرياً ويصعب عليه حفر الجذور العميقة.","يطبق تقنية (5 Whys) ببراعة، ويحدد السبب الجذري ويستأصله."],["توليد البدائل","يرى المشكلة من زاوية واحدة مسدودة ويستسلم للإحباط.","يقترح حلاً أو حلين تقليديين مع تردد في اختبار الجدوى.","يولد بدائل إبداعية متعددة، ويفاضل بينها بمصفوفة واضحة."],["الشجاعة في اتخاذ القرار","يقع فريسة لشلل التحليل والتردد والهروب المستمر.","يتخذ قراراته ببطء شديد ويظل قلقاً شاكاً في صحتها.","يحسم قراره بشجاعة بعد الشورى والاستخارة ويباشر تنفيذه."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: حل المشكلات وحسم القرارات","sub":"","lines":["💡 البوصلة والمفهوم:","الحياة لا تخلو من الأزمات، والرجولة في كيفية مواجهتها! لا تضع لاصقاً مخدراً على المشكلة فتهرب من الأعراض، بل احفر بحثاً عن \"السبب الجذر\". الحكيم يستشير، ويوازن، ويستخير، ثم يحسم أمره بعزم لا يلين.","📖 الآية المحورية:","<span class=\"ayah\">﴿يُؤْتِي الْحِكْمَةَ مَن يَشَاءُ ۚ وَمَن يُؤْتَ الْحِكْمَةَ فَقَدْ أُوتِيَ خَيْرًا كَثِيرًا﴾<\/span> <span class=\"ayref\">البقرة: 269<\/span>.","مِشكاة النبوة:","قالت عائشة رضي الله عنها: <span class=\"qt\">«مَا خُيِّرَ رَسُولُ اللَّهِ ﷺ بَيْنَ أَمْرَيْنِ إِلاَّ أَخَذَ أَيْسَرَهُمَا، مَا لَمْ يَكُنْ إِثْمًا»<\/span> <span class=\"takh\">[صحيح البخاري ومسلم]<\/span>.","📐 خطوات خوارزمية حسم الأزمات الأربع:","1. لماذا الخماسية (5 Whys): لا تتوقف حتى تصل للأصل والمنبع.","2. توليد 3 بدائل: ابحث عن زوايا مبتكرة خارج الصندوق.","3. ميزان المصالح والمفاسد: قدم الأرجح مصلحة والأدنى مفسدة.","4. التنفيذ الفوري: اتخذ القرار وتوكل، ولا تستسلم لشلل التحليل.","—hr—","🎯 قراري الحاسم الذي اتخذته هذا الأسبوع:","- المشكلة: _______________________________________________________","- السبب الجذر: __________________________________________________","- القرار التنفيذي: _______________________________________________","—hr—","📝 سجل الحسم والمبادرة (ضع ✓ عند التطبيق):","[ تشخيص السبب الجذر لمشكلة ]  [ استشارة حكيمة ]  [ تنفيذ خطوة قرار شجاع ]","(   )                     (   )                    (   )","عهد الفتى المسلم: \"أنا رجل حكيم، أواجه المشكلات ببصيرة، أتوكل على ربي، ولا أعرف التردد\"."]}]}]},{"id":"5-4","ordinal":"الثامن والعشرون","title":"أخلاقيات المهن والعمل","sub":"الأمانة، الإتقان، صناعة القيمة، وبناء السمعة في بيئات العمل","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الخامسة: المهارات المستقبلية والجاهزية العملية"],["عنوان اللقاء","أخلاقيات المهن والعمل (الأمانة، الإتقان، صناعة القيمة، وبناء السمعة في بيئات العمل)"],["الرمز الكودي","U5-L28-WORK_ETHICS"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل تفاعلية حية، محاكاة بيئة الشركات وسوق العمل، ومختبر معايير الجودة والإتقان"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> العمل والوظيفة في التصور الإسلامي ليسا مجرد وسيلة لجلب المال وقضاء الوقت بأقل مجهود، بل هما <b>عبادة وميدان لإبراز أمانة الدين وعمارة الأرض وصناعة الأثر<\/b>. الفتى الذي يفتقد لأخلاقيات المهن يسقط في التزوير، والمطل، والتسويف، وثقافة \"الحد الأدنى\". أخلاقيات العمل تقوم على ركنين عظيمين: <b>\"القوة\" (الكفاءة والمهارة) و\"الأمانة\" (الصدق والإتقان)<\/b>؛ لبناء سمعة مهنية تجعل الشاب علامة فارقة ومباركة في سوق العمل."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يستوعب الفتى معادلة (القوي الأمين)، ويدرك الفارق بين \"ثقافة الحد الأدنى\" و\"صناعة القيمة المضافة والإتقان\"."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى مراقبة الله في عمله، متحرراً من ثقافة الكسل والغش والاتكالية."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يمارس الفتى محاكاة \"عقد العمل ومعايير الجودة\"، ويلتزم بتسليم مهمة دراسية أو منزلية بإتقان استثنائي يتجاوز المتوقع."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بطرح هذا السؤال الاستفزازي الهادئ:"},{"t":"p","lvl":0,"h":"<b>\"إذا استأجرت عاملاً في بيتك ليدهن غرفتك، واتفقت معه على مبلغ جيد، ثم بمجرد أن غادرت الصالة صار يجلس على هاتفه ويدهن الحائط بطبقة رديئة وسريعة.. ما شعورك نحوه؟ لماذا نستقبح هذا السلوك في غيرنا، لكننا عندما نذاكر أو ننجز واجباً مدرسياً أو نؤدي خدمة في بيتنا نبحث عن (أقل مجهود ممكن لتمرير الموقف والسلام)؟ هل يرضى الله منا هذا الخداع؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو المطور الماطل والمندس المتقن)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة صاحب الشركة ومبرمجين: الماطل vs المتقن الصادق<\/span>"},{"t":"p","lvl":0,"h":"أراد تاجر تصميم متجر إلكتروني لمشروعه، ووظف مبرمجين شابين (عقد كل منهما 1000 دولار):"},{"t":"p","lvl":0,"h":"- الشاب (أ): يملك ذكاءً لكنه يفتقد للأمانة والجدية؛ تأخر أسبوعين وهو يقدم أعذاراً كاذبة، وسلم متجراً مليئاً بالأعطال، وقال ببرود: \"على قدر نقودكم أعمل[span_218](start_span)!\"[span_218](end_span)."},{"t":"p","lvl":0,"h":"* النتيجة: حظره التاجر، وحذر التجار منه، وتدمرت سمعته المهنية وصار عاطلاً مفلساً[span_219](start_span)[span_219](end_span)!"},{"t":"p","lvl":0,"h":"- الشاب (ب): رجل متقن أمين؛ سلم المتجر قبل الموعد بيومين، بتصميم فائق السرعة، وزاد عليه دليلاً إرشادياً مصوراً مجانياً يشرح للتاجر كيفية مضاعفة مبيعاته[span_220](start_span)[span_220](end_span)!"},{"t":"p","lvl":0,"h":"* النتيجة: انبهر التاجر، ودفع له مكافأة إضافية، ورشحه لـ 10 من كبار التجار؛ فأصبح اسمه علامة فارقة وتدفقت عليه المشاريع[span_221](start_span)[span_221](end_span)!"},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. لماذا يتوهم البعض أن \"الذكاء في تقليل المجهود والهروب من الأمانة\"؟"},{"t":"p","lvl":0,"h":"2. كيف تجعل الإتقان والقيمة المضافة الصادقة اسمك رقماً صعباً ومطلوباً في أي مهنة؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿قَالَتْ إِحْدَاهُمَا يَا أَبَتِ اسْتَأْجِرْهُ ۖ إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾<\/span> <span class=\"ayref\">القصص: 26<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الدستور القرآني للجاهزية وسوق العمل؛ اجتماع الكفاءة المهارية والجسدية والعقلية (\"القوي\") مع النزاهة والضمير الحي والصدق (\"الأمين\")."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا﴾<\/span> <span class=\"ayref\">الكهف: 30<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> الإحسان والجودة والإتقان محفوظة الأجر بعهد الله في الدنيا نماءً وذكراً، وفي الآخرة ثواباً."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَأَوْفُوا بِالْعَهْدِ ۖ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا﴾<\/span> <span class=\"ayref\">الإسراء: 34<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث عائشة رضي الله عنها:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«إِنَّ اللَّهَ يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلًا أَنْ يُتْقِنَهُ»<\/span> [شعب الإيمان للبيهقي برقم 4929، وأبو يعلى برقم 4386، وصححه الألباني في السلسلة الصحيحة برقم 1113]."},{"t":"li","lvl":1,"h":"<i>التأصيل الإيماني:<\/i> الإتقان عبادة وقربة ينال بها العبد محبة الله ورضوانه قبل أن ينال أجر مديره."},{"t":"li","lvl":0,"h":"<b>حديث رافع بن خديج رضي الله عنه:<\/b> سُئل رسول الله ﷺ: أَيُّ الكَسْبِ أَطْيَبُ؟ قَالَ: <span class=\"hadith\">«عَمَلُ الرَّجُلِ بِيَدِهِ، وَكُلُّ بَيْعٍ مَبْرُورٍ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>مسند أحمد برقم 17265، والمستدرك للحاكم 2/10 وصححه ووافقه الذهبي<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل المهني:<\/i> شرف الإنتاج وكسب اليد الخالي من الخيانة والغش والتسويف."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>تجارة النبي ﷺ في مال خديجة رضي الله عنها:<\/b> خرج بمالها للشام مصحوباً بميسرة، فكان نموذجاً فريداً في الأمانة والإتقان، والوفاء بالمواعيد، والوضوح التام في المكاسب دون إخفاء أي عيب. فرجعت التجارة بأرباح لم تُعهد، وكانت هذه \"السمعة الأخلاقية المتقنة\" سبباً في رغبة خديجة في الزواج منه ولقبته قريش بـ \"الصادق الأمين\"."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: ثقافة \"الحد الأدنى\" مقابل \"صناعة القيمة المضافة\"<\/b>"},{"t":"p","lvl":0,"h":"الأداء الشكلي (الحد الأدنى والمطْل)              الأمانة والإتقان (صناعة القيمة)"},{"t":"p","lvl":0,"h":"+----------------------------------------+----------------------------------------+"},{"t":"p","lvl":0,"h":"| - \"على قدر نقودهم أعمل\" والتفلت السريع.| - العمل كعبادة يُتقرب بها إلى الله.    |"},{"t":"p","lvl":0,"h":"| - التسويف والمطل والتأخر عن التسليم.  | - الالتزام الصارم بالمواعيد والدقة.    |"},{"t":"p","lvl":0,"h":"| - إخفاء العيوب وتمرير الأخطاء خلسة.   | - الشفافية والصراحة وتقديم قيمة مجانية.|"},{"t":"p","lvl":0,"h":"| - رؤية العمل عبئاً ثقيلاً يراد التخلص منه.| - رؤية العمل رسالة تبني السمعة والأثر. |"},{"t":"p","lvl":0,"h":"+----------------------------------------+----------------------------------------+"},{"t":"p","lvl":0,"h":"<b>المحور الثاني: بناء \"السمعة المهنية (Professional Brand)\" في سن مبكرة<\/b>"},{"t":"li","lvl":0,"h":"السمعة المهنية تبدأ من مقاعد الدراسة؛ الفتى الذي يغش في واجبه، أو يخلف موعده مع أستاذه ووالده، يدرب دماغه على الخيانة وسينقل نفس العفن إلى وظيفته ومستقبله."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"إذا كان صاحب العمل يستغلني ويعطيني أجراً بخساً، أليس من حقي التكاسل؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الأمانة لا تتجزأ؛ إذا قبلت العقد وجب عليك أداء العمل بإتقان: <span class=\"qt\">«أَدِّ الأَمَانَةَ إِلَى مَنِ ائْتَمَنَكَ وَلاَ تَخُنْ مَنْ خَانَكَ»<\/span> <span class=\"takh\">[سنن أبي داود برقم 3535]<\/span>. إذا كان الأجر ظالماً فطالب بحقك بأدب أو اترك العمل بشرف، أما الغش وتقليل الجودة فهو خيانة لدينك وإفساد لسمعتك."}]},{"t":"qa","n":"2","q":"\"هل يضر أخذ أفكار من مشاريع أخرى على الإنترنت وتقديمها باسمي؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> هذا يسمى \"سرقة علمية وخيانة للأمانة\"؛ الاستفادة من تجارب الآخرين مطلوبة للبناء عليها مع عزو الفضل لأصحابه، أما سرقتها وادعاؤها كذباً فهو تدليس يمحق بركة العلم."}]},{"t":"qa","n":"3","q":"\"كيف أطبق صناعة القيمة المضافة في دراستي اليومية؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> عندما يطلب منك المعلم ملخصاً، قدمه بخط رائع، مع فهارس ورسومات توضيحية، ومصادر إضافية تفيد زملاءك؛ هذا الإتقان الزائد ينمي بداخلك عقلية القيادة والتميز."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>رئيس مجلس الجودة (الميسر الشاب):<\/b> إدارة المحاكاة وتقييم المعايير المهنية."},{"t":"li","lvl":0,"h":"<b>مدوّن ميثاق الإتقان (المدوّن):<\/b> تدوين بنود السمعة المهنية ومعادلة القوي الأمين على السبورة."},{"t":"li","lvl":0,"h":"<b>مدقق الأمانة والجودة (المقيم):<\/b> فحص الأعمال وتحديد الأخطاء ونقاط الضعف."},{"t":"li","lvl":0,"h":"<b>حارس موعد التسليم (الميقاتي):<\/b> ضبط المواعيد النهائية (Deadlines) بصرامة ومحاكاة بيئة العمل."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر محاكاة الشركة وميثاق القوي الأمين (Quality Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> أوراق مهام تنفيذية، نماذج تقييم، وساعة إيقاف."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<i>التشكيل (3 طلاب بكل شركة مصغرة):<\/i> تكليف كل شركة بإنتاج خدمة محددة (تصميم ورقة ملخص لمادة علمية معقدة لزملائهم) في 15 دقيقة."},{"t":"li","lvl":1,"h":"<i>المعايير الملزمة:<\/i>"},{"t":"li","lvl":2,"h":"(القوة): دقة المحتوى العلمي وسلامة اللغة."},{"t":"li","lvl":2,"h":"(الأمانة): عدم النسخ العشوائي، وكتابة المراجع."},{"t":"li","lvl":2,"h":"(القيمة المضافة): إضافة خريطة ذهنية أو سؤال اختباري إضافي لم يُطلب منهم!"},{"t":"li","lvl":1,"h":"<i>التحكيم:<\/i> فحص المنتجات وتسليم درع \"القوي الأمين\" للشركة المتقنة."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: صهيب وخيار الغش في مشروع الحاسوب<\/span>"},{"t":"p","lvl":0,"h":"صهيب (17 سنة) طالب في الثانوي، انشغل بالألعاب والتسويف طوال الشهر، وقبل تسليم مشروع البرمجة النهائي بـ 24 ساعة وجد نفسه عاجزاً[span_247](start_span)[span_247](end_span)!"},{"t":"p","lvl":0,"h":"- صديقه قال له: \"عندي مشروع كامل سرقته من موقع أجنبي، غير الاسم وسلمه وسيعطيك المعلم الدرجة النهائية دون تعب[span_248](start_span)!\"[span_248](end_span)."},{"t":"p","lvl":0,"h":"- تردد صهيب؛ هو يريد المعدل المرتفع، لكن ضميره يؤنبه بأن هذا كذب وتزوير وخيانة للأمانة[span_249](start_span)[span_249](end_span)."},{"t":"p","lvl":0,"h":"الخيارات:"},{"t":"p","lvl":0,"h":"1. تسليم المشروع المسروق والحصول على درجة مزورة سريعة[span_250](start_span)[span_250](end_span)."},{"t":"p","lvl":0,"h":"2. مصارحة المعلم بشجاعة، وطلب مهلة 48 ساعة، وتحمل حسم بسيط مع تقديم عمل حقيقي من جهده وإتقانه[span_251](start_span)[span_251](end_span)!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف يرسم قرار صهيب في هذه اللحظة مسار هويته وأمانته المهنية لبقية عمره؟"},{"t":"p","lvl":0,"h":"2. أيهما أعظم في ميزان الرجولة: درجة كاملة بالغش، أم أداء صادق بشرف وأمانة؟"}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال العامل المتقاعس وخداع الحد الأدنى."],["05 - 15 د","الخطاف الحواري","قصة صاحب المتجر والمبرمج الماطل والمتقن."],["15 - 25 د","التأصيل الشرعي والمفاهيمي","أدلة القوي الأمين، حديث إن الله يحب إذا عمل أحدكم عملاً أن يتقنه، وتجارة النبي ﷺ."],["25 - 55 د","المختبر التطبيقي","محاكاة الشركة وتحدي إنتاج القيمة المضافة."],["55 - 63 د","دراسة حالة واقعية","تفكيك معضلة صهيب واختبار الأمانة في مشروع الحاسوب."],["63 - 68 د","بنك الأسئلة الجدلية","نقاش أجور العمل، السرقة العلمية، وبناء السمعة المبكرة."],["68 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع بطاقة الطالب."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 75-92","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الأمانة وإتقان العمل ونقاء الكسب قوام الحياة الإنسانية؛ ولا دين لمن لا أمانة له، والمسلم يرى في عمله عبادة لا مجرد كسب مالي»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 30-48","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«استثمار الأوقات والدقة المتناهية في أداء الواجبات هما شيمة العلماء؛ فالأمة التي تضيع مواعيدها أمة مهددة في حضارتها»<\/span>."},{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 110-125","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«أولوية الكيف والإتقان على الكم المجرد أصل إسلامي؛ فعمل قليل متقن خير من أعمال ضخمة هشة رديئة الصنع»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 50-62","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«بناء السمعة الصلبة يتطلب رفض السطحية وثقافة الحد الأدنى؛ والشاب الذي يُعرف بأمانته وإتقانه تفتح له أبواب القيادة والتمكين»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 120-132","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«إعداد المراهق للجاهزية العملية يبدأ بتعويده على احترام العقود والمواعيد وتحمل المسؤولية عن جودة مخرجاته»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>أخلاقيات العمل في الإسلام<\/i> — د. علي بن حسن عبد القادر <span class=\"pg\">ص 30-75<\/span>."},{"t":"li","lvl":1,"h":"<i>بناء السمعة والتميز المهني الشاب<\/i> — د. محمد أكرم العدلوني <span class=\"pg\">ص 45-80<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تبني سمعتك المهنية وترسخ خلق الإتقان؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"فخ ثقافة الحد الأدنى (Bare Minimum) وكيف تصنع القيمة المضافة؟\" — قناة دروس أونلاين على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"تطبيق قانون الإتقان والقيمة المضافة\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. إنجاز مهمة بإتقان استثنائي (Excellence):","[ ] أداء واجب مدرسي أو خدمة أسرية بمستوى جودة فائق يتجاوز التوقعات والحد الأدنى بوضوح.","2. الانضباط الحاسم في المواعيد (Zero Late):","[ ] الحضور قبل الموعد بـ 3 دقائق في كل صلاة، وموعد مدرسي، ولقاء أسبوعي دون أي تأخر.","3. لمسة القيمة المضافة (Value Add):","[ ] تقديم مساعدة أو خدمة إضافية طوعية لوالديك أو أستاذك دون أن يُطلب منك ذلك."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["ثقافة الإتقان والجودة","يكتفي بالحد الأدنى المسقط للواجب، ويسلم أعمالاً مليئة بالأخطاء.","يؤدي العمل بالمستوى المطلوب، لكنه لا يبادر بأي تجويد أو لمسة إضافية.","يتعبد الله بالإتقان، ويقدم أعمالاً فائقة الجودة تصنع قيمة مضافة حقيقية."],["الانضباط بالمواعيد","يتأخر باستمرار عن مواعيده وتسليم واجباته ويختلق الأعذار.","يلتزم بالمواعيد غالباً، وقد يتأخر في بعض الأحيان مع تبريرات مكررة.","يحترم المواعيد بصرامة بالغة، ويعتبر الوفاء بالوقت جزءاً من مروءته ودينه."],["النزاهة والأمانة","يبرر الغش والسرقة العلمية لتحصيل الدرجات وراحة النفس.","يتحرج من الغش الصريح، لكنه يتساهل في نقل أفكار غيره دون عزو.","يتحرى النزاهة التامة، ويرفض الغش والتزوير مهما كان الثمن والمغريات."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: أخلاقيات المهن وصناعة القيمة","sub":"","lines":["💡 البوصلة والمفهوم:","العمل عبادة، والسمعة رأس مالك! لست موظفاً يبحث عن الحد الأدنى والهروب من الجهد، بل أنت رجل مسلم يتقرب إلى ربه بالإتقان والإحسان. كن \"القوي الأمين\"؛ تصنع القيمة، وتفي بالعهود، وتترك أثراً مباركاً أينما حللت.","📖 الآية المحورية:","<span class=\"ayah\">﴿إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾<\/span> <span class=\"ayref\">القصص: 26<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«إِنَّ اللَّهَ يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلًا أَنْ يُتْقِنَهُ»<\/span> [شعب الإيمان للبيهقي].","📐 ركائز السمعة المهنية الثلاث:","1. القوة والكفاءة: طوّر أدواتك، وتعلم مهارات العصر، وكن متقناً لتخصصك.","2. الأمانة والنزاهة: لا تكذب، لا تماطل، وارفض الغش والتزوير في السر والعلن.","3. القيمة المضافة: لا تكتفِ بالمطلوب؛ بل أضف لمسة إحسان تسعد بها من يتعامل معك.","—hr—","🎯 ميثاق إتقاني لهذا الأسبوع:","- العمل الذي سأتقنه وأقدم فيه قيمة مضافة: _____________________________","- موعد قطعي ألتزم به بالدقيقة والثانية: ________________________________","—hr—","📝 سجل الإتقان والمهنية (ضع ✓ عند التطبيق):","[ تسليم عمل بجودة استثنائية ]  [ التزام تام بالمواعيد ]  [ الامتناع التام عن الغش ]","(   )                     (   )                     (   )","عهد الفتى المسلم: \"أنا القوي الأمين، عملي عبادة، إتقاني شرف، ولن يرى ربي مني إلا إحساناً\"."]}]}]},{"id":"5-5","ordinal":"التاسع والعشرون","title":"التوجيه المهني والمستقبلي","sub":"استكشاف الشغف والقدرات، واختيار التخصص الجامعي بوعي","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الخامسة: المهارات المستقبلية والجاهزية العملية"],["عنوان اللقاء","التوجيه المهني والمستقبلي (استكشاف الشغف والقدرات، واختيار التخصص الجامعي بوعي)"],["الرمز الكودي","U5-L29-CAREER_GUIDANCE"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل تفاعلية حية، حاضنة البوصلة المهنية، ومختبر تحليل القدرات والميول وبناء الخطة الجامعية"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> اختيار التخصص الجامعي والمسار المهني ليس مجرد \"قرار أكاديمي تمليه الصدفة أو المجموع أو التباهي الاجتماعي\"، بل هو <b>تحديد للثغر والرسالة التي سيعبد الشاب ربه من خلالها ويعمر بها الأرض ويخدم أمته<\/b>. التوجيه المهني الراشد يعتمد على <b>البوصلة الرباعية لبناء القرار<\/b> والتي توازن بوعي بين: (1) <b>القدرات والإمكانات الذاتية<\/b>، (2) <b>الشغف والميول المستدامة<\/b>، (3) <b>حاجة سوق العمل والأمة<\/b>، و(4) <b>الأثر والنية الرسالية<\/b>؛ لحماية الفتى من فخ التكرار والتبعية وتضييع سنوات العمر."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفكك الفتى عناصر البوصلة المهنية الرباعية، ويتعرف على التخصصات المستقبلية واحتياجات الأمة وثغورها."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى قدسية الثغر المهني، متحرراً من الخضوع للوجاهة الاجتماعية الزائفة وضغوط السمعة."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يصمم الفتى \"وثيقة بوصلته المهنية والجامعية\"، ويحدد 3 خطوات استكشافية حاسمة (مقابلة خبير، دراسة الخطة الدراسية، واختبار ميول)."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي بطرح هذا السؤال التشخيصي:"},{"t":"p","lvl":0,"h":"<b>\"لو دخلت تخصصاً طبياً أو هندسياً مرموقاً يتباهى به والداك أمام العائلة، لكنك تكرهه ولا تملك قدراته وتشعر بالاختناق كل صباح.. أو دخلت تخصصاً تقنياً أو إنسانياً تحبه وتبدع فيه وتملك شغفه وتستطيع أن تكون فيه الرقم الصعب وتخدم به أمتك.. أيهما تختار؟ ولماذا ندفع سنوات من أعمارنا ثمناً لإرضاء كلام الناس؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو الطبيب التعيس والمبرمج الشغوف)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة وسيم ومالك: الطبيب التعيس vs المتخصص الشغوف<\/span>"},{"t":"p","lvl":0,"h":"- وسيم (25 سنة): نال في الثانوية معدل 98%! وخضوعاً لرغبة أسرته في نيل لقب \"والد الطبيب\"، دخل كلية الطب رغماً عن ميوله؛ فهو يكره جو المشافي ويعشق التقنية والبرمجيات[span_283](start_span)[span_283](end_span)!"},{"t":"p","lvl":0,"h":"* اليوم: وسيم طبيب متعثر تعيس، يمارس مهنته بضيق وتثاقل، ويشعر أنه دفن 7 سنوات من عمره في جحيم لا يحبه[span_284](start_span)[span_284](end_span)!"},{"t":"p","lvl":0,"h":"- مالك (25 سنة): حصل على معدل 85%، واختار بوعي وشغف تخصص \"الأمن السيبراني والذكاء الاصطناعي\"، رغم اعتراض أقاربه وتثبيطهم له بطلب التخصصات التقليدية[span_285](start_span)[span_285](end_span)!"},{"t":"p","lvl":0,"h":"* اليوم: مالك يقود شركة أمن رقمي تحمي بيانات مؤسسات المسلمين، يحقق دخلاً مباركاً، ويعيش في قمة الإنجاز والشغف وله أثر مرموق[span_286](start_span)[span_286](end_span)!"},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. لماذا نضحي بمواهبنا وقدراتنا الحقيقية من أجل الوجاهة الاجتماعية المؤقتة؟"},{"t":"p","lvl":0,"h":"2. كيف تكتشف \"ثغرك الحقيقي\" الذي هيأك الله له، بدلاً من أن تكون نسخة مكررة باهتة من غيرك؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا﴾<\/span> <span class=\"ayref\">الإسراء: 84<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> تقرير التنوع الفطري في الطاقات والاستعدادات؛ فالنجاح الحقيقي هو أن ينطلق الشاب من \"شاكلته\" وتركيبته التي فطره الله عليها."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾<\/span> <span class=\"ayref\">البقرة: 286<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> مراعاة الطاقة والوسع؛ فلا يسوغ للشاب أن يحمل نفسه مساراً ينافي قدراته واستعداداته فيبوء بالإحباط والانقطاع."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث علي بن أبي طالب وجابر بن عبد الله رضي الله عنهما:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«اعْمَلُوا فَكُلٌّ مُيَسَّرٌ لِمَا خُلِقَ لَهُ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الجنائز برقم 4949؛ وصحيح مسلم برقم 2647<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الوجودي والمهني:<\/i> التوجيه النبوي الخالد في التخصص؛ الله سبحانه ركب في كل إنسان ميولاً واستعدادات لثغر محدد، والتوفيق في البحث عما يسره الله لك وتوظيفه في نفع الأمة."},{"t":"li","lvl":0,"h":"<b>حديث أبي هريرة رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجَزْ»<\/span> <span class=\"takh\">[صحيح مسلم: كتاب القدر برقم 2664]<\/span>."},{"t":"li","lvl":1,"h":"<i>التأصيل العملي:<\/i> المبادرة والحرص على ما يثمر نفعاً حقيقياً في الدين والدنيا مع نبذ العجز والكسل."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>توجيه النبي ﷺ التخصصي للصحابة رضي الله عنهم:<\/b> لم يضع النبي ﷺ أصحابه في قالب مكرر، بل اكتشف موهبة كل صحابي ووجهه لثغره:"},{"t":"li","lvl":1,"h":"<i>زيد بن ثابت:<\/i> استثمر سرعة حفظه وذكاءه، فأمره بتعلم السريانية ولغات الأقوام والفرائض، فصار كاتب الوحي وترجمان الرسالة."},{"t":"li","lvl":1,"h":"<i>خالد بن الوليد:<\/i> رأى عبقريته الحربية فقاده للجيوش وسماه \"سيف الله المسلول\"."},{"t":"li","lvl":1,"h":"<i>حسان بن ثابت:<\/i> وجد فيه الموهبة الشعرية فجعل له منبراً في المسجد ينافح عن الإسلام!"}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: البوصلة المهنية الرباعية (The Career Compass)<\/b>"},{"t":"li","lvl":0,"h":"تلتقي في 4 دوائر:"},{"t":"li","lvl":1,"h":"<b>القدرات (ماذا أتقن؟):<\/b> المهارات التي تبرع فيها وسهل عليك تعلمها."},{"t":"li","lvl":1,"h":"<b>الشغف (ماذا أحب؟):<\/b> المجالات التي تستمتع بالعمل فيها لساعات دون ملل."},{"t":"li","lvl":1,"h":"<b>حاجة السوق والأمة (ماذا يحتاج الواقع؟):<\/b> الوظائف والثغور المستقبلية المطلوبة."},{"t":"li","lvl":1,"h":"<b>الأثر والرسالة (أين الأجر؟):<\/b> النية الرسالية لنفع المسلمين وعمارة الأرض."},{"t":"p","lvl":0,"h":"<span class=\"lbl\">البوصلة المهنية الراشدة<\/span>"},{"t":"p","lvl":0,"h":"القدرات الذاتية ✖️ الشغف الحقيقي ✖️ احتياج سوق العمل والأمة ✖️ النية والرسالة = الثغر المهني الذهبي"},{"t":"p","lvl":0,"h":"<b>المحور الثاني: فخ \"أوهام كليات القمة\"<\/b>"},{"t":"li","lvl":0,"h":"لا توجد كلية قمة وكلية قاع في الحقيقة؛ القمة هي أن تكون <b>استثنائياً ومتقناً في تخصصك<\/b> أياً كان، والمتميز في الإعلام أو التقنية أو التعليم يخدم أمته بأعظم مما يقدمه الطبيب الفاشل أو المهندس المتعثر."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أنا لا أعرف شغفي وميولي حتى الآن، فكيف أختار؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الشغف لا ينزل من السماء وأنت نائم؛ الشغف يُكتشف بـ <b>\"التجربة والاحتكاك الميداني\"<\/b>. اقرأ، وجرب دورات في البرمجة، واللغات، والإسعافات، والتصميم، ومن خلال التجربة ستكتشف ما تميل إليه نفسك وما تنفر منه."}]},{"t":"qa","n":"2","q":"\"أبي يصر على تخصص معين ويرفض تخصصي الذي أحبه، فهل مخالفته عقوق؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> ليست عقوقاً ما دمت تسعى لما ينفعك وتبره، ولكن <b>الذكاء في كسب قلبه بالحوار والبيانات<\/b>. أعد عرضاً يوضح مجالات عمل تخصصك ومستقبله، واستعن بشخص يحترمه والدك ليشرح له الأمر بأدب ووقار دون صدام."}]},{"t":"qa","n":"3","q":"\"يقولون إن الذكاء الاصطناعي سيلغي كل الوظائف، فهل للدراسة قيمة؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الذكاء الاصطناعي لن يلغي الإنسان، بل سيلغي \"الإنسان النمطي التقليدي المقلد\"؛ المتميز القادر على التفكير الإبداعي، وإدارة التقنيات، وحل المشكلات سيزداد الطلب عليه أضعافاً."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>مستشار التوجيه المهني (الميسر الشاب):<\/b> إدارة النقاش وتوزيع استمارات البوصلة."},{"t":"li","lvl":0,"h":"<b>مدوّن مصفوفة القدرات (المدوّن):<\/b> رسم دوائر البوصلة وتدوين التخصصات الحديثة على السبورة."},{"t":"li","lvl":0,"h":"<b>محلل احتياجات الأمة وسوق العمل (المقيم):<\/b> فحص التخصصات واختبار مدى واقعيتها ومستقبلها."},{"t":"li","lvl":0,"h":"<b>حارس وقت التخطيط (الميقاتي):<\/b> ضبط أوقات التحليل والتمارين."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر رسم البوصلة المهنية والجامعية (Career Compass Lab)\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> استمارة ورقية تحوي دوائر البوصلة الأربع ودليل التخصصات المستقبلية."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b>"},{"t":"li","lvl":1,"h":"<i>الدائرة 1 (القدرات):<\/i> يسجل الفتى 3 مواد أو مهارات يتقنها ويستوعبها بسهولة (رياضيات، لغات، تحليل، إلقاء)."},{"t":"li","lvl":1,"h":"<i>الدائرة 2 (الشغف):<\/i> يسجل 3 موضوعات يستمتع بمتابعتها والبحث فيها دون إجبار."},{"t":"li","lvl":1,"h":"<i>الدائرة 3 (حاجة الأمة):<\/i> يستعرض تخصصات المستقبل (الأمن السيبراني، الذكاء الاصطناعي، الطاقة البديلة، الاقتصاد الإسلامي، والإعلام الرقمي)."},{"t":"li","lvl":1,"h":"<i>نقطة الالتقاء (الثغر المهني):<\/i> تحديد التخصص الجامعي المقترح وربطه بنية نصرة الأمة."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: طارق بين ضغط العائلة والبوصلة الشغوفة<\/span>"},{"t":"p","lvl":0,"h":"طارق (17 سنة) متفوق في الثانوية، يعشق الفيزياء التطبيقية وتكنولوجيا الطاقة المتجددة منذ سنوات وله ابتكارات ومشاريع مصغرة[span_318](start_span)[span_318](end_span)."},{"t":"p","lvl":0,"h":"- والده وأعمامه قالوا له في مجلس الأسرة بحزم: \"إما أن تدخل الهندسة المدنية لتعمل في مقاولات العائلة، أو إدارة الأعمال! أما الفيزياء فمضيعة للوقت ولا تطعم خبزاً[span_319](start_span)!\"[span_319](end_span)."},{"t":"p","lvl":0,"h":"- طارق يعلم أن الهندسة المدنية ليست شغفه وسيتعثر فيها، ويخشى في نفس الوقت اتهامه بالعقوق والتمرد إن خالفهم[span_320](start_span)[span_320](end_span)!"},{"t":"p","lvl":0,"h":"أسئلة النقاش:"},{"t":"p","lvl":0,"h":"1. كيف تشخص أزمة طارق بين الشغف الحقيقي والضغط الأسري؟"},{"t":"p","lvl":0,"h":"2. صمم سيناريو حواري بار ومقنع يقدمه طارق لوالده لعرض رؤيته بثبات وأدب وأمان[span_321](start_span)[span_321](end_span)."}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","سؤال التخصص المرموق والتعاسة مقابل الشغف."],["05 - 15 د","الخطاف الحواري","قصة وسيم ومالك وتفكيك وهم الوجاهة."],["15 - 25 د","التأصيل الشرعي والمفاهيمي","أدلة الشاكلة، حديث كل ميسر لما خلق له، وتوزيع النبي للصحابة."],["25 - 55 د","المختبر التطبيقي","تمرين رسم البوصلة المهنية وتحديد نقطة الثغر الجامعي."],["55 - 63 د","دراسة حالة واقعية","تفكيك حالة طارق مع ضغط الأسرة وإدارة الحوار البار."],["63 - 68 د","بنك الأسئلة الجدلية","أوهام كليات القمة، وتأثير الذكاء الاصطناعي، واستكشاف الشغف."],["68 - 70 د","الختام والتقييم","مراجعة الخلاصات وتوزيع بطاقة الطالب."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 52-68","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«اكتشاف الشغف والقدرات وتوجيهها نحو ثغور الأمة المنسية يحرر الشاب من التبعية للسراب الاجتماعي والتخصصات المستهلكة»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 115-128","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«التوجيه الأكاديمي والمهني للفتى يتطلب احترام استقلاليته وفهم قدراته الذاتية؛ فالقسر يولد الفشل والنفور»<\/span>."},{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 125-140","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«فقه الثغور يقتضي توزيع الطاقات على سائر حاجات الأمة العلمية والتقنية والصناعية؛ فلا يجوز تكديس الكفاءات في مسار وإهمال بقية الثغور»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 425-440","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«التربية المهنية الراشدة تكتشف ميول الفتى وتوجهه لما هيأه الله له عملاً بقوله ﷺ: اعْمَلُوا فَكُلٌّ مُيَسَّرٌ لِمَا خُلِقَ لَهُ»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 215-228","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«اختيار الحقل والميدان الذي يلائم قدراتك الفطرية يجعل التدريب ممتعاً ويقلل المقاومة النفسية، وهو أقصر طريق للتفوق الاستثنائي»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>دليلك الذكي لاختيار التخصص الجامعي<\/i> — د. ياسر بكار <span class=\"pg\">ص 30-80<\/span>."},{"t":"li","lvl":1,"h":"<i>مهن المستقبل ووظائف الغد<\/i> — معهد ماكينزي للأبحاث <span class=\"pg\">ص 25-60<\/span>."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"كيف تختار تخصصك الجامعي وتحدد ثغرك في الحياة؟\" — الشيخ أحمد السيد على يوتيوب."},{"t":"li","lvl":1,"h":"<b>مقطع توعوي:<\/b> \"قواعد نموذج إيكيجاي (Ikigai) والبوصلة المهنية في الإسلام\" — قناة دوباميكافين على يوتيوب."}]},{"num":14,"title":"التحدي الأسبوعي الميداني","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"الاستكشاف الميداني للتخصص الجامعي\"","sub":"","lines":["المهمة الميدانية المطلوبة طوال الأسبوع:","1. مقابلة خبير ممارس:","[ ] إجراء مقابلة شخصية (مباشرة أو عبر الهاتف) مع متخصص يعمل في التخصص الذي تستهدفه وسؤاله عن واقع التخصص ومستقبله.","2. فحص الخطة الدراسية الجامعية:","[ ] قراءة الخطة الدراسية والمقررات للتخصص المقترح في جامعة معتمدة وتحليل مدى ملاءمتها لقدراتك.","3. جلسة الحوار البارّ مع الوالدين:","[ ] عرض وثيقة بوصلتك المهنية على والديك بأدب ومناقشة طموحك المستقبلي معهما بسكينة وتفاهم."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["الوعي بالبوصلة المهنية","يختار تخصصه بالصدفة أو خضوعاً تاماً للوجاهة الاجتماعية.","يدرك ميوله وشغفه لكنه يجهل احتياجات سوق العمل وثغور الأمة.","يجمع بوعي بين القدرات، الشغف، حاجة الأمة، والنية الرسالية."],["الاستكشاف والمبادرة","ينتظر حتى ظهور نتائج الثانوية دون أي بحث أو استكشاف.","يقرأ نبذة عامة عن التخصصات دون فحص الخطط الدراسية أو مقابلة خبراء.","يبادر بمقابلة الممارسين، وفحص المقررات، وتجربة المهارات ميدانياً."],["إدارة الحوار مع الأسرة","يستسلم لضغط الأسرة بتذمر، أو يواجههم بتمرد وفظاظة.","يناقش أهله بتردد وضعف حجة ويستسلم سريعاً لاعتراضاتهم.","يحاور والديه ببر وذكاء، ويعرض بيانات واضحة تكسب ثقتهم ورضاهم."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: البوصلة المهنية وثغر المستقبل","sub":"","lines":["💡 البوصلة والمفهوم:","تخصصك ليس مجرد شهادة وظيفة، بل هو \"ثغرك الرسالي\" الذي تعبد الله من خلاله وتعمر به الأرض وتنصر به أمتك! لا تسلم مستقبلك لسراب المظاهر والوجاهة البائدة. ابحث عما يُسرت له، وركز على ما تتقنه وتحبه ويحتاجه واقع أمتك لتكون الرقم الصعب.","📖 الآية المحورية:","<span class=\"ayah\">﴿قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا﴾<\/span> <span class=\"ayref\">الإسراء: 84<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«اعْمَلُوا فَكُلٌّ مُيَسَّرٌ لِمَا خُلِقَ لَهُ»<\/span> <span class=\"takh\">[صحيح البخاري ومسلم]<\/span>.","📐 أركان البوصلة المهنية الرباعية:","1. القدرات (ماذا أتقن؟): العلوم والمهارات التي تنسجم مع ذكائي ويسهل عليّ تعلمها.","2. الشغف (ماذا أحب؟): الموضوعات التي أستمتع بالبحث فيها دون ملل.","3. حاجة الأمة والسوق: التخصصات المستقبلية النافعة المطلوبة في واقعنا.","4. النية والرسالة: أين الأثر، وكيف أسخر هذه المهنة لرفعة الإسلام ونفع الخلق؟","—hr—","🎯 ثغري المهني والجامعي المقترح:","- التخصص المستهدف: _____________________________________________","- الخبير الذي سأقابله هذا الأسبوع: _________________________________","—hr—","📝 سجل الاستكشاف المهني (ضع ✓ عند التطبيق):","[ مقابلة خبير في التخصص ]  [ مراجعة الخطة الدراسية ]  [ حوار بارّ مع الوالدين ]","(   )                       (   )                     (   )","عهد الفتى المسلم: \"أنا صاحب ثغر، سأبني نفسي في التخصص الذي هيأني ربي له لخدمة أمتي\"."]}]}]},{"id":"5-6","ordinal":"الثلاثون","title":"المؤتمر الختامي","sub":"عرض الفتيان لمشاريعهم السنوية، تقييم الأثر الميداني، والتتويج","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الخامسة: المهارات المستقبلية والجاهزية العملية"],["عنوان اللقاء","المؤتمر الختامي (عرض الفتيان لمشاريعهم السنوية، تقييم الأثر الميداني، والتتويج)"],["الرمز الكودي","U5-L30-ANNUAL_CONFERENCE"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","مؤتمر تتويجي ختامي موسع، منصة استعراض مشاريع الأثر الميداني، ومعرض التتويج والعهد الرسالي المستمر"],["المدى الزمني","70 دقيقة كاملة (جلسة احتفالية تتويجية بحضور أولياء الأمور)"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> اللقاء الثلاثون والأخير ليس مجرد حفل توزيع شهادات شكلية ينتهي زمانها بانتهاء ساعته، بل هو <b>المؤتمر التتويجي لاستعراض قطاف الرحلة السنوية، وتحويل المخرجات التربوية والتأصيلية إلى ميثاق حياة ممتد<\/b>. الشاب الذي خاض 30 لقاءً تربوياً في الحصانة الفكرية، وصناعة العادات، وفقه الأولويات، ومعاني الرجولة، والمهارات المستقبلية يخرج كـ <b>\"رجل مصلح، صاحب أثر صلب، متقن لمهاراته، معتز بهويته، ومبادر لنفع دينه وأمته\"<\/b>. يستعرض الفتيان مشاريعهم الميدانية بالأرقام والبيانات أمام أسرهم والمربين؛ تأكيداً على أن العلم ثمرته العمل."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يستوعب الفتى مفهوم \"الاستقامة والاستمرارية الممتدة\" ورتبة الصدق في العهد: <span class=\"ayah\">﴿رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ﴾<\/span>."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى عزة التخرج والنضج والرجولة، وشرف التحول من مستهلك سلبي إلى قائد مصلح."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يقدم الفتى/الفريق عرض الأثر النهائي لمشروعه الميداني (3 دقائق)، ويوقع على \"ميثاق العهد الرسالي المستمر\" بحضور والده ومربيه."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي المؤتمر أمام الفتيان والآباء بهذا التساؤل المؤثر:"},{"t":"p","lvl":0,"h":"<b>\"بعد 30 أسبوعاً ورحلة طويلة من البناء والتحديات.. هل نريد لهذا البرنامج أن يكون مجرد (ذكرى طيبة نقفل عليها الدفاتر ونعود بعدها لسابق عهدنا بالكسل والشاشات)؟ أم أن اليوم هو (حفل إطلاقك الحقيقي) كرجل ناضج يحمل أمانة دينه وبيته ومجتمعه؟ ما الذي سيتذكره الناس عنك بعد 10 سنوات من الآن؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — سيناريو شهادة الحائط وميثاق الأثر الحي)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">قصة الحفلين: شهادة الحائط الميتة vs ميثاق الرجل المصلح<\/span>"},{"t":"p","lvl":0,"h":"تأمل الفرق بين نهايتين لرحلتين تربويتين:"},{"t":"p","lvl":0,"h":"- الحفل (أ): استلم الطلاب شهادات ورقية مزخرفة، التقطوا صوراً سريعة، ثم علقوا الشهادات على الجدران ليعلوها الغبار، وعادوا في اليوم التالي لنفس التسويف، والخمول، والانقياد للمشتتات كأنهم لم يتعلموا شيئاً[span_356](start_span)[span_356](end_span)!"},{"t":"p","lvl":0,"h":"- حفل \"مؤتمر الجيل الصاعد\" (ب): صعد الفتيان رجالاً مصلحين وصناع أثر؛ قدموا مشاريع حقيقية أثرت في الميدان (مبادرات توعوية، منصات تقنية، أعمال بر وخدمة، وهواتف طُهرت بالعفة والانضباط)[span_357](start_span)[span_357](end_span)!"},{"t":"p","lvl":0,"h":"وقف الآباء والدموع تملأ أعينهم فخراً، وقال أب لابنه وهو يعانقه: \"اليوم وُلد لي رجلٌ حقيقي أعتمد عليه في ديني ودنياي[span_358](start_span)!\"[span_358](end_span)."},{"t":"p","lvl":0,"h":"الأسئلة الساخنة للحوار:"},{"t":"p","lvl":0,"h":"1. هل انتهت الرحلة اليوم، أم أن التكليف الحقيقي بدأ في هذه الساعة؟"},{"t":"p","lvl":0,"h":"2. كيف تحافظ على النبتة الإيمانية والمهارية التي غرستها في نفسك طوال 30 أسبوعاً دون أن تذبل؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾<\/span> <span class=\"ayref\">الأحزاب: 23<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> رتبة الرجولة القرآنية الكبرى هي في \"الصدق في العهد والثبات على المبدأ\" والاستمرار على الطريق دون انتكاس ولا تبديل."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾<\/span> <span class=\"ayref\">الشرح: 7-8<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> منهج المؤمن المستمر؛ الفراغ من مرحلة تربوية هو إيذان بالنصب والبذل في مرحلة وميدان جديد."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ﴾<\/span> <span class=\"ayref\">التوبة: 105<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أم المؤمنين عائشة رضي الله عنها:<\/b> أن رسول الله ﷺ سُئل: أَيُّ الأَعْمَالِ أَحَبُّ إِلَى اللَّهِ؟ قَالَ: <span class=\"hadith\">«أَدْوَمُهَا وَإِنْ قَلَّ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الرقاق برقم 6465؛ وصحيح مسلم برقم 783<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> المداومة والاستمرارية هما جوهر النجاح الإيماني والتربوي؛ فالأثر الثابت الدائم هو الأحب إلى الله."},{"t":"li","lvl":0,"h":"<b>حديث سفيان بن عبد الله الثقفي رضي الله عنه:<\/b> قال: قلت: يا رسول الله! قل لي في الإسلام قولاً لا أسأل عنه أحداً بعدك؟ قال: <span class=\"hadith\">«قُلْ: آمَنْتُ بِاللَّهِ، ثُمَّ اسْتَقِمْ!»<\/span> <span class=\"takh\">[صحيح مسلم: كتاب الإيمان برقم 38]<\/span>."},{"t":"li","lvl":1,"h":"<i>التأصيل الجامع:<\/i> خلاصة التربية والرسالة في كلمتين: ثبات العقيدة، والاستقامة الدائمة على الصراط."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>إشهاد النبي ﷺ للأمة في حجة الوداع:<\/b> وقف النبي ﷺ على عرفات بعد أن بنى الجيل، وأتم البلاغ، وغرس الهوية؛ فخطب خطبته الجامعة ثم رفع أصبعه الشريفة إلى السماء ونكتها إلى الناس قائلاً بصوت يهز الوجدان: <span class=\"qt\">«أَلاَ هَلْ بَلَّغْتُ؟ اللَّهُمَّ اشْهَدْ!»<\/span> فقال الصحابة: نشهد أنك قد بلغت وأديت ونصحت <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري برقم 1741؛ وصحيح مسلم برقم 1218<\/cite><\/div><\/details>. إعلان تسليم الراية للجيل الصاعد ليحمل الأمانة وينشر النور في الآفاق."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى
