","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>توثيق الاقتباسات الأساسية:<\/b>"},{"t":"li","lvl":1,"h":"د. محمد عبد الله دراز - <i>النبأ العظيم<\/i> - ص د (المقدمة)."},{"t":"li","lvl":1,"h":"د. محمد عبد الله دراز - <i>النبأ العظيم<\/i> - ص 187."},{"t":"li","lvl":1,"h":"د. محمد عبد الله دراز - <i>النبأ العظيم<\/i> - ص 116."},{"t":"li","lvl":1,"h":"د. محمد عبد الله دراز - <i>النبأ العظيم<\/i> - ص 146."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 40."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 37-38."},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>المراهق: كيف نفهمه وكيف نوجهه؟<\/i> - ص 6."},{"t":"li","lvl":1,"h":"د. يوسف القرضاوي - <i>في فقه الأولويات<\/i> - ص 66."},{"t":"li","lvl":1,"h":"محمد الغزالي - <i>خلق المسلم<\/i> - ص 24-26."},{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية المعتمدة (بالصفحات):<\/b>"},{"t":"li","lvl":1,"h":"د. مصطفى محمود - <i>القرآن محاولة لفهم عصري<\/i> - دار أخبار اليوم - (ص 25 - 50: التأمل العقلي في آيات الخلق والنظام)."},{"t":"li","lvl":1,"h":"ابن رشد - <i>فصل المقال فيما بين الحكمة والشريعة من الاتصال<\/i> - دار المعارف - (ص 30 - 55: البرهنة على عدم تعارض صريح المعقول مع صحيح المنقول)."}]},{"num":15,"title":"التكليف العملي السلوكي (تطبيق واقعي طوال الأسبوع)","short":"التكليف العملي السلوكي","kind":"std","icon":"flag","blocks":[{"t":"li","lvl":0,"h":"<b>ورد التدبر والاستهداء:<\/b> تخصيص 10 دقائق يومياً لقراءة صفحتين من المصحف مستعيناً بتفسير السعدي أو المختصر في التفسير."},{"t":"li","lvl":0,"h":"<b>استخراج برهان:<\/b> تدوين آية واحدة أسبوعياً تتضمن حجة عقلية أو لفتة فطرية ومشاركتها مع أقرانه."}]},{"num":16,"title":"مؤشر قياس الأثر الميداني (معايير تحقق الوعي لدى الطالب)","short":"مؤشر قياس الأثر الميداني","kind":"std","icon":"chart","blocks":[{"t":"li","lvl":0,"h":"<b>الاستدلال بالقرآن:<\/b> المبادرة للاستشهاد بآيات الوحي في النقاشات الفكرية بحكمة وفهم."},{"t":"li","lvl":0,"h":"<b>اليقين والسكينة:<\/b> ثبات الفتى أمام التشكيك ورد الشبهات لمحكمات الكتاب."},{"t":"li","lvl":0,"h":"<b>أثر التدبر السلوكي:<\/b> ظهور أثر الآيات في سلوكه اليومي (صدق، حياء، انضباط)."}]}]},{"id":"1-4","ordinal":"الرابع","title":"حصون اليقين","sub":"صناعة الفلتر؛ المنهجية العملية للتعامل مع الشبهات وتفكيكها","sections":[{"num":1,"title":"عنوان اللقاء","short":"عنوان اللقاء","kind":"meta","icon":"id","blocks":[{"t":"p","lvl":0,"h":"<b>حصون اليقين (صناعة الفلتر): المنهجية العملية للتعامل مع الشبهات وتفكيكها<\/b>"}],"hide":true},{"num":2,"title":"نبض الغرفة (تشخيص الحالة النفسية والذهنية للفتيان 15-18 سنة + بروتوكول الاحتواء النبوي)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"li","lvl":0,"h":"<b>التشخيص النفسي والذهني لفتيان مرحلة الثانوية (15-18 سنة):<\/b> يتعرض الفتيان لضغط شبهات متدفق في السوشيال ميديا، مع حداثة سنهم ونقص خبرتهم، مما يوقع بعضهم في الصدمة المعرفية والارتباك عند سماع شبهة مزخرفة لأول مرة. يشخّص د. عبد الكريم بكار أثر رفقاء السوء والمحتوى المضلل: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: المراهق<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>يؤثر الرفاق السيئون في إدراك المراهق للأشياء، وهذا التأثير يكون متدرجاً ومتعاضداً... وهكذا مع الأيام تتغير نظرة المراهق للحياة والأحياء، وتتسع الفجوة بينه وبين أهله، ويدخل في مرحلة المعاندة والمشاكسة<\/blockquote><cite>المراهق - ص 92<\/cite><\/div><\/details> ويحذر الأستاذ أحمد بن يوسف السيد من الخوض في الشبهات بلا تأصيل: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>فكم من متحمس في نقاش أصحاب الشبهات وهو غير مبني بناء صحيحاً كانت عاقبته خسارة وضياعاً<\/blockquote><cite>إلى الجيل الصاعد - ص 37<\/cite><\/div><\/details> ويؤكد: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن من يفتقد المستوى الناقدي الجيد فإنه سيتيه بين الأخبار المختلفة، والدعايات المتعارضة، والآراء المتضاربة<\/blockquote><cite>إلى الجيل الصاعد - ص 39-40<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>بروتوكول الاحتواء النبوي المعتمد داخل الجلسة:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدوء التام والإنصات:<\/b> عدم الفزع أو رمي الطالب بالفسوق عند طرحه لشبهة استوقفته، بل استقبال تساؤله برفق وحكمة."},{"t":"li","lvl":1,"h":"<b>التفريق بين الشبهة الفكرية والشهوة النفسية:<\/b> إدراك أن بعض الشبهات ستار لرغبة في التحرر السلوكي، فيُعالج القلب أولاً."},{"t":"li","lvl":1,"h":"<b>ترسيخ مبدأ \"المحكمات حصن اليقين\":<\/b> الثوابت القطعية لا تتزعزع باحتمالات فرعية عارضة."}]},{"num":3,"title":"خيط الربط (الوصل بأهداف الوحدة والمنهج، والتمهيد للقاء التالي)","short":"خيط الربط","kind":"std","icon":"link","blocks":[{"t":"li","lvl":0,"h":"<b>الوصل بأهداف الوحدة الأولى:<\/b> بعد وعي الغاية، وامتلاك التفكير الناقد، والبرهان القرآني، يأتي هذا اللقاء ليصوغ <b>\"الفلتر العملي\"<\/b> الذي يحمي عقل الفتى وقلبه من التسمم الفكري عند مواجهة الشبهات."},{"t":"li","lvl":0,"h":"<b>التمهيد للقاء الخامس:<\/b> حماية اليقين تحتاج لمواجهة الأرضية التي تتولد منها الشبهات والشهوات وهي \"الفراغ والسيولة الرقمية\"؛ وهو موضوع اللقاء القادم: <b>[الثبات في عصر المشتتات: إدارة حرب الانتباه ومواجهة الفراغ والسيولة الرقمية]<\/b>."}]},{"num":4,"title":"الخطاف (The Hook) — تجربة فكرية تفاعلية في أول 5 دقائق","short":"الخطاف","kind":"std","icon":"hook","blocks":[{"t":"li","lvl":0,"h":"<b>سيناريو التجربة الفكرية: \"مرشح المياه vs الفيروس الفكري\"<\/b>"},{"t":"li","lvl":1,"h":"<b>الإجراء الميداني:<\/b> كأس ماء نقي، وكأس ماء ملوث بحبر أو طين، مع مجسم لفلتر ماء متعدد الطبقات."},{"t":"li","lvl":1,"h":"<b>السيناريو:<\/b> <i>\"هل يقبل أحدكم شرب الماء الملوث؟ مستحيل! لكن لو مررناه عبر فلتر ينقيه تماماً سنشربه باطمئنان. هذا الفلتر بالضبط هو ما يحتاجه عقلك أمام سيل الشبهات في الإنترنت!\"<\/i>."},{"t":"li","lvl":1,"h":"<b>أسئلة الاستثارة التوليدية (3 دقائق):<\/b>"},{"t":"li","lvl":2,"h":"ما الفرق بين من يبتلع الشبهات بلا تمحيص، ومن يمتلك فلتر رد الفروع للأصول؟"},{"t":"li","lvl":2,"h":"لماذا يصاب الشاب غير المحصن بالشك من شبهة واحدة، بينما تزيد المحصن بصيرة؟"}]},{"num":5,"title":"المهارة الناعمة المستهدفة","short":"المهارة الناعمة المستهدفة","kind":"std","icon":"spark","blocks":[{"t":"li","lvl":0,"h":"<b>الحصانة الفكرية (Intellectual Immunity):<\/b> حماية الثوابت الإيمانية من الشكوك."},{"t":"li","lvl":0,"h":"<b>تفكيك الشبهات (Deconstruction of Doubts):<\/b> كشف التناقض والخلل في الطرح المشكك."},{"t":"li","lvl":0,"h":"<b>إدارة الانفعال المعرفي (Cognitive Regulation):<\/b> الاتزان والثبات النفسي عند ورود ما يُحير."}]},{"num":6,"title":"المحتوى المعرفي والتأصيلي المدمج","short":"المحتوى المعرفي والتأصيلي المدمج","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: نصوص الوحي المؤسسة (الآيات والأحاديث):<\/b>"},{"t":"li","lvl":0,"h":"<b>القرآن الكريم:<\/b>"},{"t":"li","lvl":1,"h":"<b>قاعدة المحكم والمتشابه:<\/b> قال تعالى: <span class=\"ayah\">﴿هُوَ الَّذِي أَنزَلَ عَلَيْكَ الْكِتَابَ مِنْهُ آيَاتٌ مُّحْكَمَاتٌ هُنَّ أُمُّ الْكِتَابِ وَأُخَرُ مُتَشَابِهَاتٌ ۖ فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ مِنْهُ ابْتِغَاءَ الْفِتْنَةِ وَابْتِغَاءَ تَأْوِيلِهِ﴾<\/span> <span class=\"ayref\">آل عمران: 7<\/span>؛ المحكم هو الأصل الثابت الذي تُرد إليه كل شبهة فرعية."},{"t":"li","lvl":1,"h":"<b>سؤال أهل الاختصاص:<\/b> قال تعالى: <span class=\"ayah\">﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾<\/span> <span class=\"ayref\">النحل: 43<\/span>؛ غرس منهجية التعلم برد الإشكال لأهله."},{"t":"li","lvl":1,"h":"<b>الوقاية بالابتعاد عن مجالس الخوض في الباطل:<\/b> قال تعالى: <span class=\"ayah\">﴿وَإِذَا رَأَيْتَ الَّذِينَ يَخُوضُونَ فِي آيَاتِنَا فَأَعْرِضْ عَنْهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ﴾<\/span> <span class=\"ayref\">الأنعام: 68<\/span>."},{"t":"li","lvl":0,"h":"<b>السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":1,"h":"<b>حديث الوقاية من المشتبهات:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«إنَّ الحَلالَ بَيِّنٌ، وإنَّ الحَرامَ بَيِّنٌ، وبينَهُما أُمُورٌ مُشْتَبِهاتٌ لا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقَى الشُّبُهاتِ اسْتَبْرَأَ لِدِينِهِ وعِرْضِهِ...»<\/span> <span class=\"takh\">[متفق عليه]<\/span>."},{"t":"li","lvl":1,"h":"<b>بروتوكول التعامل مع الخواطر والوساوس التشكيكية:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«يَأْتي الشَّيْطانُ أحَدَكُمْ فيَقولَ: مَن خَلَقَ كَذا وكَذا؟ حتَّى يَقُولَ له: مَن خَلَقَ رَبَّكَ؟ فإذا بَلَغَ ذلكَ، فَلْيَسْتَعِذْ باللَّهِ ولْيَنْتَهِ»<\/span> <span class=\"takh\">[صحيح البخاري]<\/span>؛ قطع التسلسل العبثي الفاسد فوراً والاستعاذة بالحق."},{"t":"p","lvl":0,"h":"<b>ثانياً: مواقف من قصص الأنبياء والسيرة النبوية:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف الصديق رضي الله عنه في صلح الحديبية وثباته بالمحكم:<\/b> حين جاء عمر بن الخطاب رضي الله عنه يسأل في اضطراب مشروع: \"ألسنا على الحق وهم على الباطل؟ فعلام نعطي الدنية في ديننا؟\" رد عليه أبو بكر بقاعدة المحكم القاطع: \"أيها الرجل، إنه لرسول الله ﷺ، وليس يعصي ربه، وهو ناصره، فاستمسك بغرزه\". رد الفرع المتشابه المشكل إلى الأصل المحكم المقطوع به."},{"t":"li","lvl":0,"h":"<b>ثبات موسى عليه السلام أمام إعلام السحرة وتزييفهم [طه: 66-69]:<\/b> سحروا أعين الناس واسترهبوهم، فأوجس في نفسه خيفة، فثبته الوحي: <span class=\"ayah\">﴿قُلْنَا لَا تَخَفْ إِنَّكَ أَنتَ الْأَعْلَىٰ * وَأَلْقِ مَا فِي يَمِينِكَ تَلْقَفْ مَا صَنَعُوا ۖ إِنَّمَا صَنَعُوا كَيْدُ سَاحِرٍ﴾<\/span>؛ الباطل مهما انتفش خيط عنكبوت يبتلعه برهان الحق."},{"t":"p","lvl":0,"h":"<b>ثالثاً: التأصيل المرجعي المقارن:<\/b>"},{"t":"li","lvl":0,"h":"<b>أولوية البناء على تتبع الشبهات:<\/b> يؤصل الأستاذ أحمد السيد: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>تعزيز اليقين لا يكون بالبحث عن الشبهات والمشككين... وإنما المطلوب معرفة دلائل الحق وبراهينه، والعمل بمقتضاه، وأما الشبهات فيكفي معرفة أصول المنتشر منها بعد معرفة الصواب لا العكس<\/blockquote><cite>إلى الجيل الصاعد - ص 37<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>الخطوات الأربع لتفكيك الشبهات (صناعة الفلتر):<\/b>"},{"t":"li","lvl":1,"h":"<i>الخطوة الأولى: رد المتشابه إلى المحكم:<\/i> القضايا الكبرى كوجود الله وعدله وصدق القرآن محكمات قاطعة لا تزعزعها جزئية مشتبهة. يقول د. القرضاوي: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: في فقه الأولويات<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>القضايا الكبرى بينتها آيات محكمات تقطع النزاع... ولا يجوز الخلط بين النصوص أو جعل الظنيات والشبهات حاكمة على المحكمات<\/blockquote><cite>في فقه الأولويات - ص 77<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>الخطوة الثانية: فحص صحة الثبوت:<\/i> هل الرواية أو الحديث أو المعلومة ثابتة علمياً وتاريخياً أم مكذوبة؟ <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: أحمد السيد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>الدعاوى لا تساوي شيئاً ما لم يقرنها أصحابها بأدلة تثبت صحتها<\/blockquote><cite>أحمد السيد - ص 41<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>الخطوة الثالثة: كشف المغالطة والانحراف المفهومي:<\/i> فحص طريقة الاستدلال وعلاقة اللزوم بين الدليل والنتيجة <span class=\"pg\">أحمد السيد - ص 42<\/span>."},{"t":"li","lvl":1,"h":"<i>الخطوة الرابعة: الرجوع لأهل العلم الموثوقين:<\/i> قال تعالى: <span class=\"ayah\">﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾<\/span>، وفي الحديث: <span class=\"qt\">«فإنما شفاء العي السؤال»<\/span> <span class=\"pg\">د. القرضاوي - ص 198<\/span>."}]},{"num":7,"title":"دليل ورشة التطبيق (التفاعل الميداني)","short":"دليل ورشة التطبيق","kind":"std","icon":"tools","blocks":[{"t":"li","lvl":0,"h":"<b>الزمن:<\/b> 20 دقيقة."},{"t":"li","lvl":0,"h":"<b>المجموعات:<\/b> 3 مجموعات (أهل المحكمات، المرشحون، المفككون)."},{"t":"li","lvl":0,"h":"<b>التحدي:<\/b> معالجة شبهة معاصرة شائعة: <i>\"يدعي بعض المشككين أن التشريعات الإسلامية تظلم الإنسان وتحد من حريته، بينما يوفر العالم الحديث الحرية المطلقة لكل شخص!\"<\/i>."},{"t":"li","lvl":0,"h":"<b>المهمة:<\/b> تطبيق الخطوات الأربع لتفكيك الشبهة:"},{"t":"li","lvl":1,"h":"<i>فريق المحكمات:<\/i> تثبيت أصل العبودية وحكمة الخالق وغناه."},{"t":"li","lvl":1,"h":"<i>فريق المرشحين:<\/i> إثبات وهم \"الحرية المطلقة\" في أي قانون بشري في العالم."},{"t":"li","lvl":1,"h":"<i>فريق المفككين:<\/i> كشف مغالطة رجل القش وصياغة الجواب المتماسك."},{"t":"li","lvl":0,"h":"<b>المخرجات:<\/b> تقديم كل فريق رده في 3 دقائق أمام القاعة."}]},{"num":8,"title":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","short":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"ماذا لو صادفت شبهة لم أعرف جوابها واضطربت نفسي؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> جهلك بجواب مسألة معينة لا يعني بطلان الحق، بل يدل على <b>نقص علمك البشري<\/b>. تمسك بالمحكم الثابت وضع الإشكال جانباً، واسأل أهل العلم الراسخين وسيزول اللبس بإذن الله."}]},{"t":"qa","n":"2","q":"\"هل مشاهدة المناظرات الفكرية في تيك توك ويوتيوب تزيد ثقافتي؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> تشكل خطراً بالغاً على غير المتأصل شرعياً؛ فالقلوب ضعيفة والشبه خطافة، والسلامة لا يعدلها شيء. البناء أولاً ثم دفع الصائل إن لزم."}]},{"t":"qa","n":"3","q":"\"كيف أفرق بين المحكم الذي لا يقبل الشك والمسائل الاجتهادية؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> المحكم هو ما دلت عليه نصوص قاطعة الثبوت والدلالة وأجمعت عليه الأمة كأركان الإيمان والإسلام، أما الاجتهادي فهو ما احتمل وجوهاً لظنية دليله."}]}]},{"num":9,"title":"علم الإنذار المبكر (بروتوكول الحماية والتدخل الفردي)","short":"علم الإنذار المبكر","kind":"std","icon":"alert","blocks":[{"t":"li","lvl":0,"h":"<b>مؤشرات الخطر:<\/b> القلق الوجودي الحاد، التكاسل عن الصلاة بسبب فكرة تشكيكية عالقة، والانعزال التام مع متابعة مواقع الإلحاد والشك."},{"t":"li","lvl":0,"h":"<b>بروتوكول التدخل:<\/b>"},{"t":"li","lvl":1,"h":"جلسة فردية قائمة على الأمان المطلق وتفريغ التساؤلات."},{"t":"li","lvl":1,"h":"تطبيق خطوات الفلتر الأربع على شبهته بهدوء وتفكيك مقدماتها الفاسدة."},{"t":"li","lvl":1,"h":"إهداؤه كتاب <i>سابغات<\/i> أو التنسيق له مع مستشار شرعي موثوق."}]},{"num":10,"title":"الفعاليات والأنشطة الم الغرفة والوصل بمحاور الوحدة."],["15 - 35 د","","المحتوى المعرفي (خطوات الفلتر وتأصيلات الوحي)."],["35 - 55 د","","ورشة التطبيق وتفكيك شبهة الحرية المطلقة."],["55 - 65 د","","معالجة الاعتراضات وقلق الشبهات العالقة."],["65 - 70 د","","إعلان تكليف الحصانة والختام."]]}]},{"num":14,"title":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","short":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>توثيق الاقتباسات الأساسية:<\/b>"},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 37."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 39-42."},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>المراهق: كيف نفهمه وكيف نوجهه؟<\/i> - ص 92."},{"t":"li","lvl":1,"h":"د. يوسف القرضاوي - <i>في فقه الأولويات<\/i> - ص 77."},{"t":"li","lvl":1,"h":"د. يوسف القرضاوي - <i>في فقه الأولويات<\/i> - ص 198."},{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية المعتمدة (بالصفحات):<\/b>"},{"t":"li","lvl":1,"h":"أحمد بن يوسف السيد - <i>سابغات: كيفية التعامل مع الشبهات الفكرية المعاصرة<\/i> - دار تكوين - (ص 30 - 75: البناء المنهجي للتعامل مع الشبهات)."},{"t":"li","lvl":1,"h":"د. عبد الله بن صالح العجيري - <i>ينبوع الغواية الفكرية<\/i> - مركز تفكر - (ص 40 - 85: أسباب الانحراف الفكري والوقاية منه)."}]},{"num":15,"title":"التكليف العملي السلوكي (تطبيق واقعي طوال الأسبوع)","short":"التكليف العملي السلوكي","kind":"std","icon":"flag","blocks":[{"t":"li","lvl":0,"h":"<b>الصيام عن منصات الجدل:<\/b> التوقف التام عن متابعة حسابات المناظرات والشبهات العبثية على وسائل التواصل."},{"t":"li","lvl":0,"h":"<b>تطبيق الفلتر:<\/b> عند مصادفة أي إشكال فكري عارض، يتم إمراره على بطاقة \"فلتر الشبهات\" أو عرضه على المربي فوراً."}]},{"num":16,"title":"مؤشر قياس الأثر الميداني (معايير تحقق الوعي لدى الطالب)","short":"مؤشر قياس الأثر الميداني","kind":"std","icon":"chart","blocks":[{"t":"li","lvl":0,"h":"<b>الاتزان النفسي:<\/b> غياب الهلع عند سماع الشبهة والرد المباشر إلى المحكمات."},{"t":"li","lvl":0,"h":"<b>الكف عن النشر العبثي:<\/b> التوقف عن تداول المحتويات التشكيكية أو التعليق عليها دون علم."},{"t":"li","lvl":0,"h":"<b>الرجوع للمصادر الموثوقة:<\/b> المبادرة بسؤال أهل العلم والمربين عند الالتباس."}]}]},{"id":"1-5","ordinal":"الخامس","title":"الثبات في عصر المشتتات","sub":"إدارة حرب الانتباه ومواجهة الفراغ والسيولة الرقمية","sections":[{"num":1,"title":"عنوان اللقاء","short":"عنوان اللقاء","kind":"meta","icon":"id","blocks":[{"t":"p","lvl":0,"h":"<b>الثبات في عصر المشتتات: إدارة حرب الانتباه ومواجهة الفراغ والسيولة الرقمية<\/b>"}],"hide":true},{"num":2,"title":"نبض الغرفة (تشخيص الحالة النفسية والذهنية للفتيان 15-18 سنة + بروتوكول الاحتواء النبوي)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"li","lvl":0,"h":"<b>التشخيص النفسي والذهني لفتيان مرحلة الثانوية (15-18 سنة):<\/b> يعيش فتيان هذه المرحلة في ذروة حرب الانتباه؛ مقاطع قصيرة (Reels/TikTok) مصممة لهندسة الدوبامين السريع، مما أصابهم بضعف التركيز العميق والشعور المزمن بالملل والضبابية الذهنية وجلد الذات لضياع أوقاتهم. يشخّص د. عبد الكريم بكار خطر الفراغ: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: المراهق<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن الفراغ وسوء تنظيم الوقت هما المشرط الذي يبتر قدرات المراهق ويجعله عرضة للضياع؛ فالمرء حين لا يجد ما يشغل به نفسه الناطقة، فإنها تشغله بالباطل أو بالتافه من الأمور، وتتحول أدوات التواصل والتسلية في يده من وسائل مساعدة إلى سيد مطاع يستنفد طاقته وجهده<\/blockquote><cite>المراهق - ص 78-79<\/cite><\/div><\/details> ويحذر الأستاذ أحمد بن يوسف السيد: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن السيولة المعرفية والتشتت الرقمي يُفقدان الفتى القدرة على الاستقرار المعرفي والبناء المتين، فيتحول من قارئ ومتعلم جاد إلى مستهلك سطحي ينقل عينيه بين السطور والمقاطع دون أن يرسخ في ذهنه شيء يناضل لأجله<\/blockquote><cite>إلى الجيل الصاعد - ص 52-53<\/cite><\/div><\/details> ويضيف: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 54<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن من أكبر عوائق الجيل الصاعد عن تحقيق التميز... حالة الشتات المعرفي والسيولة الرقمية؛ حيث يقضي الشاب ساعات طوالاً بين تنقلات سطحية... فيضعف ذكاؤه الاستيعابي<\/blockquote><cite>ص 54<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>بروتوكول الاحتواء النبوي المعتمد داخل الجلسة:<\/b>"},{"t":"li","lvl":1,"h":"<b>التدرج والرفق:<\/b> التوقف عن إمطارهم بالمواعظ المنفرة أو طلب الانعزال التام عن التقنية، بل معالجة العادات بذكاء سلوكي."},{"t":"li","lvl":1,"h":"<b>تأصيل التغيير الذري (<span class=\"qt\">«أدومها وإن قل»<\/span>):<\/b> استبدال المشتتات بخطوات إيجابية صغيرة مستمرة."},{"t":"li","lvl":1,"h":"<b>بناء البدائل:<\/b> ملء الفراغ بالأنشطة الجاذبة والنافعة (رياضة، قراءة، مهارة، صحبة صالحة)."}]},{"num":3,"title":"خيط الربط (الوصل بأهداف الوحدة والمنهج، والتمهيد للقاء التالي)","short":"خيط الربط","kind":"std","icon":"link","blocks":[{"t":"li","lvl":0,"h":"<b>الوصل بأهداف الوحدة الأولى:<\/b> كل الحصانات العقدية والفكرية السابقة مهددة بالانهيار إذا استُعبد الشاب لهاتفه وضاع وقته وانتباهه؛ فاللقاء الخامس يمثل <b>\"حماية الثغور الميدانية للعقل\"<\/b>؛ إذ لا يقين لمن لا يملك زمام نفسه."},{"t":"li","lvl":0,"h":"<b>التمهيد للقاء السادس:<\/b> هذا الانضباط السلوكي هو الوقود اللازم لصياغة الميثاق الجامع للوحدة في اللقاء القادم: <b>[صياغة \"الدستور الشخصي\" وخارطة الثبات]<\/b>."}]},{"num":4,"title":"الخطاف (The Hook) — تجربة فكرية تفاعلية في أول 5 دقائق","short":"الخطاف","kind":"std","icon":"hook","blocks":[{"t":"li","lvl":0,"h":"<b>سيناريو التجربة الفكرية: \"المصيدة الذهبية والساعة الرملية\"<\/b>"},{"t":"li","lvl":1,"h":"<b>الإجراء الميداني:<\/b> ساعة رملية ومؤقت هاتف."},{"t":"li","lvl":1,"h":"<b>السيناريو:<\/b> يُطلب من طالب تصفح المقاطع القصيرة لـ 60 ثانية، ثم يُسأل: <i>\"كم مقطعاً شاهدت؟ وما المعرفة الراسخة التي استفدتها لبناء مستقبلك؟\"<\/i> (النتيجة: تشتت ومتعة لحظية لا أثر لها)."},{"t":"li","lvl":1,"h":"<b>أسئلة الاستثارة التوليدية (3 دقائق):<\/b>"},{"t":"li","lvl":2,"h":"إذا كانت دقيقة واحدة تسلب 5 مشاهد وتشتت ذهنك، فماذا تصنع 4 ساعات يومياً في عمرك؟ (4 ساعات = شهرين كاملين سنوياً من حياتك!)."},{"t":"li","lvl":2,"h":"هل تعلم أن آلاف المهندسين يُدفع لهم المليارات لخدمة هدف واحد: كيف تبقيك الشاشة مسلوب الإرادة؟ فهل تقبل أن تكون السلعة؟"}]},{"num":5,"title":"المهارة الناعمة المستهدفة","short":"المهارة الناعمة المستهدفة","kind":"std","icon":"spark","blocks":[{"t":"li","lvl":0,"h":"<b>إدارة الانتباه والتركيز العميق (Deep Work):<\/b> حماية القدرات الذهنية من التشتت والعمل بتركيز مكثف."},{"t":"li","lvl":0,"h":"<b>هندسة العادات الذرية (Atomic Habits):<\/b> تصميم البيئة للتخلص من الإدمان الرقمي تدريجياً."},{"t":"li","lvl":0,"h":"<b>الانضباط الذاتي واستثمار الزمن (Time Stewardship):<\/b> إدراك أن العمر رأس مال لا يُعوض."}]},{"num":6,"title":"المحتوى المعرفي والتأصيلي المدمج","short":"المحتوى المعرفي والتأصيلي المدمج","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: نصوص الوحي المؤسسة (الآيات والأحاديث):<\/b>"},{"t":"li","lvl":0,"h":"<b>القرآن الكريم:<\/b>"},{"t":"li","lvl":1,"h":"<b>قَسَم الله بالوقت:<\/b> قال تعالى: <span class=\"ayah\">﴿وَالْعَصْرِ * إِنَّ الْإِنسَانَ لَفِي خُسْرٍ * إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ﴾<\/span> <span class=\"ayref\">العصر: 1-3<\/span>؛ كل إنسان خاسر إلا من استثمر ساعاته في الإيمان والعمل والتواصي."},{"t":"li","lvl":1,"h":"<b>صفة المؤمنين في هجر التوافه:<\/b> قال تعالى: <span class=\"ayah\">﴿وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُّعْرِضُونَ﴾<\/span> <span class=\"ayref\">المؤمنون: 3<\/span>؛ اللغو هو كل ما لا فائدة فيه في دين ولا دنيا كالمقاطع التافهة."},{"t":"li","lvl":1,"h":"<b>الاستثمار المستمر للزمن:<\/b> قال تعالى: <span class=\"ayah\">﴿فَإِذَا فَرَغْتَ فَانصَبْ * وَإِلَىٰ رَبِّكَ فَارْغَب﴾<\/span> <span class=\"ayref\">الشرح: 7-8<\/span>؛ لا يعرف المسلم الفراغ القاتل، فإذا فرغ من عمل نافع انتقل لغيره."},{"t":"li","lvl":0,"h":"<b>السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":1,"h":"<b>حديث رأس مال العمر:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«نِعْمَتانِ مَغْبُونٌ فِيهِما كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ والفَراغُ»<\/span> <span class=\"takh\">[صحيح البخاري]<\/span>؛ الغبن أن تبيع الغالي (عمرك) بأبخس الأثمان (التفاهة الرقمية)."},{"t":"li","lvl":1,"h":"<b>حديث اغتنام الشباب:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«اغتَنِم خَمساً قبلَ خَمسٍ: شَبابَكَ قَبلَ هَرَمِكَ، وصِحَّتَكَ قَبلَ سَقَمِكَ، وغِناءكَ قَبلَ فَقرِكَ، وفَراغَكَ قَبلَ شُغلِكَ، وحَياتَكَ قَبلَ مَوتِكَ»<\/span> <span class=\"takh\">[رواه الحاكم وصححه]<\/span>."},{"t":"li","lvl":1,"h":"<b>حديث الاستمرارية الذرية:<\/b> قالت عائشة رضي الله عنها: سئل النبي ﷺ: أي الأعمال أحب إلى الله؟ قال: <span class=\"hadith\">«أدْوَمُها وإنْ قَلَّ»<\/span> <span class=\"takh\">[متفق عليه]<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: مواقف من قصص الأنبياء والسيرة النبوية:<\/b>"},{"t":"li","lvl":0,"h":"<b>انضباط اليوم النبوي وهجر التشتت:<\/b> كان يوم النبي ﷺ مقسماً بأعلى درجات الوعي بين ربه، وأهله، وأمته، وتدبير شؤون الغزوات والتعليم، فلم يكن في حياته لحظة عابثة أو فراغ مهدور، ومع ذلك كان أرفق الناس وأبشهم وجهاً."},{"t":"li","lvl":0,"h":"<b>إنجاز الصحابة الشباب (زيد بن ثابت رضي الله عنه):<\/b> أمره النبي ﷺ بتعلم لغة يهود (السريانية والعبرية) ليأمن مكرهم وكتبهم، فتعلمها وأتقنها قراءة وكتابة في <b>نصف شهر (15 يوماً فقط)<\/b> بفضل التركيز الصافي والهمة العالية الخالية من ملهيات العصر."},{"t":"p","lvl":0,"h":"<b>ثالثاً: التأصيل المرجعي المقارن:<\/b>"},{"t":"li","lvl":0,"h":"<b>قيمة الزمن عند علماء المسلمين:<\/b> يؤصل الشيخ عبد الفتاح أبو غدة: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: قيمة الزمن عند العلماء<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن الوقت هو الحياة، وهو غالية العطايا، ورأس مال الإنسان في درك المعالي... وقد كان العلماء أشد شيء حرصاً على أوقاتهم؛ لعلمهم أن النفس إن لم تشغلها بالحق شغلتك بالباطل<\/blockquote><cite>قيمة الزمن عند العلماء - ص 27-28<\/cite><\/div><\/details> ويستشهد بـ ابن الجوزي: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 45<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>ينبغي للإنسان أن يعرف شرف زمانه وقدر وقته، فلا يذهب منه لحظة في غير قربة<\/blockquote><cite>ص 45<\/cite><\/div><\/details> ويربط د. القرضاوي ذلك بفقه الأولويات: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 150<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>تنظيم الوقت واستغلال الصالح منه في الأهم فالأهم هو جوهر فقه الأولويات؛ فإضاعة الأوقات في الترفيه مع ضياع الواجبات خلل عميق<\/blockquote><cite>ص 150<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>قواعد تغيير العادات وهندسة الانتباه (جيمس كلير - العادات الذرية):<\/b>"},{"t":"li","lvl":1,"h":"<i>قاعدة التحسين 1% يومياً:<\/i> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 15<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>التحسن بنسبة 1% كل يوم يمكن أن يكون ذا مغزى هائل على المدى الطويل<\/blockquote><cite>ص 15<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>بناء الهوية لا الأهداف المجردة:<\/i> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 35-36<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>ركز على من تريد أن تكون... السلوك الذي لا يتوافق مع الهوية لن يدوم<\/blockquote><cite>ص 35-36<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>قوانين التخلص من العادة السيئة:<\/i> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 112<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>اجعلها خفية، واجعلها صعبة، واجعلها غير جذابة<\/blockquote><cite>ص 112<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>الصبر الإيماني والرجولة القرآنية:<\/b> يقرر الشيخ الغزالي: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: خلق المسلم<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>الصبر في الإسلام شجاعة نفسية تكبح جماح الهوى وتصمد أمام المغريات<\/blockquote><cite>خلق المسلم - ص 85-86<\/cite><\/div><\/details> ويؤكد د. أحمد عبد المنعم: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: تفريغ معاني الرجولة<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>ورجال القرآن هم الذين لا تلهيهم تجارة ولا بيع ولا مشتتات عن ذكر الله<\/blockquote><cite>تفريغ معاني الرجولة<\/cite><\/div><\/details>"}]},{"num":7,"title":"دليل ورشة التطبيق (التفاعل الميداني)","short":"دليل ورشة التطبيق","kind":"std","icon":"tools","blocks":[{"t":"li","lvl":0,"h":"<b>الزمن:<\/b> 20 دقيقة."},{"t":"li","lvl":0,"h":"<b>المجموعات:<\/b> 3 مجموعات (فرسان الانتباه، بناة العادات، حراس الوقت)."},{"t":"li","lvl":0,"h":"<b>التحدي:<\/b> سيناريو واقعي لشاب يدعى \"خالد\": يسهر يومياً للساعة 2 ليلاً على الهاتف، يتشتت كل 5 دقائق أثناء المذاكرة، ويضيع صلاة الفجر دراسياً وإيمانياً."},{"t":"li","lvl":0,"h":"<b>المهمة:<\/b> تطبيق قوانين العادات الذرية:"},{"t":"li","lvl":1,"h":"<i>فرسان الانتباه:<\/i> هندسة البيئة (إخراج الهاتف خارج الغرفة وقت النوم والمذاكرة)."},{"t":"li","lvl":1,"h":"<i>بناة العادات:<\/i> تصميم عادة بديلة (قراءة 3 صفحات يومياً بنسبة 1% مستمرة)."},{"t":"li","lvl":1,"h":"<i>حراس الوقت:<\/i> صياغة جدول الهوية الجديد (\"أنا شاب مسلم وقتي رأسمالي\")."},{"t":"li","lvl":0,"h":"<b>المخرجات:<\/b> تقديم كل فريق خطته في 3 دقائق أمام القاعة."}]},{"num":8,"title":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","short":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أشعر بإدمان شديد للمقاطع القصيرة، فهل هذا نقص في ديني؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> له شق إيماني، لكن شقه الأكبر <b>تصميم عصبي وخوارزمي<\/b> يسحب دوبامين دماغك. العلاج لا يكون بجلد الذات بل بـ <b>\"إعادة هندسة البيئة\"<\/b>؛ كحذف التطبيق، وإلغاء الإشعارات، ووضع الهاتف في غرفة أخرى."}]},{"t":"qa","n":"2","q":"\"التكنولوجيا ضرورية لحياتنا ودراستنا، فكيف نتركها؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> نحن لا ندعو لترك التقنية، بل إلى <b>السيادة عليها<\/b>؛ لتكون خادماً لك وأداة لنفعك، لا أن تكون أنت السلعة التي تحركها خوارزميات الشركات."}]},{"t":"qa","n":"3","q":"\"أضع جداول صارمة لكنني أنتكس بعد أيام؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> لأنك تبدأ بقفزات مفاجئة لا تطيقها النفس؛ والحل في <b>\"العادات الذرية 1%\"<\/b>؛ ابدأ بدقيقتين أو قراءة صفحة واحدة يومياً وثبتها قبل أن تزيد، عملاً بهدي: <span class=\"qt\">«أدومها وإن قل»<\/span>."}]}]},{"num":9,"title":"علم الإنذار المبكر (بروتوكول الحماية والتدخل الفردي)","short":"علم الإنذار المبكر","kind":"std","icon":"alert","blocks":[{"t":"li","lvl":0,"h":"<b>مؤشرات الخطر:<\/b> إجهاد رقمي حاد، فوات صلاة الفجر المتكرر بسبب السهر، نوبات قلق وتوتر عند سحب الهاتف لساعة واحدة، وتراجع دراسي مفاجئ."},{"t":"li","lvl":0,"h":"<b>بروتوكول التدخل:<\/b>"},{"t":"li","lvl":1,"h":"جلسة احتواء بعيداً عن إشعاره بالذنب أو التوبيخ."},{"t":"li","lvl":1,"h":"فحص زمن الشاشة (Screen Time) مع الشاب لمعرفة الحقيقة بالأرقام المجردة."},{"t":"li","lvl":1,"h":"الاتفاق على خطوة واحدة قابلة للتطبيق (مثل: عدم إدخال الهاتف غرفة النوم إطلاقاً بعد 11 مساءً)."}]},{"num":10,"title":"الفعاليات والأنشطة المصاحبة (بطاقة عمل تفاعلية)","short":"الفعاليات والأنشطة المصاحبة","kind":"std","icon":"card","blocks":[{"t":"li","lvl":0,"h":"<b>تمرين: بطاقة \"هندسة البيئة الرقمية وتحدي 1%\" (7 دقائق):<\/b>"},{"t":"card","title":"بطاقة: هندسة البيئة الرقمية وتحدي 1%","sub":"","lines":["1. فحص الشاشة: كم ساعة أقضيها يومياً؟ (.........) ساعة.","- التطبيق الأكثر استنزافاً لوقتي: (.....................)","2. تطهير البيئة (جعل المشتت خفياً وصعباً):","- الخطوة 1: سأغلق إشعارات التطبيقات التالية: (.......)","- الخطوة 2: أين سأضع الهاتف أثناء المذاكرة والنوم؟","(............................................)","3. العادة الذرية الجديدة البديلة (1% يومياً):","- العادة الإيجابية: (قراءة / ورد قرآني / رياضة)","- وقت الالتزام بها: ...........................","4. إعلان الهوية: \"أنا شاب موقن، أملك هاتفي ولا يملكني\"."]}]},{"num":11,"title":"أدوار مجلس الفتيان (التشغيل القيادي)","short":"أدوار مجلس الفتيان","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>ميقاتي اللقاء:<\/b> ضبط وإدارة زمن الجلسة بدقة."},{"t":"li","lvl":0,"h":"<b>مدوّن خطط البيئة (المقرر):<\/b> تسجيل أهم الأفكار العملية لتنقية بيئة الفتيان الرقمية."},{"t":"li","lvl":0,"h":"<b>مسؤول التحدي:<\/b> متابعة توزيع البطاقات وتشجيع الالتزام بالتحدي."}]},{"num":12,"title":"خلفية المربي والمعينات المرئية المقترحة","short":"خلفية المربي والمعينات المرئية المقترحة","kind":"std","icon":"compass","blocks":[{"t":"li","lvl":0,"h":"<b>موجهات المربي:<\/b> القدوة العملية (ألا ينشغل بهاتفه أمام الطلاب)، واستيعاب آليات العادات الذرية علمياً."},{"t":"li","lvl":0,"h":"<b>المعينات المرئية الإثرائية (يوتيوب):<\/b>"},{"t":"li","lvl":1,"h":"<i>للشباب:<\/i> ملخص كتاب \"العمل العميق Deep Work\" لكال نيوبورت (قناة علي وكتاب)."},{"t":"li","lvl":1,"h":"<i>للشباب والمربي:<\/i> حلقة \"كيف تسرق السوشيال ميديا أعمارنا؟ وحرب الانتباه\" (بودكاست وعي)."},{"t":"li","lvl":1,"h":"<i>للمربي:<\/i> محاضرة \"فقه النفس وإدارة المشتتات الرقمية\" - د. عبد الرحمن ذاكر الهاشمي."}]},{"num":13,"title":"الخطة الزمنية التفصيلية المجدولة (70 دقيقة)","short":"الخطة الزمنية التفصيلية المجدولة","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","","الخطاف وسيناريو الساعة الرملية وتصفح الهاتف."],["05 - 15 د","","نبض الغرفة والوصل بأهداف الوحدة."],["15 - 35 د","","المحتوى المعرفي (قيمة الزمن، العادات الذرية، الوحي)."],["35 - 55 د","","ورشة التطبيق وتفكيك سيناريو خالد."],["55 - 65 د","","تفكيك الاعتراضات وحيل الإدمان الرقمي."],["65 - 70 د","","إعلان تحدي \"صيام الشاشات\" والختام."]]}]},{"num":14,"title":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","short":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>توثيق الاقتباسات الأساسية:<\/b>"},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>المراهق: كيف نفهمه وكيف نوجهه؟<\/i> - ص 78-79."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 13 و ص 52-54."},{"t":"li","lvl":1,"h":"الشيخ عبد الفتاح أبو غدة - <i>قيمة الزمن عند العلماء<\/i> - ص 27-28 و ص 45."},{"t":"li","lvl":1,"h":"د. يوسف القرضاوي - <i>في فقه الأولويات<\/i> - ص 150."},{"t":"li","lvl":1,"h":"جيمس كلير - <i>العادات الذرية<\/i> - ص 15، 35-36، 54، 112."},{"t":"li","lvl":1,"h":"محمد الغزالي - <i>خلق المسلم<\/i> - ص 85-86."},{"t":"li","lvl":1,"h":"د. أحمد عبد المنعم - <i>تفريغ معاني الرجولة في القرآن<\/i>."},{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية المعتمدة (بالصفحات):<\/b>"},{"t":"li","lvl":1,"h":"كال نيوبورت - <i>العمل العميق (Deep Work): قواعد للنجاح المركّز في عالم مشتت<\/i> - دار جرير - (ص 25 - 65: قواعد حماية التركيز ومخاطر الشبكات)."},{"t":"li","lvl":1,"h":"ابن القيم - <i>الفوائد<\/i> - دار عالم الفوائد - (ص 44 - 48: فصل إضاعة الوقت أشد من الموت)."}]},{"num":15,"title":"التكليف العملي السلوكي (تطبيق واقعي طوال الأسبوع)","short":"التكليف العملي السلوكي","kind":"std","icon":"flag","blocks":[{"t":"li","lvl":0,"h":"<b>صيام الشاشات:<\/b> مقاطعة المقاطع القصيرة والألعاب ساعتين متواصلتين يومياً قبل النوم، مع إخراج الهاتف كلياً من غرفة النوم ليلاً."},{"t":"li","lvl":0,"h":"<b>تطبيق عادة الـ 1%:<\/b> الالتزام بقراءة 3 صفحات من كتاب نافع أو قرآن يومياً في ذلك الوقت المفرغ من الشاشات."}]},{"num":16,"title":"مؤشر قياس الأثر الميداني (معايير تحقق الوعي لدى الطالب)","short":"مؤشر قياس الأثر الميداني","kind":"std","icon":"chart","blocks":[{"t":"li","lvl":0,"h":"<b>انخفاض زمن الشاشة:<\/b> تقليص ساعات استخدام الهاتف اليومي (Screen Time) بنسبة لا تقل عن 20% أسبوعياً."},{"t":"li","lvl":0,"h":"<b>حضور الذهن والخشوع:<\/b> استعادة الصفاء والتركيز في الصلاة والمذاكرة دون تشتت دائم."},{"t":"li","lvl":0,"h":"<b>الثبات على العادة:<\/b> الاستمرار على ورد القراءة أو العبادة الذرية طوال الأسبوع دون انقطاع."}]}]},{"id":"1-6","ordinal":"السادس","title":"صياغة \"الدستور الشخصي\" وخارطة الثبات","sub":"جلسة تطبيقية وتكاملية ختامية للوحدة الأولى","sections":[{"num":1,"title":"عنوان اللقاء","short":"عنوان اللقاء","kind":"meta","icon":"id","blocks":[{"t":"p","lvl":0,"h":"<b>صياغة \"الدستور الشخصي\" وخارطة الثبات (جلسة تطبيقية وتكاملية)<\/b>"}],"hide":true},{"num":2,"title":"نبض الغرفة (تشخيص الحالة النفسية والذهنية للفتيان 15-18 سنة + بروتوكول الاحتواء النبوي)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"li","lvl":0,"h":"<b>التشخيص النفسي والذهني لفتيان مرحلة الثانوية في الجلسة الختامية للوحدة:<\/b> يصل الفتيان إلى ختام الوحدة برصيد معرفي وفكري ثري، بحماس ممتزج بتخوف واقعي من الانتكاسة بعد اللقاءات والرجوع إلى مربع التشتت وضغط الأقران. يشخّص د. عبد الكريم بكار الفجوة بين الفكرة والعمل: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: المراهق<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>لا نبالغ إذا قلنا: إن جزءاً كبيراً من مشاكسات المراهقين... يعود إلى ما لديهم من مثالية زائدة وفهم متخشب للأمور، هذه الوضعية تعود إلى أن المراهق لا يستطيع رؤية الفجوة التي تفصل بين النظرية والتطبيق<\/blockquote><cite>المراهق - ص 18-19<\/cite><\/div><\/details> ويؤكد أهمية الدليل الواضح: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 106<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>إن المراهق يحتاج إلى مساعدة مستمرة في تنظيم حياته وحسم خياراته؛ لأن ضعف خبرته وتصارع الأشواق في داخله يجعلانه يتردد كثيراً بين ما يحبه وما يجب عليه القيام به<\/blockquote><cite>ص 106<\/cite><\/div><\/details> ويحدد الأستاذ أحمد بن يوسف السيد غاية العلم: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: إلى الجيل الصاعد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>فليس المطلوب هو مجرد شحن الذهن بالمعلومات والأدلة، بل المطلوب هو الاستقامة العملية والثبات على الحق في زمن السيولة، وتثبيت الأقدام على الصراط المستقيم<\/blockquote><cite>إلى الجيل الصاعد - ص 31<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>بروتوكول الاحتواء النبوي المعتمد داخل الجلسة:<\/b>"},{"t":"li","lvl":1,"h":"<b>التعاهد وأخذ المواثيق المكتوبة:<\/b> اقتداءً بالهدي النبوي في بيعة العقبة وبيعة الرضوان وأخذ العهود على الطاعة والثبات."},{"t":"li","lvl":1,"h":"<b>التيسير والتسديد (<span class=\"qt\">«سددوا وقاربوا»<\/span>):<\/b> تدريبهم على أن الدستور ليس سوطاً لجلد النفس بل بوصلة لتصحيح المسار عند الخطأ."},{"t":"li","lvl":1,"h":"<b>السيادة والمسؤولية:<\/b> أن يكتب الفتى بنود دستوره بيده واختياره ليكون نابعاً من قناعته لا مفروضاً عليه."}]},{"num":3,"title":"خيط الربط (الوصل بأهداف الوحدة والمنهج، والتمهيد للوحدة القادمة)","short":"خيط الربط","kind":"std","icon":"link","blocks":[{"t":"li","lvl":0,"h":"<b>الوصل بأهداف الوحدة الأولى:<\/b> يمثل هذا اللقاء <b>ذروة التتويج والتكامل<\/b>؛ حيث تُصهر ثمار اللقاءات الخمسة (الغاية، النقد، الوحي، الفلتر، وإدارة الانتباه) في وثيقة واحدة ملزمة تُترجم كل قناعة إلى سلوك مستمر."},{"t":"li","lvl":0,"h":"<b>التمهيد للوحدة الثانية:<\/b> الانتقال بالفتيان من مرحلة <b>\"بناء الحصانة واليقين الفردي\"<\/b> إلى مرحلة <b>\"البناء الأخلاقي والمسؤولية المجتمعية والتمكين القيادي\"<\/b> في وحدات المنهج التالية."}]},{"num":4,"title":"الخطاف (The Hook) — تجربة فكرية تفاعلية في أول 5 دقائق","short":"الخطاف","kind":"std","icon":"hook","blocks":[{"t":"li","lvl":0,"h":"<b>سيناريو التجربة الفكرية: \"وثيقة المدينة المنورة ومواثيق العظماء\"<\/b>"},{"t":"li","lvl":1,"h":"<b>الإجراء الميداني:<\/b> نموذج وثيقة تاريخية أنيقة مربوطة بشريط رسمي."},{"t":"li","lvl":1,"h":"<b>السيناريو:<\/b> <i>\"عندما دخل النبي ﷺ المدينة، لم يكتفِ بالنوايا الطيبة، بل كتب (وثيقة المدينة) لتحديد الهوية والحقوق والواجبات بدقة. لماذا تعتمد الأمم والجيوش والقادة على مواثيق مكتوبة ملزمة بدلاً من الاعتماد على النوايا الشفهية؟\"<\/i>."},{"t":"li","lvl":1,"h":"<b>أسئلة الاستثارة التوليدية (3 دقائق):<\/b>"},{"t":"li","lvl":2,"h":"ما الذي يحدث للنوايا الشفهية الجميلة عند أول عاصفة من الشهوات أو ضغط الأقران؟ (تتبخر وتُنسى!)."},{"t":"li","lvl":2,"h":"كيف يحميك \"دستورك الشخصي المكتوب\" ليكون مرجعيتك في أصعب لحظات ضعفك وتشتتك؟"}]},{"num":5,"title":"المهارة الناعمة المستهدفة","short":"المهارة الناعمة المستهدفة","kind":"std","icon":"spark","blocks":[{"t":"li","lvl":0,"h":"<b>التخطيط الاستراتيجي الشخصي (Strategic Planning):<\/b> تحويل المبادئ إلى أهداف وخطط سلوكية محددة."},{"t":"li","lvl":0,"h":"<b>المسؤولية الذاتية والوفاء بالعهد (Accountability &amp; Integrity):<\/b> إلزام النفس بالسلوك القويم ومحاسبتها."},{"t":"li","lvl":0,"h":"<b>التجميع والتركيب المعرفي (Synthesizing):<\/b> دمج المعارف المتفرقة في منظومة عمل متكاملة."}]},{"num":6,"title":"المحتوى المعرفي والتأصيلي المدمج","short":"المحتوى المعرفي والتأصيلي المدمج","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: نصوص الوحي المؤسسة (الآيات والأحاديث):<\/b>"},{"t":"li","lvl":0,"h":"<b>القرآن الكريم:<\/b>"},{"t":"li","lvl":1,"h":"<b>وجوب الوفاء بالعقود والمواثيق:<\/b> قال تعالى: <span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾<\/span> <span class=\"ayref\">المائدة: 1<\/span>."},{"t":"li","lvl":1,"h":"<b>مدح الثابتين على العهد مع الله:<\/b> قال تعالى: <span class=\"ayah\">﴿مِّنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا تَبْدِيلًا﴾<\/span> <span class=\"ayref\">الأحزاب: 23<\/span>."},{"t":"li","lvl":1,"h":"<b>النهي عن نقض العهود بعد توكيدها:<\/b> قال تعالى: <span class=\"ayah\">﴿وَأَوْفُوا بِعَهْدِ اللَّهِ إِذَا عَاهَدتُّمْ وَلَا تَنقُضُوا الْأَيْمَانَ بَعْدَ تَوْكِيدِهَا وَقَدْ جَعَلْتُمُ اللَّهَ عَلَيْكُمْ كَفِيلًا﴾<\/span> <span class=\"ayref\">النحل: 91<\/span>."},{"t":"li","lvl":0,"h":"<b>السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":1,"h":"<b>حديث إلزام النفس بالشروط المشروعة:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«المُسْلِمُونَ علَى شُرُوطِهِمْ، إلَّا شَرْطًا حَرَّمَ حَلَالًا، أوْ أحَلَّ حَرامًا»<\/span> <span class=\"takh\">[رواه أبو داود والترمذي وصححه]<\/span>."},{"t":"li","lvl":1,"h":"<b>حديث التسديد والرجاء الدائم:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«سَدِّدُوا وقارِبُوا، وأَبْشِرُوا، فإنَّه لَنْ يُدْخِلَ أحَدًا الجَنَّةَ عَمَلُهُ. قالوا: ولا أنْتَ يا رَسولَ اللَّهِ؟ قالَ: ولا أنا، إلَّا أنْ يَتَغَمَّدَنِي اللَّهُ بمَغْفِرَةٍ ورَحْمَةٍ»<\/span> <span class=\"takh\">[صحيح البخاري]<\/span>؛ التوازن بين بذل الجهد الكامل والاعتماد على رحمة الله."},{"t":"p","lvl":0,"h":"<b>ثانياً: مواقف من قصص الأنبياء والسيرة النبوية:<\/b>"},{"t":"li","lvl":0,"h":"<b>بيعة العقبة الثانية ونموذج الفتوة المسؤولة:<\/b> حين بايع فتيان ورجال الأنصار رسول الله ﷺ في جنح الليل بمكة، لم تكن بيعة عاطفية عابرة، بل كانت ميثاقاً صريحاً على السمع والطاعة، والنفقة، والأمر بالمعروف، والثبات حتى لو حاربتهم الدنيا كلها، فوفوا ببيعتهم وصنعوا دولة الإسلام."},{"t":"li","lvl":0,"h":"<b>بيعة الرضوان تحت الشجرة [الفتح: 18]:<\/b> <span class=\"ayah\">﴿لَّقَدْ رَضِيَ اللَّهُ عَنِ الْمُؤْمِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ الشَّجَرَةِ فَعَلِمَ مَا فِي قُلُوبِهِمْ فَأَنزَلَ السَّكِينَةَ عَلَيْهِمْ﴾<\/span>؛ ميثاق الثبات الصادق وقت الأزمات يتبعه الرضا الإلهي والسكينة."},{"t":"p","lvl":0,"h":"<b>ثالثاً: التأصيل المرجعي المقارن:<\/b>"},{"t":"li","lvl":0,"h":"<b>أصل الوفاء بالعهد والصدق:<\/b> يؤصل الشيخ الغزالي: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: خلق المسلم<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>فالوفاء بالعهد والالتزام بالوعد خلق إسلامي أصيل، يصدر عن نفس مؤمنة تستشعر رقابة الله... والصدق مع الله ومع النفس أصل كل استقامة<\/blockquote><cite>خلق المسلم - ص 48-49<\/cite><\/div><\/details> ويؤكد د. عبد الله ناصح علوان: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: تربية الأولاد في الإسلام<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>تربية الأولاد تقوم على تعويدهم تحمل المسؤولية وأخذ المواثيق في الطاعة؛ فإن الشاب متى ما أحس بأنه صاحب عهد، استيقظت فيه روح المروءة<\/blockquote><cite>تربية الأولاد في الإسلام - ص 412<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>الأركان الخمسة للدستور الشخصي (تكامل الوحدة الأولى):<\/b>"},{"t":"li","lvl":1,"h":"<i>الغاية والهوية:<\/i> العبودية والاستخلاف؛ <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: أحمد السيد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>لا هوية للمسلم قبل فهم مبدأ العبودية<\/blockquote><cite>أحمد السيد - ص 30<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>العقلية الناقدة:<\/i> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: أحمد السيد<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>اشتراط الدليل للقبول... والتثبت من صحته ولزومه<\/blockquote><cite>أحمد السيد - ص 41<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>مرجعية الوحي:<\/i> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: د. دراز — ص د<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>عقلية منهجية رتبتها آيات القرآن<\/blockquote><cite>د. دراز - ص د<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>حصن الفلتر:<\/i> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: د. القرضاوي<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>رد المتشابه للمحكم وسؤال أهل العلم<\/blockquote><cite>د. القرضاوي - ص 77<\/cite><\/div><\/details>"},{"t":"li","lvl":1,"h":"<i>حماية الانتباه:<\/i> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: الشيخ أبو غدة<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>الوقت هو الحياة والنفس إن لم تشغلها بالحق شغلتك بالباطل<\/blockquote><cite>الشيخ أبو غدة - ص 27<\/cite><\/div><\/details>"},{"t":"li","lvl":0,"h":"<b>ترجمة الدستور لعادات هوية (جيمس كلير):<\/b> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: العادات الذرية<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>العملية المكونة من خطوتين: 1. قرر من تريد أن تكون. 2. أثبت ذلك لنفسك بانتصارات صغيرة متكررة<\/blockquote><cite>العادات الذرية - ص 35-38<\/cite><\/div><\/details> <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس من: العادات الذرية<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>القاعدة الذهبية: لا تفوت العادة مرتين متتاليتين؛ فإذا فوتت يوماً، عد للمسار فوراً بأسرع ما يمكن<\/blockquote><cite>العادات الذرية - ص 218<\/cite><\/div><\/details>"}]},{"num":7,"title":"دليل ورشة التطبيق (التفاعل الميداني)","short":"دليل ورشة التطبيق","kind":"std","icon":"tools","blocks":[{"t":"li","lvl":0,"h":"<b>الزمن:<\/b> 20 دقيقة."},{"t":"li","lvl":0,"h":"<b>المجموعات:<\/b> 3 مجموعات (فرسان العهد، حراس الميثاق، سفراء اليقين)."},{"t":"li","lvl":0,"h":"<b>التحدي:<\/b> تسليم وثيقة فاخرة لكل فتى بعنوان: <b>\"وثيقة الدستور الشخصي وخارطة الثبات\"<\/b>."},{"t":"li","lvl":0,"h":"<b>المهمة:<\/b> صياغة وتعبئة بنود الدستور الخمسة الخاصة بكل طالب بدقة، بما يلائم واقعه مع تحديد الحد الأدنى من السلوكيات اليومية."},{"t":"li","lvl":0,"h":"<b>المخرجات:<\/b> توقيع الدساتير فردياً، وإلقاء ممثل عن كل فريق أبرز البنود وسط تشجيع واحتفاء تربوي."}]},{"num":8,"title":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","short":"الأسئلة والاعتراضات المتوقعة وتفكيكها بالبرهان العقلي والتأصيلي","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"ماذا لو خالفت بنداً في دستوري؟ هل أعتبر منافقاً ويضيع تعبي؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> إطلاقاً؛ الخطأ طبيعة بشرية، والمهم هو <b>سرعة العودة والتصحيح وعدم الاسترسال<\/b>. يقول النبي ﷺ: <span class=\"hadith\">«وأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُها»<\/span>، ويؤكد جيمس كلير في <i>العادات الذرية<\/i>: <details class=\"src inl\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">اقتباس، ص 218<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><blockquote>الخلل الأول ليس هو ما يدمرك، بل الدوامة التنازلية المكونة من تفويتات متكررة تجعلك تفقد الهوية<\/blockquote><cite>ص 218<\/cite><\/div><\/details>"}]},{"t":"qa","n":"2","q":"\"كيف أحافظ على حماسي بعد نهاية هذه اللقاءات؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> الحماس عاطفة مؤقتة لا تدوم؛ الاعتماد يكون على <b>الانضباط، والبيئة الصالحة، ومراجعة الدستور أسبوعياً<\/b> مع رفيق صالح من القاعة."}]},{"t":"qa","n":"3","q":"\"هل الدستور الشخصي قابل للتعديل؟\"","a":[{"lvl":0,"h":"<b>التفكيك:<\/b> الأصول الشرعية والغايات ثابتة لا تتغير، أما الوسائل والعادات والجداول فتُعدل وتتطور حسب ظروفك ومستواك."}]}]},{"num":9,"title":"علم الإنذار المبكر (بروتوكول الحماية والتدخل الفردي)","short":"علم الإنذار المبكر","kind":"std","icon":"alert","blocks":[{"t":"li","lvl":0,"h":"<b>مؤشرات الخطر:<\/b> نوبات جلد الذات المفرط عند التعثر، الانسحاب السريع والادعاء بأن الدستور \"حبر على ورق\"، أو العودة الفورية للمشتتات هروباً من المسؤولية."},{"t":"li","lvl":0,"h":"<b>بروتوكول التدخل:<\/b>"},{"t":"li","lvl":1,"h":"جلسة فردية هادئة تقوم على اللين ورفع روح الأمل والتيسير."},{"t":"li","lvl":1,"h":"تبسيط بنود دستوره وتقليل أعبائه ليتدرج بنسبة 1% فقط."},{"t":"li","lvl":1,"h":"ربطه برفيق صالح يعينه على الثبات ويذكره بلطف."}]},{"num":10,"title":"الفعاليات والأنشطة المصاحبة (الوثيقة المعتمدة)","short":"الفعاليات والأنشطة المصاحبة","kind":"std","icon":"card","blocks":[{"t":"li","lvl":0,"h":"<b>تمرين: وثيقة \"الدستور الشخصي وخارطة الثبات\" (تعبئة واعتماد رسمي):<\/b>"},{"t":"card","title":"وثيقة: الدستور الشخصي وخارطة الثبات","sub":"(ميثاق الحصانة والاستقامة للشاب المسلم)","lines":["أنا الشاب: (...................................)","في هذا اليوم: (..../..../........م) أعاهد الله وألزم نفسي بالميثاق التالي:","أولاً: بوصلة غايتي وهويتي:","- غايتي الكبرى: العبودية لله والاستخلاف ونفع أمتي.","- هويتي: مسلم معتز بديني، ابن عائلة كريمة، ومصلح على طريق الأنبياء.","ثانياً: عقلي وفكري الناقد:","- لا أقبل دعوى بغير دليل صحيح ثابت ولزوم منطقي قاطع.","- أبتعد عن التقليد الأعمى، والشخصنة، والأحكام السريعة.","ثالثاً: مرجعيتي ويقيني القرآني:","- القرآن الكريم هو مصدري الأول لبناء اليقين والحجة.","- ألتزم بورد تدبر يومي (10 دقائق) مستعيناً بتفسير ميسر.","رابعاً: حصانتي وفلتري الفكري:","- أرد المتشابهات إلى المحكمات القطعية.","- عند الاستشكال، أتوقف عن التداول وأسأل أهل الذكر الموثوقين.","خامساً: انتباهي ورأس مال عمري:","- عمري ثمين، وسأحمي بيئتي من الاستنزاف الرقمي.","- عادتي الذرية اليومية (1%): ..................................","توقيع الشاب الملتزم: (............................)","شاهد العهد (المربي): (............................)"]}]},{"num":11,"title":"أدوار مجلس الفتيان (التشغيل القيادي)","short":"أدوار مجلس الفتيان","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>ميقاتي الاحتفالية:<\/b> ضبط زمن فقرات الحفل والورشة."},{"t":"li","lvl":0,"h":"<b>مقرر ومنشد الميثاق:<\/b> تلاوة بنود الدستور الجماعية بأسلوب مهيب وواضح."},{"t":"li","lvl":0,"h":"<b>مسؤول التوثيق:<\/b> جمع الوثائق وتنظيم فقرة التوقيع والصورة التذكارية."}]},{"num":12,"title":"خلفية المربي والمعينات المرئية المقترحة","short":"خلفية المربي والمعينات المرئية المقترحة","kind":"std","icon":"compass","blocks":[{"t":"li","lvl":0,"h":"<b>موجهات المربي:<\/b> البشارة والتفاؤل، الاحتفاء بالنمو الفكري للطلاب، والاستمرار في المتابعة الأخوية غير المباشرة."},{"t":"li","lvl":0,"h":"<b>المعينات المرئية الإثرائية (يوتيوب):<\/b>"},{"t":"li","lvl":1,"h":"<i>للشباب والمربي:<\/i> مادة \"صناعة الأهداف والثبات على المبدأ\" - م. أيمن عبد الرحيم."},{"t":"li","lvl":1,"h":"<i>للشباب:<\/i> محاضرة \"كيف تصنع لنفسك منهاج حياة ثابتاً؟\" - أ. أحمد السيد."}]},{"num":13,"title":"الخطة الزمنية التفصيلية المجدولة (70 دقيقة)","short":"الخطة الزمنية التفصيلية المجدولة","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","","الخطاف ودرس وثيقة المدينة المنورة."],["05 - 15 د","","نبض الغرفة وخلاصة رحلة الوحدة."],["15 - 35 د","","المحتوى المعرفي (أركان الدستور وأصل المواثيق)."],["35 - 55 د","","ورشة التطبيق وتعبئة وثيقة الدستور وتوقيعها."],["55 - 65 د","","معالجة مخاوف الانتكاسة والفتن ببرهان الوحي."],["65 - 70 د","","مراسم التوقيع، وختام الوحدة الأولى."]]}]},{"num":14,"title":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","short":"المرجع التفصيلي وتوثيق الاقتباسات والمراجع الإثرائية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>توثيق الاقتباسات الأساسية:<\/b>"},{"t":"li","lvl":1,"h":"د. عبد الكريم بكار - <i>المراهق: كيف نفهمه وكيف نوجهه؟<\/i> - ص 18-19 وص 106."},{"t":"li","lvl":1,"h":"أحمد السيد - <i>إلى الجيل الصاعد<\/i> - ص 30-33 وص 41."},{"t":"li","lvl":1,"h":"د. دراز - <i>النبأ العظيم<\/i> - ص د."},{"t":"li","lvl":1,"h":"د. القرضاوي - <i>في فقه الأولويات<\/i> - ص 77."},{"t":"li","lvl":1,"h":"الشيخ أبو غدة - <i>قيمة الزمن عند العلماء<\/i> - ص 27-28."},{"t":"li","lvl":1,"h":"جيمس كلير - <i>العادات الذرية<\/i> - ص 35-38 وص 218."},{"t":"li","lvl":1,"h":"محمد الغزالي - <i>خلق المسلم<\/i> - ص 48-49."},{"t":"li","lvl":1,"h":"د. عبد الله ناصح علوان - <i>تربية الأولاد في الإسلام<\/i> - دار السلام - ص 412."},{"t":"li","lvl":1,"h":"د. أحمد عبد المنعم - <i>تفريغ معاني الرجولة في القرآن<\/i>."},{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية المعتمدة (بالصفحات):<\/b>"},{"t":"li","lvl":1,"h":"ستيفن كوفي - <i>العادات السبع للناس الأكثر فاعلية<\/i> - مكتبة جرير - (ص 95 - 130: عادة ابدأ والغاية في ذهنك وصياغة الدستور الشخصي)."},{"t":"li","lvl":1,"h":"د. راغب السرجاني - <i>فن صناعة القائد<\/i> - مؤسسة اقرأ - (ص 80 - 115: مهارات الثبات على المبدأ والوفاء بالمواثيق)."}]},{"num":15,"title":"التكليف العملي السلوكي (تطبيق واقعي مستمر)","short":"التكليف العملي السلوكي","kind":"std","icon":"flag","blocks":[{"t":"li","lvl":0,"h":"<b>تثبيت الوثيقة:<\/b> تعليق وثيقة \"الدستور الشخصي\" في مكان بارز بغرفة الفتى (فوق المكتب أو عند السرير) لتكون مذكراً دائماً له."},{"t":"li","lvl":0,"h":"<b>محطة الجمعة:<\/b> تخصيص 10 دقائق عصر كل جمعة لمراجعة مدى الالتزام بالدستور ومحاسبة النفس دون جلد مفرط."}]},{"num":16,"title":"مؤشر قياس الأثر الميداني (معايير تحقق الوعي لدى الطالب)","short":"مؤشر قياس الأثر الميداني","kind":"std","icon":"chart","blocks":[{"t":"li","lvl":0,"h":"<b>الاستقامة الذاتية:<\/b> المحافظة على الفرائض واستثمار الوقت بدافع ذاتي دون حاجة لرقابة خارجية مستمرة."},{"t":"li","lvl":0,"h":"<b>الصلابة الفكرية:<\/b> الثبات على المبادئ والقيم أمام الشبهات وضغوط الأقران."},{"t":"li","lvl":0,"h":"<b>سرعة التدارك عند العثرة:<\/b> غياب اليأس، والعودة المباشرة إلى المسار القويم فور وقوع أي تقصير بفضل مرونة الدستور وصدق اليقين."}]}]}]},{"n":2,"title":"صناعة الذات وهندسة العادات","c":"amber","lessons":[{"id":"2-1","ordinal":"الأول","title":"قوة التحسين المستمر","sub":"أثر الـ 1% والتراكم الإيجابي في بناء الشخصية","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثانية: صناعة الذات وهندسة العادات"],["عنوان اللقاء","قوة التحسين المستمر (أثر الـ 1% والتراكم الإيجابي في بناء الشخصية)"],["الرمز الكودي","U2-L1-HAB"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","ورشة عمل حوارية تفاعلية ومختبر استدلالي (تيسير تشاركي بعيداً عن التلقين والوعظ المباشر)"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> التحول العظيم في الشخصية وبناء القوة الإيمانية والأخلاقية لا يحدث عبر الاندفاعات البركانية الفجائية المؤقتة، بل يتشكل عبر <b>\"قانون التراكم والتحسين المستدرج بنسبة 1% يومياً\"<\/b>؛ حيث تتحول الأفعال الذرية البسيطة المواظَب عليها إلى هوية راسخة ورأس مال إيماني وسلوكي غير قابل للانكسار."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يفكك الفتى المعالجة الرياضية والسلوكية لقانون الـ 1%، ويستوعب الفارق بين \"أوهام النتائج الفورية\" و\"حقيقة التراكم التنازلي والتصاعدي\"."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى الأمل والطمأنينة الإيمانية، ويتخلص من مشاعر جلد الذات والإحباط الناجمة عن \"المثالية الصارمة\" أو الاستهانة بالخطوات الصغيرة."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن يصمم الفتى \"عادة ذرية واحدة (1%)\" في حياته، ويطبقها عبر \"قاعدة الدقيقتين\" يومياً دون انقطاع طوال الأسبوع."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي الجلسة بطرح هذا السؤال المفاجئ والمحدد دون تمهيد، ليقيس طريقة تفكير الطلاب:"},{"t":"p","lvl":0,"h":"<b>\"لو عُرض عليك الآن الاختيار بين خيارين محددين:<\/b>"},{"t":"li","lvl":0,"h":"<b>الخيار (أ):<\/b> أن تتلقى اليوم فوراً مبلغ <b>3 ملايين دولار نقداً<\/b>."},{"t":"li","lvl":0,"h":"<b>الخيار (ب):<\/b> أن تتلقى <b>قرشاً واحداً فقط (سنت)<\/b> يتضاعف حجمه يومياً بنسبة 100% (اليوم الأول: سنت، اليوم الثاني: سنتان، اليوم الثالث: 4 سنتات...) لمدة 31 يوماً."},{"t":"p","lvl":0,"h":"<b>أيهما تختار فوراً وبلا تردد؟ ولماذا؟\"<\/b>"},{"t":"li","lvl":0,"h":"<b>تشخيص المربي لذهنية الفتيان:<\/b> سيتجه أغلب الفتيان نحو الخيار (أ) بدافع جاذبية \"النتيجة الضخمة السريعة\"، بينما يزهدون في القرش الصغير المتضاعف."},{"t":"li","lvl":0,"h":"<b>الترشيد الميسر:<\/b> القرش المتضاعف يومياً يصل في اليوم الـ 31 إلى أكثر من <b>10.7 مليون دولار! (10,737,418.24 $)<\/b>؛ أي أكثر من ثلاثة أضعاف الخيار الأول. عقولنا لا تستوعب قوة \"التراكم الهندسي المركّب\" في بداياته الهادئة، وهكذا تماماً تنمو العادات والتقوى والشخصية، أو تنهار بالتدريج!"}]},{"num":4,"title":"الخطاف الحواري (The Hook — معضلة اندفاعة زياد وسكون رامي)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"يعرض المربي القصة الواقعية التالية على الشاشة أو في بطاقات حوارية:"},{"t":"p","lvl":0,"h":"<span class=\"lbl\">معضلة النادي الرياضي وتحدي الـ 100 ضغط<\/span>"},{"t":"p","lvl":0,"h":"- زياد (16 سنة): استيقظ يوم الأحد بحماس عارم إثر مشاهدة مقطع تحفيزي، فذهب للنادي وأدى 100 تمرين ضغط دفعة واحدة حتى تمزقت عضلاته. في اليوم التالي استلقى في الفراش عاجزاً من شدة الألم، وشعر بالإحباط، وتوقف تماماً بقية الشهر!"},{"t":"p","lvl":0,"h":"- رامي (16 سنة): قرر أن يبدأ بتمرين ضغط واحد فقط (1) يومياً بعد صلاة الفجر، مع زيادة تمرين واحد فقط أسبوعياً بشرط ألا يقطع يوماً واحداً."},{"t":"p","lvl":0,"h":"- الإشكالية للحوار:"},{"t":"p","lvl":0,"h":"بعد مرور 6 أشهر.. من منهما يملك الجسد الأقوى؟ ومن منهما يملك \"هوية الشاب الرياضي\"؟ ولماذا نكرر جميعاً سلوك زياد في دراستنا وصلاتنا وعلاقتنا مع الله ثم ننتكس؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ﴾<\/span> <span class=\"ayref\">العنكبوت: 69<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> صيغة الفعل الماضي المقرون بالاستمرار تدل على بذل الجهد اليومي الدؤوب؛ فالهداية التامة والتوفيق الإلهي ثمرة متراكمة لمجاهدة النفس في صغائر الأعمال وكبائرها."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ * وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ﴾<\/span> <span class=\"ayref\">الزلزلة: 7-8<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> أرست الشريعة معيار \"الذرة\" في بناء الشخصية؛ فلا يُحقرن عمل يسير دائم (كصفحة من كتاب أو ركعة خفيفة)، ولا يُستهان بهفوة يسيرة؛ فإن الجبال الشاهقة أصلها حصى متراكم."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أم المؤمنين عائشة رضي الله عنها:<\/b> أن رسول الله ﷺ سُئل: أَيُّ الأَعْمَالِ أَحَبُّ إِلَى اللهِ؟ قَالَ: <span class=\"hadith\">«أَدْوَمُهَا وَإِنْ قَلَّ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الرقاق، باب القصد والمداومة على العمل، برقم 6465؛ وصحيح مسلم: كتاب صلاة المسافرين وقصرها، برقم 783<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل الفقهي والتربوي:<\/i> المداومة على القليل الثابت مقدمة في الميزان الرباني على الكثير المنقطع؛ لأن القليل الدائم يربي النفس على العبودية الثابتة والانضباط الذاتي."},{"t":"li","lvl":0,"h":"<b>حديث أبي هريرة رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«سَدِّدُوا وَقَارِبُوا، وَاعْلَمُوا أَنْ لَنْ يُدْخِلَ أَحَدَكُمْ عَمَلُهُ الجَنَّةَ، وَأَنَّ أَحَبَّ الأَعْمَالِ إِلَى اللهِ أَدْوَمُهَا وَإِنْ قَلَّ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الرقاق، باب القصد والمداومة، برقم 6467<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> \"السداد والمقاربة\" هما المنهج النبوي لكسر وهم المثالية الصارمة التي تورث الانقطاع والانبتات."},{"t":"li","lvl":0,"h":"<b>حديث أبي ذر رضي الله عنه:<\/b> قال لي النبي ﷺ: <span class=\"hadith\">«لاَ تَحْقِرَنَّ مِنَ المَعْرُوفِ شَيْئًا، وَلَوْ أَنْ تَلْقَى أَخَاكَ بِوَجْهٍ طَلْقٍ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح مسلم: كتاب البر والصلة والآداب، برقم 2626<\/cite><\/div><\/details>."},{"t":"p","lvl":0,"h":"<b>ثالثاً: مواقف من سير الأنبياء والصحابة رضي الله عنهم:<\/b>"},{"t":"li","lvl":0,"h":"<b>موقف النبي ﷺ مع عبد الله بن عمرو بن العاص رضي الله عنهما:<\/b> حين دخل في عبادة مجهدة وأراد صيام الدهر وختم القرآن كل ليلة، فردّه النبي ﷺ بالتدريج إلى القصد والاعتدال، حتى قال عبد الله لما أسنّ وعجز: <i>\"يا ليتني قبلت رخصة رسول الله ﷺ\"<\/i>، وقوله ﷺ له: <span class=\"hadith\">«يَا عَبْدَ اللهِ، لاَ تَكُنْ مِثْلَ فُلاَنٍ كَانَ يَقُومُ اللَّيْلَ فَتَرَكَ قِيَامَ اللَّيْلِ»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب التهجد، باب ما يكره من ترك قيام الليل لمن كان يقومه، برقم 1152<\/cite><\/div><\/details>."},{"t":"li","lvl":0,"h":"<b>أثر أم المؤمنين عائشة رضي الله عنها في التدرج التشريعي:<\/b> <span class=\"qt\">«إِنَّمَا نَزَلَ أَوَّلَ مَا نَزَلَ مِنْهُ سُورَةٌ مِنَ المُفَصَّلِ، فِيهَا ذِكْرُ الجَنَّةِ وَالنَّارِ، حَتَّى إِذَا ثَابَ النَّاسُ إِلَى الإِسْلاَمِ نَزَلَ الحَلاَلُ وَالحَرَامُ، وَلَوْ نَزَلَ أَوَّلَ شَيْءٍ: لاَ تَشْرَبُوا الخَمْرَ، لَقَالُوا: لاَ نَدَعُ الخَمْرَ أَبَدًا»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب فضائل القرآن، باب تأليف القرآن، برقم 4993<\/cite><\/div><\/details>. وهذا أصل تشريعي وتربوي في بناء العادات وتغيير السلوك عبر المدارجة."}]},{"num":6,"title":"تفكيك المفاهيم والمحتوى الحواري (محاور للنقاش)","short":"تفكيك المفاهيم والمحتوى الحواري","kind":"std","icon":"layers","blocks":[{"t":"p","lvl":0,"h":"<b>المحور الأول: خديعة الاندفاع الفوري وقانون الـ 1% (Mathematics of Habits)<\/b>"},{"t":"li","lvl":0,"h":"بيان المعالجة الحسابية لأثر التراكم:"},{"t":"li","lvl":1,"h":"<b>معادلة النمو الإيجابي:<\/b> (1.01)<sup>365<\/sup> = 37.78 (التحسن بنسبة 1% يومياً يطور قدراتك بمقدار <b>38 ضعفاً<\/b> خلال عام واحد!)."},{"t":"li","lvl":1,"h":"<b>معادلة التراجع والضمور:<\/b> (0.99)<sup>365<\/sup> = 0.03 (التراجع بنسبة 1% يومياً ينحدر بك نحو <b>الصفر<\/b> تقريباً خلال عام!)."},{"t":"li","lvl":0,"h":"ربط ذلك بالبناء الذاتي: قراءة 4 صفحات يومياً تختم بها أكثر من 7 كتب تأسيسية في العام دون إجهاد."},{"t":"p","lvl":0,"h":"<b>المحور الثاني: هضبة الإمكانات الكامنة ووادي الإحباط (The Plateau of Latent Potential)<\/b>"},{"t":"li","lvl":0,"h":"تحليل سر توقف الشباب في المنتصف: يتوقع الشاب أن نتائج جهده ستظهر في مسار خطي صاعد ومباشر، بينما تكمن النتائج الحقيقية تحت الأرض وتتراكم، كبذور \"نبات الخيزران الصيني\" التي تظل تسقى تحت الأرض 5 سنوات دون أن ترى ساقاً، ثم تنمو بطول 90 قدماً في 6 أسابيع فقط بمجرد اكتمال الجذور."},{"t":"p","lvl":0,"h":"<b>المحور الثالث: أوهام \"الأهداف الكبيرة\" في مقابل قوة \"الأنظمة اليومية\"<\/b>"},{"t":"li","lvl":0,"h":"الفارق بين <b>الهدف<\/b> (محطة الوصول المنشودة) و<b>النظام<\/b> (الطقوس والسلوكيات الذرية الصغرى اليومية)."},{"t":"li","lvl":0,"h":"الركض خلف الهدف المجرد دون نظام يومي يورث القلق والعجز، بينما التركيز على النظام الذري يمنح الرضا والإنجاز المستمر."}]},{"num":7,"title":"بنك الأسئلة الجدلية ودليل الميسر","short":"بنك الأسئلة الجدلية ودليل الميسر","kind":"qa","icon":"q","blocks":[{"t":"qa","n":"1","q":"\"أليس البدء بخطوة يسيرة كقراءة صفحة واحدة أو تمرين لدقيقتين تماطلاً ورضا بالدونية؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> الغاية الأولى ليست حجم النتيجة الظاهرة، بل <b>\"تثبيت عادة الحضور والهوية في الدماغ\"<\/b>. العادة التي لا وجود لها أصلاً يستحيل تحسينها! دقيقتان يومياً ترسخ هويتك كشاب قارئ أو رياضي، والتوسيع يأتي لاحقاً بصورة تلقائية."}]},{"t":"qa","n":"2","q":"\"ألا تتطلب المعالي والريادة طفرات كبرى وقفزات استثنائية بدلاً من هذه الخطوات البطيئة؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> القفزات الكبيرة دون أنظمة حماية تنتهي غالباً بالانكسار. العلماء الكبار والمبدعون صُنعت إنجازاتهم من خلال آلاف الساعات الهادئة وغير المرئية من الانضباط في الأساسيات، لا عبر ومضات الحماس المؤقت."}]},{"t":"qa","n":"3","q":"\"إذا انكسرت العادة يوماً بسبب ظرف قاهر، هل يضيع التراكم وأبدأ من الصفر؟\"","a":[{"lvl":0,"h":"<i>دليل الميسر:<\/i> يُرشد المربي لتطبيق <b>\"القاعدة الذهبية: لا تفوت العادة مرتين متتاليتين أبداً\"<\/b>. التفويت لمرة واحدة عارض بشري طبيعي، أما التفويت المتتالي فهو تأسيس لعادة سلبية بديلة. إذا تعثرت يوماً، عُد في اليوم التالي ولو بالحد الأدنى الذري."}]}]},{"num":8,"title":"أدوار مجلس الفتيان في الجلسة","short":"أدوار مجلس الفتيان في الجلسة","kind":"std","icon":"people","blocks":[{"t":"li","lvl":0,"h":"<b>الميسر الشاب:<\/b> إدارة نوبات المداخلات وضمان مشاركة الجميع."},{"t":"li","lvl":0,"h":"<b>المدوّن:<\/b> تسجيل معادلات التراكم والمفاهيم المحورية على السبورة."},{"t":"li","lvl":0,"h":"<b>المعارض (محامي الشيطان):<\/b> طرح إشكالات الواقع وتحديات الالتزام اليومي."},{"t":"li","lvl":0,"h":"<b>ضابط الوقت (الميقاتي):<\/b> إدارة توقيت الفقرات بدقة."}]},{"num":9,"title":"المختبر العملي / المحاكاة داخل القاعة","short":"المختبر العملي / المحاكاة داخل القاعة","kind":"std","icon":"flask","blocks":[{"t":"p","lvl":0,"h":"<b>تمرين: \"مختبر المكعبات وهندسة التراكم\"<\/b>"},{"t":"li","lvl":0,"h":"<b>الأدوات:<\/b> 100 مكعب صغير."},{"t":"li","lvl":0,"h":"<b>إجراء المحاكاة:<\/b> يُقسم الفتيان إلى فريقين:"},{"t":"li","lvl":1,"h":"<b>فريق الطفرة (فريق زياد):<\/b> يُطلب منهم بناء برج شاهق من 50 مكعباً خلال 10 ثوانٍ فقط وبأعلى سرعة ممكنة."},{"t":"li","lvl":1,"h":"<b>فريق التراكم (فريق رامي):<\/b> يُطلب منهم وضع مكعب واحد كل 3 ثوانٍ بتأنٍ وثبات متزن على مدار دقيقتين."},{"t":"li","lvl":0,"h":"<b>النتيجة والربط التربوي:<\/b> برج فريق الطفرة ينهار سريعاً لانعدام الاتزان، بينما يكتمل برج فريق التراكم بقوة وثبات. هكذا تبنى شخصية الشاب: الاندفاع العاجل يهدم الجهد، والتراكم الهادئ يصنع المتانة."}]},{"num":10,"title":"دراسة حالة واقعية","short":"دراسة حالة واقعية","kind":"std","icon":"case","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">دراسة حالة: ياسين وعقدة بدايات العام الدراسي<\/span>"},{"t":"p","lvl":0,"h":"ياسين شاب في الصف الثاني الثانوي، يتملكه حماس مفرط مع بداية كل عام دراسي؛ فيشتري دفاتر فاخرة ويضع جدولاً صارماً:"},{"t":"p","lvl":0,"h":"(الاستيقاظ 4:30 صباحاً، مذاكرة 6 ساعات يومياً، حفظ جزء شهرياً، وجري 5 كم يومياً)."},{"t":"p","lvl":0,"h":"يطبق ياسين هذا الجدول بنجاح لمدة 3 أيام وهو في قمة النشوة. وفي اليوم الرابع، يستيقظ متعباً فيفوّت الجدول، ويصاب بجلد الذات واليأس، قائلاً: \"انكسر النظام، ولا فائدة مني!\"، فيتوقف كلياً عن الدراسة والرياضة، ويقضي بقية الفصل في التسويف والتصفح الرقمي!"},{"t":"p","lvl":0,"h":"أسئلة التفكيك الجماعي:"},{"t":"p","lvl":0,"h":"1. ما الخلل المنهجي في تصميم عقلية ونظام ياسين؟"},{"t":"p","lvl":0,"h":"2. أعد صياغة خطة ياسين باستخدام \"قواعد التراكم والـ 1% وقاعدة الدقيقتين\"."}]},{"num":11,"title":"الجدول الزمني التكتيكي (70 دقيقة)","short":"الجدول الزمني التكتيكي","kind":"time","icon":"clock","blocks":[{"t":"timeline","rows":[["00 - 05 د","نبض الغرفة","طرح معضلة الملايين الثلاثة مقابل القرش المتضاعف."],["05 - 15 د","الخطاف الحواري","عرض قصة زياد ورامي (تحدي الـ 100 ضغط) وتفكيك المفاهيم."],["15 - 30 د","التأصيل الشرعي والمفاهيمي","استعراض آيات التراكم، وأحاديث المداومة، وسير الصحابة والأنبياء."],["30 - 45 د","المختبر ودراسة الحالة","محاكاة المكعبات وتفكيك حالة ياسين في مجموعات العمل."],["45 - 55 د","بنك الأسئلة الجدلية","تفكيك الاعتراضات والشبهات مع الميسر ومحامي الشيطان."],["55 - 65 د","تصميم التحدي الأسبوعي","تعبئة بطاقة الطالب وتحديد العادة الذرية (1%) لكل شاب."],["65 - 70 د","الختام والتقييم","مراجعة المخرجات وتوزيع الأدوار للقاء القادم."]]}]},{"num":12,"title":"التوثيق والاقتباسات من المراجع المعتمدة","short":"التوثيق والاقتباسات من المراجع المعتمدة","kind":"sources","icon":"src","blocks":[{"t":"srcs","items":[{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 15","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«إن التحسن بنسبة 1% كل يوم لا يبدو ملاحَظاً في الغالب... والتغير الذي يمكن أن يحدثه تحسن بنسبة 1% بمرور الوقت هو تغير مذهل»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 16","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«العادات هي الفائدة المركبة للتطوير الذاتي... أثر عاداتك يتضاعف مع تكرارها»<\/span>."},{"t":"src","cite":"العادات الذرية - جيمس كلير - ص 218","short":"العادات الذرية — جيمس كلير","q":"<span class=\"qt\">«القاعدة الذهبية: لا تفوت العادة مرتين متتاليتين أبداً؛ فإذا فوت يوماً ما، حاول أن تعود إلى المسار الصحيح بأسرع ما يمكن»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 23","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«نحن بحاجة إلى الانفكاك عن المفهوم المادي الضيق للمصطلح المختزل للنجاح، وإعادة تعريفه ليتوافق مع التصور الإسلامي للحياة»<\/span>."},{"t":"src","cite":"إلى الجيل الصاعد - أحمد السيد - ص 27","short":"إلى الجيل الصاعد — أحمد السيد","q":"<span class=\"qt\">«التركيز على العمل الإيجابي المتدرج البصير، والاشتغال بالبناء اليومي، هو الحصن الذي يحمي الشاب من مشاعر اليأس والإحباط»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 27-28","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«إن الوقت هو الحياة... وقد كان العلماء أشد شيء حرصاً على أوقاتهم؛ لعلمهم أن النفس إن لم تشغلها بالحق شغلتك بالباطل»<\/span>."},{"t":"src","cite":"قيمة الزمن عند العلماء - عبد الفتاح أبو غدة - ص 45","short":"قيمة الزمن عند العلماء — عبد الفتاح أبو غدة","q":"<span class=\"qt\">«ينبغي للإنسان أن يعرف شرف زمانه وقدر وقته، فلا يذهب منه لحظة في غير قربة، ويقدم الأفضل فالأفضل»<\/span>."},{"t":"src","cite":"في فقه الأولويات - يوسف القرضاوي - ص 101","short":"في فقه الأولويات — يوسف القرضاوي","q":"<span class=\"qt\">«أن يكون العمل أدوم: ومعنى الأدم أن يداوم عليه فاعله ويواظب عليه، بخلاف العمل الذي يقع منه بعض المرات في بعض الأوقات»<\/span>."},{"t":"src","cite":"المراهق كيف نفهمه وكيف نوجهه - عبد الكريم بكار - ص 106","short":"المراهق كيف نفهمه وكيف نوجهه — عبد الكريم بكار","q":"<span class=\"qt\">«إن المراهق يحتاج إلى مساعدة مستمرة في تنظيم حياته وحسم خياراته؛ لأن ضعف خبرته وتصارع الأشواق في داخله يجعلانه يتردد كثيراً»<\/span>."},{"t":"src","cite":"خلق المسلم - محمد الغزالي - ص 85-86","short":"خلق المسلم — محمد الغزالي","q":"<span class=\"qt\">«الصبر في الإسلام شجاعة نفسية وقوة إرادة تكبح جماح الهوى... وبدون الصبر على الطاعة والصبر عن المعصية لا يستقيم للمسلم خلق»<\/span>."},{"t":"src","cite":"تربية الأولاد في الإسلام - عبد الله ناصح علوان - ص 412","short":"تربية الأولاد في الإسلام — عبد الله ناصح علوان","q":"<span class=\"qt\">«تربية الأولاد في الإسلام تقوم على تعويدهم تحمل المسؤولية... فإن الشاب متى ما أحس بأنه صاحب عهد ومسؤول عنه استيقظت فيه روح الرجولة»<\/span>."},{"t":"src","cite":"تفريغ: معاني الرجولة في القرآن - أحمد عبد المنعم","short":"تفريغ: معاني الرجولة في القرآن — أحمد عبد المنعم","q":"<span class=\"qt\">«الرجولة صفة إيمانية قائمة على العبادة والدعوة والثبات والتدرج في طريق الله»<\/span>."}]}]},{"num":13,"title":"المراجع الإثرائية والوسائط الإضافية","short":"المراجع الإثرائية والوسائط الإضافية","kind":"sources","icon":"src","blocks":[{"t":"li","lvl":0,"h":"<b>المراجع الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<i>صيد الخاطر<\/i> — ابن الجوزي (فصل: حفظ أوقات العمر والتدرج في الطاعات، ص 120-122)."},{"t":"li","lvl":1,"h":"<i>المشوق إلى القراءة وطلب العلم<\/i> — علي العمران (فصل: تراكم القراءة اليومية وأثر الصفحة والصفحتين، ص 45-50)."},{"t":"li","lvl":0,"h":"<b>الوسائط المرئية الإثرائية:<\/b>"},{"t":"li","lvl":1,"h":"<b>مقطع كرتوني تفاعلي:<\/b> \"أثر التغيرات الصغيرة - مراجعة كتاب العادات الذرية\" — قناة <i>علي وكتاب<\/i> على يوتيوب (تفكيك المعادلة الرياضية للـ 1%)."},{"t":"li","lvl":1,"h":"<b>مقطع تأصيلي تربوي:<\/b> \"فقه المداومة والتدرج في بناء النفس والشخصية\" — الشيخ أحمد السيد (برنامج <i>البناء المنهجي<\/i> على يوتيوب)."}]},{"num":14,"title":"التحدي الأسبوعي الميداني (تحدي الـ 1% وقاعدة الدقيقتين)","short":"التحدي الأسبوعي الميداني","kind":"std","icon":"flag","blocks":[{"t":"card","title":"تحدي الأسبوع: \"قاعدة الدقيقتين والـ 1%\"","sub":"","lines":["المهمة الميدانية المطلوبة:","1. اختيار عادة ذرية إيجابية واحدة فقط:","[ ] قراءة قرآن (صفحتان يومياً بعد الفجر).","[ ] لياقة بدنية (5 تمارين ضغط يومياً).","[ ] قراءة حرة نافعة (3 صفحات يومياً).","[ ] أذكار الاستيقاظ والنوم (دقيقتان يومياً).","2. الشروط الإلزامية:","- تطبيق قاعدة الدقيقتين: أداء العادة في نفس الزمان والمكان فوراً دون زيادة أول 3 أيام.","- قاعدة عدم التفويت مرتين: في حال التعثر الطارئ، تلزم نفسك بالعودة في اليوم التالي حتماً.","3. التدوين: توثيق التنفيذ في جدول بطاقة الطالب اليومية."]}]},{"num":15,"title":"مصفوفة قياس الأثر السلوكي للمربي","short":"مصفوفة قياس الأثر السلوكي للمربي","kind":"matrix","icon":"chart","blocks":[{"t":"matrix","head":["المعيار السلوكي","مستوى (مبتدئ)","مستوى (متوسط)","مستوى (متمكن ومتميز)"],"rows":[["فهم التحسين المستمر","يتمسك بالأهداف الصدمية الكبرى ويستصغر البدايات الذرية.","يستوعب أثر الـ 1% نظرياً لكنه يتعجل النتائج ويحزن لبطئها.","يتبنى عقلية &quot;التراكم الذري&quot; ويستمتع بالخطوات اليومية الصغيرة."],["التعامل مع التعثر","ينقطع تماماً ويصاب بالإحباط وجلد الذات عند أول عارض.","يتدارك التفويت بعد 3 إلى 4 أيام مع تردد وتثاقل.","يطبق قاعدة &quot;عدم التفويت مرتين&quot; ويعود للمسار في اليوم التالي مباشرة."],["الاستمرارية والمداومة","ينقطع بعد يومين أو ثلاثة من فورة الحماس.","يستمر لمدة أسبوع مع حاجته للتذكير والتحفيز الخارجي.","يواظب على عادته طوال الأسبوع بدافع وانضباط ذاتي كامل."]]}]},{"num":16,"title":"بطاقة الطالب المركزة (One-Pager Handout)","short":"بطاقة الطالب المركزة","kind":"handout","icon":"card","blocks":[{"t":"card","title":"بطاقة الشاب الموقن: قوة التحسين المستمر (1%)","sub":"","lines":["💡 البوصلة والمفهوم:","لا تنتظر القفزات البركانية الفجائية لتصنع ذاتك! الشخصية المتينة ثمرة \"التراكم الرياضي للـ 1% اليومية\". القرش المتضاعف يتفوق على ملايين الاندفاع السريع، والأفعال الذرية الصغرى يصنع الله بها العظائم.","📖 الآية المحورية:","<span class=\"ayah\">﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ﴾<\/span> <span class=\"ayref\">العنكبوت: 69<\/span>.","مِشكاة النبوة:","قال رسول الله ﷺ: <span class=\"hadith\">«أَحَبُّ الأَعْمَالِ إِلَى اللهِ أَدْوَمُهَا وَإِنْ قَلَّ»<\/span> <span class=\"takh\">[صحيح البخاري ومسلم]<\/span>.","📐 المعادلة الرياضية للتحول الشخصي:","(1.01)^365 = 37.78  =====&gt; (نمو بمقدار 38 ضعفاً بـ 1% إيجابية يومياً)","(0.99)^365 = 0.03   =====&gt; (انحدار شبه تام نحو الصفر بـ 1% إهمال يومياً)","—hr—","🎯 قواعد التراكم الذري الثلاث:","1. العادة التي لا وجود لها أصلاً لا يمكن تحسينها (ابدأ بدقيقتين وثبّت الحضور أولاً).","2. ركز على \"أنظمة السلوك اليومي\" وتجاوز الانشغال الذهني بـ \"النتائج البعيدة\".","3. القاعدة الذهبية: \"لا تفوت العادة مرتين متتاليتين أبداً\".","—hr—","📝 جدول تتبع تحدي الأسبوع (ضع ✓ أمام اليوم المنجز):","[ السبت ]  [ الأحد ]  [ الاثنين ]  [ الثلاثاء ]  [ الأربعاء ]  [ الخميس ]  [ الجمعة ]","(   )      (   )      (    )       (    )       (    )       (   )      (   )","عهد الفتى المسلم: \"أنا شاب مسلم ابن أمة رسالية، أبني نفسي لبنةً لبنةً بثبات ويقين\"."]}]}]},{"id":"2-2","ordinal":"الثاني","title":"هندسة البيئة والمحيط","sub":"أثر الصحبة، الأماكن، والمدخلات الرقمية في تشكيل الهوية","sections":[{"num":1,"title":"بطاقة اللقاء والرمز الكودي","short":"بطاقة اللقاء والرمز الكودي","kind":"meta","icon":"id","blocks":[{"t":"kvs","items":[["اسم الوحدة","الوحدة الثانية: صناعة الذات وهندسة العادات"],["عنوان اللقاء","هندسة البيئة والمحيط (أثر الصحبة، الأماكن، والمدخلات الرقمية في تشكيل الهوية)"],["الرمز الكودي","U2-L2-ENV"],["الفئة المستهدفة","الفتيان (15 - 18 سنة / المرحلة الثانوية)"],["نمط اللقاء","مختبر هندسة سلوكية ومكانية وورشة عمل تفاعلية"],["المدى الزمني","70 دقيقة كاملة"]]}]},{"num":2,"title":"الفكرة الجوهرية والأهداف","short":"الفكرة الجوهرية والأهداف","kind":"std","icon":"target","blocks":[{"t":"li","lvl":0,"h":"<b>الفكرة الجوهرية:<\/b> قوة الإرادة والعزيمة المجردة خط دفاع أخير سريع الاستنزاف، بينما <b>\"هندسة البيئة والمحيط\"<\/b> (انتقاء الرفقة، تصميم المكان، وتصفية المشتتات الرقمية) هي خط الدفاع الأول والأصلب. من يربط استقامته بالإرادة وحدها يُهزم أمام المحفزات الملوثة، ومن يهندس بيئته يجعل فعل الطاعة مرئياً وسهلاً، وفعل المعصية والكسل خفياً وشاقاً."},{"t":"li","lvl":0,"h":"<b>الأهداف التشغيلية:<\/b>"},{"t":"li","lvl":1,"h":"<b>الهدف المعرفي:<\/b> أن يستوعب الفتى قانوني تغيير السلوك (جعل الإشارة مرئية/خفية، وجعل الفعل سهلاً/صعباً)، ويدرك أثر عدوى السلوك والدوبامين من خلال البيئة الرقمية والأقران."},{"t":"li","lvl":1,"h":"<b>الهدف الوجداني:<\/b> أن يستشعر الفتى المسؤولية والاعتزاز بضبط حيزه الشخصي، متحرراً من وهم الصمود الذاتي المزعوم داخل بيئة مشوهة."},{"t":"li","lvl":1,"h":"<b>الهدف السلوكي:<\/b> أن ينفذ الفتى خطة \"تطهير بيئي ثلاثية\": تنظيم حيز المذاكرة والنوم، تصفية المتابعات والإشعارات في الهاتف، واختيار \"صديق مبادرة\" للمساءلة والمرافقة الإيجابية."}]},{"num":3,"title":"نبض الغرفة (سؤال كاشف لذهنية الفتيان قبل البدء)","short":"نبض الغرفة","kind":"std","icon":"pulse","blocks":[{"t":"p","lvl":0,"h":"يفتتح المربي الجلسة بطرح هذا النموذج المقارن:"},{"t":"p","lvl":0,"h":"<b>\"تخيل شابين يحملان نفس المستوى من الإيمان والرغبة في التفوق والمحافظة على الصلاة:<\/b>"},{"t":"li","lvl":0,"h":"<b>الشاب (أ):<\/b> يضع هاتفه بجوار رأسه عند النوم، ويترك إشعارات الألعاب والمجموعات مفتوحة، ويضع كتبه في غرفة المعيشة المزدحمة، ويصادق أفراداً يستهينون بالصلاة والجدية."},{"t":"li","lvl":0,"h":"<b>الشاب (ب):<\/b> يشحن هاتفه خارج الغرفة كلياً، ويجعل مكتبه مواجهاً للحائط خالياً من الشاشات، ويلغي الإشعارات، ويرتبط برفيق يذكره بالصلاة والمذاكرة."},{"t":"p","lvl":0,"h":"<b>إذا انخفضت طاقتهما النفسية في يوم مجهد؛ أيهما سينتكس ويفشل حتماً؟ ولماذا نضع المحفزات المغرية تحت وسائدنا وننتظر من إرادتنا المعجزات؟\"<\/b>"}]},{"num":4,"title":"الخطاف الحواري (The Hook — معضلة تفخيخ البيئة وتجربة المقاومة المستنزفة)","short":"الخطاف الحواري","kind":"std","icon":"hook","blocks":[{"t":"p","lvl":0,"h":"<span class=\"lbl\">معضلة أمين: هل الإرادة ضعيفة أم أن البيئة مفخخة؟<\/span>"},{"t":"p","lvl":0,"h":"أمين (17 سنة) يعاني من تأخر دراسي وتفويت لصلاة الفجر، ويشعر بالذنب والخذلان. عاهد نفسه ليلة الأحد أن يبدأ \"صفحة جديدة\" وأقسم أنه سيذاكر 4 ساعات وسيستيقظ لصلاة الفجر."},{"t":"p","lvl":0,"h":"واقع غرفة أمين وبيئته:"},{"t":"p","lvl":0,"h":"1. مكتب المذاكرة مغطى بأشرطة الألعاب، وعلب المشروبات، وتوصيلات الأجهزة."},{"t":"p","lvl":0,"h":"2. الهاتف يصدر رنيناً واهتزازاً كل 20 ثانية لمجموعات الألعاب."},{"t":"p","lvl":0,"h":"3. شاشة التلفاز تنقل مباراة حماسية في الصالة الملاصقة لغرفته والباب مفتوح."},{"t":"p","lvl":0,"h":"النتيجة: بعد 25 دقيقة من مدافعة النفس واستنزاف الإرادة، استسلم أمين، والتقط الهاتف، وسهر حتى الثالثة والنصف فجراً، فضاعت صلاته وتأجلت دراسته!"},{"t":"p","lvl":0,"h":"سؤال النقاش:"},{"t":"p","lvl":0,"h":"أمين يجلس حزيناً ويلوم نفسه قائلاً: \"أنا عديم الإرادة وضعيف الإيمان!\".."},{"t":"p","lvl":0,"h":"هل أزمة أمين الحقيقية في ضعف إرادته؟ أم أن محيطه هُندس ببراعة لتهزم إرادته؟"}]},{"num":5,"title":"التأصيل الشرعي","short":"التأصيل الشرعي","kind":"std","icon":"book","blocks":[{"t":"p","lvl":0,"h":"<b>أولاً: القرآن الكريم ووجه الاستدلال السلوكي:<\/b>"},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَن ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا﴾<\/span> <span class=\"ayref\">الكهف: 28<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> لم يكتفِ التوجيه الرباني بالأمر بالصبر المجرد، بل قرنه بـ <b>\"هندسة البيئة الاجتماعية\"<\/b> (مع الذين يدعون ربهم)، وحذر من مساحات الغفلة؛ لأن العين والقلب يتشكلان بما يديم النظر إليه ومجالسته."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿وَقَدْ نَزَّلَ عَلَيْكُمْ فِي الْكِتَابِ أَنْ إِذَا سَمِعْتُمْ آيَاتِ اللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا مَعَهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ إِنَّكُمْ إِذًا مِّثْلُهُمْ﴾<\/span> <span class=\"ayref\">النساء: 140<\/span>."},{"t":"li","lvl":1,"h":"<i>وجه الاستدلال السلوكي:<\/i> تقرير قرآني حاسم لقانون \"العدوى السلوكية\"؛ فالبقاء في البيئة الموبوءة يورث التشابه والمماثلة السلوكية والفكرية ولو بعد حين."},{"t":"li","lvl":0,"h":"<b>قوله تعالى:<\/b> <span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ﴾<\/span> <span class=\"ayref\">التوبة: 119<\/span>."},{"t":"p","lvl":0,"h":"<b>ثانياً: السنة النبوية الشريفة:<\/b>"},{"t":"li","lvl":0,"h":"<b>حديث أبي موسى الأشعري رضي الله عنه:<\/b> قال رسول الله ﷺ: <span class=\"hadith\">«مَثَلُ الجَلِيسِ الصَّالِحِ وَالجَلِيسِ السَّوْءِ كَمَثَلِ صَاحِبِ المِسْكِ وَنَافِخِ الكِيرِ؛ فَصَاحِبُ المِسْكِ إِمَّا أَنْ يُحْذِيَكَ، وَإِمَّا أَنْ تَبْتَاعَ مِنْهُ، وَإِمَّا أَنْ تَجِدَ مِنْهُ رِيحًا طَيِّبَةً، وَنَافِخُ الكِيرِ إِمَّا أَنْ يُحْرِقَ ثِيَابَكَ، وَإِمَّا أَنْ تَجِدَ رِيحًا خَبِيثَةً»<\/span> <details class=\"src tk\"><summary><span class=\"ico\">❖<\/span><span class=\"st\">التخريج<\/span><span class=\"chev\"><\/span><\/summary><div class=\"sb\"><cite>صحيح البخاري: كتاب الذبائح والصيد، باب المسك، برقم 5534؛ وصحيح مسلم: كتاب البر والصلة والآداب، باب استحباب مجالسة الصالحين، برقم 2628<\/cite><\/div><\/details>."},{"t":"li","lvl":1,"h":"<i>التأصيل السلوكي:<\/i> التأثر بالبيئة والمخالطة قانون حتمي كلي لا مفر منه؛ فالبيئة تفرض مدخلاتها على النفس طوعاً أو كرهاً."},{"t":"li","lvl":0,"h":"<b>حديث أبي هريرة رضي الله عنه:<\/b> أن النبي ﷺ قال: <span class=\"hadith\">«الرَّجُلُ عَلَى
